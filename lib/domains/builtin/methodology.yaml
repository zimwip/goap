name: methodology
version: 1.16.0
description: >
  Built-in meta-domain (ADR 0012 §4, ADR 0023): the definition of a methodology version, one node per element, in the
  "methodology" namespace. Its types are in every type catalogue, before anything is loaded from the registry.
enums:
  - {name: planner, description: How an agent plans its actions, values: [{value: goap, label: GOAP}, {value: utility, label: Utility}, {value: hybrid, label: Hybrid}]}
  - {name: action-kind, description: How an action is carried out, values: [{value: llm, label: LLM}, {value: tool, label: Tool}, {value: human, label: Human}, {value: builtin, label: Built-in}, {value: script, label: Script}, {value: abstract, label: Abstract}]}
nodeTypes:
  - name: MethodologyVersion
    description: "A version of a methodology: its scalar fields, status and timestamps"
    editor: methodology
    search: [{property: name, text: true}, {property: description, text: true}, {property: status, facet: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the methodology", type: string, section: Identity, order: 1, asName: true}
      - {name: version, label: Version, description: "Version of the methodology", type: string, section: Identity, order: 2}
      - {name: description, label: Description, description: "What the methodology is for", type: string, widget: textarea, section: Identity, order: 3}
      - {name: namespace, label: "Domain namespace", description: "Namespace of the domain the methodology works on", type: string, section: Definition, order: 4}
      - {name: domains, label: Domains, description: "Version of each domain the methodology is written against (ADR 0113): pinned when it is published", type: json, widget: textarea, section: Definition, order: 4}
      - {name: lifecycle, label: Lifecycle, description: "Lifecycle of the domain the changes of the methodology follow (ADR 0058); empty: none", type: string, section: Definition, order: 4}
      - {name: criticality, label: Criticality, description: "Default criticality of the changes of the methodology (C1, C2 or C3, ADR 0075); empty: C2", type: string, section: Definition, order: 4}
      - {name: goal, label: Goal, description: "Main goal of the methodology when it names no goal or process of the version (ADR 0096): a declared one is the main_goal link (ADR 0120); empty: the first goal or process", type: string, section: Definition, order: 4}
      - {name: administrative, label: Administrative, description: "The changes of the methodology name no project (it manages organisation, project, policy or adapter data)", type: boolean, section: Definition, order: 4}
      - {name: appliesTo, label: "Applies to", description: "Methodologies whose changes it runs alongside (a transverse methodology, ADR 0036)", type: json, widget: textarea, section: Definition, order: 4}
      - {name: imports, label: Imports, description: "Condition libraries the methodology uses without declaring their conditions", type: json, widget: textarea, section: Definition, order: 4}
      - {name: on, label: "Reacts to", description: "Events a methodology reacts to: of its own change (a transverse methodology), of the changes it integrates or of the change integrating it (ADR 0106)", type: json, widget: textarea, section: Definition, order: 4}
      - {name: events, label: Events, description: "Events of the methodology, in addition to the standard ones (ADR 0110): name, description; raised by a signal item of that name (an action's emits)", type: json, widget: textarea, section: Definition, order: 4}
      - {name: integrates, label: Integrates, description: "Methodologies whose changes its changes integrate as sub-changes (ADR 0106)", type: json, widget: textarea, section: Definition, order: 4}
      - {name: guardian, label: Guardian, description: "What it requires of the changes it integrates: commit and transition guards (ADR 0106, 0146)", type: json, widget: textarea, section: Definition, order: 4}
      - {name: assessments, label: Assessments, description: "How the assessments of the subjects of its changes read (ADR 0116): per subject pattern, states bound to conditions or a CEL when, with a tone, a label and whether the bubble opens", type: json, widget: textarea, section: Definition, order: 4}
      - {name: status, label: Status, description: "draft, published or archived", type: string, section: Definition, order: 5}
      - {name: createdAt, label: "Created at", description: "When the version was created", type: string, section: History, order: 6}
      - {name: updatedAt, label: "Updated at", description: "When the version was last modified", type: string, section: History, order: 7}
      - {name: publishedAt, label: "Published at", description: "When the version was published", type: string, section: History, order: 8}
      - {name: updatedBy, label: "Updated by", description: "Who last modified the version", type: string, section: History, order: 9}
  - name: Agent
    description: "Agent of a methodology version, with its triggers"
    editor: agent
    search: [{property: name, text: true}, {property: description, text: true}, {property: examples, text: true}, {property: planner, facet: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the element in its methodology version", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the element is for", type: string, widget: textarea, section: Identity, order: 2}
      - {name: planner, label: Planner, description: "How the agent plans its actions", type: enum, enum: planner, section: Planning, order: 3}
      - {name: model, label: Model, description: "Model alias of the agent (llm actions)", type: string, section: Planning, order: 4}
      - {name: actions, label: Actions, description: "Actions the agent can run that the version does not declare (the declared ones are uses links, ADR 0120)", type: json, widget: textarea, section: Planning, order: 5}
      - {name: goals, label: Goals, description: "Goals the agent pursues that the version does not declare (the declared ones are pursues links, ADR 0120)", type: json, widget: textarea, section: Planning, order: 6}
      - {name: triggers, label: Triggers, description: "Events and schedules that start the agent", type: json, widget: textarea, section: Planning, order: 7}
      - {name: roles, label: Roles, description: "Roles allowed to run the agent that the version does not declare (the declared ones are assigns links, as run, ADR 0120)", type: json, widget: textarea, section: Access, order: 8}
      - {name: examples, label: Examples, description: "Phrasings of the intents the agent answers", type: json, widget: textarea, section: Identity, order: 3}
      - {name: mcps, label: MCPs, description: "MCPs whose tools its llm and script actions may use", type: json, widget: textarea, section: Planning, order: 8}
      - {name: role, label: Role, description: "Role the agent acts as when the version does not declare it (a declared one is an assigns link, as actsAs, ADR 0120)", type: string, section: Access, order: 8}
      - {name: persistent, label: Persistent, description: "One instance per scope, run again for every new execution there with its conversation (ADR 0112): scope (change, or a path into the event), until (conditions closing it), memory (exchanges kept)", type: json, widget: textarea, section: Planning, order: 9}
      - {name: position, label: Position, description: "Position of the element in its collection of the definition", type: number, section: Definition, order: 90}
      - {name: removed, label: Removed, description: "The element was removed from the definition (kept for the history)", type: boolean, section: Definition, order: 91}
  # Action is an Activity too (architecture plan "Activity concept"): the smallest one, not broken down further.
  - name: Action
    description: "Action of a methodology version"
    extends: Activity
    editor: action
    search: [{property: instructions, text: true}, {property: kind, facet: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the element in its methodology version", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the element is for", type: string, widget: textarea, section: Identity, order: 2}
      - {name: kind, label: Kind, description: "How the action is carried out", type: enum, enum: action-kind, section: Execution, order: 3}
      - {name: roles, label: Roles, description: "Roles allowed to run the action that the version does not declare (the declared ones are assigns links, as run, ADR 0120)", type: json, widget: textarea, section: Access, order: 4}
      - {name: role, label: Role, description: "Role the action acts as when the version does not declare it (a declared one is an assigns link, as actsAs); none: the role of what refines it (ADR 0139)", type: string, section: Access, order: 4}
      - {name: verify, label: Verification, description: "How the effect is verified: the oracle (tool, human, model) and whether the verifier differs from the producer", type: json, widget: textarea, section: Execution, order: 5}
      - {name: pre, label: Preconditions, description: "Conditions required to run the action that the version does not declare (a library's, generated ones), with their expected value: a declared condition is a requires link (ADR 0120)", type: json, widget: textarea, section: Planning, order: 6}
      - {name: effects, label: Effects, description: "Conditions the action establishes that the version does not declare, with their value: a declared condition is a produces link (ADR 0120)", type: json, widget: textarea, section: Planning, order: 7}
      - {name: cost, label: Cost, description: "Cost the planner minimizes (default 1)", type: number, section: Planning, order: 8}
      - {name: utility, label: Utility, description: "CEL number used by the utility and hybrid planners (default 1)", type: string, section: Planning, order: 9}
      - {name: expects, label: Expectation, description: "Expectation on the produced items, compiled to a condition", type: json, widget: textarea, section: Planning, order: 10}
      - {name: incremental, label: Incremental, description: "Reaches its effects over several executions: an execution that produced items is progress", type: boolean, section: Planning, order: 11}
      - {name: emits, label: Emits, description: "Events of the methodology the action raises when it reaches its effects (ADR 0110)", type: json, widget: textarea, section: Reactions, order: 7}
      - {name: scope, label: Scope, description: "Runs once per pending subject of this scope (impact, item, risk, action, step; ADR 0109): pre and effects name conditions of the scope", type: string, section: Planning, order: 12}
      - {name: where, label: Where, description: "Subjects of the scope the action runs for (CEL, self the subject)", type: string, widget: textarea, section: Planning, order: 13}
      - {name: parallel, label: Parallel, description: "Subjects a scoped llm or tool action runs for at once (0: the engine's bound, 1: one after the other)", type: number, section: Planning, order: 14}
      - {name: permission, label: Permission, description: "Permission required from the initiator to run the action automatically", type: string, section: Access, order: 12}
      - {name: model, label: Model, description: "Model alias of an llm action", type: string, section: Execution, order: 13}
      - {name: prompt, label: Prompt, description: "Prompt of an llm action", type: string, widget: textarea, section: Execution, order: 14}
      - {name: loop, label: Loop, description: "Budget of the tool loop of an llm action (ADR 0118): maxRounds, maxToolResultBytes, maxTokens, timeout, compactBytes", type: json, widget: textarea, section: Execution, order: 14}
      - {name: tool, label: Tool, description: "mcp/tool of a tool action", type: string, section: Execution, order: 15}
      - {name: mcps, label: MCPs, description: "MCPs an llm or script action uses", type: json, widget: textarea, section: Execution, order: 16}
      - {name: builtin, label: Builtin, description: "Name of the builtin action", type: string, section: Execution, order: 17}
      - {name: instructions, label: Instructions, description: "What a person does in a human action", type: string, widget: textarea, section: Execution, order: 18}
      - {name: params, label: Parameters, description: "Parameters of the action", type: json, widget: textarea, section: Execution, order: 19}
      - {name: nodeTypes, label: "Node types", description: "Qualified node types a human task may create or pick; empty: every type of the namespace", type: json, widget: textarea, section: Execution, order: 20}
      - {name: form, label: Form, description: "What a person fills in to carry out a human action (ADR 0115): title, submit, artifact, fields with their widget and constraints", type: json, widget: textarea, section: Execution, order: 20}
      - {name: language, label: Language, description: "Language of a script action (javascript or go)", type: string, section: Execution, order: 21}
      - {name: code, label: Code, description: "Code of a script action", type: string, widget: textarea, section: Execution, order: 22}
      - {name: specializes, label: Specializes, description: "Action of another methodology this one specializes (methodology/action): an action of the version is a specializes link (ADR 0120)", type: string, section: Specialization, order: 23}
      - {name: when, label: "Applies when", description: "CEL guard of a specialization; empty: always", type: string, section: Specialization, order: 24}
      - {name: priority, label: Priority, description: "The applicable specialization with the highest priority wins", type: number, section: Specialization, order: 25}
      - {name: position, label: Position, description: "Position of the element in its collection of the definition", type: number, section: Definition, order: 90}
      - {name: removed, label: Removed, description: "The element was removed from the definition (kept for the history)", type: boolean, section: Definition, order: 91}
  - name: Condition
    description: "Condition of a methodology version"
    editor: condition
    search: [{property: name, text: true}, {property: description, text: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the element in its methodology version", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the element is for", type: string, widget: textarea, section: Identity, order: 2}
      - {name: expr, label: Expression, description: "CEL predicate over the blackboard (self is the subject of a scoped condition)", type: string, widget: textarea, section: Definition, order: 3}
      - {name: scope, label: Scope, description: "Kind of subject the condition is about (ADR 0109): change (default), impact, item, risk, action, step", type: string, section: Definition, order: 4}
      - {name: where, label: Where, description: "Subjects of a scoped condition or an aggregate (CEL, self the subject)", type: string, widget: textarea, section: Definition, order: 5}
      - {name: all, label: All, description: "Aggregate: every subject satisfies this scoped condition, when the version does not declare it (a declared one is an aggregates link, as all, ADR 0120)", type: string, section: Aggregate, order: 6}
      - {name: any, label: Any, description: "Aggregate: some subject satisfies this scoped condition, when the version does not declare it (aggregates link, as any)", type: string, section: Aggregate, order: 7}
      - {name: none, label: None, description: "Aggregate: no subject satisfies this scoped condition, when the version does not declare it (aggregates link, as none)", type: string, section: Aggregate, order: 8}
      - {name: empty, label: Empty, description: "Value of an all aggregate over no subject (default false)", type: boolean, section: Aggregate, order: 9}
      - {name: position, label: Position, description: "Position of the element in its collection of the definition", type: number, section: Definition, order: 90}
      - {name: removed, label: Removed, description: "The element was removed from the definition (kept for the history)", type: boolean, section: Definition, order: 91}
  - name: Goal
    description: "Goal of a methodology version"
    editor: goal
    search: [{property: name, text: true}, {property: description, text: true}, {property: examples, text: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the element in its methodology version", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the element is for", type: string, widget: textarea, section: Identity, order: 2}
      - {name: pre, label: Conditions, description: "Conditions the goal requires that the version does not declare, with their expected value: a declared condition is a requires link (ADR 0120)", type: json, widget: textarea, section: Definition, order: 3}
      - {name: examples, label: Examples, description: "Phrasings of the intents that reach the goal", type: json, widget: textarea, section: Identity, order: 3}
      - {name: value, label: Value, description: "Value of the goal for the utility planners", type: number, section: Definition, order: 4}
      - {name: position, label: Position, description: "Position of the element in its collection of the definition", type: number, section: Definition, order: 90}
      - {name: removed, label: Removed, description: "The element was removed from the definition (kept for the history)", type: boolean, section: Definition, order: 91}
  # ADR 0035 §2: a role processes and methods assign RACI style; ADR 0039: what Assignment (organisation namespace)
  # grants a unit or user on a project is named from a project's applicable methodologies' roles.
  - name: Role
    description: "Role of a methodology version: assigned RACI style by its processes and methods, allowed to run its agents and actions, held on a project through an Assignment"
    editor: role
    search: [{property: name, text: true}, {property: description, text: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the element in its methodology version", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the element is for (assigned RACI style by processes and methods)", type: string, widget: textarea, section: Identity, order: 2}
      - {name: operations, label: Operations, description: "Operations on a change the role allows (ADR 0103): codes of the catalogue or kinds (doer, reviewer); none: all", type: json, widget: textarea, section: Access, order: 3}
      - {name: position, label: Position, description: "Position of the element in its collection of the definition", type: number, section: Definition, order: 90}
      - {name: removed, label: Removed, description: "The element was removed from the definition (kept for the history)", type: boolean, section: Definition, order: 91}
  # Activity (architecture plan "Activity concept, Activity Runs, Change scoping"): the common shape of
  # Process/Step/Method/MethodStep. Requires conditions, produces conditions (ADR 0120); breaks down into
  # sub-activities (sub_activity link) that feed it. A Change scopes to one Activity node (Change.Data["activityRef"], ADR 0066);
  # an Activity Run (pkg/journal.Record) is one execution instance of one, against one Change.
  - name: Activity
    description: "Common shape of Process/Step/Method/MethodStep: the conditions it requires (input) and produces (output), composed from sub-activities"
    editor: activity
    search: [{property: name, text: true}, {property: description, text: true}]
    attributes:
      - {name: name, label: Name, description: "Name of the element in its methodology version", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the element is for", type: string, widget: textarea, section: Identity, order: 2}
      - {name: input, label: Input, description: "Conditions the activity takes that the version does not declare (generated: state:, step:; a library's): a declared condition is a requires link (ADR 0120)", type: json, widget: textarea, section: Definition, order: 3}
      - {name: output, label: Output, description: "Conditions the activity produces that the version does not declare: a declared condition is a produces link (ADR 0120)", type: json, widget: textarea, section: Definition, order: 5}
      - {name: on, label: "Reacts to", description: "Events that run the activity again on a change of its methodology (ADR 0110): event, filter (CEL over event), from", type: json, widget: textarea, section: Reactions, order: 6}
      - {name: position, label: Position, description: "Position of the element in its collection of the definition", type: number, section: Definition, order: 90}
      - {name: removed, label: Removed, description: "The element was removed from the definition (kept for the history)", type: boolean, section: Definition, order: 91}
  # ADR 0034: the steps and sub-steps that reach an objective, each done by an action, an agent, a nested process or a person
  # ADR 0035 §1, ADR 0050: how a step capability is carried out in a context, with which actions; the scheduler creates the agent applying it
  - name: Method
    description: "Method of a methodology version: the reference of how a capability is carried out in a context"
    extends: Activity
    editor: method
    search: [{property: for, text: true}, {property: guidance, text: true}]
    attributes:
      - {name: for, label: Capability, description: "Capability the method carries out", type: string, section: Identity, order: 1}
      - {name: when, label: "Applies when", description: "CEL guard of the method; empty: always", type: string, section: Selection, order: 2}
      - {name: priority, label: Priority, description: "The applicable method with the highest priority wins", type: number, section: Selection, order: 3}
      - {name: guidance, label: Guidance, description: "How to carry the capability out", type: string, widget: textarea, section: Guidance, order: 4}
      - {name: checklist, label: Checklist, description: "Points to check", type: json, widget: textarea, section: Guidance, order: 5}
      - {name: deliverables, label: Deliverables, description: "What the method produces", type: json, widget: textarea, section: Guidance, order: 6}
      - {name: references, label: References, description: "Reference documents", type: json, widget: textarea, section: Guidance, order: 7}
      - {name: roles, label: Responsibilities, description: "RACI assignment of roles the version does not declare (a declared role is an assigns link, as responsible, accountable, consulted or informed, ADR 0120)", type: json, widget: textarea, section: Access, order: 8}
      - {name: actions, label: Actions, description: "Pool of actions the steps inherit that the version does not declare (the declared ones are uses links, ADR 0120)", type: json, widget: textarea, section: Execution, order: 9}
      - {name: done, label: "Done when", description: "Conditions that complete the method that the version does not declare: a declared condition is a produces link (ADR 0120)", type: json, widget: textarea, section: Execution, order: 10}
      - {name: planner, label: Planner, description: "How the generated agent plans", type: enum, enum: planner, section: Execution, order: 11}
      - {name: model, label: Model, description: "Model alias of the generated agent", type: string, section: Execution, order: 12}
      - {name: mcps, label: MCPs, description: "MCPs the generated agent may use", type: json, widget: textarea, section: Execution, order: 13}
      - {name: persistent, label: Persistent, description: "The same instance of the agent applying the method carries it out at every run of its step, with its conversation (ADR 0112): scope, until, memory", type: json, widget: textarea, section: Execution, order: 15}
  - name: Process
    description: "Process of a methodology version: its steps and sub-steps"
    extends: Activity
    editor: process
    search: [{property: examples, text: true}]
    attributes:
      - {name: examples, label: Examples, description: "Examples of the process at work", type: json, widget: textarea, section: Identity, order: 1}
      - {name: references, label: References, description: "Reference documents", type: json, widget: textarea, section: Guidance, order: 2}
      - {name: roles, label: Responsibilities, description: "RACI assignment of roles the version does not declare (a declared role is an assigns link, ADR 0120); the responsible role is required, the steps inherit them (ADR 0139)", type: json, widget: textarea, section: Access, order: 3}
  # Step and MethodStep (architecture plan point 2): one step of a Process/Method, materialized as its own
  # node (not just compiled in-memory) so it can be an Activity in its own right - its own input/goals/output,
  # its own ActivityRuns. Still authored inline in the owning Process/Method's YAML for ergonomics; the
  # registry stores one node per step, reached from its process or method through sub_activity only (ADR 0120).
  - name: Step
    description: "Step of a Process: its own input/goals/output, done by an action, an agent, a nested process or a person"
    extends: Activity
    editor: step
    search: [{property: instructions, text: true}, {property: guidance, text: true}]
    attributes:
      - {name: instructions, label: Instructions, description: "What to do in the step", type: string, widget: textarea, section: Identity, order: 1}
      - {name: guidance, label: Guidance, description: "How to do it", type: string, widget: textarea, section: Guidance, order: 2}
      - {name: checklist, label: Checklist, description: "Points to check", type: json, widget: textarea, section: Guidance, order: 3}
      - {name: deliverables, label: Deliverables, description: "What the step produces", type: json, widget: textarea, section: Guidance, order: 4}
      - {name: references, label: References, description: "Reference documents", type: json, widget: textarea, section: Guidance, order: 5}
      - {name: roles, label: Responsibilities, description: "RACI assignment of roles the version does not declare (a declared role is an assigns link, ADR 0120)", type: json, widget: textarea, section: Access, order: 6}
      - {name: action, label: Action, description: "Action that does the step, when the version does not declare it (a declared one is a performed_by link, as action, ADR 0120)", type: string, section: Execution, order: 7}
      - {name: actions, label: "Alternative actions", description: "Actions among which the planner picks that the version does not declare (performed_by links, as alternative)", type: json, widget: textarea, section: Execution, order: 8}
      - {name: agent, label: Agent, description: "Agent that does the step", type: string, section: Execution, order: 9}
      - {name: process, label: Process, description: "Nested process of another methodology that does the step (methodology/process): a process of the version is a nests link (ADR 0120)", type: string, section: Execution, order: 10}
      - {name: method, label: Method, description: "Capability whose applicable method does the step (the methods providing it are carried_out_by links)", type: string, section: Execution, order: 11}
      - {name: foreach, label: "For each", description: "CEL list: the step runs once per element, in parallel", type: string, section: Execution, order: 12}
      - {name: groupBy, label: "Group by", description: "CEL key: one run per group instead of per element", type: string, section: Execution, order: 13}
      - {name: where, label: "Where", description: "CEL condition of the scope (self): the subjects of the scoped action the step runs it for", type: string, section: Execution, order: 14}
      - {name: review, label: "Review", description: "The step reviews a subject of the change (subject: description, title, intent, impact:<key>, item:<key>); automatic: it starts by itself on the events of its subject (ADR 0130)", type: json, widget: textarea, section: Reactions, order: 15}
      - {name: gate, label: "Gate", description: "The step is a gate of its process: the transition of the lifecycle of the change its go takes, the checklist split among roles (veto, when, attest), the decision (board, rule) and what the go freezes (ADR 0132)", type: json, widget: textarea, section: Execution, order: 16}
  - name: MethodStep
    description: "Step of a Method: its own input/goals/output, done by an action, an agent, a nested process or a person"
    extends: Activity
    editor: step
    search: [{property: instructions, text: true}, {property: guidance, text: true}]
    attributes:
      - {name: instructions, label: Instructions, description: "What to do in the step", type: string, widget: textarea, section: Identity, order: 1}
      - {name: guidance, label: Guidance, description: "How to do it", type: string, widget: textarea, section: Guidance, order: 2}
      - {name: checklist, label: Checklist, description: "Points to check", type: json, widget: textarea, section: Guidance, order: 3}
      - {name: deliverables, label: Deliverables, description: "What the step produces", type: json, widget: textarea, section: Guidance, order: 4}
      - {name: references, label: References, description: "Reference documents", type: json, widget: textarea, section: Guidance, order: 5}
      - {name: roles, label: Responsibilities, description: "RACI assignment of roles the version does not declare (a declared role is an assigns link, ADR 0120)", type: json, widget: textarea, section: Access, order: 6}
      - {name: action, label: Action, description: "Action that does the step, when the version does not declare it (a declared one is a performed_by link, as action, ADR 0120)", type: string, section: Execution, order: 7}
      - {name: actions, label: "Alternative actions", description: "Actions among which the planner picks that the version does not declare (performed_by links, as alternative)", type: json, widget: textarea, section: Execution, order: 8}
      - {name: agent, label: Agent, description: "Agent that does the step", type: string, section: Execution, order: 9}
      - {name: process, label: Process, description: "Nested process of another methodology that does the step (methodology/process): a process of the version is a nests link (ADR 0120)", type: string, section: Execution, order: 10}
      - {name: method, label: Method, description: "Capability whose applicable method does the step (the methods providing it are carried_out_by links)", type: string, section: Execution, order: 11}
      - {name: foreach, label: "For each", description: "CEL list: the step runs once per element, in parallel", type: string, section: Execution, order: 12}
      - {name: groupBy, label: "Group by", description: "CEL key: one run per group instead of per element", type: string, section: Execution, order: 13}
      - {name: where, label: "Where", description: "CEL condition of the scope (self): the subjects of the scoped action the step runs it for", type: string, section: Execution, order: 14}
      - {name: review, label: "Review", description: "The step reviews a subject of the change (subject: description, title, intent, impact:<key>, item:<key>); automatic: it starts by itself on the events of its subject (ADR 0130)", type: json, widget: textarea, section: Reactions, order: 15}
      - {name: gate, label: "Gate", description: "Refused in a method: a method says how, the gate belongs to the process (ADR 0132); kept so a definition reads back as written", type: json, widget: textarea, section: Execution, order: 16}
  # an MCP tool the self-observation asks the platform for (ADR 0011): not part of a definition
  - name: ToolRequest
    description: "MCP tool requested by the self-observation of a methodology"
    search: [{property: name, text: true}, {property: description, text: true}, {property: motivation, text: true}]
    attributes:
      - {name: name, label: Tool, description: "Name of the requested tool", type: string, section: Identity, order: 1, asName: true}
      - {name: description, label: Description, description: "What the tool should do", type: string, widget: textarea, section: Identity, order: 2}
      - {name: motivation, label: Motivation, description: "Why the observed runs needed it", type: string, widget: textarea, section: Identity, order: 3}
      - {name: span, label: Span, description: "Where in the runs the need appeared", type: string, section: Identity, order: 4}
linkTypes:
  # compose: true flags a composition link (the target is a part of the source): editors and browsers read it
  # to show the targets as the children of the source, instead of knowing the link by name.
  # a version -> its elements
  - name: defines
    description: "A methodology version defines its elements"
    from: MethodologyVersion
    compose: true
  # a specialization -> the more generic Activity it specializes (ADR 0009 §5 for an abstract action, ADR 0035 §1
  # for a method providing a capability; architecture plan "Activity concept"): the mechanism is the same at every
  # layer, going from generic to specialized - Action extends Activity, so this already covers it transitively.
  # properties: when (CEL guard, "" = always), priority (the applicable one with the highest wins).
  - name: specializes
    description: "A specialization of a more generic activity (the one with the highest priority whose condition holds applies)"
    from: Activity
    to: Activity
    attributes:
      - {name: when, label: "Applies when", description: "CEL guard; empty: always", type: string, section: Selection, order: 1}
      - {name: priority, label: Priority, description: "The applicable one with the highest priority wins", type: number, section: Selection, order: 2}
  # an Activity -> the sub-activities (Step/MethodStep, or a nested Process/Method) it is composed from
  - name: sub_activity
    description: "An activity is composed of sub-activities"
    from: Activity
    to: Activity
    compose: true
  # References between the elements of a version (ADR 0120): what the definition names, the graph links. A condition is
  # the output of an activity (produces) and the input of another (requires): the same node. A name the version does
  # not declare (a library's condition, a generated one, another methodology's element) stays in the property.
  - name: requires
    description: "An input: a condition an action, a step or a goal needs, with the value it needs (an action's pre, a step's pre, a goal's conditions)"
    to: Condition
    label: requires
    inverseLabel: "input of"
    attributes:
      - {name: value, label: Value, description: "The value the condition must have (default true)", type: boolean, order: 1}
  - name: produces
    description: "An output: a condition an action or an activity establishes, with its value (an action's effects, a step's or a method's done)"
    from: Activity
    to: Condition
    label: produces
    inverseLabel: "output of"
    attributes:
      - {name: value, label: Value, description: "The value the condition takes (default true)", type: boolean, order: 1}
  - name: uses
    description: "The actions an agent plans over, the pool of actions of a method"
    to: Action
    label: uses
    inverseLabel: "used by"
    attributes:
      - {name: position, label: Position, description: "Position in the list of the definition", type: number, order: 1}
  - name: pursues
    description: "The goals an agent pursues (as trigger: the goal a trigger of the agent starts it with)"
    from: Agent
    to: Goal
    label: pursues
    inverseLabel: "pursued by"
    attributes:
      - {name: position, label: Position, description: "Position in the list of the definition", type: number, order: 1}
      - {name: as, label: As, description: "trigger: the goal of a trigger of the agent; empty: a goal of the agent", type: string, order: 2}
  - name: performed_by
    description: "The action a step runs (as action), or the alternatives the planner picks among (as alternative)"
    from: Activity
    to: Action
    label: "performed by"
    inverseLabel: performs
    attributes:
      - {name: as, label: As, description: "action (the action of the step) or alternative", type: string, order: 1}
      - {name: position, label: Position, description: "Position among the alternatives", type: number, order: 2}
  - name: nests
    description: "The process a step nests"
    from: Activity
    to: Process
    label: nests
    inverseLabel: "nested by"
  - name: carried_out_by
    description: "The methods providing the capability a step names (derived from the capability and the methods' for)"
    from: Activity
    to: Method
    label: "carried out by"
    inverseLabel: "carries out"
  - name: assigns
    description: "A role: allowed to run an agent or an action (as run), the role an agent acts as (actsAs), or RACI on a step or a method (responsible, accountable, consulted, informed)"
    to: Role
    label: assigns
    inverseLabel: "assigned to"
    attributes:
      - {name: as, label: As, description: "run, actsAs, responsible, accountable, consulted, informed, or trigger (the identity of a trigger of an agent)", type: string, order: 1}
      - {name: position, label: Position, description: "Position in the list of the definition", type: number, order: 2}
  - name: aggregates
    description: "The scoped condition an aggregate condition brings to the level of the change (as all, any or none)"
    from: Condition
    to: Condition
    label: aggregates
    inverseLabel: "aggregated by"
    attributes:
      - {name: as, label: As, description: "all, any or none", type: string, order: 1}
  - name: main_goal
    description: "The main goal of a methodology version: a goal or a process (ADR 0096)"
    from: MethodologyVersion
    label: "main goal"
    inverseLabel: "main goal of"
  - name: mentions
    description: "A condition an expression of the element reads (conditions.x in a where, an expr, a when, a filter) or a nested structure of it names (an assessment state, the until of a persistent agent)"
    to: Condition
    label: mentions
    inverseLabel: "mentioned by"
# The types of change item (ADR 0128): what the actions of a methodology write on a change and its conditions read.
# Each change item names its type (`type`) and, within it, what it is about (`target`: what an artifact is, the name
# of a signal). The graph refuses an item of a type no domain in force declares, and checks the keys of its data an
# item type declares as attributes (type, enum); the rest of the data stays free. The use cases add the meaning in
# code (domain.RegisterItemType: risk, assess, verify).
itemTypes:
  # the change mechanism
  - name: artifact
    description: "A product of an action (a document, a report, a plan…); its target names what it is."
  - name: decision
    description: "Accepts or rejects another item of the change."
  - name: decision_point
    description: "An event of a decision point (open, rule, answer, ratify), replayed into the decision points of the change (ADR 0009)."
  - name: flow
    description: "An event of the action flow: a step relaunched on a new flow, which is then adopted or discarded."
  - name: review
    description: "The record of a review of the change impacts; every verdict is made by a submitted review (ADR 0080, 0105)."
    attributes:
      - {name: key, label: Key, description: "The review the item is a version of", type: string}
      - {name: comment, label: Comment, description: "The comment of the reviewer", type: string, widget: textarea}
      - {name: status, label: Status, description: "open, submitted or discarded", type: string}
      - {name: entries, label: Entries, description: "The verdicts: impact, comment, outcome accept | reject", type: json}
      - {name: by, label: By, description: "The reviewer", type: string}
      - {name: submittedAt, label: Submitted, description: "When the review was submitted", type: date}
  - name: signal
    description: "A named notification other agents or a live parent may react to; its target is the name of the signal, its recipient the process it addresses."
  - name: transition
    description: "A move of the lifecycle of the change, written only by a transition (ADR 0058)."
  # the risk register (pkg/risk, ADR 0036, 0075)
  - name: risk
    description: "A risk of the change: each item is a version of the record of its key (ADR 0036)."
    attributes:
      - {name: key, label: Key, description: "The risk the item is a version of", type: string}
      - {name: title, label: Title, description: "What could go wrong", type: string}
      - {name: description, label: Description, description: "The risk in detail", type: string, widget: textarea}
      - {name: probability, label: Probability, description: "1 (rare) to 5 (almost certain)", type: number}
      - {name: impact, label: Impact, description: "1 (minor) to 5 (severe)", type: number}
      - {name: status, label: Status, description: "open, mitigating, accepted, closed", type: string}
      - {name: owner, label: Owner, description: "Who answers for the risk", type: string}
      - {name: actions, label: Actions, description: "Keys of the actions mitigating it", type: json}
      - {name: step, label: Step, description: "The step that raised it", type: string}
  - name: action
    description: "An action mitigating a risk or answering a decision point: each item is a version of the record of its key (ADR 0036)."
    attributes:
      - {name: key, label: Key, description: "The action the item is a version of", type: string}
      - {name: title, label: Title, description: "What is to be done", type: string}
      - {name: status, label: Status, description: "open, done, cancelled", type: string}
      - {name: owner, label: Owner, description: "Who does it", type: string}
      - {name: due, label: Due, description: "When it is due", type: string}
      - {name: for, label: For, description: "The risk key or the decision point it answers", type: string}
      - {name: result, label: Result, description: "What came of it", type: string, widget: textarea}
      - {name: kind, label: Kind, description: "mitigation (default) or poc: a proof of concept or a prototype, a relaxed build in a sub-change (ADR 0131)", type: string}
      - {name: purpose, label: Purpose, description: "Of a poc: derisk (check its risks) or explore (the need, during the framing)", type: string}
      - {name: risks, label: Risks, description: "Of a poc: the keys of the risks it checks", type: json}
      - {name: hypotheses, label: Hypotheses, description: "Of a poc: the statements it checks (explore)", type: json}
      - {name: change, label: Change, description: "Of a poc: the sub-change carrying it, once opened", type: string}
  - name: hypothesis
    description: "A statement a proof of concept or a prototype checks, the requirement of its sub-change; its verdict is the assessment of item:<key> (ADR 0131)."
    attributes:
      - {name: key, label: Key, description: "The hypothesis the item is a version of", type: string}
      - {name: statement, label: Statement, description: "What is to be confirmed or refuted", type: string, widget: textarea}
      - {name: source, label: Source, description: "The risk of the parent change it checks, or framing", type: string}
  - name: derogation
    description: "A signed waiver of a rule on a target of the change, until it expires (ADR 0075)."
    attributes:
      - {name: key, label: Key, description: "The derogation the item is a version of", type: string}
      - {name: rule, label: Rule, description: "The rule waived", type: string}
      - {name: target, label: Target, description: "What the rule is waived on", type: string}
      - {name: reason, label: Reason, description: "Why it is waived", type: string, widget: textarea}
      - {name: signatory, label: Signatory, description: "Who signed it (the writer of the item)", type: string}
      - {name: expires, label: Expires, description: "Until when it holds", type: string}
      - {name: status, label: Status, description: "active, expired, closed", type: string}
  # assessments (pkg/assess, ADR 0110)
  - name: assessment
    description: "A rating of a subject of the change (score, verdict, findings, suggestion): each item is the whole record of its key (ADR 0110)."
    attributes:
      - {name: key, label: Subject, description: "The subject rated: description, title, intent, impact:<key>, item:<key>", type: string}
      - {name: score, label: Score, description: "0 to 5", type: number}
      - {name: verdict, label: Verdict, description: "clear, unclear, insufficient, confirmed or refuted", type: string}
      - {name: findings, label: Findings, description: "The remarks: text, severity", type: json}
      - {name: suggestion, label: Suggestion, description: "A wording the rater proposes", type: string, widget: textarea}
      - {name: reply, label: Reply, description: "What the rater says to the person", type: string, widget: textarea}
      - {name: rated, label: Rated, description: "The text rated or its fingerprint", type: string}
  - name: comment
    description: "A message of a person about a subject, in the thread of its assessment (ADR 0110)."
    attributes:
      - {name: about, label: About, description: "The subject of the thread", type: string}
      - {name: text, label: Text, description: "The message", type: string, widget: textarea}
      - {name: by, label: By, description: "Who wrote it", type: string}
  # verification (pkg/verify, ADR 0075)
  - name: verification
    description: "A state of verification of a produced effect: produced, verified, accepted (with reserve) or rejected (ADR 0075)."
    attributes:
      - {name: state, label: State, description: "produced, verified, accepted, accepted_with_reserve, rejected", type: string}
      - {name: action, label: Action, description: "The action whose effect is verified", type: string}
      - {name: impact, label: Impact, description: "The impact verified", type: string}
      - {name: impacts, label: Impacts, description: "The impacts verified", type: json}
      - {name: oracle, label: Oracle, description: "How it was verified", type: string}
      - {name: independent, label: Independent, description: "The verifier is not the producer", type: boolean}
      - {name: model, label: Model, description: "The model that verified it", type: string}
      - {name: by, label: By, description: "Who verified it", type: string}
      - {name: derogation, label: Derogation, description: "The derogation an acceptance with reserve stands on", type: string}
