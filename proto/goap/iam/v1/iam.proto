syntax = "proto3";

package goap.iam.v1;

import "google/protobuf/timestamp.proto";

// IamService manages organizations, users and access policies. Access is
// attribute based (ABAC) and evaluated by Casbin; policies are stored in the
// iam database. Organization and user management: milestone M2.
service IamService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // Decide an access request. Called by the services (engine, registry).
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // Policy administration (requires `policy` permissions).
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc AddPolicy(AddPolicyRequest) returns (AddPolicyResponse);
  rpc RemovePolicy(RemovePolicyRequest) returns (RemovePolicyResponse);
}

// Organization is a tenant. Every change belongs to one; the MCP tools available
// to its actions are the ones bound to the organization.
message Organization {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
}

// Subject attributes (r.sub in rules).
message Principal {
  string subject = 1;
  string org = 2;
  repeated string roles = 3;
}

// Object attributes (r.obj in rules).
message Resource {
  string type = 1;
  string id = 2;
  string org = 3;
  string owner = 4;
  string name = 5;
}

// An ABAC rule: `rule` is an expression over r.sub, r.obj and r.act, e.g.
// hasRole(r.sub, "approver") && r.sub.Org == r.obj.Org && r.sub.Subject != r.obj.Owner
message Policy {
  string rule = 1;
  // resource type or "*"
  string resource = 2;
  // action or "*"
  string action = 3;
  // allow | deny
  string effect = 4;
}

message CreateOrganizationRequest {
  // slug identifying the organization (lowercase letters, digits, '-'); generated from name when empty
  string id = 1;
  string name = 2;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message GetOrganizationRequest {
  string id = 1;
}

message GetOrganizationResponse {
  Organization organization = 1;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message CreateUserRequest {
  string email = 1;
  string display_name = 2;
}

message CreateUserResponse {
  User user = 1;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  Principal principal = 1;
}

message CheckPermissionRequest {
  Principal subject = 1;
  string action = 2;
  Resource resource = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message AddPolicyRequest {
  Policy policy = 1;
}

message AddPolicyResponse {
  Policy policy = 1;
}

message RemovePolicyRequest {
  Policy policy = 1;
}

message RemovePolicyResponse {}
