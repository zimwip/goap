syntax = "proto3";

package goap.engine.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// EngineService runs agent processes: intent loop, then GOAP planning and
// execution over the blackboard of a change.
service EngineService {
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc AnswerIntent(AnswerIntentRequest) returns (AnswerIntentResponse);
  rpc SubmitHumanInput(SubmitHumanInputRequest) returns (SubmitHumanInputResponse);
  // Decide a pending approval (an action needing a permission the initiator
  // lacks) with the caller's permissions.
  rpc ApproveAction(ApproveActionRequest) returns (ApproveActionResponse);
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  // Live process events and logs (server streaming). Empty process_id: every
  // process the caller may read.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
  // Triggers of the published agents, with their state.
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse);
  // Fire a trigger now (test from the IDE).
  rpc FireTrigger(FireTriggerRequest) returns (FireTriggerResponse);
}

message TriggerState {
  string methodology = 1;
  string agent = 2;
  string name = 3;
  string description = 4;
  // event | schedule
  string type = 5;
  string event = 6;
  string schedule = 7;
  bool enabled = 8;
  int32 fires = 9;
  google.protobuf.Timestamp last_fired = 10;
  google.protobuf.Timestamp next_fire = 11;
  string last_process_id = 12;
  string last_error = 13;
}

message ListTriggersRequest {}

message ListTriggersResponse {
  repeated TriggerState triggers = 1;
}

message FireTriggerRequest {
  string methodology = 1;
  string agent = 2;
  string trigger = 3;
}

message FireTriggerResponse {
  Process process = 1;
}

// Token and call accounting.
message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int32 llm_calls = 3;
  int32 tool_calls = 4;
}

message LlmCall {
  string provider = 1;
  string model = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 duration_ms = 5;
  string error = 6;
}

message ToolCall {
  string name = 1;
  int64 duration_ms = 2;
  string error = 3;
}

message LogLine {
  google.protobuf.Timestamp time = 1;
  // debug | info | warn | error
  string level = 2;
  string message = 3;
  string process_id = 4;
  string action = 5;
  int32 step = 6;
}

message Turn {
  string role = 1;
  string text = 2;
}

message Candidate {
  string goal = 1;
  double confidence = 2;
  string reason = 3;
  string agent = 4;
  string methodology = 5;
}

message Principal {
  string subject = 1;
  string org = 2;
  repeated string roles = 3;
}

message HumanTask {
  string action = 1;
  string description = 2;
  string instructions = 3;
  int32 step = 4;
  // input (submit items) | approval (approve or reject the action)
  string kind = 5;
  // permission required to approve
  string permission = 6;
  // kind "agent": the sub-agent process this one waits for
  string child_process_id = 7;
}

message Step {
  int32 index = 1;
  string action = 2;
  repeated string plan = 3;
  map<string, bool> before = 4;
  map<string, bool> after = 5;
  repeated string items = 6;
  bool effects_met = 7;
  string output = 8;
  string error = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp ended_at = 11;
  string approved_by = 12;
  Usage usage = 13;
  repeated LlmCall llm_calls = 14;
  repeated ToolCall tool_calls = 15;
  repeated LogLine logs = 16;
  // sub-agent processes started by this step
  repeated string child_process_ids = 17;
  // sandbox that executed the step (script actions)
  string sandbox = 18;
}

message Process {
  string id = 1;
  string methodology = 2;
  string change_id = 3;
  // clarifying | running | waiting | completed | stuck | failed
  string status = 4;
  string goal = 5;
  repeated Turn turns = 6;
  string question = 7;
  repeated Candidate candidates = 8;
  HumanTask pending = 9;
  repeated string plan = 10;
  map<string, bool> world = 11;
  map<string, string> unknown = 12;
  repeated Step steps = 13;
  repeated string disabled = 14;
  string error = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  Principal initiator = 18;
  // agent of the methodology run by the process
  string agent = 19;
  // goap | utility | hybrid
  string planner = 20;
  // process that called this one as a sub-agent
  string parent_id = 21;
  // totals over the steps
  Usage usage = 22;
  string baseline_id = 23;
  string title = 24;
  // OpenTelemetry trace of the process (root span "process")
  string trace_id = 25;
  // "<methodology>/<agent>/<trigger>" when started by a trigger
  string trigger = 26;
}

message StartProcessRequest {
  // empty: the intent loop identifies the methodology and agent among every
  // published methodology
  string methodology = 1;
  // continue an existing change, or open one on baseline_id
  string change_id = 2;
  string baseline_id = 3;
  string title = 4;
  string intent = 5;
  // skip the intent loop
  string goal = 6;
  google.protobuf.Struct vars = 7;
  // restrict identification to this agent
  string agent = 8;
}

message StartProcessResponse {
  Process process = 1;
}

message AnswerIntentRequest {
  string process_id = 1;
  string answer = 2;
}

message AnswerIntentResponse {
  Process process = 1;
}

message SubmitHumanInputRequest {
  string process_id = 1;
  // items in the engine input format (see pkg/engine.ItemInput)
  repeated google.protobuf.Struct items = 2;
}

message SubmitHumanInputResponse {
  Process process = 1;
}

message ApproveActionRequest {
  string process_id = 1;
  bool approve = 2;
  string comment = 3;
}

message ApproveActionResponse {
  Process process = 1;
}

message GetProcessRequest {
  string id = 1;
}

message GetProcessResponse {
  Process process = 1;
}

message ListProcessesRequest {
  // only the processes started by the caller
  bool mine = 1;
  // filter by status (empty: all)
  repeated string statuses = 2;
  // only root processes (no sub-agents)
  bool roots_only = 3;
}

message ListProcessesResponse {
  repeated Process processes = 1;
}

message WatchEventsRequest {
  string process_id = 1;
}

message WatchEventsResponse {
  // started | intent | step | waiting | completed | stuck | failed | log
  string type = 1;
  google.protobuf.Timestamp time = 2;
  Process process = 3;
  LogLine log = 4;
}
