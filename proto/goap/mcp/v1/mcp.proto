syntax = "proto3";

package goap.mcp.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "goap/connector/v1/connector.proto";

// McpService is the MCP hub. It keeps:
//   - the live registry of connectors (separate services that register themselves),
//   - the generic MCP definitions (e.g. document-repository: list, read, write),
//   - the adapters mapping the tools of an MCP onto the operations of a connector,
//   - the bindings of an organization: MCP -> (connector, configuration, secrets).
// A tool call of a change goes through its organization's binding.
service McpService {
  // Connector registry (called by the connectors, as a heartbeat as well).
  rpc RegisterConnector(RegisterConnectorRequest) returns (RegisterConnectorResponse);
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);

  // Generic MCP definitions.
  rpc SaveMcp(SaveMcpRequest) returns (SaveMcpResponse);
  rpc ListMcps(ListMcpsRequest) returns (ListMcpsResponse);
  rpc DeleteMcp(DeleteMcpRequest) returns (DeleteMcpResponse);

  // Adapters: how a connector implements an MCP.
  rpc SaveAdapter(SaveAdapterRequest) returns (SaveAdapterResponse);
  rpc ListAdapters(ListAdaptersRequest) returns (ListAdaptersResponse);
  rpc DeleteAdapter(DeleteAdapterRequest) returns (DeleteAdapterResponse);

  // Organization bindings.
  rpc BindMcp(BindMcpRequest) returns (BindMcpResponse);
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  rpc UnbindMcp(UnbindMcpRequest) returns (UnbindMcpResponse);

  // Tools an organization can use, and their invocation.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

// ---- connectors --------------------------------------------------------------

message RegisterConnectorRequest {
  goap.connector.v1.ConnectorInfo info = 1;
  // base URL where the hub reaches the ConnectorService of this connector
  string endpoint = 2;
}

message RegisterConnectorResponse {
  // the registration expires unless renewed within this delay
  int32 lease_seconds = 1;
}

message Connector {
  goap.connector.v1.ConnectorInfo info = 1;
  string endpoint = 2;
  google.protobuf.Timestamp last_seen = 3;
  // registered and renewed within the lease
  bool live = 4;
}

message ListConnectorsRequest {}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

// ---- MCP definitions -----------------------------------------------------------

message McpTool {
  string name = 1;
  string description = 2;
  // JSON Schema of the arguments
  google.protobuf.Struct input_schema = 3;
}

message Mcp {
  string name = 1;
  string description = 2;
  repeated McpTool tools = 3;
}

message SaveMcpRequest {
  Mcp mcp = 1;
}

message SaveMcpResponse {
  Mcp mcp = 1;
}

message ListMcpsRequest {}

message ListMcpsResponse {
  repeated Mcp mcps = 1;
}

message DeleteMcpRequest {
  string name = 1;
}

message DeleteMcpResponse {}

// ---- adapters ---------------------------------------------------------------------

// ToolMapping maps one tool of the MCP onto one operation of the connector.
message ToolMapping {
  string tool = 1;
  string operation = 2;
  // operation arguments: literals, or "$.a.b" references to the arguments of the
  // tool call (nested objects and lists are mapped recursively)
  google.protobuf.Struct arguments = 3;
  // dotted path picked in the result of the operation ("" = the whole result)
  string result_path = 4;
}

message Adapter {
  string mcp = 1;
  string connector = 2;
  repeated ToolMapping tools = 3;
}

message SaveAdapterRequest {
  Adapter adapter = 1;
}

message SaveAdapterResponse {
  Adapter adapter = 1;
  // non-blocking problems (e.g. an operation the registered connector does not offer)
  repeated string warnings = 2;
}

message ListAdaptersRequest {
  // restrict to an MCP
  string mcp = 1;
}

message ListAdaptersResponse {
  repeated Adapter adapters = 1;
}

message DeleteAdapterRequest {
  string mcp = 1;
  string connector = 2;
}

message DeleteAdapterResponse {}

// ---- bindings ------------------------------------------------------------------------

message Binding {
  string org_id = 1;
  string mcp = 2;
  // connector implementing the MCP for this organization (through its adapter)
  string connector = 3;
  // per-organization connector configuration (root path, account, ...)
  google.protobuf.Struct config = 4;
  // secret name -> reference: "<vault path>#<field>" or "env:<VARIABLE>"
  map<string, string> secrets = 5;
}

message BindMcpRequest {
  Binding binding = 1;
}

message BindMcpResponse {
  Binding binding = 1;
}

message ListBindingsRequest {
  // empty: the organization of the caller
  string org_id = 1;
}

message ListBindingsResponse {
  repeated Binding bindings = 1;
}

message UnbindMcpRequest {
  string org_id = 1;
  string mcp = 2;
}

message UnbindMcpResponse {}

// ---- tools ---------------------------------------------------------------------------------

message Tool {
  // "<mcp>/<tool>"
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
}

message ListToolsRequest {
  // empty: the organization of the caller
  string org_id = 1;
}

message ListToolsResponse {
  // the tools of the MCPs bound by the organization
  repeated Tool tools = 1;
  // the bound MCPs
  repeated string mcps = 2;
}

message CallToolRequest {
  string org_id = 1;
  // "<mcp>/<tool>"
  string name = 2;
  google.protobuf.Struct arguments = 3;
}

message CallToolResponse {
  google.protobuf.Struct result = 1;
  bool is_error = 2;
  string error = 3;
}
