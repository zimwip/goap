syntax = "proto3";

package goap.mcp.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "goap/connector/v1/connector.proto";

// McpService is the MCP hub. It keeps the live registry of connectors (separate services that
// register themselves) and resolves tools for the organisational unit that holds a change:
//   - MCPs are nodes of the "platform" namespace: the generic usage of a tool by an LLM;
//   - Adapters are nodes of the "organisation" namespace, owned by a unit: they say how the unit
//     implements an MCP with a connector (parameters, secrets, mapping of the tools onto operations);
//   - a unit inherits the adapters of its ancestors; the nearest one wins.
// MCPs and adapters are edited as graph nodes (through changes); this service only reads them.
service McpService {
  // Connector registry (called by the connectors, as a heartbeat as well).
  rpc RegisterConnector(RegisterConnectorRequest) returns (RegisterConnectorResponse);
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);

  // The MCPs of the platform namespace.
  rpc ListMcps(ListMcpsRequest) returns (ListMcpsResponse);
  // The MCPs a unit can use, with the adapter that implements each (own or inherited).
  rpc ListEffective(ListEffectiveRequest) returns (ListEffectiveResponse);
  // Check an adapter before saving it as a node.
  rpc CheckAdapter(CheckAdapterRequest) returns (CheckAdapterResponse);

  // Tools a unit can use, and their invocation.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

// ---- connectors --------------------------------------------------------------

message RegisterConnectorRequest {
  goap.connector.v1.ConnectorInfo info = 1;
  // base URL where the hub reaches the ConnectorService of this connector
  string endpoint = 2;
}

message RegisterConnectorResponse {
  // the registration expires unless renewed within this delay
  int32 lease_seconds = 1;
}

message Connector {
  goap.connector.v1.ConnectorInfo info = 1;
  string endpoint = 2;
  google.protobuf.Timestamp last_seen = 3;
  // registered and renewed within the lease
  bool live = 4;
}

message ListConnectorsRequest {}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

// ---- MCPs ----------------------------------------------------------------------------

message McpTool {
  string name = 1;
  string description = 2;
  // JSON Schema of the arguments
  google.protobuf.Struct input_schema = 3;
}

message Mcp {
  string name = 1;
  string description = 2;
  repeated McpTool tools = 3;
}

message ListMcpsRequest {}

message ListMcpsResponse {
  repeated Mcp mcps = 1;
}

// ---- adapters ---------------------------------------------------------------------------

// ToolMapping maps one tool of the MCP onto one operation of the connector.
message ToolMapping {
  string tool = 1;
  string operation = 2;
  // operation arguments: literals, or "$.a.b" references to the arguments of the tool call
  // (nested objects and lists are mapped recursively); empty: the tool arguments as they are
  google.protobuf.Struct arguments = 3;
  // dotted path picked in the result of the operation ("" = the whole result)
  string result_path = 4;
}

message Adapter {
  // key of the OrgUnit owning the adapter
  string unit = 1;
  string mcp = 2;
  // id of a registered connector
  string connector = 3;
  // parameters of the connector (see its config schema)
  google.protobuf.Struct config = 4;
  // secret name -> reference: "<vault path>#<field>" or "env:<VARIABLE>"
  map<string, string> secrets = 5;
  repeated ToolMapping tools = 6;
}

message EffectiveMcp {
  Mcp mcp = 1;
  // the adapter resolved for the unit (its `unit` says where it is defined)
  Adapter adapter = 2;
  // defined by an ancestor unit
  bool inherited = 3;
}

message ListEffectiveRequest {
  // key of the OrgUnit (empty: the default organisation)
  string unit = 1;
}

message ListEffectiveResponse {
  // the unit and its ancestors, nearest first
  repeated string chain = 1;
  repeated EffectiveMcp mcps = 2;
}

message CheckAdapterRequest {
  Adapter adapter = 1;
}

message CheckAdapterResponse {
  // non-blocking problems (connector not registered, operation or parameter unknown, ...)
  repeated string warnings = 1;
}

// ---- tools ---------------------------------------------------------------------------------

message Tool {
  // "<mcp>/<tool>"
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
}

message ListToolsRequest {
  // key of the OrgUnit holding the change (empty: the default organisation)
  string unit = 1;
}

message ListToolsResponse {
  // the mapped tools of the MCPs the unit can use
  repeated Tool tools = 1;
  // the MCPs the unit can use
  repeated string mcps = 2;
}

message CallToolRequest {
  string unit = 1;
  // "<mcp>/<tool>"
  string name = 2;
  google.protobuf.Struct arguments = 3;
}

message CallToolResponse {
  google.protobuf.Struct result = 1;
  bool is_error = 2;
  string error = 3;
}
