syntax = "proto3";

package goap.assistant.v1;

import "goap/conversations/v1/conversations.proto";

// AssistantService is the conversational assistant (ADR 0087). It answers the messages of a conversation of the
// caller (ADR 0085) with the model of the "assistant" alias, as the caller, and may use six tools: list the
// methodologies of the active project, select a project, create a change, open a change, list the agents the caller
// may run here and propose to start one (ADR 0090: a proposal, started only by ConfirmAction).
service AssistantService {
  // Appends the user message and a pending assistant message to the conversation, starts the answer in the background
  // and returns both at once. The web polls GetConversation until the assistant message is no longer pending. Refused
  // with FAILED_PRECONDITION when the caller has no "assistant" model alias or the previous message is still being
  // answered.
  rpc Send(SendRequest) returns (SendResponse);
  // Decides a proposal of the assistant (an action of type "start_agent" with status "proposed", ADR 0090). Only the
  // owner of the conversation. Accept re-validates everything as the caller, creates the change when the proposal
  // names a new one, starts the process through the engine as the caller and records the outcome in the action
  // (status "started" with processId and changeId, or "failed" with an error); reject records "rejected". An action
  // already decided is ABORTED; a proposal that is stale (the active project is no longer the proposal's, or the
  // change can no longer be worked on) is FAILED_PRECONDITION and stays proposed.
  rpc ConfirmAction(ConfirmActionRequest) returns (ConfirmActionResponse);
}

message PageTab {
  string kind = 1;
  map<string, string> params = 2;
}

// What the person was looking at when they wrote the message: used for this turn only, never stored (the user message
// keeps a short description of it).
message PageContext {
  PageTab tab = 1;
  // the node or change the tab is about (opaque)
  string subject = 2;
  // the text selected on the page
  string selection = 3;
  // the active project key
  string project = 4;
}

message SendRequest {
  string conversation_id = 1;
  string text = 2;
  PageContext context = 3;
}

message SendResponse {
  goap.conversations.v1.Message user_message = 1;
  // status "pending"; its id is the one to watch
  goap.conversations.v1.Message assistant_message = 2;
}

message ConfirmActionRequest {
  string conversation_id = 1;
  // the assistant message holding the proposal
  string message_id = 2;
  // index in the message's actions
  int32 action_index = 3;
  // accept | reject
  string decision = 4;
  // the active project of the web (empty: the caller's token project); compared with the proposal's
  string project = 5;
}

message ConfirmActionResponse {
  // the assistant message with the action updated
  goap.conversations.v1.Message message = 1;
}
