syntax = "proto3";

package goap.model.v1;

import "google/protobuf/timestamp.proto";

// ModelService is the model gateway: one API over several LLM providers and
// models, addressed by alias ("default", "fast", …) or "provider/model".
service ModelService {
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Embeds texts on the embedding model (alias "embed" by default), one vector per text (ADR 0026).
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  // The contextual helper (ADR 0086): proposes values for the fields of the form the user is working on.
  // Stateless and ephemeral: nothing is stored, no change, no journal entry; it calls the model of the
  // "helper" alias as the caller (role allow-list and token usage as for any other call).
  rpc Suggest(SuggestRequest) returns (SuggestResponse);

  // Platform administration of the gateway (`admin` on the `platform`
  // resource), read-only: providers, models and aliases are nodes of the
  // platform namespace of the graph, changed through changes. Providers are
  // pluggable: a kind is a preset (Mistral, Anthropic, Google, …) on top of a
  // wire protocol (anthropic, openai, gemini).
  rpc ListProviderKinds(ListProviderKindsRequest) returns (ListProviderKindsResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // Ask the provider for its models (before or after saving it).
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  // The catalog: models offered on the platform, with quota and access level.
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse);
  // The global behaviours of the LLM calls (ADR 0093): instructions the gateway adds to the system text of the calls
  // matching their scope. Platform administrators only, like the catalog; they are nodes of the platform namespace,
  // changed through changes.
  rpc ListBehaviors(ListBehaviorsRequest) returns (ListBehaviorsResponse);
  // What a call would be sent with, without calling any model (pure): the system text with the behaviours that apply.
  rpc PreviewBehaviors(PreviewBehaviorsRequest) returns (PreviewBehaviorsResponse);

  // The ledger of LLM calls (ADR 0089): one row per call the gateway served or refused, whoever asked (engine,
  // assistant, helper, indexer). A caller reads its own calls; platform administrators any subject.
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse);
  rpc UsageSummary(UsageSummaryRequest) returns (UsageSummaryResponse);
  // The request and the answer of a call the gateway stores (LLMCall.has_exchange): every call but an engine call of a
  // change, whose exchange is in the change log (ADR 0059). The caller's own calls, any for platform administrators;
  // NOT_FOUND for a call of someone else, a purged one and one with no stored exchange.
  rpc GetCallExchange(GetCallExchangeRequest) returns (GetCallExchangeResponse);
}

message Message {
  string role = 1;
  string content = 2;
}

// What the caller declares about a call, for the ledger (accounting only: never an authorisation input; the subject
// and the project of a call are the principal's).
message CallMeta {
  // who asked: engine | assistant | helper | indexer | intent | ... (lower case, at most 40 characters)
  string source = 1;
  string conversation_id = 2;
  string process_id = 3;
  string change_id = 4;
  // the step of the process and the position of the call in that step (meaningful with a process_id only)
  int32 step = 5;
  string action = 6;
  string agent = 7;
  int32 call = 8;
}

message CompleteRequest {
  string model = 1;
  string system = 2;
  repeated Message messages = 3;
  int32 max_tokens = 4;
  bool json = 5;
  CallMeta meta = 6;
}

message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
}

message CompleteResponse {
  string text = 1;
  string provider = 2;
  string model = 3;
  Usage usage = 4;
  // the global behaviours the gateway added to the instructions (ADR 0093; "!name": dropped by the cap) and the tokens
  // they added (an estimate)
  repeated string behaviors = 5;
  int32 behavior_tokens = 6;
}

message EmbedRequest {
  // alias or "provider/model"; empty: the "embed" alias
  string model = 1;
  repeated string texts = 2;
  CallMeta meta = 3;
}

message Vector {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Vector vectors = 1;
  string provider = 2;
  string model = 3;
  int32 tokens = 4;
}

message ListModelsRequest {}

message ModelAlias {
  string alias = 1;
  string provider = 2;
  string model = 3;
  // Used by the platform itself (assistant, helper): may not be retired nor renamed (ADR 0084). Provider and model are
  // empty while nothing is configured for it.
  bool protected = 4;
}

// A model the caller may use.
message AvailableModel {
  string provider = 1;
  string model = 2;
  string display_name = 3;
}

// What the caller may use: the enabled catalog models it has the role for and
// the aliases pointing to them.
message ListModelsResponse {
  repeated ModelAlias aliases = 1;
  repeated string providers = 2;
  repeated AvailableModel models = 3;
}

message ProviderKind {
  string id = 1;
  string label = 2;
  string protocol = 3;
  string default_base_url = 4;
  bool key_required = 5;
  string description = 6;
}

message ProviderProtocol {
  string id = 1;
  string label = 2;
}

message ListProviderKindsRequest {}

message ListProviderKindsResponse {
  repeated ProviderKind kinds = 1;
  repeated ProviderProtocol protocols = 2;
}

// A configured provider. The API key is never stored: api_key_ref references
// it (env:<VAR> or <vault path>#<field>, alternatives separated by "|").
message Provider {
  string name = 1;
  string kind = 2;
  string protocol = 3;
  string base_url = 4;
  bool enabled = 5;
  bool has_key = 6;
  string api_key_ref = 7;
  // whether the provider is loaded in the running router
  bool active = 8;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message DiscoveredModel {
  string id = 1;
  string display_name = 2;
  // already in the catalog
  bool registered = 3;
}

message DiscoverModelsRequest {
  Provider provider = 1;
  // empty: resolve the key from provider.api_key_ref, or from the reference of the
  // provider of that name
  string api_key = 2;
}

message DiscoverModelsResponse {
  repeated DiscoveredModel models = 1;
}

// A catalog entry. roles: any of these roles may call the model (empty:
// every authenticated caller); admins always may. quota_tokens: global token
// budget per period (0: unlimited); quota_period: day | month | total.
message CatalogModel {
  string provider = 1;
  string model = 2;
  string display_name = 3;
  bool enabled = 4;
  int64 quota_tokens = 5;
  string quota_period = 6;
  repeated string roles = 7;
  int64 used_tokens = 8;
}

message ListCatalogRequest {}

message ListCatalogResponse {
  repeated CatalogModel models = 1;
  repeated ModelAlias aliases = 2;
}

// ---- global behaviours (ADR 0093) ---------------------------------------------

message Behavior {
  string name = 1;
  string description = 2;
  string instruction = 3;
  bool enabled = 4;
  // prepend | append
  string position = 5;
  int32 order = 6;
  // selectors, ANDed, empty: everything
  repeated string aliases = 7;
  repeated string models = 8;
  repeated string sources = 9;
  repeated string kinds = 10;
  bool applies_to_json = 11;
}

message ListBehaviorsRequest {}

// enabled and disabled behaviours, by order then name
message ListBehaviorsResponse {
  repeated Behavior behaviors = 1;
  // the caps: one instruction, and the text added to one call
  int32 max_instruction_bytes = 2;
  int32 max_total_bytes = 3;
  repeated string sources = 4;
}

message PreviewBehaviorsRequest {
  // the alias or provider/model the call would request ("" : default)
  string alias = 1;
  // the declared source of the call (engine, assistant, ...; "" : other)
  string source = 2;
  // the call requires a JSON answer
  bool json = 3;
  // the system text of the call, before the behaviours
  string system = 4;
}

message PreviewBehaviorsResponse {
  string system = 1;
  repeated string applied = 2;
  // dropped by the cap on the text added to a call
  repeated string skipped = 3;
  int32 added_tokens = 4;
}

// ---- the contextual helper (ADR 0086) ---------------------------------------

// The tab the user is on, as the web names it (opaque to the server).
message SuggestTab {
  string kind = 1;
  map<string, string> params = 2;
}

// A field of the form: what the helper may propose a value for.
message SuggestField {
  string id = 1;
  string label = 2;
  // string | number | boolean | date | enum | json
  string type = 3;
  repeated string enum_values = 4;
  string description = 5;
  // the current value, as JSON text ("" when empty)
  string current_value = 6;
  bool read_only = 7;
}

message SuggestContext {
  SuggestTab tab = 1;
  // the node or change the tab is about (opaque strings)
  string subject = 2;
  // the text the user selected on the page
  string selection = 3;
  repeated SuggestField fields = 4;
}

message SuggestMessage {
  // user | assistant
  string role = 1;
  string text = 2;
}

message SuggestRequest {
  SuggestContext context = 1;
  // the small discussion so far, resent each time
  repeated SuggestMessage messages = 2;
  // optional instruction of the user for this round
  string instruction = 3;
}

message SuggestProposal {
  string field_id = 1;
  // the proposed value, as JSON text
  string value = 2;
  string rationale = 3;
}

message SuggestResponse {
  string message = 1;
  repeated SuggestProposal proposals = 2;
  Usage usage = 3;
}


// ---- the ledger of LLM calls (ADR 0089) --------------------------------------

// One LLM call. The exchange of an engine call of a change stays in the change log (ADR 0059, the model.call entry of
// change_id / process_id with this step and call); the gateway stores the exchange of every other call (has_exchange).
message LLMCall {
  int64 seq = 1;
  google.protobuf.Timestamp at = 2;
  int64 duration_ms = 3;
  // the principal's, "" for a trusted internal caller without identity
  string subject = 4;
  string project = 5;
  string org = 6;
  // the name requested, "" when a literal provider/model
  string alias = 7;
  // empty when the model could not be resolved (a refused call)
  string provider = 8;
  string model = 9;
  // complete | embed
  string kind = 10;
  int64 input_tokens = 11;
  int64 output_tokens = 12;
  // the failure, refusals included (quota exceeded, forbidden, ...); empty when it succeeded
  string error = 13;
  string source = 14;
  string conversation_id = 15;
  string process_id = 16;
  string change_id = 17;
  // -1 when the call belongs to no process
  int32 step = 18;
  string action = 19;
  string agent = 20;
  int32 call = 21;
  // the gateway stores the request and the answer of this call (read them with GetCallExchange)
  bool has_exchange = 22;
  // the global behaviours applied to the call ("!name": dropped by the cap, ADR 0093) and the tokens they added (an
  // estimate). The stored exchange holds the system text as sent, behaviours included.
  repeated string behaviors = 23;
  int64 behavior_tokens = 24;
}

message GetCallExchangeRequest {
  int64 seq = 1;
}

message ExchangeMessage {
  string role = 1;
  string content = 2;
}

message GetCallExchangeResponse {
  LLMCall call = 1;
  string system = 2;
  repeated ExchangeMessage messages = 3;
  string response = 4;
  // a text was cut to the cap of the exchanges
  bool truncated = 5;
  // the failure of the call, "" when it succeeded (also in call.error)
  string error = 6;
}

// What to select. Every field narrows; empty matches everything. A caller who is not an administrator sees its own
// calls only (subject is forced to it; naming another is refused).
message UsageFilter {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string subject = 3;
  string project = 4;
  // the model id, or provider/model
  string model = 5;
  string alias = 6;
  string source = 7;
  string process_id = 8;
  string change_id = 9;
  string conversation_id = 10;
  // only the calls after this seq (the cursor of a feed)
  int64 after_seq = 11;
  // 0: 500; at most 5000
  int32 limit = 12;
}

message ListUsageRequest {
  UsageFilter filter = 1;
}

// calls are ascending by seq: with after_seq, the first ones after it; without, the latest `limit` ones.
message ListUsageResponse {
  repeated LLMCall calls = 1;
  // the cursor to pass as after_seq to get what follows (after_seq itself when nothing matched)
  int64 next_seq = 2;
  // more calls follow next_seq
  bool has_more = 3;
}

message UsageSummaryRequest {
  // after_seq and limit are ignored
  UsageFilter filter = 1;
  // model | alias | source | subject | process | action | agent | day | hour
  string group_by = 2;
}

message UsageSummaryRow {
  // the value of the group (day: YYYY-MM-DD, hour: YYYY-MM-DDTHH, UTC; "" for calls with none)
  string key = 1;
  int64 calls = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 errors = 5;
  int64 duration_ms = 6;
}

message UsageSummaryResponse {
  // by decreasing tokens; day and hour ascending
  repeated UsageSummaryRow rows = 1;
}
