syntax = "proto3";

package goap.model.v1;

// ModelService is the model gateway: one API over several LLM providers and
// models, addressed by alias ("default", "fast", …) or "provider/model".
service ModelService {
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Embeds texts on the embedding model (alias "embed" by default), one vector per text (ADR 0026).
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  // The contextual helper (ADR 0086): proposes values for the fields of the form the user is working on.
  // Stateless and ephemeral: nothing is stored, no change, no journal entry; it calls the model of the
  // "helper" alias as the caller (role allow-list and token usage as for any other call).
  rpc Suggest(SuggestRequest) returns (SuggestResponse);

  // Platform administration of the gateway (`admin` on the `platform`
  // resource), read-only: providers, models and aliases are nodes of the
  // platform namespace of the graph, changed through changes. Providers are
  // pluggable: a kind is a preset (Mistral, Anthropic, Google, …) on top of a
  // wire protocol (anthropic, openai, gemini).
  rpc ListProviderKinds(ListProviderKindsRequest) returns (ListProviderKindsResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // Ask the provider for its models (before or after saving it).
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  // The catalog: models offered on the platform, with quota and access level.
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse);
}

message Message {
  string role = 1;
  string content = 2;
}

message CompleteRequest {
  string model = 1;
  string system = 2;
  repeated Message messages = 3;
  int32 max_tokens = 4;
  bool json = 5;
}

message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
}

message CompleteResponse {
  string text = 1;
  string provider = 2;
  string model = 3;
  Usage usage = 4;
}

message EmbedRequest {
  // alias or "provider/model"; empty: the "embed" alias
  string model = 1;
  repeated string texts = 2;
}

message Vector {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Vector vectors = 1;
  string provider = 2;
  string model = 3;
  int32 tokens = 4;
}

message ListModelsRequest {}

message ModelAlias {
  string alias = 1;
  string provider = 2;
  string model = 3;
  // Used by the platform itself (assistant, helper): may not be retired nor renamed (ADR 0084). Provider and model are
  // empty while nothing is configured for it.
  bool protected = 4;
}

// A model the caller may use.
message AvailableModel {
  string provider = 1;
  string model = 2;
  string display_name = 3;
}

// What the caller may use: the enabled catalog models it has the role for and
// the aliases pointing to them.
message ListModelsResponse {
  repeated ModelAlias aliases = 1;
  repeated string providers = 2;
  repeated AvailableModel models = 3;
}

message ProviderKind {
  string id = 1;
  string label = 2;
  string protocol = 3;
  string default_base_url = 4;
  bool key_required = 5;
  string description = 6;
}

message ProviderProtocol {
  string id = 1;
  string label = 2;
}

message ListProviderKindsRequest {}

message ListProviderKindsResponse {
  repeated ProviderKind kinds = 1;
  repeated ProviderProtocol protocols = 2;
}

// A configured provider. The API key is never stored: api_key_ref references
// it (env:<VAR> or <vault path>#<field>, alternatives separated by "|").
message Provider {
  string name = 1;
  string kind = 2;
  string protocol = 3;
  string base_url = 4;
  bool enabled = 5;
  bool has_key = 6;
  string api_key_ref = 7;
  // whether the provider is loaded in the running router
  bool active = 8;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message DiscoveredModel {
  string id = 1;
  string display_name = 2;
  // already in the catalog
  bool registered = 3;
}

message DiscoverModelsRequest {
  Provider provider = 1;
  // empty: resolve the key from provider.api_key_ref, or from the reference of the
  // provider of that name
  string api_key = 2;
}

message DiscoverModelsResponse {
  repeated DiscoveredModel models = 1;
}

// A catalog entry. roles: any of these roles may call the model (empty:
// every authenticated caller); admins always may. quota_tokens: global token
// budget per period (0: unlimited); quota_period: day | month | total.
message CatalogModel {
  string provider = 1;
  string model = 2;
  string display_name = 3;
  bool enabled = 4;
  int64 quota_tokens = 5;
  string quota_period = 6;
  repeated string roles = 7;
  int64 used_tokens = 8;
}

message ListCatalogRequest {}

message ListCatalogResponse {
  repeated CatalogModel models = 1;
  repeated ModelAlias aliases = 2;
}


// ---- the contextual helper (ADR 0086) ---------------------------------------

// The tab the user is on, as the web names it (opaque to the server).
message SuggestTab {
  string kind = 1;
  map<string, string> params = 2;
}

// A field of the form: what the helper may propose a value for.
message SuggestField {
  string id = 1;
  string label = 2;
  // string | number | boolean | date | enum | json
  string type = 3;
  repeated string enum_values = 4;
  string description = 5;
  // the current value, as JSON text ("" when empty)
  string current_value = 6;
  bool read_only = 7;
}

message SuggestContext {
  SuggestTab tab = 1;
  // the node or change the tab is about (opaque strings)
  string subject = 2;
  // the text the user selected on the page
  string selection = 3;
  repeated SuggestField fields = 4;
}

message SuggestMessage {
  // user | assistant
  string role = 1;
  string text = 2;
}

message SuggestRequest {
  SuggestContext context = 1;
  // the small discussion so far, resent each time
  repeated SuggestMessage messages = 2;
  // optional instruction of the user for this round
  string instruction = 3;
}

message SuggestProposal {
  string field_id = 1;
  // the proposed value, as JSON text
  string value = 2;
  string rationale = 3;
}

message SuggestResponse {
  string message = 1;
  repeated SuggestProposal proposals = 2;
  Usage usage = 3;
}
