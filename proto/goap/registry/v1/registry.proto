syntax = "proto3";

package goap.registry.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// RegistryService stores the methodologies (as nodes of the graph, ADR 0023); the domains are DomainService's (ADR
// 0125). A version is a draft (editable) until published (immutable). YAML is only an import / export format.
service RegistryService {
  rpc ListMethodologies(ListMethodologiesRequest) returns (ListMethodologiesResponse);
  // version empty = latest published version
  rpc GetMethodology(GetMethodologyRequest) returns (GetMethodologyResponse);
  // Create or replace a draft. Invalid drafts are saved and their issues returned.
  rpc SaveMethodology(SaveMethodologyRequest) returns (SaveMethodologyResponse);
  rpc ValidateMethodology(ValidateMethodologyRequest) returns (ValidateMethodologyResponse);
  // A process of a methodology (as edited, saved or not) as a graph: steps, the edges its conditions draw, methods (ADR 0036 §4).
  rpc GetProcessGraph(GetProcessGraphRequest) returns (GetProcessGraphResponse);
  // The compiled view of the activities of a methodology (as edited, saved or not): processes, methods, step trees
  // with their entry and exit conditions, and what each condition means (ADR 0126 step 3). It holds no value of a
  // change: the engine binds it to a change (GetChangeState, ListStartingPoints, GetProgress).
  rpc GetMethodologyView(GetMethodologyViewRequest) returns (GetMethodologyViewResponse);
  // Level-by-level coherence of a process, or of a method composing its own steps (as edited): for the root and each
  // step with sub-steps, whether the entry conditions and exit criteria of the direct steps chain the parent's
  // inputs to its outputs.
  rpc CheckLevels(CheckLevelsRequest) returns (CheckLevelsResponse);
  // Plans toward a goal with the planner its agent is actually configured with (goap, utility or hybrid), from a
  // world state the given condition overrides patch on top of an empty blackboard: no live Change is needed. For a
  // process, name it as both agent and goal; for an agent a step names directly (or a capability's chosen method),
  // name its agent and goal instead - that is where a hybrid or utility planner actually runs.
  rpc PreviewPlan(PreviewPlanRequest) returns (PreviewPlanResponse);
  // Freeze a valid draft; the engine only runs published versions.
  rpc PublishMethodology(PublishMethodologyRequest) returns (PublishMethodologyResponse);
  // Copy a version into a new draft version.
  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse);
  // Delete a draft, or archive a published version.
  rpc DeleteMethodology(DeleteMethodologyRequest) returns (DeleteMethodologyResponse);
  rpc ImportMethodology(ImportMethodologyRequest) returns (ImportMethodologyResponse);
  rpc ExportMethodology(ExportMethodologyRequest) returns (ExportMethodologyResponse);

  // Methodology versions referencing a domain version.
  rpc GetDomainUsage(GetDomainUsageRequest) returns (GetDomainUsageResponse);
}

// DomainService stores the domains (in its database, ADR 0023), the definition of the graph: the object part (node
// types, link types, lifecycles, algorithms), one per namespace (ADR 0013); methodologies reference their types as
// <namespace>@<type>. A version is a draft (editable) until published (immutable), like a methodology. It names no
// methodology (ADR 0125 §3).
service DomainService {
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse);
  // version empty = latest published version
  rpc GetDomain(GetDomainRequest) returns (GetDomainResponse);
  rpc SaveDomain(SaveDomainRequest) returns (SaveDomainResponse);
  rpc ValidateDomain(ValidateDomainRequest) returns (ValidateDomainResponse);
  // Freeze a valid draft: it becomes the version in force. The methodologies it breaks are suspended by the
  // methodology registry, which follows the events of the domains (ADR 0125 §3).
  rpc PublishDomain(PublishDomainRequest) returns (PublishDomainResponse);
  rpc CreateDomainVersion(CreateDomainVersionRequest) returns (CreateDomainVersionResponse);
  rpc DeleteDomain(DeleteDomainRequest) returns (DeleteDomainResponse);
  rpc ImportDomain(ImportDomainRequest) returns (ImportDomainResponse);
  rpc ExportDomain(ExportDomainRequest) returns (ExportDomainResponse);
  // The type catalogue in force (ADR 0012): the node and link types of the published and built-in domains, resolved.
  rpc ListTypes(ListTypesRequest) returns (ListTypesResponse);
  // Try an algorithm of a domain on a sample input, without saving anything.
  rpc RunAlgorithm(RunAlgorithmRequest) returns (RunAlgorithmResponse);
}

message NodeType {
  string name = 1;
  string description = 2;
  // attributes of the nodes: what the user interface displays and edits, with their validators
  repeated Attribute attributes = 3;
  // parent type (subtyping): inherits its attributes and link types
  string extends = 4;
  // name of the lifecycle of the nodes of the type (ADR 0014, one of the
  // domain's lifecycles); inherited through extends
  string lifecycle = 5;
  // the type is a document embedding nodes through outgoing "contains" links
  DocumentSpec document = 6;
  // absent: change controlled (the default)
  optional bool change_controlled = 7;
  // node_validator instances (ADR 0018) checking a node as a whole, in call order
  repeated string validators = 8;
  // properties the node index keeps (ADR 0026)
  repeated SearchProperty search = 9;
  // editor the user interface opens the nodes of the type with (inherited through extends; empty: the default node editor)
  string editor = 10;
  // tags the type as a structure of the graph (ADR 0054): the organisation or the project hierarchy
  StructureTag structure = 11;
  // links a node of the type must carry (ADR 0065)
  repeated RequiredLink requires = 12;
  // nodes of the type are written by platform administrators only (ADR 0068)
  bool admin_only = 13;
  // nodes of the type may carry properties that are no attribute of it (strict attributes, ADR 0079); inherited
  bool additional_properties = 14;
  // what a person fills in to create a node of the type (pkg/form.Form, ADR 0115 §7); inherited
  google.protobuf.Struct form = 15;
  // icon the user interface draws the nodes with (a name of its icon set); inherited
  string icon = 16;
  // color of the nodes (#rrggbb); inherited
  string color = 17;
}

// RequiredLink: a node of the type has exactly count outgoing links of the link type (ADR 0065).
message RequiredLink {
  // link type of the same domain, or qualified
  string link = 1;
  // number of links; 0 means 1
  int32 count = 2;
}

// StructureTag tags a node type as the one building a hierarchy every node version is placed in (ADR 0054).
message StructureTag {
  // "organisation" or "project"
  string kind = 1;
  // link type (of the same domain) from a child to its parent
  string parent = 2;
  // key of the root node the bootstrap creates
  string root = 3;
  // the root links to itself through parent (a project root)
  bool self_parent = 4;
}

// SearchProperty declares how the node index uses a property: text (full text
// and embedding document), facet (filter and count).
message SearchProperty {
  string property = 1;
  bool text = 2;
  bool facet = 3;
}

// Attribute defines a property of a node type or a link type: its code and what the user interface needs to display
// and edit it.
message Attribute {
  // code: the key of the value in the properties
  string name = 1;
  string label = 2;
  string description = 3;
  // string | number | boolean | date | enum | json | code (empty: string)
  string type = 4;
  // text | textarea | dropdown | checkbox | date | directory | code (empty: the usual one of the type)
  string widget = 5;
  // enum of the domain an enum attribute takes its values from
  string enum = 6;
  string default_value = 7;
  string section = 8;
  int32 order = 9;
  string tooltip = 10;
  // the attribute is the display name of the node
  bool as_name = 11;
  // property_validator instances (ADR 0018), in call order
  repeated string validators = 12;
  // how a change of its value is shown: value | words | lines | json | code (empty: the usual one of the type)
  string diff = 13;
}

// EnumValue is one value of an enum; the label defaults to the value.
message EnumValue {
  string value = 1;
  string label = 2;
}

// Enum is a closed list of values of a domain that enum attributes refer to.
message Enum {
  string name = 1;
  string description = 2;
  repeated EnumValue values = 3;
}

// ItemType is a type of change item a domain declares (ADR 0128): its items name it in their `type`; a name is one
// across the domains in force. The attributes describe the keys of the data of its items.
message ItemType {
  string name = 1;
  string description = 2;
  repeated Attribute attributes = 3;
}

// ImporterDecl is a source a domain declares its graph can be loaded from (ADR 0148): its name, unique in the domain,
// and the parameters a run takes, as attributes; a service registered with the import registry implements it.
message ImporterDecl {
  string name = 1;
  string label = 2;
  string description = 3;
  repeated Attribute params = 4;
}

// AttributeInfo is a resolved attribute of a node type or link type.
message AttributeInfo {
  Attribute attribute = 1;
  // the type that declares it when it is inherited; empty: the type's own
  string from = 2;
  // values of the enum of an enum attribute
  repeated EnumValue values = 3;
}

// AlgorithmParam declares a typed parameter of an algorithm.
message AlgorithmParam {
  string name = 1;
  // string | number | boolean | regex | enum | strings | json | secret
  string type = 2;
  string description = 3;
  bool required = 4;
  google.protobuf.Value default_value = 5;
  // allowed values of an enum
  repeated string values = 6;
}

// Algorithm is a script of a fixed type (ADR 0018) with declared parameters.
message Algorithm {
  string name = 1;
  string description = 2;
  // property_validator | node_validator | link_validator | transition_guard | transition_action
  string type = 3;
  // javascript | go
  string language = 4;
  string code = 5;
  repeated AlgorithmParam params = 6;
}

// AlgorithmInstance sets the parameter values of an algorithm; it is what gets plugged.
message AlgorithmInstance {
  string name = 1;
  string description = 2;
  string algorithm = 3;
  google.protobuf.Struct values = 4;
}

message Lifecycle {
  string name = 4;
  string description = 5;
  string initial = 1;
  repeated LifecycleState states = 2;
  repeated LifecycleTransition transitions = 3;
}

message LifecycleState {
  string name = 1;
  string description = 2;
  // a node in a not committable state blocks the commit of its change (ADR 0078)
  bool not_committable = 3;
  bool final = 4;
}

message LifecycleTransition {
  string name = 1;
  string from = 2;
  string to = 3;
  // "type:action" the actor must hold
  string permission = 4;
  // CEL over the node and its children, evaluated when the change is applied
  string guard = 5;
  repeated string requires_attributes = 6;
  repeated string requires_outgoing_links = 7;
  // documents: allowed states of the contained children (empty: no constraint)
  repeated string children_states = 8;
  // transition_guard instances, run in order after the CEL guard
  repeated string guards = 9;
  // transition_action instances, run in order once the transition is accepted
  repeated string actions = 10;
  string description = 11;
  // criteria of the gate (ADR 0075 §3): a veto not met blocks, an objective not met needs a derogation
  repeated Criterion vetos = 12;
  repeated Criterion objectives = 13;
}

// A named CEL predicate of a gate.
message Criterion {
  string name = 1;
  string expr = 2;
  string description = 3;
}

message DocumentSpec {
  repeated string contains = 1;
}

message LinkType {
  string name = 1;
  string from = 2;
  string to = 3;
  // composition link: the target is a part of the source, shown as its child
  bool compose = 4;
  // what a link of the type carries
  repeated Attribute attributes = 5;
  string description = 6;
  // link_validator instances (ADR 0100) checking a link of the type as a whole, in call order
  repeated string validators = 7;
  // the link read from its source ("implements"); empty: the name
  string label = 8;
  // the link read from its target ("implemented by"); empty: the label
  string inverse_label = 9;
}

message Condition {
  string name = 1;
  string description = 2;
  // CEL expression over the blackboard (self is the subject of a scoped condition)
  string expr = 3;
  // kind of subject (ADR 0109): change (empty), impact, item, risk, action, step
  string scope = 4;
  // subjects of a scoped condition or an aggregate (CEL, self the subject)
  string where = 5;
  // aggregate: the scoped condition every / some / no subject satisfies
  string all = 6;
  string any = 7;
  string none = 8;
  // value of an all aggregate over no subject
  bool empty = 9;
}

// A condition used as a control of an activity, and what it covers (ADR 0162): rules of the domain, linked to the
// subject or kept by a filter, and general rules of the methodology. A condition is a control by this use only.
message Control {
  // the condition the activity waits for: it holds once the rules were collected
  string condition = 5;
  // node types of the domain the rules are (alm@ArchitectureDecision)
  repeated string types = 1;
  // link type from a rule to the subject of the execution (alm@governs); empty: no link needed
  string via = 2;
  // CEL keeping the rules that govern the subject: self the rule, subject the subject, change the change
  string where = 3;
  // general rules of the methodology
  repeated ControlRule rules = 4;
}

// A rule a control covers (ADR 0162).
message ControlRule {
  string id = 1;
  // the rule in one imperative sentence: all an agent is given of it
  string statement = 2;
  // veto (empty) | objective | advice
  string severity = 3;
  // how the rule is measured; none: it guides, it is not measured
  ControlCheck check = 4;
  // how to fix a violation, in one line
  string fix = 5;
}

// How a rule is measured (ADR 0162).
message ControlCheck {
  // cypher (a query over the view of the change, each row a violation) | shell (a command in the workspace)
  string language = 1;
  string code = 2;
}

message ProduceSpec {
  // create_node | update_node
  string op = 1;
  string node_type = 2;
}

message LinkSpec {
  string type = 1;
  // out (default) | in
  string direction = 2;
}

message Expectation {
  // impacts | proposals | items | artifacts
  string for_each = 1;
  string where = 2;
  ProduceSpec produce = 3;
  LinkSpec link = 4;
}

message Action {
  string name = 1;
  string description = 2;
  // llm | script | tool | human | builtin | abstract
  string kind = 3;
  map<string, bool> pre = 4;
  map<string, bool> effects = 5;
  double cost = 6;
  Expectation expects = 7;
  // "<resource>:<action>" required from the initiator, e.g. change:apply
  string permission = 8;
  string model = 9;
  string prompt = 10;
  string tool = 11;
  string builtin = 12;
  string instructions = 13;
  google.protobuf.Struct params = 14;
  // script actions: javascript | go, and the code run in the sandbox with the DSL
  string language = 15;
  string code = 16;
  // CEL expression returning a number (utility / hybrid planners)
  string utility = 17;
  // specialization: "<action>" or "<methodology>/<action>", guard (CEL) and priority
  string specializes = 18;
  string when = 19;
  int32 priority = 20;
  // reaches its effects over several executions (progress is not a failure)
  bool incremental = 21;
  // MCPs the action uses (llm and script actions); a tool action is "<mcp>/<tool>"
  repeated string mcps = 22;
  // how the effect is verified (ADR 0075)
  Verify verify = 23;
  // the events that make it reactive: it runs again on a change of its methodology for each of them (ADR 0110)
  repeated Subscription on = 24;
  // the events of the methodology it raises when it reaches its effects (ADR 0110)
  repeated string emits = 25;
  // runs once per pending subject of this scope (ADR 0109), within where
  string scope = 26;
  string where = 27;
  // the subjects a scoped llm or tool action runs for at once (0: the engine's bound, 1: one after the other)
  int32 parallel = 28;
  // human actions: what the person fills in (ADR 0115, pkg/form.Form as JSON: title, description, submit, artifact,
  // fields [{name, widget, label, help, placeholder, section, required, default, constraints}])
  google.protobuf.Struct form = 29;
  // llm actions: the budget of the tool loop (ADR 0118)
  ActionLoop loop = 30;
  // roles allowed to run the action (ADR 0043), declared by the methodology; empty: those of the agent
  repeated string roles = 31;
  // the role the action acts as (ADR 0139): its own; the compiler gives the others the role of what refines them
  string role = 32;
  // the controls governing what it produces (ADR 0162): their conditions waited for, their rules given and measured
  repeated Control controls = 33;
}

// The budget of the tool loop of an llm action (ADR 0118); 0 / empty: the engine's default.
message ActionLoop {
  int32 max_rounds = 1;
  int32 max_tool_result_bytes = 2;
  int64 max_tokens = 3;
  // a Go duration (45m, 2h)
  string timeout = 4;
  int32 compact_bytes = 5;
}

// The verification an action declares (ADR 0075): the kind of verifier its effect needs.
message Verify {
  // tool | human | model
  string oracle = 1;
  // the verifier differs from the producer; unset is true
  optional bool independent = 2;
}

// An agent (Embabel terminology): a planner and the set of admissible actions
// reaching its goals. Identification of the agent from an intent uses the
// description and examples.
message Agent {
  string name = 1;
  string description = 2;
  repeated string examples = 3;
  // goap | utility | hybrid | llm | llm-scoring
  string planner = 4;
  // admissible action names (empty: all)
  repeated string actions = 5;
  // goal names (empty: all)
  repeated string goals = 6;
  // automatic executions (outside the intent loop)
  repeated Trigger triggers = 7;
  // MCPs whose tools the llm and script actions of the agent may use
  repeated string mcps = 8;
  // LLM alias (required when planner is llm or llm-scoring)
  string model = 9;
  // one instance per scope, run again for every new execution there with its conversation (ADR 0112)
  Persistence persistent = 10;
  // roles allowed to run the agent (ADR 0043), declared by the methodology; empty: any member of the project
  repeated string roles = 11;
  // the role the agent acts as (ADR 0050, 0139)
  string role = 12;
}

// The persistence of an agent (ADR 0112): what one instance is for, what closes it, how much of its conversation it
// keeps.
message Persistence {
  // "change" (default) or a path into the event that starts the run ("event.process.methodology")
  string scope = 1;
  // conditions that close the instance once a run of it completes with them
  map<string, bool> until = 2;
  // exchanges of its llm actions given back to the model (0: the default)
  int32 memory = 3;
}

// A trigger starts the agent automatically.
message Trigger {
  string name = 1;
  string description = 2;
  // event | schedule
  string type = 3;
  // event triggers: change.created | change.applied | change.item_added |
  // process.completed | process.failed | methodology.published
  string event = 4;
  // CEL filter over the event: event.type, event.change {id, title, status,
  // methodology, goal, baseline}, event.process {id, agent, goal, status}
  string filter = 5;
  // schedule triggers: cron expression (5 fields, UTC)
  string schedule = 6;
  // goal to reach (empty: the only goal of the agent, or the intent loop)
  string goal = 7;
  // intent text given to the process
  string intent = 8;
  // new_change: open a change on the latest baseline (default);
  // event_change: work on the change of the event
  string target = 9;
  // roles of the service identity running the process (ABAC)
  repeated string roles = 10;
  bool enabled = 11;
  // event_change: an event firing the trigger cancels its runs still at work on the change (ADR 0110)
  bool supersede = 12;
}

message Goal {
  string name = 1;
  string description = 2;
  repeated string examples = 3;
  map<string, bool> pre = 4;
  double value = 5;
}

message Methodology {
  string name = 1;
  string version = 2;
  string description = 3;
  // draft | published | archived (read only)
  string status = 4;
  repeated Condition conditions = 7;
  repeated Action actions = 8;
  repeated Goal goals = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp published_at = 12;
  string updated_by = 13;
  repeated Agent agents = 14;
  // target namespace: the namespace (domain) the changes of the methodology act on (ADR 0013)
  string namespace = 17;
  // how the objective of a change is reached, as steps and sub-steps (ADR 0034)
  repeated Process processes = 18;
  // how a step capability is carried out per context, each naming the agent that acts (ADR 0035 §1)
  repeated Method methods = 19;
  // the roles the processes and methods assign (ADR 0035 §2)
  repeated Role roles = 20;
  // transverse: its processes run alongside the changes of these methodologies (ADR 0036 §3)
  repeated string applies_to = 21;
  // the events of those changes it reacts to (default: a process attached, a step completed)
  repeated Subscription on = 22;
  // the lifecycle of the domain its changes follow (ADR 0058); empty: none
  string lifecycle = 23;
  // the condition libraries it imports (ADR 0064): decisions, risks
  repeated string imports = 24;
  // default criticality of the changes of the methodology: C1, C2 or C3 (ADR 0075 §3); empty: C2
  string criticality = 25;
  // the main goal of the methodology: a declared goal or a process; its changes start with it (ADR 0096)
  string goal = 26;
  // the methodologies whose changes its changes integrate as sub-changes (ADR 0106)
  repeated Integration integrates = 27;
  // what it requires of the changes it integrates, as an outer guardian of their chain (ADR 0106)
  Guardian guardian = 28;
  // the events of the methodology, in addition to the standard ones (ADR 0110)
  repeated EventDef events = 29;
  // the version of each domain the methodology is written against, by domain name (ADR 0113): pinned at publication
  map<string, string> domains = 30;
  // how the assessments of the subjects of its changes read: per subject, states bound to conditions (ADR 0116)
  repeated AssessmentView assessments = 31;
  // why a published version is suspended (ADR 0125 §3): the domains it follows changed and it no longer compiles against
  // them; no change starts on it and no run reads it until a compatible version is published. Empty: in force. Set by
  // the registry, ignored on a write.
  string suspended = 32;
}

// AssessmentView is how the assessments of the subjects a pattern matches read (ADR 0116): the first state that holds wins.
message AssessmentView {
  // a subject key (description, title, intent, impact:<key>, item:<key>) or a glob (impact:*, *)
  string subject = 1;
  repeated AssessmentState states = 2;
}

// AssessmentState holds when each condition has its value and the CEL expression when is true.
message AssessmentState {
  string when = 1;
  map<string, bool> conditions = 2;
  // ok | warn | danger | info | neutral
  string tone = 3;
  string label = 4;
  // the bubble opens by itself while the state holds
  bool open = 5;
}

// EventDef is an event a methodology declares (ADR 0110), raised by a signal item of its name.
message EventDef {
  string name = 1;
  string description = 2;
}

// Methodologies whose changes the changes of a methodology integrate (ADR 0106).
message Integration {
  repeated string methodologies = 1;
  // those changes commit only through a change of the integrator
  bool exclusive = 2;
  // decision (default) | auto
  string attach = 3;
}

// The guards a methodology adds to the changes it integrates (ADR 0106): CEL, with `integrator`.
message Guardian {
  // must hold for each commit of a change it integrates (ADR 0146)
  string commit = 1;
  // transition name -> guard
  map<string, string> transitions = 2;
}

// An event a methodology reacts to, with a CEL filter over event ({type, change, process, step, items}); from: self
// (default, the change it runs on), integrated (the changes it integrates), integrator (the change integrating it).
message Subscription {
  string event = 1;
  string filter = 2;
  string from = 3;
  // An event arriving while the reactive run is at work interrupts it and runs it again (ADR 0110).
  bool supersede = 4;
}

// A role a methodology needs; the organisation assigns it to users per unit ("developer@TEAM-PAY").
message Role {
  string name = 1;
  string description = 2;
  // the operations on a change the role allows (ADR 0103): codes of the catalogue or kinds (doer, reviewer); none: all
  repeated string operations = 3;
}

// Roles assigned to a step or a method, RACI style.
message Responsibilities {
  string responsible = 1;
  string accountable = 2;
  repeated string consulted = 3;
  repeated string informed = 4;
}

// A method: the documentary reference of how a capability is carried out in a context, and the agent that acts.
message Method {
  string name = 1;
  // the capability it provides
  string for = 2;
  // CEL condition of its context (empty: always)
  string when = 3;
  int32 priority = 4;
  string description = 5;
  string guidance = 6;
  repeated string checklist = 7;
  repeated string deliverables = 8;
  repeated Reference references = 9;
  // the roles involved when the method is used (replacing those of the step)
  Responsibilities roles = 12;
  // composes the method from its own steps and sub-steps, the same shape and compilation as a process's,
  // generating a goal of the method's own name
  repeated Step steps = 13;
  // the actions that realize the method: the pool of the agent applying it, with those of its steps (ADR 0050)
  repeated string actions = 14;
  // exit criteria of a method without steps
  map<string, bool> done = 15;
  // planner (goap by default), LLM alias and MCPs of the agent applying the method
  string planner = 16;
  string model = 17;
  repeated string mcps = 18;
  // the events that make it reactive: it runs again on a change of its methodology for each of them (ADR 0110)
  repeated Subscription on = 19;
  // the same instance of its agent carries the method out at every run of its step on the scope (ADR 0112)
  Persistence persistent = 20;
}

// A process: the steps that reach an objective, run by an agent of its name towards a goal of its name (ADR 0034).
message Process {
  string name = 1;
  string description = 2;
  repeated string examples = 3;
  repeated Step steps = 5;
  // the reference documents that describe the process
  repeated Reference references = 6;
  // the events that make it reactive: it runs again on a change of its methodology for each of them (ADR 0110)
  repeated Subscription on = 7;
  // the roles of the process, RACI style (ADR 0139): its responsible role is required, its steps inherit them
  Responsibilities roles = 8;
}

// A reference document: "doc:<key>" (a document of the graph), "<mcp>:<path>" (a document repository) or a URL.
message Reference {
  string title = 1;
  string ref = 2;
  string section = 3;
}

// A step of a process, done by one method: sub-steps, an action, an agent, a nested process, or by hand (none). Steps
// are sequenced by their conditions, not by their position.
message Step {
  string name = 1;
  string description = 2;
  // what a person does, for a manual step
  string instructions = 3;
  // entry conditions (also of its sub-steps)
  map<string, bool> pre = 4;
  // exit criteria (default: derived from the method)
  map<string, bool> done = 5;
  repeated Step steps = 8;
  string action = 9;
  // an agent is the actor of a method, not a way to do a step
  // nested process: "<process>" or "<methodology>/<process>"
  string process = 12;
  // alternative actions the planner chooses among (instead of action)
  repeated string actions = 13;
  // the reference documents that describe the step
  repeated Reference references = 14;
  // what the step is for and how to go about it (markdown), what a person checks, what it produces
  string guidance = 15;
  repeated string checklist = 16;
  repeated string deliverables = 17;
  // the capability the step needs done, provided by methods (ADR 0035 §1)
  string method = 18;
  // the roles assigned to the step (its sub-steps inherit them)
  Responsibilities roles = 19;
  // CEL list on the blackboard: the step naming a capability runs once per element, in parallel streams (ADR 0050)
  string foreach = 20;
  // CEL key of the group of each element of foreach: one stream per group, whose item is {key, items}
  string group_by = 21;
  // the events that make it reactive: it runs again on a change of its methodology for each of them (ADR 0110)
  repeated Subscription on = 22;
  // CEL condition of the scope (self): the subjects of the scoped action the step runs it for (ADR 0109 §3.5)
  string where = 23;
  // the step is a review of a subject of the change; an automatic one starts by itself (ADR 0130)
  StepReview review = 24;
  // the step is a gate of its process: a checklist, a go decision, a move of the lifecycle of the change (ADR 0132)
  StepGate gate = 25;
  // the controls governing what the step and its sub-steps produce (ADR 0162)
  repeated Control controls = 26;
}

// A gate of a process (ADR 0132): a milestone where the checklist of the change is checked, a go is decided and the
// change takes a transition of its lifecycle, freezing what the gate declares.
message StepGate {
  // the transition of the lifecycle of the change the go takes
  string transition = 1;
  repeated GateItem checklist = 2;
  GateDecision decision = 3;
  GateFreezes freezes = 4;
}

// An item of the checklist of a gate: a condition of the methodology, or an attestation of a person of its role.
message GateItem {
  string name = 1;
  string description = 2;
  // the role that answers for the item (default: the accountable role of the step)
  string role = 3;
  // an unmet veto blocks the gate; an unmet objective is covered by a derogation
  bool veto = 4;
  // CEL over the change: the item applies only then
  string when = 5;
  // a person of the role attests the item
  bool attest = 6;
}

// How the go of a gate is decided: the accountable role alone, or a board ruling by a rule.
message GateDecision {
  string question = 1;
  // a transition back the decision may take instead
  string back = 2;
  // the roles that sit on the decision (the accountable role always does)
  repeated string board = 3;
  // unanimity | majority | consent
  string rule = 4;
  // how long before it is escalated to the accountable role ("72h")
  string max_duration = 5;
}

// What the go of a gate freezes beyond the impacts of the state it leaves.
message GateFreezes {
  // title | intent | description
  repeated string fields = 1;
  // qualified node types (subtypes included) no longer created, checked out or edited
  repeated string types = 2;
  // the lifecycle of a node of a frozen type may still move
  bool transitions = 3;
  // the impacts of the state left stay editable
  bool keep_phase = 4;
}

// A step that reviews a subject of the change (ADR 0130): its verdict is an assessment, which advises and never decides.
message StepReview {
  // description | title | intent | impact:<node key> | item:<record key or id>
  string subject = 1;
  // it starts by itself on the events of its subject (created, edited, a remark about it), without a person
  bool automatic = 2;
}

message GoalSummary {
  string name = 1;
  string description = 2;
}

message AgentSummary {
  string name = 1;
  string description = 2;
  string planner = 3;
}

message MethodologySummary {
  string name = 1;
  string version = 2;
  string description = 3;
  string status = 4;
  repeated GoalSummary goals = 5;
  repeated AgentSummary agents = 8;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp published_at = 7;
  // namespace (domain) the changes of the methodology act on
  string namespace = 9;
  // why a published version is suspended (ADR 0125 §3); empty: in force
  string suspended = 10;
}

// A validation issue. `path` locates the field, e.g. "conditions[2].expr".
message Issue {
  string path = 1;
  string message = 2;
  // flow path of the process, method or step the issue is about ("<process>/<step>/<sub-step>"); empty: none
  string activity = 3;
  // "warning" for a remark that never blocks; empty or "error": a blocking issue
  string severity = 4;
  // how to fix it, when the check knows (the closest name, the names allowed, what to change)
  string hint = 5;
}

message ListMethodologiesRequest {
  // every version (drafts, archived) instead of the latest one per name
  bool all_versions = 1;
}

message ListMethodologiesResponse {
  repeated MethodologySummary methodologies = 1;
}

message GetMethodologyRequest {
  string name = 1;
  string version = 2;
  // also answer the domains the version compiles against (ADR 0126 step 6): with them a client builds the activable
  // form the registry builds, through the same compilation
  bool with_domains = 3;
}

message GetMethodologyResponse {
  Methodology methodology = 1;
  // with with_domains: the domain versions the methodology version compiles against (pinned, in force at its
  // publication, else in force; the built-in domains left out)
  repeated Domain domains = 2;
}

message SaveMethodologyRequest {
  Methodology methodology = 1;
}

message SaveMethodologyResponse {
  Methodology methodology = 1;
  repeated Issue issues = 2;
}

message ValidateMethodologyRequest {
  Methodology methodology = 1;
}

message ValidateMethodologyResponse {
  repeated Issue issues = 1;
}

message PublishMethodologyRequest {
  string name = 1;
  string version = 2;
}

message PublishMethodologyResponse {
  Methodology methodology = 1;
}

message CreateVersionRequest {
  string name = 1;
  string from_version = 2;
  string new_version = 3;
}

message CreateVersionResponse {
  Methodology methodology = 1;
}

message DeleteMethodologyRequest {
  string name = 1;
  string version = 2;
}

message DeleteMethodologyResponse {}

message ImportMethodologyRequest {
  string yaml = 1;
  // publish right away (the definition must be valid)
  bool publish = 2;
}

message ImportMethodologyResponse {
  Methodology methodology = 1;
  repeated Issue issues = 2;
}

message ExportMethodologyRequest {
  string name = 1;
  string version = 2;
}

message ExportMethodologyResponse {
  string yaml = 1;
  string filename = 2;
}

// Domain is the model of a namespace (node types, link types, lifecycles, algorithms), versioned on its own in the
// registry's database; each graph holds the published ones in memory (the type catalogue).
message Domain {
  string name = 1;
  string version = 2;
  string description = 3;
  // draft | published | archived (read only)
  string status = 4;
  repeated NodeType node_types = 5;
  repeated LinkType link_types = 6;
  repeated Lifecycle lifecycles = 11;
  repeated Enum enums = 16;
  repeated Algorithm algorithms = 12;
  repeated AlgorithmInstance algorithm_instances = 13;
  repeated ItemType item_types = 17;
  repeated ImporterDecl importers = 18;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp published_at = 9;
  string updated_by = 10;
  // built into the platform (methodology, organisation, platform): published and frozen, it changes with the code
  bool builtin = 14;
}

message DomainSummary {
  string name = 1;
  string version = 2;
  string description = 3;
  string status = 4;
  int32 node_type_count = 5;
  int32 link_type_count = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp published_at = 8;
  // built into the platform: published and frozen
  bool builtin = 9;
  int32 item_type_count = 10;
}

message ListDomainsRequest {
  // every version (drafts, archived) instead of the latest one per name
  bool all_versions = 1;
}

message ListDomainsResponse {
  repeated DomainSummary domains = 1;
}

message GetDomainRequest {
  string name = 1;
  string version = 2;
}

message GetDomainResponse {
  Domain domain = 1;
}

message SaveDomainRequest {
  Domain domain = 1;
}

message SaveDomainResponse {
  Domain domain = 1;
  repeated Issue issues = 2;
}

message ValidateDomainRequest {
  Domain domain = 1;
}

message ValidateDomainResponse {
  repeated Issue issues = 1;
}

message PublishDomainRequest {
  string name = 1;
  string version = 2;
}

message PublishDomainResponse {
  Domain domain = 1;
}

message CreateDomainVersionRequest {
  string name = 1;
  string from_version = 2;
  string new_version = 3;
}

message CreateDomainVersionResponse {
  Domain domain = 1;
}

message DeleteDomainRequest {
  string name = 1;
  string version = 2;
}

message DeleteDomainResponse {}

message ImportDomainRequest {
  // the definition, YAML or JSON
  string yaml = 1;
  bool publish = 2;
}

message ImportDomainResponse {
  Domain domain = 1;
  repeated Issue issues = 2;
}

message ExportDomainRequest {
  string name = 1;
  string version = 2;
  // yaml (default) | json
  string format = 3;
}

message ExportDomainResponse {
  // the definition in the format asked (the field keeps its name for JSON too)
  string yaml = 1;
  string filename = 2;
  string media_type = 3;
}

message GetDomainUsageRequest {
  string name = 1;
  string version = 2;
}

message DomainUser {
  string name = 1;
  string version = 2;
  string status = 3;
}

message GetDomainUsageResponse {
  // methodology versions that act on the namespace of the domain or reference its types
  repeated DomainUser methodologies = 1;
}

// RunAlgorithmRequest runs an algorithm on a sample input (ADR 0018).
message RunAlgorithmRequest {
  Algorithm algorithm = 1;
  // parameter values (as an instance would set them)
  google.protobuf.Struct values = 2;
  // sample input: node {key,type,state,props}, property, value, children [node], transition {name,from,to}, change {id,title,intent,methodology,goal}
  google.protobuf.Struct input = 3;
}

message RunAlgorithmResponse {
  // the algorithm accepted (and the script ran)
  bool ok = 1;
  // reasons the algorithm rejected
  repeated string failures = 2;
  // the script itself failed (does not compile, throws, times out)
  string error = 3;
  // property changes asked by a transition action
  google.protobuf.Struct set = 4;
  repeated string unset = 5;
  repeated string logs = 6;
}

message ListTypesRequest {}

message ListTypesResponse {
  repeated TypeInfo types = 1;
  repeated LinkTypeInfo link_types = 2;
  // namespace (domain) -> version in force
  map<string, string> domains = 3;
}

// TypeInfo is the resolved model of a node type ("<namespace>@<name>").
message TypeInfo {
  string ref = 1;
  string description = 2;
  // resolved attributes, the inherited ones first
  repeated AttributeInfo attributes = 3;
  // supertypes, nearest first
  repeated string ancestors = 4;
  // own or inherited; absent: the nodes have no state
  Lifecycle lifecycle = 5;
  bool change_controlled = 6;
  // IDE editor of the nodes (ADR 0027); empty: the default node editor
  string editor = 7;
  // qualified types the nodes embed through "contains" links (own or inherited)
  repeated string contains = 8;
  // node_validator instances checking a node of the type as a whole, in call order (own and inherited)
  repeated string node_validators = 9;
  // the nodes may carry properties that are no attribute of the type (own or inherited)
  bool additional_properties = 10;
  // the creation form of the nodes (own or the nearest ancestor's, pkg/form.Form, ADR 0115 §7)
  google.protobuf.Struct form = 11;
  // icon and color of the nodes (own or inherited); empty: the user interface's defaults
  string icon = 12;
  string color = 13;
}

// LinkTypeInfo is the resolved model of a link type; an empty end accepts any node type.
message LinkTypeInfo {
  string ref = 1;
  string from = 2;
  string to = 3;
  bool compose = 4;
  repeated AttributeInfo attributes = 5;
  // the link read from its source, then from its target (empty: the name, then the source label)
  string label = 6;
  string inverse_label = 7;
}

message GetProcessGraphRequest {
  // the methodology as edited; none: the stored version name / version names (a change's, ADR 0113)
  Methodology methodology = 1;
  string process = 2;
  string name = 3;
  string version = 4;
}

message GetProcessGraphResponse {
  ProcessGraph graph = 1;
  // why the graph could not be built (the methodology does not compile)
  repeated Issue issues = 2;
}

message GetMethodologyViewRequest {
  // the methodology as edited; none: the stored version name / version names (a change's, ADR 0113)
  Methodology methodology = 1;
  string name = 2;
  string version = 3;
}

message GetMethodologyViewResponse {
  MethodologyView view = 1;
  // the issues of the methodology; no view when it does not compile at all
  repeated Issue issues = 2;
}

// The compiled view of the activities of a methodology (ADR 0126 step 3).
message MethodologyView {
  string methodology = 1;
  string version = 2;
  // the main goal of the methodology (ADR 0096)
  string goal = 3;
  repeated ViewActivity processes = 4;
  // the valid methods, with their steps when they compose some
  repeated ViewActivity methods = 5;
  // every condition an entry, an exit or a goal of the view names, and their prerequisites
  map<string, ViewCondition> conditions = 6;
}

// A process or a method of a view.
message ViewActivity {
  string name = 1;
  // process | method
  string kind = 2;
  string description = 3;
  // the agent and the goal running it as a whole; done: what its goal asks
  string agent = 4;
  string goal = 5;
  map<string, bool> done = 6;
  // a process another step nests (shown in that step)
  bool nested = 7;
  // the activity or one of its steps runs again on events (ADR 0110)
  bool reactive = 8;
  // the capability a method provides, and the roles it assigns
  string for = 9;
  Responsibilities roles = 10;
  repeated ViewStep steps = 11;
}

// A step of a view, with its sub-steps.
message ViewStep {
  string path = 1;
  string name = 2;
  // the process or method whose step tree holds it
  string owner = 3;
  // steps | action | agent | process | capability | manual, and what it runs
  string method = 4;
  string target = 5;
  string capability = 6;
  string foreach = 7;
  string description = 8;
  string guidance = 9;
  repeated string checklist = 10;
  repeated Reference references = 11;
  Responsibilities roles = 12;
  map<string, bool> entry = 13;
  map<string, bool> exit = 14;
  // the actions whose runs are the runs of the step
  repeated string planned = 15;
  // for a step naming a capability: the context conditions of the methods providing it
  repeated string unavailable = 16;
  repeated ViewStep steps = 17;
  // the step is a review of a subject; automatic: it starts by itself (ADR 0130)
  StepReview review = 18;
  // the step is a gate of its process (ADR 0132)
  StepGate gate = 19;
}

// What a condition means, the actions making it hold and the conditions it cannot hold without.
message ViewCondition {
  string description = 1;
  repeated string produced_by = 2;
  repeated string requires = 3;
}

message CheckLevelsRequest {
  // the methodology as edited; none: the stored version name / version names (a change's, ADR 0113)
  Methodology methodology = 1;
  // a process, or a method composing its own steps
  string root = 2;
  string name = 3;
  string version = 4;
}

message CheckLevelsResponse {
  repeated LevelCheck levels = 1;
  // why the levels could not be checked (the methodology does not compile)
  repeated Issue issues = 2;
  // every condition the methodology knows (declared, platform, generated by the steps) with its expression: the
  // dynamic conditions, evaluated over the state of the change
  map<string, string> conditions = 3;
}

// One level: the direct steps of a parent (the root or a step with sub-steps).
message LevelCheck {
  // the parent: the root name, or the path of a step
  string path = 1;
  // process | method | step | agent (the lowest level: the actions an agent carries out)
  string kind = 2;
  map<string, bool> inputs = 3;
  map<string, bool> outputs = 4;
  // the direct steps in the order the conditions allow
  repeated LevelStep order = 5;
  repeated LevelGap gaps = 6;
  // no gap breaks the chain
  bool ok = 7;
  // the direct steps of the level (the system of interest the flow shows) and the links their conditions draw
  repeated LevelNode steps = 8;
  repeated GraphEdge edges = 9;
  // who operates the level (kind agent, or a method naming one) and the goal it plans towards
  string agent = 10;
  string goal = 11;
}

message LevelNode {
  string name = 1;
  string path = 2;
  string method = 3;
  string target = 4;
  string capability = 5;
  map<string, bool> entry = 6;
  map<string, bool> exit = 7;
  // the step has sub-steps: a level of its own
  bool composite = 8;
  // that level, or one below it, is not resolved: the level above cannot run through the step
  bool broken = 9;
  int32 sub_steps = 10;
  // the step runs once per element (or group) of a CEL list, in parallel streams (ADR 0050)
  string foreach = 11;
  string group_by = 12;
  // the step reviews a subject; automatic: it starts by itself (ADR 0130)
  StepReview review = 13;
  // the step is a gate of its process (ADR 0132)
  StepGate gate = 14;
}

message LevelStep {
  string name = 1;
  // steps of one layer are independent of each other
  int32 layer = 2;
}

message LevelGap {
  // the direct step concerned (empty: the outputs of the level)
  string step = 1;
  // blocked | output | external | inner | noop (an input that is also an output)
  string kind = 2;
  repeated string missing = 3;
  string message = 4;
}

message ProcessGraph {
  string process = 1;
  string description = 2;
  repeated GraphStep steps = 3;
  repeated GraphEdge edges = 4;
  repeated Method methods = 5;
  // the goal the agent of each method reaches, by method name
  map<string, string> method_goals = 6;
  repeated GraphAgent agents = 7;
  repeated Reference references = 8;
}

message GraphStep {
  string path = 1;
  string name = 2;
  string description = 3;
  // the path of the step containing it ("" at the top)
  string parent = 4;
  int32 depth = 5;
  // it runs something (no sub-steps)
  bool leaf = 6;
  // steps | action | agent | process | method | manual
  string method = 7;
  string target = 8;
  map<string, bool> entry = 9;
  map<string, bool> exit = 10;
  Responsibilities roles = 11;
  string guidance = 12;
  repeated Reference references = 13;
  string process = 14;
  string capability = 15;
  // the step runs once per element (or group) of a CEL list, in parallel streams (ADR 0050)
  string foreach = 16;
  string group_by = 17;
  // the step is a review of a subject; automatic: it starts by itself (ADR 0130)
  StepReview review = 18;
  // the step is a gate of its process (ADR 0132)
  StepGate gate = 19;
}

// The exit criteria of from meet the entry of to, on these conditions.
message GraphEdge {
  string from = 1;
  string to = 2;
  repeated string conditions = 3;
}

message GraphAgent {
  string name = 1;
  string description = 2;
  string planner = 3;
  repeated string goals = 4;
  repeated GraphAction actions = 5;
}

message GraphAction {
  string name = 1;
  string kind = 2;
  string description = 3;
  map<string, bool> pre = 4;
  map<string, bool> effects = 5;
}

message PreviewPlanRequest {
  Methodology methodology = 1;
  string agent = 2;
  string goal = 3;
  // condition names overridden true/false on top of the empty blackboard's evaluation
  map<string, bool> overrides = 4;
}

message PreviewPlanResponse {
  PlanPreview preview = 1;
  // why the methodology does not compile, or the agent/goal is unknown
  repeated Issue issues = 2;
}

message PlanPreview {
  string agent = 1;
  string goal = 2;
  string planner = 3;
  // the goal already holds in the given world: actions is then empty
  bool reached = 4;
  repeated PlanStep actions = 5;
  double cost = 6;
  // conditions missing that no action of this agent establishes ("name" / "!name"), set only when no plan reaches
  // the goal (ADR 0036 §3's distinction between waiting and stuck)
  repeated string awaiting = 7;
}

message PlanStep {
  string name = 1;
  // the step path the action was generated from
  string step = 2;
  string kind = 3;
  double cost = 4;
}
