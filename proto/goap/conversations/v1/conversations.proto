syntax = "proto3";

package goap.conversations.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ConversationService keeps the conversations of the users with the assistant, outside the graph (ADR 0085): per
// subject, a list of conversations, each an ordered list of messages. A caller only ever reads and writes their own
// conversations. A platform service (system principal: the executor of the assistant) appends and updates the
// assistant's messages in any conversation, and reads nothing of anyone.
service ConversationService {
  // Opens an empty conversation owned by the caller.
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  // The conversations of the caller, most recently updated first, paged.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  // A conversation of the caller with its messages in order.
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc RenameConversation(RenameConversationRequest) returns (RenameConversationResponse);
  // Forgets a conversation of the caller and its messages.
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  // Appends a message: a user message by the owner, an assistant message by a platform service.
  rpc AppendMessage(AppendMessageRequest) returns (AppendMessageResponse);
  // Replaces the content of an assistant message (platform services only): text, actions, status, error.
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);
}

message Conversation {
  string id = 1;
  string subject = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  // position in the conversation, from 1
  int32 seq = 3;
  // user | assistant
  string role = 4;
  string text = 5;
  // structured UI actions the assistant asked the web to run: {type, args, result?}
  repeated google.protobuf.Struct actions = 6;
  // the engine run that produced an assistant message (optional)
  string process_id = 7;
  // pending | done | error
  string status = 8;
  string error = 9;
  google.protobuf.Timestamp created_at = 10;
  // a short description of what the user was looking at when they wrote a user message (never the page itself)
  string context = 11;
}

message CreateConversationRequest {
  // optional; a default title is given when empty
  string title = 1;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message ListConversationsRequest {
  // at most this many (a default and a maximum apply)
  int32 page_size = 1;
  // next_page_token of the previous page
  string page_token = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  // empty on the last page
  string next_page_token = 2;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated Message messages = 2;
}

message RenameConversationRequest {
  string id = 1;
  string title = 2;
}

message RenameConversationResponse {
  Conversation conversation = 1;
}

message DeleteConversationRequest {
  string id = 1;
}

message DeleteConversationResponse {}

message AppendMessageRequest {
  string conversation_id = 1;
  // user | assistant (default user)
  string role = 2;
  string text = 3;
  repeated google.protobuf.Struct actions = 4;
  string process_id = 5;
  // pending | done | error (assistant messages; a user message is done)
  string status = 6;
  // user messages: a short description of what the user was looking at (at most 300 bytes)
  string context = 7;
}

message AppendMessageResponse {
  Message message = 1;
}

message UpdateMessageRequest {
  string id = 1;
  string text = 2;
  repeated google.protobuf.Struct actions = 3;
  string status = 4;
  string error = 5;
  // set when not empty
  string process_id = 6;
}

message UpdateMessageResponse {
  Message message = 1;
}
