syntax = "proto3";

package goap.importer.v1;

import "google/protobuf/struct.proto";
import "goap/jobs/v1/jobs.proto";
import "goap/registry/v1/registry.proto";

// Importers (ADR 0148): a domain declares the sources its graph can be loaded from (`importers:` of the domain, with
// their parameters); a separately deployed service implements one or more of them as a worker of the job service
// (ADR 0149: it claims the jobs of kind import.<domain>.<importer>) and runs them, writing through the graph's change
// operations like any producer. Adding a source is publishing its declaration in the domain and deploying the
// service: nothing else of the platform changes.

// ImportService is the import registry, served by the graph service next to the domain registry: the people list the
// sources of a namespace and run them through it; the runs are jobs (goap.jobs.v1), followed and cancelled there.
service ImportService {
  // ListImporters lists the importers the domains in force declare, each with whether a live worker implements it.
  rpc ListImporters(ListImportersRequest) returns (ListImportersResponse);
  // StartImport runs an importer for the caller (permission import:run on the namespace and the project).
  rpc StartImport(StartImportRequest) returns (StartImportResponse);
}

// Implements names one importer a domain declares.
message Implements {
  string domain = 1;
  string importer = 2;
}

message ImporterInfo {
  // stable identifier of the service, e.g. "importer-git"
  string id = 1;
  string version = 2;
  string description = 3;
  repeated Implements implements = 4;
}

message ListImportersRequest {
  // only the importers of the domain of this namespace
  string namespace = 1;
}

// Importer is an importer a domain declares, as the registry knows it.
message Importer {
  string domain = 1;
  string domain_version = 2;
  string name = 3;
  string label = 4;
  string description = 5;
  // the parameters a run takes, an enum one with its values
  repeated goap.registry.v1.AttributeInfo params = 6;
  // a live worker implements it
  bool available = 7;
  // the worker implementing it, when there is one
  string service = 8;
}

message ListImportersResponse {
  repeated Importer importers = 1;
}

message StartImportRequest {
  string domain = 1;
  string importer = 2;
  google.protobuf.Struct params = 3;
  // empty: the caller's active project
  string project_id = 4;
  string owner_org = 5;
}

message StartImportResponse {
  goap.jobs.v1.Job job = 1;
}

