syntax = "proto3";

package goap.credentials.v1;

// CredentialsService keeps the local sign-in password of a subject that connects without an external
// identity provider (ADR 0040): one credential per subject, in its own store outside the graph, so a failed
// login never touches the audited graph/change log and no secret material ever becomes graph data. It sits
// behind this small interface so the concrete backend can move from its own SQL table today to being
// platform.Secrets/Vault-backed later with no call-site change. Only the gateway calls it (its own local
// AuthMode's register/login/logout/change-password endpoints); the subject is a parameter, not derived from
// caller identity, so there is nothing to authenticate before a subject has signed in at all.
service CredentialsService {
  // Register creates the credential of a new subject. Fails (already exists) if one is there.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Verify checks a subject's password.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // SetPassword replaces a subject's password (self-service change).
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  // Exists reports whether a subject already has a local credential.
  rpc Exists(ExistsRequest) returns (ExistsResponse);
}

message RegisterRequest {
  string subject = 1;
  string password = 2;
}
message RegisterResponse {}

message VerifyRequest {
  string subject = 1;
  string password = 2;
}
message VerifyResponse {
  bool ok = 1;
}

message SetPasswordRequest {
  string subject = 1;
  string password = 2;
}
message SetPasswordResponse {}

message ExistsRequest {
  string subject = 1;
}
message ExistsResponse {
  bool exists = 1;
}
