  string execution = 6;
}

message ImpactNodeSplitRequest {
  string change_id = 1;
  NodeName source = 2;
  repeated NodeCreateSpec into = 3;
  string rationale = 4;
  string flow = 5;
  string execution = 6;
}

// A link of another node to a split source that the split leaves as it is (ADR 0003: suspect).
message SuspectLink {
  NodeRef from = 1;
  string from_key = 2;
  string type = 3;
  NodeRef to = 4;
  string to_key = 5;
}

message ImpactNodeRestructureResponse {
  repeated ChangeImpact successors = 1;
  repeated ChangeImpact sources = 2;
  repeated ChangeImpact parents = 3;
  repeated SuspectLink suspect = 4;
}

