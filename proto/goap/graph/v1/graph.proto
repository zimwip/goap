syntax = "proto3";

package goap.graph.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "goap/jobs/v1/jobs.proto";

// GraphService exposes the two axes of the knowledge graph: the domain axis
// (versioned nodes, version-to-version links, baselines) and the change axis
// (changes and their items, i.e. the blackboards of agent processes).
service GraphService {
  // Domain axis
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListBaselines(ListBaselinesRequest) returns (ListBaselinesResponse);
  // Tags (ADR 0143 §6) name one exact node version; not unique, a name may label several versions.
  rpc TagVersion(TagVersionRequest) returns (TagVersionResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc GetBaselineGraph(GetBaselineGraphRequest) returns (GetBaselineGraphResponse);
  // GetBaselineDelta reads what moved from a baseline to a later one of its branch (ADR 0143 §4): the nodes committed in
  // between at their version in the later one, the links leaving them, the nodes it no longer holds. INVALID_ARGUMENT
  // when the baselines do not follow each other or too much moved: read the later baseline whole.
  rpc GetBaselineDelta(GetBaselineDeltaRequest) returns (GetBaselineDeltaResponse);
  // Browsing a large baseline: a page of its nodes (by type, filtered) and the neighbourhood of one node.
  rpc ListBaselineNodes(ListBaselineNodesRequest) returns (ListBaselineNodesResponse);
  rpc ListBaselineLinks(ListBaselineLinksRequest) returns (ListBaselineLinksResponse);
  rpc GetNodeNeighbourhood(GetNodeNeighbourhoodRequest) returns (GetNodeNeighbourhoodResponse);
  // The namespaces holding at least one node.
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  // The statistics of the graph: what every namespace holds (the overview of the graph statistics view).
  rpc GetGraphOverview(GetGraphOverviewRequest) returns (GetGraphOverviewResponse);
  // The statistics of a namespace: what the store holds for it and the shape of the state at the head of a lasting branch
  // (nodes, links, degrees, components, per node type and link type).
  rpc GetGraphStats(GetGraphStatsRequest) returns (GetGraphStatsResponse);
  // The structures of the graph (ADR 0054): the organisation and the projects, with the node types belonging to each.
  rpc GetStructures(GetStructuresRequest) returns (GetStructuresResponse);
  // The item types the graph accepts on a change, described (ADR 0119).
  rpc ListItemTypes(ListItemTypesRequest) returns (ListItemTypesResponse);
  // Whether a node type is written by platform administrators only (`adminOnly:` on the node type, ADR 0068).
  rpc IsAdminOnlyType(IsAdminOnlyTypeRequest) returns (IsAdminOnlyTypeResponse);
  // The impact log of a change (ADR 0029): every operation on its change impacts, with its caller.
  rpc ListChangeEvents(ListChangeEventsRequest) returns (ListChangeEventsResponse);
  // The log of a change (ADR 0030): its facts, journal records and impact events in one order, filtered on columns.
  rpc ListChangeLog(ListChangeLogRequest) returns (ListChangeLogResponse);
  // The whole log of a change as W3C PROV-O provenance, in JSON-LD (ADR 0057).
  rpc ExportChangeProvenance(ExportChangeProvenanceRequest) returns (ExportChangeProvenanceResponse);
  // The state of a namespace at a baseline as a JSON snapshot, without history (ADR 0104).
  rpc ExportGraph(ExportGraphRequest) returns (ExportGraphResponse);
  // StartGraphExport exports the state of a namespace as a job (ADR 0149, kind graph.export): a JSON snapshot
  // (ADR 0104) or an OKF zip archive, one Markdown file per node (ADR 0111), downloaded from the job when it ends.
  rpc StartGraphExport(StartGraphExportRequest) returns (StartGraphExportResponse);
  // Imports a JSON snapshot into the main branch of its namespace as one new change, left open for review (ADR 0104).
  rpc ImportGraph(ImportGraphRequest) returns (ImportGraphResponse);
  // StartGraphImport imports a JSON snapshot as a job (ADR 0149, kind graph.import): what ImportGraph does, followed
  // from the job, whose output names the change created.
  rpc StartGraphImport(StartGraphImportRequest) returns (StartGraphImportResponse);
  // Loads the demo data (administrators only): the demo organisation, the demo project bound to it and the ALM
  // repository acting in that project, each part when it is missing. Unimplemented where the deployment ships no demo.
  rpc LoadDemoData(LoadDemoDataRequest) returns (LoadDemoDataResponse);

  // Change axis
  rpc CreateChange(CreateChangeRequest) returns (CreateChangeResponse);
  rpc GetChange(GetChangeRequest) returns (GetChangeResponse);
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  // The versions a change starts from (the pre version of its change impacts), and the
  // changes acting on a node (ADR 0024).
  rpc GetChangeImpacts(GetChangeImpactsRequest) returns (GetChangeImpactsResponse);
  rpc ListNodeChanges(ListNodeChangesRequest) returns (ListNodeChangesResponse);
  rpc UpdateChange(UpdateChangeRequest) returns (UpdateChangeResponse);
  rpc MoveChange(MoveChangeRequest) returns (MoveChangeResponse);
  // Make a root change a sub-change of a change whose methodology integrates its own, or give it back (ADR 0106).
  rpc AttachChange(AttachChangeRequest) returns (AttachChangeResponse);
  rpc DetachChange(DetachChangeRequest) returns (DetachChangeResponse);
  // The changes a change depends on, the open changes depending on it and the merge order of its sub-changes (ADR 0108).
  rpc SetChangeDependencies(SetChangeDependenciesRequest) returns (SetChangeDependenciesResponse);
  rpc GetChangeDependencies(GetChangeDependenciesRequest) returns (GetChangeDependenciesResponse);
  // Move an open change to another version of its methodology (ADR 0113).
  rpc UpgradeChange(UpgradeChangeRequest) returns (UpgradeChangeResponse);
  // SetChangeMethodology gives an open change that follows no methodology one of the methodologies of its project.
  rpc SetChangeMethodology(SetChangeMethodologyRequest) returns (SetChangeMethodologyResponse);
  rpc AddItems(AddItemsRequest) returns (AddItemsResponse);
  // Change impacts (ADR 0024): declare the nodes a change acts on, write the version each produces on the
  // change branch, and accept or reject them (a comment is mandatory).
  rpc ProposeImpact(ProposeImpactRequest) returns (ProposeImpactResponse);
  // Node edits (ADR 0076, 0079): every write names a change, and a node has no version while the change works on it.
  // ImpactNodeCreate and ImpactNodeCheckout give the node a draft (once per change and flow; the impact's post is the draft
  // reference, version 0); ImpactNodeUpdate and the link operations edit it; an edit never reviews, an accepted review runs
  // the checks of a version on the draft and writes nothing; ImpactNodeTransition moves a node along its lifecycle (the
  // state of its draft, the node checked out first when it has none); ImpactNodeCancel drops the draft (a creation cancelled
  // removes its impact). The versions are written when the change commits.
  rpc ImpactNodeCreate(ImpactNodeCreateRequest) returns (ImpactNodeCreateResponse);
  rpc ImpactNodeCheckout(ImpactNodeCheckoutRequest) returns (ImpactNodeCheckoutResponse);
  rpc ImpactNodeUpdate(ImpactNodeUpdateRequest) returns (ImpactNodeUpdateResponse);
  rpc ImpactLinkCreate(ImpactLinkCreateRequest) returns (ImpactLinkCreateResponse);
  rpc ImpactLinkUpdate(ImpactLinkUpdateRequest) returns (ImpactLinkUpdateResponse);
  rpc ImpactLinkDelete(ImpactLinkDeleteRequest) returns (ImpactLinkDeleteResponse);
  rpc ImpactNodeTransition(ImpactNodeTransitionRequest) returns (ImpactNodeTransitionResponse);
  rpc ImpactNodeCancel(ImpactNodeCancelRequest) returns (ImpactNodeCancelResponse);
  // Merge nodes into a new one, split one into new ones, seen from the parent side (ADR 0077): the parents lose the
  // links to the sources and gain the links to the successors, the sources stay untouched with the impact of their
  // parent as via.
  rpc ImpactNodeMerge(ImpactNodeMergeRequest) returns (ImpactNodeRestructureResponse);
  rpc ImpactNodeSplit(ImpactNodeSplitRequest) returns (ImpactNodeRestructureResponse);
  // Take a change impact out of the change, explicitly: its draft is dropped.
  rpc WithdrawImpact(WithdrawImpactRequest) returns (WithdrawImpactResponse);
  // Take several change impacts out of the change at once, in one transaction: all of them or none.
  rpc WithdrawImpacts(WithdrawImpactsRequest) returns (WithdrawImpactsResponse);
  // Sub-changes (ADR 0081, 0082): a sub-change commits in its parent's log, by a fast-forward. RebaseChange brings the drafts
  // the parent changed since the sub-change took them up to date (a three-way merge; the fields changed on both sides are
  // conflicts, the sub-change's value kept; a changed impact is to be reviewed again); MergeChange rebases first.
  // ImpactNodeResolve keeps the sub-change's values for the conflicts left on an impact (an edit of a field settles its
  // own); GetRebaseState tells the impacts behind the parent and the conflicts to settle.
  rpc RebaseChange(RebaseChangeRequest) returns (RebaseChangeResponse);
  rpc ImpactNodeResolve(ImpactNodeResolveRequest) returns (ImpactNodeResolveResponse);
  rpc GetRebaseState(GetRebaseStateRequest) returns (GetRebaseStateResponse);
  // What a change can commit and merge (ADR 0102): the accepted modifications the next commit writes, the withdrawn nodes
  // it reverts, what holds the merge; the one source of the Commit and Merge buttons.
  rpc GetCommitState(GetCommitStateRequest) returns (GetCommitStateResponse);
  rpc ImpactNodeReview(ImpactNodeReviewRequest) returns (ImpactNodeReviewResponse);
  // The review object (ADR 0080): a reviewer builds a review up (a global comment, one entry per change impact with its
  // own comment and outcome), then submits it; the submission reviews every impact in one transaction, all or none. An
  // open review is changed by its author or an administrator only; submitted and discarded reviews are final.
  // The mechanism under it: reviews of several impacts applied in one transaction, all or none, each stamped with the
  // review id, and an optional item written with them.
  rpc ImpactNodeReviewBatch(ImpactNodeReviewBatchRequest) returns (ImpactNodeReviewBatchResponse);
  rpc ReviewOpen(ReviewOpenRequest) returns (ReviewResponse);
  rpc ReviewUpdate(ReviewUpdateRequest) returns (ReviewResponse);
  rpc ReviewSubmit(ReviewSubmitRequest) returns (ReviewResponse);
  // Drop a review that was never submitted (final).
  rpc ReviewDiscard(ReviewDiscardRequest) returns (ReviewResponse);
  rpc ReopenChangeImpacts(ReopenChangeImpactsRequest) returns (ReopenChangeImpactsResponse);
  // Producers: a whole change of node edits (change impacts, versions, reviews, apply) in one call.
  rpc CommitEdits(CommitEditsRequest) returns (CommitEditsResponse);
  rpc GetBlackboard(GetBlackboardRequest) returns (GetBlackboardResponse);
  // First act of a change (ADR 0056): validates the change and writes its versions on its own branch, answering the
  // header of the commit (no state: a caller reading nodes asks for them). A root change
  // stays open (ADR 0102): edited and committed again; MergeChange merges that branch into the one the change was forked
  // from (rebased first), once it holds a commit.
  rpc CommitChange(CommitChangeRequest) returns (CommitChangeResponse);
  // Move the state of a change along a transition of its lifecycle (ADR 0058): its guard (a decided decision point,
  // the expected world state) must hold, and it is journaled.
  rpc TransitionChange(TransitionChangeRequest) returns (TransitionChangeResponse);
  // Remove a change that committed nothing, with its log (ADR 0037). Refused once anything of it is applied or used.
  rpc DeleteChange(DeleteChangeRequest) returns (DeleteChangeResponse);

  // Staged settings (ADR 0037, ADR 0122): the edits of the settings dialog, held by the personal changes of the caller
  // (one per namespace). Each call does on the server what the dialog did call by call, and answers the whole pending
  // state of the caller.
  rpc GetPendingSettings(GetPendingSettingsRequest) returns (PendingSettingsResponse);
  // Stage edits in order: the creation or new properties of a node (props), or its retirement (retire). The personal
  // change of a namespace is opened on the first edit; a node created by it and retired again is given up.
  rpc StageSettings(StageSettingsRequest) returns (PendingSettingsResponse);
  // Save: the edits that modify something are accepted (one review per change) and their changes applied; the others are
  // withdrawn, and a change left with nothing is removed.
  rpc SaveSettings(SaveSettingsRequest) returns (PendingSettingsResponse);
  // Discard: the personal changes holding the edits are removed.
  rpc DiscardSettings(DiscardSettingsRequest) returns (PendingSettingsResponse);

  // Version branches (ADR 0009)
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);
  rpc SetBranchStatus(SetBranchStatusRequest) returns (SetBranchStatusResponse);
  rpc SetBranchDescription(SetBranchDescriptionRequest) returns (SetBranchDescriptionResponse);
  rpc ListNodeVersions(ListNodeVersionsRequest) returns (ListNodeVersionsResponse);
  // The first versions of the nodes that derive from a node: the successors of the merges and splits that replaced it
  // (ADR 0077). Node.origins answers the other way.
  rpc DerivedNodes(DerivedNodesRequest) returns (DerivedNodesResponse);
  rpc PlanMerge(PlanMergeRequest) returns (PlanMergeResponse);
  rpc MergeBranch(MergeBranchRequest) returns (MergeBranchResponse);
  // What going from a baseline to another changes, node by node (same namespace), and the changes that explain it.
  rpc DiffBaselines(DiffBaselinesRequest) returns (DiffBaselinesResponse);
  // The change-stack of a node version or a baseline (ADR 0133): the changes it is the application of, oldest first,
  // and the lineage they are read from.
  rpc GetChangeStack(GetChangeStackRequest) returns (GetChangeStackResponse);
  // Merges a change into what it was forked from (ADR 0102): a root change into the branch it forked from, a sub-change
  // into its parent. It must be settled; it is rebased onto the target's head, its guardian is asked, then it is
  // fast-forwarded. A change whose three-way merge waits for its resolutions (committed) is integrated with them.
  rpc MergeChange(MergeChangeRequest) returns (MergeChangeResponse);
  // Nodes the change shares with other open changes (a merge will be needed).
  rpc GetSharedNodes(GetSharedNodesRequest) returns (GetSharedNodesResponse);
  // Splits a change along organisational boundaries: one sub-change per unit owning impacted nodes.
  rpc SplitChange(SplitChangeRequest) returns (SplitChangeResponse);
  rpc ListSubChanges(ListSubChangesRequest) returns (ListSubChangesResponse);
  // Action flow branches: a relaunched step forks the flow, a human adopts or discards the branch.
  rpc OpenFlow(OpenFlowRequest) returns (OpenFlowResponse);
  rpc AdoptFlow(AdoptFlowRequest) returns (AdoptFlowResponse);
  rpc DiscardFlow(DiscardFlowRequest) returns (DiscardFlowResponse);
  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse);
  // Applies the proposals of a flow on a graph branch of its own (a preview, merged when the flow is adopted).
  // Consistency check of the blackboard as a process on a flow sees it.
  rpc ValidateBoard(ValidateBoardRequest) returns (ValidateBoardResponse);
  // Options of a change (ADR 0009 §3, ADR 0032 §6): hypotheses explored on flows of their own; the active one is
  // where every call that names no flow goes ("main" names the main flow).
  rpc OpenOption(OpenOptionRequest) returns (OpenOptionResponse);
  rpc ActivateOption(ActivateOptionRequest) returns (ActivateOptionResponse);
  rpc EvaluateOption(EvaluateOptionRequest) returns (EvaluateOptionResponse);
  rpc SelectOption(SelectOptionRequest) returns (SelectOptionResponse);
  rpc RejectOption(RejectOptionRequest) returns (RejectOptionResponse);
  rpc ListOptions(ListOptionsRequest) returns (ListOptionsResponse);
  rpc CompareOptions(CompareOptionsRequest) returns (CompareOptionsResponse);
  // The impacts two flows of a change see, compared (ADR 0083): added, removed or modified, with the attribute-level
  // changes of a modified one; the identical ones are counted, not listed.
  rpc DiffFlows(DiffFlowsRequest) returns (DiffFlowsResponse);
  // The graph a change sees at a level (written, accepted, committed) on a flow (ADR 0032 §5), and the graph a call on
  // the change reads (the active option's, else the reference baseline).
  rpc GetChangeView(GetChangeViewRequest) returns (GetChangeViewResponse);
  // Decision points of a change (ADR 0009 §4): opened, ruled (decided or undecidable with questions), their questions
  // answered, an agent ruling below the threshold ratified by a person; a decided point selects its option.
  rpc OpenDecision(OpenDecisionRequest) returns (OpenDecisionResponse);
  rpc RuleDecision(RuleDecisionRequest) returns (RuleDecisionResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc RatifyDecision(RatifyDecisionRequest) returns (RatifyDecisionResponse);
  rpc ListDecisionPoints(ListDecisionPointsRequest) returns (ListDecisionPointsResponse);
  rpc GetChangeGraph(GetChangeGraphRequest) returns (GetChangeGraphResponse);

  // The execution journal (ADR 0011, pkg/journal) is entries of the log of a change: appended with AppendLog, read as
  // records with ListExecutions (or as entries with ListChangeLog)
  rpc AppendLog(AppendLogRequest) returns (AppendLogResponse);
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);

  // Node index (ADR 0026): publishes again the event of every node version and the head of main, to
  // rebuild an index. Requires `admin` on the `platform` resource.
  rpc RepublishIndex(RepublishIndexRequest) returns (RepublishIndexResponse);
}

message RepublishIndexRequest {}

message RepublishIndexResponse {
  int32 versions = 1;
}

message NodeRef {
  string id = 1;
  int32 version = 2;
}

message Node {
  string id = 1;
  int32 version = 2;
  string key = 3;
  string type = 4;
  google.protobuf.Struct props = 5;
  bool deleted = 6;
  string change_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // branch of the version (main by default)
  string branch = 9;
  // versions this one descends from (two for a merge)
  repeated int32 parents = 10;
  // create | revise | derive | merge
  string reason = 11;
  // state in the lifecycle of the node type (empty: none)
  string state = 12;
  // namespace of the node (required with a type catalogue)
  string namespace = 13;
  // change impact that produced this version, and its acceptance comment (ADR 0024)
  string change_impact = 14;
  string comment = 15;
  // action run that wrote this version (what a relaunch marks stale, ADR 0025)
  string execution = 16;
  // the branches the version joined besides the one it was written on (ADR 0032; filled by ListNodeVersions)
  repeated string joined = 17;
  // the organisational unit responsible for the version and the project the node was created in (node ids, ADR 0054)
  string owner = 18;
  string project = 19;
  // the draft of a node in a change (ADR 0079): the node has no version while the change works, version is 0; the version
  // is written when the change commits
  bool draft = 20;
  // the nodes this one derives from (ADR 0077, merge and split): set on the first version of a successor
  repeated NodeRef origins = 21;
}

message Link {
  string id = 1;
  string type = 2;
  NodeRef from = 3;
  NodeRef to = 4;
  google.protobuf.Struct props = 5;
  string change_id = 6;
}

message NodeView {
  Node node = 1;
  int32 latest = 2;
  repeated Link out = 3;
  repeated Link in = 4;
  // the node has a lifecycle and its state is flagged notCommittable (ADR 0078)
  bool not_committable = 5;
}

message Baseline {
  string id = 1;
  string name = 2;
  string parent_id = 3;
  string change_id = 4;
  map<string, int32> nodes = 5;
  google.protobuf.Timestamp created_at = 6;
  string branch = 7;
  string namespace = 8;
  // the head of the branch merged in, when this baseline is the result of a merge (a second parent)
  string merged_from = 9;
  // commit | merge | fast-forward | rebase | revert | snapshot (ADR 0056)
  string kind = 10;
  // the baseline the change was forked from before its rebase onto the head of its target (ADR 0101)
  string rebased_from = 11;
}

message Decision {
  string item = 1;
  bool accept = 2;
  string comment = 3;
}

message ChangeItem {
  string id = 1;
  // item type (ADR 0119): decision | artifact | flow | signal | risk ... (ListItemTypes)
  string type = 2;
  // what the item is about within its type: the type of an artifact, the name of a signal
  string target = 3;
  string status = 4;
  Decision decision = 7;
  google.protobuf.Struct data = 8;
  string produced_by = 9;
  repeated string derived_from = 10;
  google.protobuf.Timestamp created_at = 11;
  // items replaced by this one (rebase, merge)
  repeated string supersedes = 12;
  // journal record of the action execution that produced the item
  string execution = 13;
  // flow branch that produced the item; flow_event on type = flow
  string flow = 15;
  FlowEvent flow_event = 16;
  // event of a decision point on type = decision_point (ADR 0009 §4)
  DecisionEvent decision_event = 17;
}

message Change {
  string id = 1;
  string title = 2;
  string intent = 3;
  string methodology = 4;
  string goal = 5;
  string status = 6;
  string baseline_id = 7;
  string result_baseline_id = 8;
  google.protobuf.Struct data = 9;
  repeated ChangeItem items = 10;
  google.protobuf.Timestamp created_at = 11;
  string branch = 12;
  // namespace the change acts on (required with a type catalogue)
  string namespace = 13;
  // sub-change: the parent change and the responsible OrgUnit key
  string parent_id = 14;
  string owner_org = 15;
  // the nodes the change reads, modifies or creates: stored, and derived from its items (ADR 0024)
  repeated ChangeImpact nodes = 17;
  // key of the ProjectUnit (organisation namespace) this change's nodes belong to (ADR 0039);
  string project_id = 18;
  // the lifecycle the change follows (named by its methodology) and its state (ADR 0058); empty: none
  string lifecycle = 20;
  string state = 21;
  // the guardian chain of the change, outermost first, its own methodology last (ADR 0106)
  repeated GuardianRef guardians = 22;
  // the changes whose work reaches the branch it merges into before it merges (ADR 0108)
  repeated string depends_on = 23;
  // the version of its methodology the change follows (ADR 0113): the latest published one when it was created, until
  // it is upgraded; empty: the latest
  string methodology_version = 24;
  // the position of the log of the change its impacts and items were read at: the view the reader holds (ADR 0153)
  int64 seq = 25;
}

// A methodology of the guardian chain of a change, at the version in force when the chain was computed (ADR 0106).
message GuardianRef {
  string methodology = 1;
  string version = 2;
}

message Review {
  // accepted | rejected
  string status = 1;
  string by = 2;
  string comment = 3;
  google.protobuf.Timestamp at = 4;
  // flow branch the review was made on, action run that made it, replaced by an adopted flow (ADR 0025)
  string flow = 5;
  string execution = 6;
  bool superseded = 7;
  // the review object (ADR 0080) the review was submitted in; empty for a review made on its own
  string review_id = 8;
}

// The link from a change to a node (ADR 0024).
message ChangeImpact {
  string id = 1;
  string key = 2;
  string type = 3;
  // created | modified
  string intent = 4;
  string rationale = 5;
  // released version of the reference baseline (empty for a created node)
  NodeRef pre = 6;
  // the draft of the node while the change works (a draft reference: the node, version 0, ADR 0079), the version written once
  // the change is committed (empty while the impact of an existing node is only proposed)
  NodeRef post = 7;
  // version on the target branch once applied
  NodeRef committed = 8;
  // proposed | accepted | rejected
  string review = 9;
  repeated Review reviews = 10;
  string via = 11;
  bool recheck = 12;
  string produced_by = 13;
  repeated string derived_from = 14;
  string execution = 15;
  // impact / proposal items this change impact is derived from (empty when written directly)
  repeated string items = 16;
  google.protobuf.Timestamp created_at = 17;
  // flow branch that declared the change impact (empty: the main flow), replaced by an adopted flow (ADR 0025)
  string flow = 18;
  bool superseded = 19;
  // a read model, never stored: what the accepted-review gate would say of the draft as it stands (empty: not checked
  // or no draft); filled by GetChange and GetBlackboard
  ImpactValidation validation = 20;
}

// The outcome of checking a draft as an accepted review would: valid, or the first failure (readable message).
message ImpactValidation {
  bool valid = 1;
  string message = 2;
  // the draft differs from the version it was checked out from (or creates a node): only a modification is accepted
  // and committed (ADR 0102)
  bool modified = 3;
}


message GetNodeRequest {
  // version 0 = latest (with change_id: the draft the change holds of the node, if any, ADR 0079)
  NodeRef ref = 1;
  // alternative to ref: latest version of the node with this key
  string key = 2;
  // namespace of key (required with a type catalogue)
  string namespace = 3;
  // read the node as this change sees it on a flow ("" = the main flow, else the active option): a node the change holds a
  // draft of is read through the draft (a draft reference: version 0), others as the stored version (ADR 0079)
  string change_id = 4;
  string flow = 5;
}

message GetNodeResponse {
  NodeView view = 1;
}


// A tag names one exact node version (ADR 0143 §6).
message Tag {
  string id = 1;
  string name = 2;
  // the namespace of the node
  string namespace = 3;
  string node_id = 4;
  int32 version = 5;
  string by = 6;
  google.protobuf.Timestamp created_at = 7;
}

message TagVersionRequest {
  string node_id = 1;
  int32 version = 2;
  string name = 3;
}

message TagVersionResponse {
  Tag tag = 1;
}

// every field empty matches every tag
message ListTagsRequest {
  string namespace = 1;
  string name = 2;
  string node_id = 3;
}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message DeleteTagRequest {
  string id = 1;
}

message DeleteTagResponse {}

message ListBaselinesRequest {
  string namespace = 1;
  // a page of the history of this branch (ADR 0140): its baselines committed before `before` (0: the newest), at most
  // `limit` (default 100, at most 500), with what draws them in `related`. Neither branch nor ids: every baseline of
  // the namespace.
  string branch = 2;
  int64 before = 3;
  int32 limit = 4;
  // the headers of these baselines only
  repeated string ids = 5;
}

message ListBaselinesResponse {
  // the headers of the baselines, oldest first: their nodes are not sent (ADR 0140)
  repeated Baseline baselines = 1;
  // with a branch: the baselines the changes of the page left on their own branches, those of the open branches
  // forked from it (newest page), and the ones their edges reach outside the page
  repeated Baseline related = 2;
  // with a branch: the `before` of the older page; 0: none
  int64 next = 3;
}

message GetBaselineGraphRequest {
  string id = 1;
}

message GetBaselineGraphResponse {
  Baseline baseline = 1;
  repeated Node nodes = 2;
  repeated Link links = 3;
  repeated Link suspect_links = 4;
}

message GetBaselineDeltaRequest {
  string from = 1;
  string to = 2;
}

message GetBaselineDeltaResponse {
  Baseline from = 1;
  Baseline to = 2;
  repeated Node nodes = 3;
  repeated Link links = 4;
  repeated string removed = 5;
}

message ListBaselineNodesRequest {
  string baseline_id = 1;
  // qualified node type ("alm@Requirement"); empty: every type
  string type = 2;
  // case-insensitive text matched against the key, the type and the string properties
  string query = 3;
  int32 offset = 4;
  // page size (default and max 500)
  int32 limit = 5;
  bool include_deleted = 6;
  // the nodes the impacts of this change act on, at their version in the baseline: the answer and its cost follow
  // the change, not the size of the baseline (ADR 0140); empty: every node of the baseline
  string change_id = 7;
}

message TypeCount {
  string type = 1;
  int32 count = 2;
}

message ListBaselineNodesResponse {
  repeated Node nodes = 1;
  // number of nodes matching the query, all pages
  int32 total = 2;
  // nodes per type matching the text query (the type filter aside)
  repeated TypeCount types = 3;
  // the header of the baseline: its nodes are not sent
  Baseline baseline = 4;
}

message ListBaselineLinksRequest {
  string baseline_id = 1;
  // link type; empty: every type
  string type = 2;
  // case-insensitive text matched against the type and the string properties
  string query = 3;
  int32 offset = 4;
  // page size (default and max 500)
  int32 limit = 5;
}

message ListBaselineLinksResponse {
  repeated Link links = 1;
  // number of links matching the query, all pages
  int32 total = 2;
  // links per type matching the text query (the type filter aside)
  repeated TypeCount types = 3;
  // the header of the baseline: its nodes are not sent
  Baseline baseline = 4;
}

message GetNodeNeighbourhoodRequest {
  string baseline_id = 1;
  string node_id = 2;
}

message GetNodeNeighbourhoodResponse {
  Node node = 1;
  // targets of its outgoing links and sources (in the baseline) of its incoming links
  repeated Node nodes = 2;
  repeated Link links = 3;
  // ids of the links whose target changed since they were created
  repeated string suspect_link_ids = 4;
}

// An operation on the change impacts of a change (ADR 0029).
message ImpactEvent {
  string id = 1;
  string change_id = 2;
  int32 seq = 3;
  // empty for a change-level event (adopted)
  string impact_id = 4;
  // proposed (an existing node) | created (a new node: its impact and its draft) | checkedOut | transitioned | updated |
  // cancelled | withdrawn | reviewed | discarded | adopted | committed | rebased
  string op = 5;
  // the caller: the flow branch ("" = the main flow), the journal record of the action run, the principal or component
  string flow = 6;
  string execution = 7;
  string by = 8;
  google.protobuf.Timestamp at = 9;
  // proposed, created
  ChangeImpact state = 10;
  // created, checkedOut, transitioned, updated
  NodeRef post = 11;
  // rebased
  NodeRef pre = 12;
  NodeRef committed = 13;
  // reviewed, discarded
  Review review = 14;
  // adopted: the action runs the flow replaces
  repeated string stale = 15;
}

// An entry of the log of a change (ADR 0030).
message LogEntry {
  // position in the log (one order for the entries of a change)
  int64 seq = 1;
  string id = 2;
  string change_id = 3;
  // <stream>.<kind>: fact.artifact, journal.schedule, impact.transitioned...
  string type = 4;
  // flow branch ("" = the main flow)
  string flow = 5;
  string process_id = 6;
  // the action run behind the entry (a journal record is its own)
  string execution = 7;
  // what it is about: the action, the fact type, the change impact
  string subject = 8;
  string by = 9;
  google.protobuf.Timestamp at = 10;
  // the whole fact, journal record or impact event, as JSON
  string payload = 11;
  // the id of the entry this one follows from (ADR 0105): a decided review of a change impact names the submitted
  // review (fact.review) that decided it; empty when none
  string causation = 12;
}

message ListChangeLogRequest {
  // the change, or the processes (which name theirs)
  string change_id = 1;
  // exact types ("journal.action") or streams ("journal.")
  repeated string types = 2;
  // flow branches; "main" is the main flow
  repeated string flows = 3;
  repeated string process_ids = 4;
  string execution = 5;
  // entries after this position (to follow the log)
  int64 after_seq = 6;
  int32 limit = 7;
}

message ListChangeLogResponse {
  repeated LogEntry entries = 1;
  // entries of each type matching the request without its types
  map<string, int32> counts = 2;
}

message ExportChangeProvenanceRequest {
  string change_id = 1;
}

message ExportChangeProvenanceResponse {
  // the JSON-LD document
  string document = 1;
  string filename = 2;
  string media_type = 3;
}

message ExportGraphRequest {
  string namespace = 1;
  // the branch whose head is exported (default main), unless a baseline is named
  string branch = 2;
  string baseline_id = 3;
}

message ExportGraphResponse {
  // the snapshot (format goap.graph.snapshot/v1)
  string document = 1;
  string filename = 2;
  string media_type = 3;
  int32 nodes = 4;
}

message StartGraphExportRequest {
  string namespace = 1;
  // the branch whose head is exported (default main), unless a baseline is named
