  string from = 1;
  string into = 2;
  string title = 3;
  // by node id
  map<string, Resolution> resolutions = 4;
  // namespace of the branches (default: the default namespace)
  string namespace = 5;
}

message MergeBranchResponse {
  Change change = 1;
  Baseline baseline = 2;
  MergePlan plan = 3;
