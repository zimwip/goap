}

message DetachChangeResponse {
  Change change = 1;
}

// SetChangeDependencies replaces the changes a change depends on (ADR 0108): no cycle, no ancestor, no sub-change.
message SetChangeDependenciesRequest {
  string change_id = 1;
  repeated string depends_on = 2;
}

message SetChangeDependenciesResponse {
  Change change = 1;
}

// UpgradeChange moves an open change to another version of its methodology (ADR 0113): the version named, else the
