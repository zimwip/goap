  // after superseding the previous definition as an "intent" item, so the history is kept.
  optional string title = 5;
  optional string intent = 6;
}

message UpdateChangeResponse {
  Change change = 1;
}

// MoveChange moves a root change, draft or active, with its open sub-changes, to another project (ADR 0091).
