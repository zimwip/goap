}

message CreateChangeRequest {
  string title = 1;
  string intent = 2;
  string methodology = 3;
  string baseline_id = 4;
  google.protobuf.Struct data = 5;
  // branch the change applies to (default main)
  string branch = 6;
  // namespace the change acts on (required with a type catalogue)
  string namespace = 7;
  // give the change a branch of its own, merged into `branch` when applied
  bool own_branch = 8;
  // make the change a sub-change of another one (namespace, branch and baseline follow the parent)
  string parent_id = 9;
  // key of the responsible OrgUnit (organisation namespace); "@me": the personal unit of the caller, which
  // makes the change personal (ADR 0037)
  string owner_org = 10;
  // key of the ProjectUnit (organisation namespace) this change's nodes belong to (ADR 0039);
  string project_id = 12;
  // the version of the methodology the change follows (ADR 0113); empty: the parent's for a sub-change of the same
  // methodology, else the latest published one
  string methodology_version = 13;
}

message CreateChangeResponse {
  Change change = 1;
}

message GetChangeRequest {
  string id = 1;
  // read the change as its log stood at this position (its impacts, items and state); 0 or past the head: the head
  int64 at_seq = 2;
}

message GetChangeResponse {
  Change change = 1;
}

message ListChangesRequest {
  // namespace the change acts on (empty: every namespace)
  string namespace = 1;
  // draft | active | committed | applied | abandoned (empty: every status)
  repeated string status = 2;
  // key of the responsible OrgUnit (empty: every unit)
  string owner_org = 3;
  // the heads of the changes only, without their impacts and items: what a list shows (ADR 0140)
  bool header_only = 4;
  // key of the project the change acts in (empty: every project)
  string project = 5;
  // a text the id, title, intent, methodology or namespace of the change contains, case ignored (empty: every change)
  string query = 6;
  // the size of a page, newest first (0: every change, unpaged; at most 500)
  int32 limit = 7;
  // next_cursor of the page before (empty: the newest page); only with a limit
  string cursor = 8;
}

message ListChangesResponse {
  repeated Change changes = 1;
  // the cursor of the next (older) page; empty: this page is the last
  string next_cursor = 2;
