message ToolUse {
  string name = 1;
  int64 duration_ms = 2;
  string error = 3;
}

// ExecutionRecord is one entry of the execution journal of a change: a tick
// (observe + plan), an action execution, a human decision, a process start / end.
message ExecutionRecord {
  string id = 1;
  string change_id = 2;
  string process_id = 3;
  string parent_process_id = 4;
  int32 seq = 5;
  // process.started | tick | action | approval | process.ended
  string kind = 6;
  string methodology = 7;
  string methodology_version = 8;
  string agent = 9;
  string planner = 10;
  string goal = 11;
  string status = 12;
  int32 step = 13;
  string action = 14;
  string action_kind = 15;
  string specialization = 16;
  repeated string plan = 17;
  map<string, bool> before = 18;
  map<string, bool> after = 19;
  optional bool effects_met = 20;
  repeated string items = 21;
  int64 input_tokens = 22;
  int64 output_tokens = 23;
  repeated ModelCall model_calls = 24;
  repeated ToolUse tool_calls = 25;
  string actor = 26;
  string output = 27;
  string error = 28;
  string trace_id = 29;
  string span_id = 30;
  google.protobuf.Struct data = 31;
  google.protobuf.Timestamp started_at = 32;
  google.protobuf.Timestamp ended_at = 33;
  int64 duration_ms = 34;
  // the step reads the blackboard and extends it: node versions it started from,
  // and the item count of the change before / after it
  repeated NodeRef reads = 35;
  int32 board_before = 36;
  int32 board_after = 37;
  // last item of the flow before the step: where a relaunch of the step forks
  string board_last = 38;
  // flow branch the process runs on ("" = the main flow)
  string flow = 39;
}

message ListExecutionsRequest {
  string change_id = 1;
  repeated string process_ids = 2;
}

message ListExecutionsResponse {
  repeated ExecutionRecord records = 1;
}

message LinkEdit {
  string type = 1;
  // existing node version, or the key of a node created by another edit of the commit
  NodeRef to = 2;
  string to_key = 3;
  google.protobuf.Struct props = 4;
}

message NodeEdit {
  // a created node
  string key = 1;
  string type = 2;
  // a modified node: the version it starts from
  NodeRef pre = 3;
  // merged over the current properties (null clears one)
  google.protobuf.Struct props = 4;
  string rationale = 5;
  repeated LinkEdit links = 6;
  // outgoing links of the pre version the new version leaves out (removing a child is a modification of its parent)
  repeated string remove_links = 7;
  // key of the organisational unit the node is transferred to (ADR 0054); empty: unchanged, or the unit holding the
  // commit for a created node
  string owner = 8;
  // the lifecycle state the node is moved to (a transition of its own, ADR 0076): after the other edits, or before
  // them (a retired entry restored)
  string state = 9;
}

message CommitEditsRequest {
  string namespace = 1;
  string title = 2;
  string intent = 3;
  string methodology = 4;
  google.protobuf.Struct data = 5;
  string baseline_id = 6;
  string baseline_name = 7;
  repeated NodeEdit edits = 8;
  // the unit holding the commit (empty: the root unit; "@me": the caller's personal unit) and the project it acts in (empty: the
  // caller's active project, else the default project), ADR 0054
  string owner_org = 9;
  string project_id = 10;
  // the writer's own events, stored in the graph's outbox in the transaction of the commit and delivered with the graph's
  // (ADR 0136): what a registry keeping its versions in the graph emits; system callers only, never a subject of the graph
  repeated CarriedEvent events = 11;
}

// CarriedEvent is an event a writer owns that rides on a graph write (ADR 0136): its subject and its JSON payload.
message CarriedEvent {
  string subject = 1;
  bytes payload = 2;
}

message CommitEditsResponse {
  string change_id = 1;
  Baseline baseline = 2;
}

message ProposeImpactRequest {
  string change_id = 1;
  repeated ChangeImpact nodes = 2;
}

message ProposeImpactResponse {
  repeated ChangeImpact nodes = 1;
}

message NodeLinkWrite {
  string type = 1;
  NodeRef to = 2;
  google.protobuf.Struct props = 3;
}

// The node a ImpactNodeCheckout or a ImpactNodeTransition works on: a change impact of the change, or a node (then the impact the
// flow sees on it, declared when the change holds none). flow is the flow the call works on (empty: the active option,
// "main": the main flow) and execution the action run that makes it (ADR 0025).
message ImpactNodeCreateRequest {
  string change_id = 1;
  string key = 2;
  string type = 3;
  google.protobuf.Struct props = 4;
  // key of the organisational unit owning the node (ADR 0054); empty: the unit holding the change
  string owner = 5;
  string rationale = 6;
  repeated NodeLinkWrite links = 7;
  string flow = 8;
  string execution = 9;
}

// A node a merge or a split creates (the fields of ImpactNodeCreateRequest but the change and the flow).
message NodeCreateSpec {
  string key = 1;
  string type = 2;
  google.protobuf.Struct props = 3;
  string owner = 4;
  string rationale = 5;
  repeated NodeLinkWrite links = 6;
}

// A node a merge or a split works on: a change impact of the change, a node id or a key.
message NodeName {
  string change_impact_id = 1;
  string node_id = 2;
  string key = 3;
}

message ImpactNodeMergeRequest {
  string change_id = 1;
  repeated NodeName sources = 2;
  NodeCreateSpec into = 3;
  // why, on the impacts the merge declares; empty: the rationale of into
  string rationale = 4;
  string flow = 5;
  string execution = 6;
}

message ImpactNodeSplitRequest {
  string change_id = 1;
  NodeName source = 2;
  repeated NodeCreateSpec into = 3;
  string rationale = 4;
  string flow = 5;
  string execution = 6;
}

// A link of another node to a split source that the split leaves as it is (ADR 0003: suspect).
message SuspectLink {
  NodeRef from = 1;
  string from_key = 2;
  string type = 3;
  NodeRef to = 4;
  string to_key = 5;
}

message ImpactNodeRestructureResponse {
  repeated ChangeImpact successors = 1;
  repeated ChangeImpact sources = 2;
  repeated ChangeImpact parents = 3;
  repeated SuspectLink suspect = 4;
}

message DerivedNodesRequest {
  // version 0: any version of the node
  NodeRef ref = 1;
}

message DerivedNodesResponse {
  repeated Node nodes = 1;
}

message ImpactNodeCreateResponse {
  ChangeImpact node = 1;
}

message ImpactNodeCheckoutRequest {
  string change_id = 1;
  string change_impact_id = 2;
  string node_id = 3;
  // why, when the call declares the impact
  string rationale = 4;
  string flow = 5;
  string execution = 6;
}

message ImpactNodeCheckoutResponse {
  ChangeImpact node = 1;
}

message ImpactNodeUpdateRequest {
  string change_id = 1;
  string change_impact_id = 2;
  // merged over the properties of the draft
  google.protobuf.Struct props = 3;
  // key of the organisational unit the node is transferred to (ADR 0054); empty: unchanged
  string owner = 4;
  string flow = 5;
  string execution = 6;
}

message ImpactNodeUpdateResponse {
  ChangeImpact node = 1;
}

message ImpactLinkCreateRequest {
  string change_id = 1;
  // the change impact whose draft the link leaves from
  string change_impact_id = 2;
  string type = 3;
  NodeRef to = 4;
  google.protobuf.Struct props = 5;
  string flow = 6;
  string execution = 7;
}

message ImpactLinkCreateResponse {
  Link link = 1;
}

message ImpactLinkUpdateRequest {
  string change_id = 1;
  string link_id = 2;
  google.protobuf.Struct props = 3;
  string flow = 4;
  string execution = 5;
}

message ImpactLinkUpdateResponse {
  Link link = 1;
}

message ImpactLinkDeleteRequest {
  string change_id = 1;
  string link_id = 2;
  string flow = 3;
  string execution = 4;
}

message ImpactLinkDeleteResponse {}

message ImpactNodeTransitionRequest {
  string change_id = 1;
  string change_impact_id = 2;
  string node_id = 3;
  // the lifecycle state the node goes to
  string state = 4;
  string rationale = 5;
  string flow = 6;
  string execution = 7;
}

message ImpactNodeTransitionResponse {
  ChangeImpact node = 1;
}

message ImpactNodeCancelRequest {
  string change_id = 1;
  string change_impact_id = 2;
  string flow = 3;
  string execution = 4;
}

message ImpactNodeCancelResponse {
  // the change impact as the cancellation leaves it (empty when a creation was cancelled: the impact is gone)
  ChangeImpact node = 1;
}

message WithdrawImpactRequest {
  string change_id = 1;
  string change_impact_id = 2;
  string flow = 3;
  string execution = 4;
}

message WithdrawImpactResponse {}

message WithdrawImpactsRequest {
  string change_id = 1;
  repeated string change_impact_ids = 2;
  string flow = 3;
  string execution = 4;
}

message WithdrawImpactsResponse {}

message RebaseChangeRequest {
  string change_id = 1;
}

// What a rebase did to a change impact of the sub-change (ADR 0082).
message RebasedImpact {
  string change_impact_id = 1;
  string key = 2;
  // the merged draft differs from the sub-change's: its review went back to proposed
  bool changed = 3;
  // the fields changed on both sides: props.<key>, owner, state, link:<type>:<node>, node (the parent rejected or
  // withdrew its impact)
  repeated string conflicts = 4;
  // the draft took values from the target (a root change, ADR 0101)
  bool merged = 5;
}

message RebaseChangeResponse {
  // the parent change of a sub-change, "" for a root change
  string parent_id = 1;
  repeated RebasedImpact impacts = 2;
  // a root change (ADR 0101): the target branch, the baseline it was forked from and the head it moved to
  string branch = 3;
  string from = 4;
  string onto = 5;
}

message ImpactNodeResolveRequest {
  string change_id = 1;
  string change_impact_id = 2;
  string execution = 3;
}

message ImpactNodeResolveResponse {
  ChangeImpact node = 1;
}

message GetRebaseStateRequest {
  string change_id = 1;
}

message GetCommitStateRequest {
  string change_id = 1;
}

message GetCommitStateResponse {
  // keys of the accepted modifications the next commit writes
  repeated string to_commit = 1;
  // nodes withdrawn after their commit that the next commit reverts
  int32 reverts = 2;
  // what holds the merge (impacts to commit, review, rework or withdraw; open flows, decision points, sub-changes)
  repeated string unsettled = 3;
  // the change committed on its own branch something it has not merged yet
  bool commits = 4;
  bool can_commit = 5;
  bool can_merge = 6;
}

// The conflicts a rebase left on a change impact, not settled yet.
message ImpactConflicts {
  string change_impact_id = 1;
  string key = 2;
  repeated string conflicts = 3;
}

message GetRebaseStateResponse {
  // the parent change ("" when the change is not a sub-change)
  string parent_id = 1;
  // the change impacts whose draft the parent changed since the sub-change took it
  repeated string behind_impact_ids = 2;
  repeated ImpactConflicts conflicts = 3;
  // a root change behind the head of its target branch (ADR 0101): the branch and the head a rebase moves it to
  string branch = 4;
  string onto = 5;
}

message ImpactNodeReviewRequest {
  string change_id = 1;
  string change_impact_id = 2;
  bool accept = 3;
  string comment = 4;
  // flow branch the review is made on (empty: the main flow) and the action run that makes it
  string flow = 5;
  string execution = 6;
}

message ImpactNodeReviewResponse {
  ChangeImpact node = 1;
}

message ImpactVerdict {
  string change_impact_id = 1;
  bool accept = 2;
  string comment = 3;
}

message ImpactNodeReviewBatchRequest {
  string change_id = 1;
  string review_id = 2;
  string flow = 3;
  string execution = 4;
  repeated ImpactVerdict verdicts = 5;
  // a fact written with the verdicts once they stood
  ChangeItem item = 6;
}

message ImpactNodeReviewBatchResponse {
  repeated ChangeImpact nodes = 1;
}

// The review object (ADR 0080). A review is an item of the change (kind review); every call answers its current version.
message ReviewEntry {
  string change_impact_id = 1;
  string comment = 2;
  // accept | reject | empty while undecided
  string outcome = 3;
}

message ReviewRecord {
  string key = 1;
  // flow branch the entries are reviewed on (empty: the main flow)
  string flow = 2;
  // the global comment
  string comment = 3;
  // open | submitted | discarded
  string status = 4;
  repeated ReviewEntry entries = 5;
  string by = 6;
  google.protobuf.Timestamp submitted_at = 7;
  string item = 8;
  int32 versions = 9;
}

message ReviewOpenRequest {
  string change_id = 1;
  string flow = 2;
  string comment = 3;
}

// A change to an open review: the comment replaces the global one when set; remove then add change the impacts; entries
// set comment / outcome of entries once the set changed (set_comment / set_outcome say which fields to write).
message ReviewEntryEdit {
  string change_impact_id = 1;
  bool set_comment = 2;
  string comment = 3;
  bool set_outcome = 4;
  // accept | reject | empty to take the decision back
  string outcome = 5;
}

message ReviewUpdateRequest {
  string change_id = 1;
  string key = 2;
  bool set_comment = 3;
  string comment = 4;
  repeated string add = 5;
  repeated string remove = 6;
  repeated ReviewEntryEdit entries = 7;
}

message ReviewSubmitRequest {
  string change_id = 1;
  string key = 2;
}

message ReviewDiscardRequest {
  string change_id = 1;
  string key = 2;
}

message ReviewResponse {
  ReviewRecord review = 1;
}

// ReopenChangeImpactsRequest sends accepted or rejected impacts of the main flow back to proposed (ADR 0075, 0076).
message ReopenChangeImpactsRequest {
  string change_id = 1;
  repeated string change_impact_ids = 2;
  string comment = 3;
}

message ReopenChangeImpactsResponse {
  repeated string reopened = 1;
}

message GetChangeImpactsRequest {
  string change_id = 1;
}

message GetChangeImpactsResponse {
  repeated NodeRef nodes = 1;
}

// A page of the changes acting on a node, the most recent first in pages (ADR 0140).
message ListNodeChangesRequest {
  string node_id = 1;
  // the changes that acted on the node before this cursor (0: up to the latest), a `next` of a previous answer
  int64 before = 2;
  // the most recent changes kept (0: 50, at most 500)
  int32 limit = 3;
}

message ListNodeChangesResponse {
  // headers only (no items, no impacts), oldest first
  repeated Change changes = 1;
  // the `before` of the next (older) page; 0: none
  int64 next = 2;
}

message MergeChangeRequest {
  string change_id = 1;
  // by node id
  map<string, Resolution> resolutions = 2;
}

message MergeChangeResponse {
  Change change = 1;
}

message GetSharedNodesRequest {
  string change_id = 1;
}

message SharedNode {
  NodeRef node = 1;
  string key = 2;
  repeated string changes = 3;
}

message GetSharedNodesResponse {
  repeated SharedNode nodes = 1;
}

message SplitChangeRequest {
  string change_id = 1;
}

message SplitChangeResponse {
  // the sub-changes created by this call
  repeated Change changes = 1;
}

message ListSubChangesRequest {
  string change_id = 1;
}

message ListSubChangesResponse {
  repeated Change changes = 1;
}

message FlowEvent {
  // open | adopt | discard
  string op = 1;
  string flow = 2;
  string parent = 3;
  string fork_after = 4;
  repeated string stale = 9;
  string by = 10;
  // open: the flow is an option of the change (ADR 0009 §3); evaluate: the evaluation
  Option option = 16;
  string comment = 17;
  // opaque producer ids invalidated by the flow (ADR 0025)
  repeated string stale_runs = 18;
  // opaque record of the opener (the graph never reads it, ADR 0067)
  google.protobuf.Struct origin = 19;
}

// Option is the hypothesis of a flow opened as an option.
message Option {
  string name = 1;
  string hypothesis = 2;
}

// Flow is a flow branch of a change, replayed from its events.
message Flow {
  string id = 1;
  string parent = 2;
  string fork_after = 3;
  // open | adopted | discarded
  string status = 8;
  // items the relaunched step invalidated (stale while open, superseded once adopted)
  repeated string stale = 9;
  google.protobuf.Timestamp opened_at = 10;
  google.protobuf.Timestamp decided_at = 11;
  string decided_by = 12;
  // adopted flows that replace the same items: an open flow that competes cannot be adopted
  repeated string competes_with = 17;
  // set on an option: its hypothesis, its status (exploring | evaluated | selected | rejected), its last evaluation,
  // and whether the change works on it
  Option option = 19;
  string option_status = 20;
  string evaluation = 21;
  bool active = 22;
  // opaque producer ids invalidated by the flow (ADR 0025)
  repeated string stale_runs = 23;
  // opaque record of the opener (the graph never reads it, ADR 0067)
  google.protobuf.Struct origin = 24;
}

message OpenFlowRequest {
  string change_id = 1;
  string parent = 2;
  string fork_after = 3;
  repeated string seeds = 4;
  // opaque producer ids the flow invalidates (ADR 0025)
  repeated string stale_runs = 12;
  // opaque record of the opener, stored on the flow and never read by the graph (ADR 0067)
  google.protobuf.Struct origin = 13;
  // items written on the new flow at its creation
  repeated ChangeItem items = 14;
}

message OpenFlowResponse {
  Flow flow = 1;
}

message AdoptFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message AdoptFlowResponse {
  Flow flow = 1;
}

message DiscardFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message DiscardFlowResponse {
  Flow flow = 1;
}

message ListFlowsRequest {
  string change_id = 1;
}

message ListFlowsResponse {
  repeated Flow flows = 1;
}

message BoardIssue {
  // item where the problem shows, and the item to blame (relaunch the step that produced it)
  string item = 1;
  string culprit = 2;
  // structure | dangling | derived_from_invalid | reference | outdated | rule | impact | duplicate
  string code = 3;
  string message = 4;
  // error | warning
  string severity = 5;
}

message ValidateBoardRequest {
  string change_id = 1;
  // flow branch (empty: the main flow)
  string flow = 2;
}

message ValidateBoardResponse {
  repeated BoardIssue issues = 1;
}

message OpenOptionRequest {
  string change_id = 1;
  string name = 2;
  string hypothesis = 3;
  // make it the option the change works on
  bool activate = 4;
}

message OpenOptionResponse {
  Flow option = 1;
}

message ActivateOptionRequest {
  string change_id = 1;
  // the option to work on; empty or "main": the main flow
  string option = 2;
}

message ActivateOptionResponse {
  // the active option (empty: the main flow)
  string active = 1;
}

message EvaluateOptionRequest {
  string change_id = 1;
  string option = 2;
  string comment = 3;
}

message EvaluateOptionResponse {
  Flow option = 1;
}

message SelectOptionRequest {
  string change_id = 1;
  string option = 2;
}

message SelectOptionResponse {
  Flow option = 1;
}

message RejectOptionRequest {
  string change_id = 1;
  string option = 2;
}

message RejectOptionResponse {
  Flow option = 1;
}

message ListOptionsRequest {
  string change_id = 1;
}

message ListOptionsResponse {
  repeated Flow options = 1;
  // the option the change works on (empty: the main flow)
  string active = 2;
}

message CompareOptionsRequest {
  string change_id = 1;
  // written (default) | accepted
  string level = 2;
  // every option, decided ones included (default: the open ones)
  bool all = 3;
}

// OptionNode is a node written by at least one option, with its version on the main flow and on each option (absent:
// not in the graph of that side).
message OptionNode {
  string node = 1;
  string key = 2;
  string type = 3;
  NodeRef main = 4;
  // by option id
  map<string, NodeRef> options = 5;
  // properties by side: "main" or the option id
  map<string, google.protobuf.Struct> props = 6;
}

message CompareOptionsResponse {
  string level = 1;
  repeated Flow options = 2;
  repeated OptionNode nodes = 3;
}

message DiffFlowsRequest {
  string change_id = 1;
  // the flows to compare: "main" (or empty) for the main flow, else an option id (open or decided)
  string left = 2;
  string right = 3;
  // written (default: every impact not rejected) | accepted (the impacts accepted on that flow)
  string level = 4;
}

// FieldChange is one difference between the left and the right shape of an impact's node: a property (name), the state,
// the owner, or a link (name: its type, target: the key of its target node). Old / new are absent when added / removed.
message FieldChange {
  // property | state | owner | link
  string kind = 1;
  string name = 2;
  // added | removed | changed, from the left to the right
  string op = 3;
  string target = 4;
  google.protobuf.Value old = 5;
  google.protobuf.Value new = 6;
}

// ImpactSide is what one flow sees of an impact.
message ImpactSide {
  string impact = 1;
  // the flow that declared the impact ("" = the main flow)
  string flow = 2;
  string intent = 3;
  string review = 4;
  // false for a planned impact: its node is not checked out
  bool drafted = 5;
  string state = 6;
  string owner = 7;
}

// ImpactDiff is an impact that differs between the two flows (matched by node, else by type and key).
message ImpactDiff {
  string node = 1;
  string key = 2;
  string type = 3;
  // added (right only) | removed (left only) | modified (both, other content)
  string category = 4;
  ImpactSide left = 5;
  ImpactSide right = 6;
  repeated FieldChange changes = 7;
}

message DiffFlowsResponse {
  string left = 1;
  string right = 2;
  string level = 3;
  repeated ImpactDiff impacts = 4;
  // impacts both flows see with the same content (left out of impacts)
  int32 identical = 5;
}

message GetChangeViewRequest {
  string change_id = 1;
  // flow or option (empty: the active option, else the main flow; "main": the main flow)
  string flow = 2;
  // written (default) | accepted | committed
  string level = 3;
}

message GetChangeViewResponse {
  // a baseline without an id below committed: computed, not stored
  Baseline baseline = 1;
}

message GetChangeGraphRequest {
  string change_id = 1;
  // flow or option (empty: the active option, else the main flow; "main": the main flow)
  string flow = 2;
}

message GetChangeGraphResponse {
  repeated Node nodes = 1;
  repeated Link links = 2;
}

// DecisionEvent is an event of a decision point (ADR 0009 §4).
message DecisionEvent {
  // open | rule | answer | ratify
  string op = 1;
  string point = 2;
  string question = 3;
  repeated string options = 4;
  repeated string criteria = 5;
  string outcome = 10;
  string option = 11;
  double confidence = 12;
  string justification = 13;
  repeated string questions = 14;
  bool human = 15;
  string question_id = 16;
  string answer = 17;
  string process = 18;
  bool accept = 19;
  string comment = 20;
  string by = 21;
  // opaque policy values of the point, resolved at its opening (open only)
  google.protobuf.Struct policy = 22;
}

message Question {
  string id = 1;
  string point = 2;
  string text = 3;
  // open | answered
  string status = 4;
  string answer = 5;
  string answered_by = 6;
  // the process that investigated it
  string process = 7;
  google.protobuf.Timestamp asked_at = 8;
}

message Ruling {
  // decided | undecidable
  string outcome = 1;
  string option = 2;
  double confidence = 3;
  string justification = 4;
  string by = 5;
  bool human = 6;
  google.protobuf.Timestamp at = 7;
}

// DecisionPoint is a decision point replayed from its events.
message DecisionPoint {
  string id = 1;
  string question = 2;
  repeated string options = 3;
  repeated string criteria = 4;
  google.protobuf.Timestamp opened_at = 9;
  string opened_by = 10;
  // open | blocked | ratifying | escalated | decided
  string status = 11;
  repeated Question questions = 13;
  Ruling ruling = 14;
  // why the policy reserved the point to a person (empty: not escalated)
  string escalation = 15;
  string option = 16;
  google.protobuf.Timestamp decided_at = 17;
  string decided_by = 18;
  // opaque policy values of the point, kept by the policy (ADR 0067)
  google.protobuf.Struct policy = 19;
  // only a person may rule the point now: by design or escalated
  bool human_only = 20;
}

message OpenDecisionRequest {
  string change_id = 1;
  string question = 2;
  // the options it chooses among; unset (with all_options) the open options of the change
  repeated string options = 3;
  bool all_options = 4;
  repeated string criteria = 5;
  // the policy values the opener gives (who decides, a threshold, rounds, a duration): resolved by the graph's
  // decision policy (ADR 0067)
  google.protobuf.Struct policy = 10;
  // what it chooses among beyond the options of the change: plain labels (go, no_go, back of a gate, ADR 0132)
  repeated string choices = 11;
}

message OpenDecisionResponse {
  DecisionPoint point = 1;
}

message RuleDecisionRequest {
  string change_id = 1;
  // empty: the only pending point
  string point = 2;
  // decided | undecidable
  string outcome = 3;
  string option = 4;
  double confidence = 5;
  string justification = 6;
  repeated string questions = 7;
  // ruled by an agent of a process (the engine): below the threshold it waits for a ratification, and it is refused
  // on a point a person rules; unset, the caller rules as a person
  bool agent = 8;
  // the seat of the board the person rules in, for a collegial decision (ADR 0132)
  string role = 9;
}

message RuleDecisionResponse {
  DecisionPoint point = 1;
}

message AnswerQuestionRequest {
  string change_id = 1;
  string question = 2;
  string answer = 3;
  string process = 4;
}

message AnswerQuestionResponse {
  DecisionPoint point = 1;
}

message RatifyDecisionRequest {
  string change_id = 1;
  string point = 2;
  bool accept = 3;
  string comment = 4;
}

message RatifyDecisionResponse {
  DecisionPoint point = 1;
}

message ListDecisionPointsRequest {
  string change_id = 1;
}

message ListDecisionPointsResponse {
  repeated DecisionPoint points = 1;
}
