  string change_impact_id = 1;
  string key = 2;
  repeated string conflicts = 3;
}

message GetRebaseStateResponse {
  // the parent change ("" when the change is not a sub-change)
  string parent_id = 1;
  // the change impacts whose draft the parent changed since the sub-change took it
  repeated string behind_impact_ids = 2;
  repeated ImpactConflicts conflicts = 3;
}

