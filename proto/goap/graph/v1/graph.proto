message NodeLinkWrite {
  string type = 1;
  NodeRef to = 2;
  google.protobuf.Struct props = 3;
}

// The node a ImpactNodeCheckout or a ImpactNodeTransition works on: a change impact of the change, or a node (then the impact the
// flow sees on it, declared when the change holds none). flow is the flow the call works on (empty: the active option,
// "main": the main flow) and execution the action run that makes it (ADR 0025).
message ImpactNodeCreateRequest {
  string change_id = 1;
  string key = 2;
  string type = 3;
  google.protobuf.Struct props = 4;
  // key of the organisational unit owning the node (ADR 0054); empty: the unit holding the change
  string owner = 5;
  string rationale = 6;
  repeated NodeLinkWrite links = 7;
  string flow = 8;
  string execution = 9;
}

// A node a merge or a split creates (the fields of ImpactNodeCreateRequest but the change and the flow).
message NodeCreateSpec {
  string key = 1;
  string type = 2;
  google.protobuf.Struct props = 3;
  string owner = 4;
  string rationale = 5;
  repeated NodeLinkWrite links = 6;
}

// A node a merge or a split works on: a change impact of the change, a node id or a key.
message NodeName {
  string change_impact_id = 1;
  string node_id = 2;
  string key = 3;
}

message ImpactNodeMergeRequest {
  string change_id = 1;
  repeated NodeName sources = 2;
  NodeCreateSpec into = 3;
