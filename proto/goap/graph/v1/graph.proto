message SetChangeMethodologyResponse {
  Change change = 1;
}

message GetChangeDependenciesRequest {
  string change_id = 1;
}

// A change related to another by a dependency (ADR 0108), as the dependent change sees it.
message Dependency {
  string id = 1;
  string title = 2;
  string methodology = 3;
  string status = 4;
  string state = 5;
  string parent_id = 6;
  // the work of the dependency has reached the branch the dependent change merges into
  bool satisfied = 7;
  // why not
  string reason = 8;
}

message GetChangeDependenciesResponse {
  // the changes it depends on
  repeated Dependency depends_on = 1;
  // the open changes depending on it, satisfied: its work reached the branch each merges into
  repeated Dependency dependents = 2;
  // its open sub-changes in the order they merge, satisfied: their own dependencies are
  repeated Dependency order = 3;
}

