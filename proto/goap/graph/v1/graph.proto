  string branch = 1;
  string change = 2;
}
message BaselineStep {
  string id = 1;
  string name = 2;
  string branch = 3;
  // commit | fast-forward | merge | rebase | revert | snapshot
  string kind = 4;
  string change = 5;
  string parent = 6;
  string merged_from = 7;
  string rebased_from = 8;
  google.protobuf.Timestamp created_at = 9;
  // the sub-changes merged into the change it takes in (ADR 0103), oldest first: the work it brings is theirs too
  repeated string merged = 10;
}
message BaselineDiff {
  string node = 1;
  string key = 2;
  string type = 3;
  // added | removed | changed
  string kind = 4;
  // the node as each baseline holds it (absent where the node is not in it)
  Node from = 5;
  Node to = 6;
}
message PlanMergeResponse {
  MergePlan plan = 1;
}

