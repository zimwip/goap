  string model = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 duration_ms = 5;
  string error = 6;
  // what was sent and answered is an entry of the log of the change of its own (model.call), never part of the record
  reserved 7;
}

message ToolUse {
  string name = 1;
  int64 duration_ms = 2;
  string error = 3;
}

// ExecutionRecord is one entry of the execution journal of a change: a tick
// (observe + plan), an action execution, a human decision, a process start / end.
message ExecutionRecord {
  string id = 1;
  string change_id = 2;
  string process_id = 3;
  string parent_process_id = 4;
  int32 seq = 5;
  // process.started | tick | action | approval | process.ended
  string kind = 6;
  string methodology = 7;
  string methodology_version = 8;
  string agent = 9;
  string planner = 10;
  string goal = 11;
  string status = 12;
  int32 step = 13;
  string action = 14;
  string action_kind = 15;
  string specialization = 16;
  repeated string plan = 17;
  map<string, bool> before = 18;
  map<string, bool> after = 19;
  optional bool effects_met = 20;
  repeated string items = 21;
  int64 input_tokens = 22;
  int64 output_tokens = 23;
  repeated ModelCall model_calls = 24;
  repeated ToolUse tool_calls = 25;
  string actor = 26;
  string output = 27;
  string error = 28;
  string trace_id = 29;
  string span_id = 30;
  google.protobuf.Struct data = 31;
  google.protobuf.Timestamp started_at = 32;
  google.protobuf.Timestamp ended_at = 33;
  int64 duration_ms = 34;
  // the step reads the blackboard and extends it: node versions it started from,
  // and the item count of the change before / after it
  repeated NodeRef reads = 35;
  int32 board_before = 36;
  int32 board_after = 37;
  // last item of the flow before the step: where a relaunch of the step forks
  string board_last = 38;
  // flow branch the process runs on ("" = the main flow)
  string flow = 39;
}

message ListExecutionsRequest {
  string change_id = 1;
  repeated string process_ids = 2;
}

message ListExecutionsResponse {
  repeated ExecutionRecord records = 1;
}

message LinkEdit {
  string type = 1;
  // existing node version, or the key of a node created by another edit of the commit
  NodeRef to = 2;
  string to_key = 3;
  google.protobuf.Struct props = 4;
}

message NodeEdit {
  // a created node
  string key = 1;
  string type = 2;
  // a modified node: the version it starts from
  NodeRef pre = 3;
  // merged over the current properties (null clears one)
  google.protobuf.Struct props = 4;
  string rationale = 5;
  repeated LinkEdit links = 6;
  // outgoing links of the pre version the new version leaves out (removing a child is a modification of its parent)
  repeated string remove_links = 7;
  // key of the organisational unit the node is transferred to (ADR 0054); empty: unchanged, or the unit holding the
  // commit for a created node
  string owner = 8;
  // the lifecycle state the node is moved to (a transition of its own, ADR 0076): after the other edits, or before
  // them (a retired entry restored)
  string state = 9;
}

message CommitEditsRequest {
  string namespace = 1;
  string title = 2;
  string intent = 3;
  string methodology = 4;
  google.protobuf.Struct data = 5;
  string baseline_id = 6;
  string baseline_name = 7;
  repeated NodeEdit edits = 8;
  // the unit holding the commit (empty: the root unit; "@me": the caller's personal unit) and the project it acts in (empty: the
  // caller's active project, else the default project), ADR 0054
  string owner_org = 9;
  string project_id = 10;
}

message CommitEditsResponse {
  string change_id = 1;
  Baseline baseline = 2;
}

