// The review object (ADR 0080). A review is an item of the change (kind review); every call answers its current version.
message ReviewEntry {
  string change_impact_id = 1;
  string comment = 2;
  // accept | reject | empty while undecided
  string outcome = 3;
}

message ReviewRecord {
  string key = 1;
  // flow branch the entries are reviewed on (empty: the main flow)
  string flow = 2;
  // the global comment
  string comment = 3;
  // open | submitted | discarded
  string status = 4;
  repeated ReviewEntry entries = 5;
  string by = 6;
  google.protobuf.Timestamp submitted_at = 7;
  string item = 8;
  int32 versions = 9;
}

message ReviewOpenRequest {
  string change_id = 1;
  string flow = 2;
  string comment = 3;
}

// A change to an open review: the comment replaces the global one when set; remove then add change the impacts; entries
// set comment / outcome of entries once the set changed (set_comment / set_outcome say which fields to write).
message ReviewEntryEdit {
  string change_impact_id = 1;
  bool set_comment = 2;
  string comment = 3;
  bool set_outcome = 4;
  // accept | reject | empty to take the decision back
  string outcome = 5;
}

message ReviewUpdateRequest {
  string change_id = 1;
  string key = 2;
  bool set_comment = 3;
  string comment = 4;
  repeated string add = 5;
  repeated string remove = 6;
  repeated ReviewEntryEdit entries = 7;
}

message ReviewSubmitRequest {
