message FlowEvent {
  // open | adopt | discard
  string op = 1;
  string flow = 2;
  string parent = 3;
  string fork_after = 4;
  reserved 5, 6, 7, 8; // from_step, execution, process, reason (now in origin, ADR 0067)
  repeated string stale = 9;
  string by = 10;
  reserved 11, 12, 13, 14; // branch, items, merged, nodes (MaterializeFlow is gone: the flow branch is the preview)
  reserved 15; // stale_executions (now stale_runs)
  // open: the flow is an option of the change (ADR 0009 §3); evaluate: the evaluation
  Option option = 16;
  string comment = 17;
  // opaque producer ids invalidated by the flow (ADR 0025)
  repeated string stale_runs = 18;
  // opaque record of the opener (the graph never reads it, ADR 0067)
  google.protobuf.Struct origin = 19;
}

// Option is the hypothesis of a flow opened as an option.
message Option {
  string name = 1;
  string hypothesis = 2;
}

// Flow is a flow branch of a change, replayed from its events.
message Flow {
  string id = 1;
  string parent = 2;
  string fork_after = 3;
  reserved 4, 5, 6, 7; // from_step, execution, process, reason (now in origin, ADR 0067)
  // open | adopted | discarded
  string status = 8;
  // items the relaunched step invalidated (stale while open, superseded once adopted)
  repeated string stale = 9;
  google.protobuf.Timestamp opened_at = 10;
  google.protobuf.Timestamp decided_at = 11;
  string decided_by = 12;
  reserved 13, 14, 15, 16; // branch, branches, materialized, merged
  // adopted flows that replace the same items: an open flow that competes cannot be adopted
  repeated string competes_with = 17;
  reserved 18; // stale_executions (now stale_runs)
  // set on an option: its hypothesis, its status (exploring | evaluated | selected | rejected), its last evaluation,
  // and whether the change works on it
  Option option = 19;
  string option_status = 20;
  string evaluation = 21;
  bool active = 22;
  // opaque producer ids invalidated by the flow (ADR 0025)
  repeated string stale_runs = 23;
  // opaque record of the opener (the graph never reads it, ADR 0067)
  google.protobuf.Struct origin = 24;
}

message OpenFlowRequest {
  string change_id = 1;
  string parent = 2;
  string fork_after = 3;
  repeated string seeds = 4;
  reserved 5, 6, 7, 8, 9, 10, 11; // from_step, execution, process, reason, guidance, by, stale_executions
  // opaque producer ids the flow invalidates (ADR 0025)
  repeated string stale_runs = 12;
  // opaque record of the opener, stored on the flow and never read by the graph (ADR 0067)
  google.protobuf.Struct origin = 13;
  // items written on the new flow at its creation
  repeated ChangeItem items = 14;
}

message OpenFlowResponse {
  Flow flow = 1;
}

message AdoptFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message AdoptFlowResponse {
  Flow flow = 1;
}

message DiscardFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message DiscardFlowResponse {
  Flow flow = 1;
}

message ListFlowsRequest {
  string change_id = 1;
}

message ListFlowsResponse {
  repeated Flow flows = 1;
}

message BoardIssue {
  // item where the problem shows, and the item to blame (relaunch the step that produced it)
  string item = 1;
  string culprit = 2;
  // structure | dangling | derived_from_invalid | reference | outdated | rule | impact | duplicate
  string code = 3;
  string message = 4;
  // error | warning
  string severity = 5;
}

message ValidateBoardRequest {
  string change_id = 1;
  // flow branch (empty: the main flow)
  string flow = 2;
}

message ValidateBoardResponse {
  repeated BoardIssue issues = 1;
}

message OpenOptionRequest {
  string change_id = 1;
  string name = 2;
  string hypothesis = 3;
  // make it the option the change works on
  bool activate = 4;
}

message OpenOptionResponse {
  Flow option = 1;
}

message ActivateOptionRequest {
  string change_id = 1;
  // the option to work on; empty or "main": the main flow
  string option = 2;
}

message ActivateOptionResponse {
  // the active option (empty: the main flow)
  string active = 1;
}

message EvaluateOptionRequest {
  string change_id = 1;
  string option = 2;
  string comment = 3;
}

message EvaluateOptionResponse {
  Flow option = 1;
}

message SelectOptionRequest {
  string change_id = 1;
  string option = 2;
}

message SelectOptionResponse {
  Flow option = 1;
}

message RejectOptionRequest {
  string change_id = 1;
  string option = 2;
}

message RejectOptionResponse {
  Flow option = 1;
}

message ListOptionsRequest {
  string change_id = 1;
}

message ListOptionsResponse {
  repeated Flow options = 1;
  // the option the change works on (empty: the main flow)
  string active = 2;
}

message CompareOptionsRequest {
  string change_id = 1;
  // written (default) | accepted
  string level = 2;
  // every option, decided ones included (default: the open ones)
  bool all = 3;
}

// OptionNode is a node written by at least one option, with its version on the main flow and on each option (absent:
// not in the graph of that side).
message OptionNode {
  string node = 1;
  string key = 2;
  string type = 3;
  NodeRef main = 4;
  // by option id
  map<string, NodeRef> options = 5;
  // properties by side: "main" or the option id
  map<string, google.protobuf.Struct> props = 6;
}

message CompareOptionsResponse {
  string level = 1;
  repeated Flow options = 2;
  repeated OptionNode nodes = 3;
}

message DiffFlowsRequest {
  string change_id = 1;
  // the flows to compare: "main" (or empty) for the main flow, else an option id (open or decided)
  string left = 2;
  string right = 3;
  // written (default: every impact not rejected) | accepted (the impacts accepted on that flow)
  string level = 4;
}

// FieldChange is one difference between the left and the right shape of an impact's node: a property (name), the state,
// the owner, or a link (name: its type, target: the key of its target node). Old / new are absent when added / removed.
message FieldChange {
  // property | state | owner | link
  string kind = 1;
  string name = 2;
  // added | removed | changed, from the left to the right
  string op = 3;
  string target = 4;
  google.protobuf.Value old = 5;
  google.protobuf.Value new = 6;
}

// ImpactSide is what one flow sees of an impact.
message ImpactSide {
  string impact = 1;
  // the flow that declared the impact ("" = the main flow)
  string flow = 2;
  string intent = 3;
  string review = 4;
  // false for a planned impact: its node is not checked out
  bool drafted = 5;
  string state = 6;
  string owner = 7;
}

// ImpactDiff is an impact that differs between the two flows (matched by node, else by type and key).
message ImpactDiff {
  string node = 1;
  string key = 2;
  string type = 3;
  // added (right only) | removed (left only) | modified (both, other content)
  string category = 4;
  ImpactSide left = 5;
  ImpactSide right = 6;
  repeated FieldChange changes = 7;
}

message DiffFlowsResponse {
  string left = 1;
  string right = 2;
  string level = 3;
  repeated ImpactDiff impacts = 4;
  // impacts both flows see with the same content (left out of impacts)
  int32 identical = 5;
}

message GetChangeViewRequest {
  string change_id = 1;
  // flow or option (empty: the active option, else the main flow; "main": the main flow)
  string flow = 2;
  // written (default) | accepted | landed
  string level = 3;
}

message GetChangeViewResponse {
  // a baseline without an id below landed: computed, not stored
  Baseline baseline = 1;
}

message GetChangeGraphRequest {
  string change_id = 1;
  // flow or option (empty: the active option, else the main flow; "main": the main flow)
  string flow = 2;
}

message GetChangeGraphResponse {
  repeated Node nodes = 1;
  repeated Link links = 2;
}

// DecisionEvent is an event of a decision point (ADR 0009 §4).
message DecisionEvent {
  // open | rule | answer | ratify
  string op = 1;
  string point = 2;
  string question = 3;
  repeated string options = 4;
  repeated string criteria = 5;
  reserved 6, 7, 8, 9; // decider, threshold, max_rounds, deadline (now in policy, ADR 0067)
  string outcome = 10;
  string option = 11;
  double confidence = 12;
  string justification = 13;
  repeated string questions = 14;
  bool human = 15;
  string question_id = 16;
  string answer = 17;
  string process = 18;
  bool accept = 19;
  string comment = 20;
  string by = 21;
  // opaque policy values of the point, resolved at its opening (open only)
  google.protobuf.Struct policy = 22;
}

message Question {
  string id = 1;
  string point = 2;
  string text = 3;
  // open | answered
  string status = 4;
  string answer = 5;
  string answered_by = 6;
  // the process that investigated it
  string process = 7;
  google.protobuf.Timestamp asked_at = 8;
}

message Ruling {
  // decided | undecidable
  string outcome = 1;
  string option = 2;
  double confidence = 3;
  string justification = 4;
  string by = 5;
  bool human = 6;
  google.protobuf.Timestamp at = 7;
}

// DecisionPoint is a decision point replayed from its events.
message DecisionPoint {
  string id = 1;
  string question = 2;
  repeated string options = 3;
  repeated string criteria = 4;
  reserved 5, 6, 7, 8; // decider, threshold, max_rounds, deadline (now in policy, ADR 0067)
  google.protobuf.Timestamp opened_at = 9;
  string opened_by = 10;
  // open | blocked | ratifying | escalated | decided
  string status = 11;
  reserved 12; // rounds (now in policy)
  repeated Question questions = 13;
  Ruling ruling = 14;
  // why the policy reserved the point to a person (empty: not escalated)
  string escalation = 15;
  string option = 16;
  google.protobuf.Timestamp decided_at = 17;
  string decided_by = 18;
  // opaque policy values of the point, kept by the policy (ADR 0067)
  google.protobuf.Struct policy = 19;
  // only a person may rule the point now: by design or escalated
  bool human_only = 20;
}

message OpenDecisionRequest {
  string change_id = 1;
  string question = 2;
  // the options it chooses among; unset (with all_options) the open options of the change
  repeated string options = 3;
  bool all_options = 4;
  repeated string criteria = 5;
  reserved 6, 7, 8, 9; // decider, threshold, max_rounds, max_duration (now in policy)
  // the policy values the opener gives (who decides, a threshold, rounds, a duration): resolved by the graph's
  // decision policy (ADR 0067)
  google.protobuf.Struct policy = 10;
}

message OpenDecisionResponse {
  DecisionPoint point = 1;
}

message RuleDecisionRequest {
  string change_id = 1;
  // empty: the only pending point
  string point = 2;
  // decided | undecidable
  string outcome = 3;
  string option = 4;
  double confidence = 5;
  string justification = 6;
  repeated string questions = 7;
  // ruled by an agent of a process (the engine): below the threshold it waits for a ratification, and it is refused
  // on a point a person rules; unset, the caller rules as a person
  bool agent = 8;
}

message RuleDecisionResponse {
  DecisionPoint point = 1;
}

message AnswerQuestionRequest {
  string change_id = 1;
  string question = 2;
  string answer = 3;
  string process = 4;
}

message AnswerQuestionResponse {
  DecisionPoint point = 1;
}

message RatifyDecisionRequest {
  string change_id = 1;
  string point = 2;
  bool accept = 3;
  string comment = 4;
}

message RatifyDecisionResponse {
  DecisionPoint point = 1;
}

message ListDecisionPointsRequest {
  string change_id = 1;
}

message ListDecisionPointsResponse {
  repeated DecisionPoint points = 1;
}
