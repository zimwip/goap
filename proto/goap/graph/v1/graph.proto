syntax = "proto3";

package goap.graph.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// GraphService exposes the two axes of the knowledge graph: the domain axis
// (versioned nodes, version-to-version links, baselines) and the change axis
// (change sets and their items, i.e. the blackboards of agent processes).
service GraphService {
  // Domain axis
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  // CreateObject creates a data node typed by a NodeType of the metadata layer
  // (ADR 0012): the node and its instanceOf edge go through a change applied on main.
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);
  rpc CreateBaseline(CreateBaselineRequest) returns (CreateBaselineResponse);
  rpc ListBaselines(ListBaselinesRequest) returns (ListBaselinesResponse);
  rpc GetBaselineGraph(GetBaselineGraphRequest) returns (GetBaselineGraphResponse);

  // Change axis
  rpc CreateChange(CreateChangeRequest) returns (CreateChangeResponse);
  rpc GetChange(GetChangeRequest) returns (GetChangeResponse);
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  // Nodes a change is attached to (the versions it starts from), and the
  // changes a node is attached to (ADR 0014).
  rpc GetChangeNodes(GetChangeNodesRequest) returns (GetChangeNodesResponse);
  rpc ListNodeChanges(ListNodeChangesRequest) returns (ListNodeChangesResponse);
  rpc UpdateChange(UpdateChangeRequest) returns (UpdateChangeResponse);
  rpc AddItems(AddItemsRequest) returns (AddItemsResponse);
  rpc GetBlackboard(GetBlackboardRequest) returns (GetBlackboardResponse);
  rpc ApplyChange(ApplyChangeRequest) returns (ApplyChangeResponse);

  // Version branches (ADR 0009)
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);
  rpc SetBranchStatus(SetBranchStatusRequest) returns (SetBranchStatusResponse);
  rpc ListNodeVersions(ListNodeVersionsRequest) returns (ListNodeVersionsResponse);
  rpc PlanMerge(PlanMergeRequest) returns (PlanMergeResponse);
  rpc MergeBranch(MergeBranchRequest) returns (MergeBranchResponse);
  rpc GetDivergences(GetDivergencesRequest) returns (GetDivergencesResponse);
  rpc RebaseChange(RebaseChangeRequest) returns (RebaseChangeResponse);
  // Completes a merge_pending change: merges its branch into the branch it forked from.
  rpc MergeChange(MergeChangeRequest) returns (MergeChangeResponse);
  // Nodes the change shares with other open changes (a merge will be needed).
  rpc GetSharedNodes(GetSharedNodesRequest) returns (GetSharedNodesResponse);
  // Pre/post view of the impacts of a change, with the maturity state of both sides.
  rpc GetImpacts(GetImpactsRequest) returns (GetImpactsResponse);
  // Splits a change along organisational boundaries: one sub-change per unit owning impacted nodes.
  rpc SplitChange(SplitChangeRequest) returns (SplitChangeResponse);
  rpc ListSubChanges(ListSubChangesRequest) returns (ListSubChangesResponse);
  // Action flow branches: a relaunched step forks the flow, a human adopts or discards the branch.
  rpc OpenFlow(OpenFlowRequest) returns (OpenFlowResponse);
  rpc AdoptFlow(AdoptFlowRequest) returns (AdoptFlowResponse);
  rpc DiscardFlow(DiscardFlowRequest) returns (DiscardFlowResponse);
  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse);
  // Applies the proposals of a flow on a graph branch of its own (a preview, merged when the flow is adopted).
  rpc MaterializeFlow(MaterializeFlowRequest) returns (MaterializeFlowResponse);
  // Consistency check of the blackboard as a process on a flow sees it.
  rpc ValidateBoard(ValidateBoardRequest) returns (ValidateBoardResponse);

  // Execution journal (ADR 0011)
  rpc RecordExecutions(RecordExecutionsRequest) returns (RecordExecutionsResponse);
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
}

message NodeRef {
  string id = 1;
  int32 version = 2;
}

message Node {
  string id = 1;
  int32 version = 2;
  string key = 3;
  string type = 4;
  google.protobuf.Struct props = 5;
  bool deleted = 6;
  string change_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // branch of the version (main by default)
  string branch = 9;
  // versions this one descends from (two for a merge)
  repeated int32 parents = 10;
  // create | revise | derive | merge
  string reason = 11;
  // state in the lifecycle of the node type (empty: none)
  string state = 12;
  // namespace of the node (default sdlc)
  string namespace = 13;
}

message Link {
  string id = 1;
  string type = 2;
  NodeRef from = 3;
  NodeRef to = 4;
  google.protobuf.Struct props = 5;
  string change_id = 6;
}

message NodeView {
  Node node = 1;
  int32 latest = 2;
  repeated Link out = 3;
  repeated Link in = 4;
  // the node has a lifecycle and its state is not editable
  bool frozen = 5;
}

message Baseline {
  string id = 1;
  string name = 2;
  string parent_id = 3;
  string change_id = 4;
  map<string, int32> nodes = 5;
  google.protobuf.Timestamp created_at = 6;
  string branch = 7;
}

message Endpoint {
  NodeRef node = 1;
  string item = 2;
}

message NodeDraft {
  NodeRef base = 1;
  string key = 2;
  string type = 3;
  google.protobuf.Struct props = 4;
  // merge_node: merged version and common ancestor
  NodeRef from = 5;
  NodeRef ancestor = 6;
  // transition_node: target lifecycle state
  string state = 7;
  // created node namespace (empty: the change namespace)
  string namespace = 8;
}

message LinkDraft {
  string link_id = 1;
  string type = 2;
  Endpoint from = 3;
  Endpoint to = 4;
  google.protobuf.Struct props = 5;
}

message Proposal {
  // create_node | update_node | delete_node | add_link | remove_link | merge_node
  string op = 1;
  NodeDraft node = 2;
  LinkDraft link = 3;
}

message Decision {
  string item = 1;
  bool accept = 2;
  string comment = 3;
}

message ChangeItem {
  string id = 1;
  // impact | proposal | decision | artifact | merge
  string kind = 2;
  string type = 3;
  string status = 4;
  NodeRef target = 5;
  Proposal proposal = 6;
  Decision decision = 7;
  google.protobuf.Struct data = 8;
  string produced_by = 9;
  repeated string derived_from = 10;
  google.protobuf.Timestamp created_at = 11;
  // items replaced by this one (rebase, merge)
  repeated string supersedes = 12;
  // journal record of the action execution that produced the item
  string execution = 13;
  // impact: the "post" side (target is the "pre" version)
  Endpoint post = 14;
  // flow branch that produced the item; flow_event on kind = flow
  string flow = 15;
  FlowEvent flow_event = 16;
}

message ChangeSet {
  string id = 1;
  string title = 2;
  string intent = 3;
  string methodology = 4;
  string goal = 5;
  string status = 6;
  string baseline_id = 7;
  string result_baseline_id = 8;
  google.protobuf.Struct data = 9;
  repeated ChangeItem items = 10;
  google.protobuf.Timestamp created_at = 11;
  string branch = 12;
  // namespace the change acts on (default sdlc)
  string namespace = 13;
  // sub-change: the parent change and the responsible OrgUnit key
  string parent_id = 14;
  string owner_org = 15;
  reserved 16;
}

message CreateNodeRequest {
  string key = 1;
  string type = 2;
  google.protobuf.Struct props = 3;
  string namespace = 4;
}

message CreateNodeResponse {
  Node node = 1;
}

message CreateObjectRequest {
  string methodology = 1;
  string node_type = 2;
  string key = 3;
  google.protobuf.Struct props = 4;
  // namespace of the created object (default sdlc)
  string namespace = 5;
}

message CreateObjectResponse {
  Node node = 1;
  Baseline baseline = 2;
}

message UpdateNodeRequest {
  NodeRef base = 1;
  google.protobuf.Struct props = 2;
}

message UpdateNodeResponse {
  Node node = 1;
}

message GetNodeRequest {
  // version 0 = latest
  NodeRef ref = 1;
  // alternative to ref: latest version of the node with this key
  string key = 2;
  // namespace of key (default sdlc)
  string namespace = 3;
}

message GetNodeResponse {
  NodeView view = 1;
}

message CreateLinkRequest {
  string type = 1;
  NodeRef from = 2;
  NodeRef to = 3;
  google.protobuf.Struct props = 4;
}

message CreateLinkResponse {
  Link link = 1;
}

message CreateBaselineRequest {
  string name = 1;
  repeated NodeRef nodes = 2;
  // snapshot the latest version of every node
  bool all_latest = 3;
}

message CreateBaselineResponse {
  Baseline baseline = 1;
}

message ListBaselinesRequest {}

message ListBaselinesResponse {
  repeated Baseline baselines = 1;
}

message GetBaselineGraphRequest {
  string id = 1;
}

message GetBaselineGraphResponse {
  Baseline baseline = 1;
  repeated Node nodes = 2;
  repeated Link links = 3;
  repeated Link suspect_links = 4;
}

message CreateChangeRequest {
  string title = 1;
  string intent = 2;
  string methodology = 3;
  string baseline_id = 4;
  google.protobuf.Struct data = 5;
  // branch the change applies to (default main)
  string branch = 6;
  // namespace the change acts on (default sdlc)
  string namespace = 7;
  // give the change a branch of its own, merged into `branch` when applied
  bool own_branch = 8;
  // make the change a sub-change of another one (namespace, branch and baseline follow the parent)
  string parent_id = 9;
  // key of the responsible OrgUnit (organisation namespace)
  string owner_org = 10;
  reserved 11;
}

message CreateChangeResponse {
  ChangeSet change = 1;
}

message GetChangeRequest {
  string id = 1;
}

message GetChangeResponse {
  ChangeSet change = 1;
}

message ListChangesRequest {}

message ListChangesResponse {
  repeated ChangeSet changes = 1;
}

message UpdateChangeRequest {
  string id = 1;
  optional string goal = 2;
  optional string status = 3;
  google.protobuf.Struct data = 4;
}

message UpdateChangeResponse {
  ChangeSet change = 1;
}

message AddItemsRequest {
  string change_id = 1;
  repeated ChangeItem items = 2;
}

message AddItemsResponse {
  repeated ChangeItem items = 1;
}

message GetBlackboardRequest {
  string change_id = 1;
  // flow branch the caller runs on (empty: the main flow)
  string flow = 2;
}

message GetBlackboardResponse {
  ChangeSet change = 1;
  repeated NodeView nodes = 2;
  repeated Node neighbors = 3;
}

message ApplyChangeRequest {
  string change_id = 1;
  string baseline_name = 2;
}

message ApplyChangeResponse {
  Baseline baseline = 1;
}

message Branch {
  string name = 1;
  string parent = 2;
  string fork_baseline = 3;
  string head = 4;
  // change / option that opened the branch
  string origin = 5;
  // open | merged | abandoned
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateBranchRequest {
  string name = 1;
  string from_baseline = 2;
  string origin = 3;
}

message CreateBranchResponse {
  Branch branch = 1;
}

message ListBranchesRequest {}

message ListBranchesResponse {
  repeated Branch branches = 1;
}

message GetBranchRequest {
  string name = 1;
}

message GetBranchResponse {
  Branch branch = 1;
  Baseline head = 2;
}

message SetBranchStatusRequest {
  string name = 1;
  string status = 2;
}

message SetBranchStatusResponse {}

message ListNodeVersionsRequest {
  string id = 1;
}

message ListNodeVersionsResponse {
  repeated Node versions = 1;
}

message MergeCandidate {
  string node = 1;
  string key = 2;
  string type = 3;
  // added | fast_forward | merge
  string kind = 4;
  NodeRef ancestor = 5;
  NodeRef ours = 6;
  NodeRef theirs = 7;
  bool deleted = 8;
  google.protobuf.Struct base = 9;
  google.protobuf.Struct ours_props = 10;
  google.protobuf.Struct theirs_props = 11;
  google.protobuf.Struct merged = 12;
  repeated string conflicts = 13;
}

message MergePlan {
  string from = 1;
  string into = 2;
  string into_head = 3;
  repeated MergeCandidate candidates = 4;
}

message PlanMergeRequest {
  string from = 1;
  string into = 2;
}

message PlanMergeResponse {
  MergePlan plan = 1;
}

message Resolution {
  google.protobuf.Struct props = 1;
  // keep the target version unchanged
  bool skip = 2;
}

message MergeBranchRequest {
  string from = 1;
  string into = 2;
  string title = 3;
  // by node id
  map<string, Resolution> resolutions = 4;
}

message MergeBranchResponse {
  ChangeSet change = 1;
  Baseline baseline = 2;
  MergePlan plan = 3;
}

message Divergence {
  string item = 1;
  string op = 2;
  // base | from | to
  string role = 3;
  NodeRef base = 4;
  NodeRef head = 5;
  bool head_deleted = 6;
  google.protobuf.Struct theirs = 7;
  google.protobuf.Struct ours = 8;
  google.protobuf.Struct merged = 9;
  repeated string conflicts = 10;
}

message GetDivergencesRequest {
  string change_id = 1;
}

message GetDivergencesResponse {
  repeated Divergence divergences = 1;
}

message RebaseChangeRequest {
  string change_id = 1;
  // resolved properties by item id
  map<string, google.protobuf.Struct> resolutions = 2;
}

message RebaseChangeResponse {
  ChangeSet change = 1;
  // replaced item id -> replacement id ("" when dropped)
  map<string, string> superseded = 2;
  repeated Divergence divergences = 3;
}

message ModelCall {
  string provider = 1;
  string model = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 duration_ms = 5;
  string error = 6;
}

message ToolUse {
  string name = 1;
  int64 duration_ms = 2;
  string error = 3;
}

// ExecutionRecord is one entry of the execution journal of a change: a tick
// (observe + plan), an action execution, a human decision, a process start / end.
message ExecutionRecord {
  string id = 1;
  string change_id = 2;
  string process_id = 3;
  string parent_process_id = 4;
  int32 seq = 5;
  // process.started | tick | action | approval | process.ended
  string kind = 6;
  string methodology = 7;
  string methodology_version = 8;
  string agent = 9;
  string planner = 10;
  string goal = 11;
  string status = 12;
  int32 step = 13;
  string action = 14;
  string action_kind = 15;
  string specialization = 16;
  repeated string plan = 17;
  map<string, bool> before = 18;
  map<string, bool> after = 19;
  optional bool effects_met = 20;
  repeated string items = 21;
  int64 input_tokens = 22;
  int64 output_tokens = 23;
  repeated ModelCall model_calls = 24;
  repeated ToolUse tool_calls = 25;
  string actor = 26;
  string output = 27;
  string error = 28;
  string trace_id = 29;
  string span_id = 30;
  google.protobuf.Struct data = 31;
  google.protobuf.Timestamp started_at = 32;
  google.protobuf.Timestamp ended_at = 33;
  int64 duration_ms = 34;
  // the step reads the blackboard and extends it: node versions it started from,
  // and the item count of the change before / after it
  repeated NodeRef reads = 35;
  int32 board_before = 36;
  int32 board_after = 37;
  // last item of the flow before the step: where a relaunch of the step forks
  string board_last = 38;
}

message RecordExecutionsRequest {
  repeated ExecutionRecord records = 1;
}

message RecordExecutionsResponse {}

message ListExecutionsRequest {
  string change_id = 1;
  repeated string process_ids = 2;
}

message ListExecutionsResponse {
  repeated ExecutionRecord records = 1;
}

message GetChangeNodesRequest {
  string change_id = 1;
}

message GetChangeNodesResponse {
  repeated NodeRef nodes = 1;
}

message ListNodeChangesRequest {
  string node_id = 1;
}

message ListNodeChangesResponse {
  // headers only (no items)
  repeated ChangeSet changes = 1;
}

message MergeChangeRequest {
  string change_id = 1;
  // by node id
  map<string, Resolution> resolutions = 2;
}

message MergeChangeResponse {
  ChangeSet change = 1;
}

message GetSharedNodesRequest {
  string change_id = 1;
}

message SharedNode {
  NodeRef node = 1;
  string key = 2;
  repeated string changes = 3;
}

message GetSharedNodesResponse {
  repeated SharedNode nodes = 1;
}

message GetImpactsRequest {
  string change_id = 1;
}

message Impact {
  string item = 1;
  string key = 2;
  string type = 3;
  // pre: version of the reference baseline (empty for a created node)
  NodeRef pre = 4;
  string pre_state = 5;
  // post: version on the change branch (empty until it exists)
  NodeRef post = 6;
  string post_state = 7;
}

message GetImpactsResponse {
  repeated Impact impacts = 1;
}

message SplitChangeRequest {
  string change_id = 1;
}

message SplitChangeResponse {
  // the sub-changes created by this call
  repeated ChangeSet changes = 1;
}

message ListSubChangesRequest {
  string change_id = 1;
}

message ListSubChangesResponse {
  repeated ChangeSet changes = 1;
}

message FlowEvent {
  // open | adopt | discard
  string op = 1;
  string flow = 2;
  string parent = 3;
  string fork_after = 4;
  int32 from_step = 5;
  string execution = 6;
  string process = 7;
  string reason = 8;
  repeated string stale = 9;
  string by = 10;
  // materialize: domain branch and the proposals applied on it; adopt: merged into the change branch
  string branch = 11;
  repeated string items = 12;
  bool merged = 13;
  map<string, string> nodes = 14;
}

// Flow is a flow branch of a change, replayed from its events.
message Flow {
  string id = 1;
  string parent = 2;
  string fork_after = 3;
  int32 from_step = 4;
  string execution = 5;
  string process = 6;
  string reason = 7;
  // open | adopted | discarded
  string status = 8;
  // items the relaunched step invalidated (stale while open, superseded once adopted)
  repeated string stale = 9;
  google.protobuf.Timestamp opened_at = 10;
  google.protobuf.Timestamp decided_at = 11;
  string decided_by = 12;
  // domain (graph) branch the flow was last materialized on, every branch it used, the proposals
  // applied there, and the ones already merged into the change branch (adopted flow)
  string branch = 13;
  repeated string branches = 14;
  repeated string materialized = 15;
  repeated string merged = 16;
  // adopted flows that replace the same items: an open flow that competes cannot be adopted
  repeated string competes_with = 17;
}

message OpenFlowRequest {
  string change_id = 1;
  string parent = 2;
  string fork_after = 3;
  repeated string seeds = 4;
  int32 from_step = 5;
  string execution = 6;
  string process = 7;
  string reason = 8;
  // comment for the agent, recorded on the branch and read by the relaunched steps
  string guidance = 9;
  string by = 10;
}

message OpenFlowResponse {
  Flow flow = 1;
}

message AdoptFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message AdoptFlowResponse {
  Flow flow = 1;
}

message DiscardFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message DiscardFlowResponse {
  Flow flow = 1;
}

message ListFlowsRequest {
  string change_id = 1;
}

message ListFlowsResponse {
  repeated Flow flows = 1;
}

message BoardIssue {
  // item where the problem shows, and the item to blame (relaunch the step that produced it)
  string item = 1;
  string culprit = 2;
  // structure | dangling | derived_from_invalid | reference | outdated | rule | impact | duplicate
  string code = 3;
  string message = 4;
  // error | warning
  string severity = 5;
}

message ValidateBoardRequest {
  string change_id = 1;
  // flow branch (empty: the main flow)
  string flow = 2;
}

message ValidateBoardResponse {
  repeated BoardIssue issues = 1;
}

message MaterializeFlowRequest {
  string change_id = 1;
  string flow = 2;
}

message MaterializeFlowResponse {
  Flow flow = 1;
}
