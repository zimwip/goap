<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>GOAP</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa5ff"/>
      <stop offset="0.45" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#0a1e3f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d86ff"/>
      <stop offset="1" stop-color="#1450c0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- painted back to front: the tip coming out behind the target, the target, then the shaft in front -->
  <path d="M38 26 L46 18" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M57 7 L52.5 22.5 L48.5 18.5 L45.5 15.5 L41.5 11.5 Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- the target, turned three quarters away: its edge, then its face -->
  <g transform="translate(30 34) rotate(-12) scale(0.76 1)">
    <circle cx="4.5" r="21" fill="#0a2a63"/>
    <circle r="21" fill="url(#face)"/>
    <g fill="none" stroke="#fff">
      <circle r="17.5" stroke-width="3.6" stroke-opacity="0.6"/>
      <circle r="10.5" stroke-width="3.6" stroke-opacity="0.85"/>
    </g>
    <circle r="4.4" fill="#fff"/>
    <circle r="2" fill="#0a2a63" fill-opacity="0.55"/>
  </g>
  <!-- speed lines behind the arrow -->
  <g stroke="url(#trail)" stroke-linecap="round" fill="none">
    <path d="M4 46 L15 35" stroke-width="2.2"/>
    <path d="M17 60 L27 50" stroke-width="2.2"/>
    <path d="M6 56 L13 49" stroke-width="2.6"/>
  </g>
  <!-- the shaft in front, sunk into the bullseye, and its fletching -->
  <path d="M14 50 L30 34" stroke="#0a1e3f" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  <path d="M14 50 L30 34" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M10.5 47.5 L17.5 47.5 L17.5 54.5 M14.5 43.5 L21.5 43.5 L21.5 50.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
