name: methodology-improvement
version: 1.4.0
namespace: methodology
description: >
  Platform self-observation: at the end of each process, an agent analyzes the
  execution journal (planning ticks, actions, LLM and tool calls) and the
  OpenTelemetry traces of the run, spots the elements that are too costly
  (loops, failures, LLM calls where the action is systematizable, slow
  points) and proposes improvements to the methodology: specializations,
  agent definitions, new actions, MCP tools. Accepted proposals become a new
  draft version of the methodology.

# who may run what (ADR 0043): the review of the proposals is a methodologist's; the observer itself runs as a
# service identity administering the platform (its triggers' roles: drafting a methodology is administration).
roles:
  - {name: methodologist, description: Reviews the improvements proposed to a methodology}

conditions:
  - name: analyzed
    description: The cost of the observed run has been analyzed (journal + traces)
    expr: artifacts.exists(a, a.type == "cost_report")
  - name: has_findings
    description: The analysis found pain points
    expr: artifacts.exists(a, a.type == "cost_report" && size(a.data.findings) > 0)
  - name: proposed
    description: Improvements have been proposed (or the analysis found none)
    expr: artifacts.exists(a, a.type == "improvement_plan")
  - name: reviewed
    description: Every improvement (change impact on an element of the methodology) has received a decision
    expr: size(changeImpacts) > 0 && changeImpacts.all(n, n.review != "proposed")
  - name: drafted
    description: The accepted improvements are integrated into a draft of the methodology
    expr: artifacts.exists(a, a.type == "methodology_draft")
  - name: settled
    description: >
      The observation is closed: a draft was produced, or there is nothing to
      improve (no findings, or no proposal) — the goal is then reached as soon
      as the analysis is done.
    expr: >
      artifacts.exists(a, a.type == "methodology_draft")
      || artifacts.exists(a, a.type == "cost_report" && size(a.data.findings) == 0)
      || (artifacts.exists(a, a.type == "improvement_plan") && size(changeImpacts) == 0)

actions:
  - name: analyze_run
    kind: builtin
    builtin: observe.analyze
    description: >
      Analyze the observed run: execution journal of the change (and its
      sub-agents), OpenTelemetry spans of its trace; per-action statistics and
      findings.
    
    effects: {analyzed: true}
    cost: 1

  - name: propose_improvements
    kind: abstract
    description: Propose improvements to the methodology from the findings (change impacts on its elements)
    pre: {analyzed: true}
    effects: {proposed: true}
    cost: 1

  - name: propose_by_rules
    kind: builtin
    builtin: observe.propose
    specializes: propose_improvements
    description: >
      Rules: specialize a regular-output LLM action with a script, use a
      faster model for a costly LLM action, raise the cost of a looping
      action, remove a disabled action from an agent, request an MCP tool for
      a slow point.

  - name: propose_with_llm
    kind: llm
    specializes: propose_improvements
    when: vars.llm_review == true
    priority: 10
    model: reasoning
    description: LLM analysis of the cost report (enable with the llm_review variable)
    prompt: |
      You are improving an enterprise methodology run by GOAP agents.
      Here is the cost report of a run (journal + traces):
      {{range .Artifacts}}{{if eq .Type "cost_report"}}{{json .Data}}{{end}}{{end}}

      Propose changes to the elements of the observed methodology version (definition nodes with key
      "MV:<methodology>@<version>/<action|agent|goal|condition>/<name>"), each as a change impact
      declared then written:
      - a modified action (kind, model, cost, prompt, code…) or agent (actions, planner):
        {"kind":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<element key>","rationale":"<title>: <why>"}}
        {"kind":"changeImpact","changeImpact":{"op":"write","node":"<element key>","props":{...changed properties}}}
      - a created methodology@Action with "specializes" (a script systematizing an LLM call), or a created methodology@ToolRequest
        for an MCP tool to be created (name, description, motivation):
        {"kind":"changeImpact","changeImpact":{"op":"declare","intent":"created","type":"methodology@Action","key":"<new key>","rationale":"<title>: <why>"}}
        {"kind":"changeImpact","changeImpact":{"op":"write","node":"<new key>","props":{...}}}
      Finish with an artifact of type "improvement_plan" with data.notes (a list of remarks).

  - name: review_improvements
    kind: human
    description: Review of improvement proposals by a methodologist
    roles: [methodologist]
    instructions: >
      Accept or reject each improvement (a comment is required). Accepted
      improvements will be integrated into a new draft version of the methodology,
      to be published from the editor.
    pre: {proposed: true}
    effects: {reviewed: true}
    cost: 1

  - name: draft_methodology
    kind: builtin
    builtin: methodology.draft
    description: Create the new draft version of the methodology with the accepted proposals
    pre: {reviewed: true}
    effects: {drafted: true, settled: true}
    permission: methodology:write
    cost: 1

goals:
  - name: improve_methodology
    description: Make the methodology less costly based on its executions
    examples:
      - analyze the cost of a run
      - improve the methodology from its executions
      - find the pain points of an agent
    pre: {settled: true}
    value: 10

agents:
  - name: observer
    description: Observes completed runs and proposes to improve their methodology
    examples:
      - why did this process cost so much
      - improve the methodology from its executions
    planner: goap
    triggers:
      - name: on_process_end
        description: Observe every completed root process (excluding self-observation)
        type: event
        event: process.completed
        filter: event.process.methodology != "methodology-improvement" && event.process.parent == ""
        goal: improve_methodology
        roles: [admin]
        enabled: true
      - name: on_process_failure
        description: Observe failed processes
        type: event
        event: process.failed
        filter: event.process.methodology != "methodology-improvement" && event.process.parent == ""
        goal: improve_methodology
        roles: [admin]
        enabled: true
      - name: on_process_stuck
        description: Observe stuck processes (no plan reaches the goal)
        type: event
        event: process.stuck
        filter: event.process.methodology != "methodology-improvement" && event.process.parent == ""
        goal: improve_methodology
        roles: [admin]
        enabled: true
