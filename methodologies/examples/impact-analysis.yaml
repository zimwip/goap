name: impact-analysis
version: 1.2.0
description: >
  Impact analysis of a change on a requirements repository: identification of
  impacted elements, propagation along traceability links, update proposals
  and human review.

namespace: alm

conditions:
  - name: has_impacts
    description: At least one element of the reference graph is impacted
    expr: changeImpacts.exists(n, n.intent == "modified")
  - name: propagated
    description: Impacts have been propagated along traceability links
    expr: artifacts.exists(a, a.type == "propagation")
  - name: reported
    description: An impact report has been written
    expr: artifacts.exists(a, a.type == "report")
  - name: reviewed
    description: All the change impacts (impacts, updates, new tests) have received a decision
    expr: size(changeImpacts) > 0 && changeImpacts.all(n, n.review != "proposed")
  - name: applied
    description: The change has been applied to the repository (new baseline)
    expr: change.status == "applied"

actions:
  - name: identify_impacts
    kind: llm
    description: Identify the elements directly impacted by the change intent
    
    effects: {has_impacts: true}
    cost: 2
    model: default
    prompt: |
      You are an impact analyst. Change intent:
      "{{ .Change.Intent }}"

      Repository elements (key, type, properties):
      {{ range .Baseline.Nodes }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}
      Identify the elements DIRECTLY impacted. For each one, declare a change impact
      {"kind":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<key>","rationale":"why it is impacted"}}.

  - name: select_impacts
    kind: human
    description: Manual selection of impacted elements (fallback if automatic analysis is not possible)
    
    effects: {has_impacts: true}
    cost: 8
    instructions: Indicate the elements of the repository directly impacted by the change, and why.

  - name: propagate_impacts
    kind: builtin
    builtin: graph.propagate
    description: Propagate impacts to linked elements (tests, components, derived requirements)
    pre: {has_impacts: true}
    effects: {propagated: true}
    cost: 1
    params:
      maxDepth: 3
      # an impact on the target of a link propagates to its source
      linkTypes: [alm@verifies, alm@implements, alm@satisfies]

  - name: propose_requirement_updates
    kind: llm
    description: Propose a new version of each impacted requirement
    pre: {propagated: true}
    cost: 3
    model: default
    expects:
      forEach: changeImpacts
      where: x.type == "alm@Requirement"
      produce: {op: update_node}
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted requirements:
      {{ range .ChangeImpacts }}{{ if eq .Type "alm@Requirement" }}- {{ .Key }} {{ json .Pre.Properties }} (reason: {{ .Rationale }})
      {{ end }}{{ end }}
      For each requirement, write its new version:
      {"kind":"changeImpact","changeImpact":{"op":"write","node":"<key>","props":{...}}}

  - name: propose_tests
    kind: llm
    description: Create a new test case for each impacted requirement
    # after the requirements are updated: the test cases verify their new versions
    pre: {propagated: true, "expect:propose_requirement_updates": true}
    cost: 3
    model: default
    expects:
      forEach: changeImpacts
      where: x.type == "alm@Requirement"
      produce: {op: create_node, nodeType: alm@TestCase}
      link: {type: alm@verifies}
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted requirements:
      {{ range .ChangeImpacts }}{{ if eq .Type "alm@Requirement" }}- {{ .Key }} {{ json .Post.Properties }}
      {{ end }}{{ end }}
      For each requirement, create a test case and link it to the requirement:
      {"kind":"changeImpact","changeImpact":{"op":"declare","ref":"#t1","intent":"created","type":"alm@TestCase","key":"TST-...","rationale":"why"}}
      {"kind":"changeImpact","changeImpact":{"op":"write","node":"#t1","props":{"title":"..."},"links":[{"type":"alm@verifies","to":"<requirement key>"}]}}

  - name: write_report
    kind: llm
    description: Write the impact report
    pre: {propagated: true}
    effects: {reported: true}
    cost: 1
    model: fast
    prompt: |
      Intent: "{{ .Change.Intent }}"
      Impacts:
      {{ range .ChangeImpacts }}{{ if eq .Intent "modified" }}- {{ .Key }} ({{ .Type }}) : {{ .Rationale }}
      {{ end }}{{ end }}
      Write a concise report: {"kind":"artifact","type":"report","data":{"markdown":"..."}}

  - name: review_proposals
    kind: human
    description: Review of the change impacts (accept / reject)
    pre: {"expect:propose_requirement_updates": true, "expect:propose_tests": true}
    effects: {reviewed: true}
    cost: 2
    instructions: Accept or reject each change impact (impacts, updated requirements, new tests); a comment is required.

  - name: apply_change
    kind: builtin
    builtin: graph.apply
    description: Apply the validated change to the repository (creates the resulting baseline)
    pre: {reviewed: true}
    effects: {applied: true}
    cost: 1
    # without this permission, the initiator must obtain an approver's approval
    permission: change:apply

goals:
  - name: assess_impact
    description: Assess the impact of a change and produce a report, without modifying the repository
    examples:
      - what is the impact
      - what does this break
      - impact analysis
    pre: {propagated: true, reported: true}
    value: 10
  - name: prepare_change
    description: Prepare the repository change (updated requirements and tests) and have it validated
    examples:
      - update the requirements
      - prepare the change
      - propose the changes
    pre: {"expect:propose_requirement_updates": true, "expect:propose_tests": true, reviewed: true}
    value: 20
  - name: deliver_change
    description: Prepare, validate, then apply the change to the repository
    examples:
      - apply the change
      - deliver the change
      - put the repository into production
    pre: {reviewed: true, applied: true}
    value: 30
