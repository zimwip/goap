name: test-design
version: 1.3.0
description: >
  Design and review of a test campaign from the repository's requirements.
  Example of agents (goap, utility and hybrid planners), script actions
  (JavaScript and Go) and delegation to sub-agents.

namespace: alm

# who may run what (ADR 0043): a project member holding one of these roles, granted by an Assignment
roles:
  - {name: test_designer, description: Designs the test cases of a campaign}
  - {name: test_reviewer, description: Reviews the designed test cases}

conditions:
  - name: has_scope
    description: The requirements to cover are identified
    expr: size(changeImpacts) > 0
  - name: tests_designed
    description: At least one test case is created by the change
    expr: changeImpacts.exists(n, n.intent == "created" && n.type == "alm@TestCase")
  - name: summarized
    description: A summary of the campaign is written
    expr: artifacts.exists(a, a.type == "summary")
  - name: reviewed
    description: All the test cases have received a decision
    expr: changeImpacts.exists(n, n.intent == "created") && changeImpacts.filter(n, n.intent == "created").all(n, n.review != "proposed")
  - name: pinger_ready
    description: A human let the pinger proceed
    expr: artifacts.exists(a, a.type == "go")
  - name: pinger_pinged
    description: The pinger sent its progress signal to its parent
    expr: has(vars.pinged) && vars.pinged == true
  - name: pinger_wrapped
    description: A human let the pinger finish
    expr: artifacts.exists(a, a.type == "wrapped")
  - name: ping_done
    description: The watcher's sub-agent call to the pinger has returned
    expr: has(vars.childStatus)

actions:
  - name: collect_scope
    kind: script
    language: javascript
    description: Retain the repository's requirements as the scope of the campaign
    pre: {has_scope: false}
    effects: {has_scope: true}
    code: |
      function run(ctx) {
        const reqs = ctx.nodes("alm@Requirement");
        for (const r of reqs) ctx.impactNode(r.key, "in the scope of the campaign");
        ctx.log(reqs.length + " requirement(s) retained");
        return reqs.length + " requirement(s)";
      }

  - name: design_tests
    kind: script
    language: go
    description: Create one test case per requirement in scope
    pre: {has_scope: true, tests_designed: false}
    effects: {tests_designed: true}
    code: |
      package action

      import (
      	"fmt"

      	"github.com/zimwip/goap/pkg/dsl"
      )

      func Run(ctx *dsl.Ctx) error {
      	for _, n := range ctx.ChangeImpacts() {
      		if n.Pre == nil || n.Type != "alm@Requirement" || n.Intent != "modified" {
      			continue
      		}
      		title := fmt.Sprintf("Verify %s: %v", n.Key, n.Pre.Props["title"])
      		t := ctx.CreateNode("alm@TestCase", "TC-"+n.Key, "verifies "+n.Key)
      		ctx.WriteNode(t, map[string]any{
      			"props": map[string]any{"title": title},
      			"links": []any{map[string]any{"type": "alm@verifies", "to": n.Key}},
      		})
      	}
      	return nil
      }

  - name: summarize
    kind: script
    language: javascript
    description: Write the campaign summary with the LLM
    pre: {tests_designed: true, summarized: false}
    effects: {summarized: true}
    code: |
      const tests = ctx.changeImpacts().filter(n => n.intent === "created");
      const r = ctx.complete({
        model: "fast",
        prompt: "Summarize in three lines a campaign of " + tests.length + " test cases: " +
                tests.map(t => t.post ? t.post.props.title : t.key).join("; "),
      });
      ctx.addArtifact("summary", { markdown: r.text, tests: tests.length });

  - name: auto_review
    kind: script
    language: javascript
    description: Automatically accept the test cases (small campaigns)
    pre: {tests_designed: true, reviewed: false}
    effects: {reviewed: true}
    utility: 'has(vars.review) && vars.review == "human" ? 0.1 : 0.9'
    code: |
      for (const n of ctx.changeImpacts()) {
        if (n.intent === "created" && n.review === "proposed") ctx.reviewNode(n.key, true, "automatic review");
      }

  - name: human_review
    kind: human
    description: Human review of the test cases
    roles: [test_reviewer]
    pre: {tests_designed: true, reviewed: false}
    effects: {reviewed: true}
    utility: "0.5"
    instructions: Accept or reject each proposed test case (a comment is required).

  - name: delegate
    kind: script
    language: javascript
    description: Have the specialized agents design then review the campaign
    pre: {reviewed: false}
    effects: {tests_designed: true, summarized: true, reviewed: true}
    code: |
      const design = ctx.runAgent("test-designer", "design the test cases");
      if (design.status !== "completed") throw new Error("design: " + design.status);
      const review = ctx.runAgent("reviewer", "review the test cases");
      if (review.status !== "completed") throw new Error("review: " + review.status);
      ctx.log("campaign designed and reviewed");

  - name: wait_ready
    kind: human
    description: Wait for a human to let the pinger proceed
    pre: {pinger_ready: false}
    effects: {pinger_ready: true}
    instructions: Submit an artifact of type "go".

  - name: ping
    kind: script
    language: javascript
    description: Signal progress to the parent process, then wait to finish
    pre: {pinger_ready: true, pinger_pinged: false}
    effects: {pinger_pinged: true}
    code: |
      ctx.signal("progress", { note: "halfway" }, ctx.parentID());
      ctx.setVar("pinged", true);

  - name: wait_wrap
    kind: human
    description: Wait for a human to let the pinger finish
    pre: {pinger_pinged: true, pinger_wrapped: false}
    effects: {pinger_wrapped: true}
    instructions: Submit an artifact of type "wrapped".

  - name: wait_for_ping
    kind: script
    language: javascript
    description: Start the pinger and wake early on its progress signal
    pre: {ping_done: false}
    effects: {ping_done: true}
    code: |
      ctx.wakeOn("progress");
      const r = ctx.runAgent("pinger", "notify the parent step by step");
      ctx.setVar("childStatus", r.status);
      ctx.log("child status: " + r.status);

goals:
  - name: designed
    description: Design the test cases and their summary
    pre: {tests_designed: true, summarized: true}
    value: 10
  - name: review
    description: Review the test cases
    pre: {reviewed: true}
    value: 10
  - name: delivered
    description: Design, summarize and get a test campaign validated
    pre: {tests_designed: true, summarized: true, reviewed: true}
    value: 20
  - name: notified
    description: The pinger has sent its progress signal and finished
    pre: {pinger_pinged: true, pinger_wrapped: true}
    value: 10
  - name: pinged_back
    description: The watcher started the pinger and got its result
    pre: {ping_done: true}
    value: 10

agents:
  - name: test-designer
    description: Test designer
    examples: [design the test cases, write tests]
    planner: goap
    actions: [collect_scope, design_tests, summarize]
    goals: [designed]
    triggers:
      - name: nightly
        description: Nightly design on the latest repository
        type: schedule
        schedule: "0 2 * * *"
        goal: designed
        roles: [test_designer]
        enabled: false
  - name: reviewer
    description: Test campaign reviewer
    examples: [review the test cases, validate the tests]
    planner: utility
    actions: [auto_review, human_review]
    goals: [review]
    triggers:
      - name: after_design
        description: Automatically review a completed design (outside delegation)
        type: event
        event: process.completed
        filter: event.process.agent == "test-designer" && event.process.parent == ""
        target: event_change
        goal: review
        roles: [test_designer]
        enabled: true
  - name: coordinator
    description: Test campaign coordinator
    examples: [prepare and validate the test campaign, complete test campaign]
    planner: hybrid
    actions: [delegate]
    goals: [delivered]
  - name: pinger
    description: Sends a progress signal to its parent before finishing
    examples: [notify the parent step by step]
    planner: goap
    actions: [wait_ready, ping, wait_wrap]
    goals: [notified]
  - name: watcher
    description: Starts a pinger and wakes early on its progress signal
    examples: [watch a pinger and wake on its signal]
    planner: hybrid
    actions: [wait_for_ping]
    goals: [pinged_back]
