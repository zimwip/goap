name: sdlc
version: 0.2.0
description: >
  Software Development Life Cycle (SDLC) on the ALM repository: needs →
  requirements → functions → components → build artifacts → applications →
  solutions, with data, interfaces and flows. From the scope of a change to
  its delivery: impact analysis, specification and traceability, design,
  build (specialized by technology), tests, releases, release note, review,
  step-by-step deployment across environments (dev → test → staging →
  production) and application to the repository. Initial version, to be
  refined.

domain:
  nodeTypes:
    - {name: Need, description: Business need expressed by a stakeholder, properties: [title, description, stakeholder]}
    - {name: Requirement, description: Requirement satisfying a need, properties: [title, description, priority, status]}
    - {name: FunctionalRequirement, extends: Requirement, description: Functional requirement}
    - {name: NonFunctionalRequirement, extends: Requirement, description: Non-functional requirement (performance, availability…), properties: [category]}
    - {name: SecurityRequirement, extends: NonFunctionalRequirement, description: Security requirement}
    - {name: Function, description: Function (capability) realizing requirements, properties: [title, description]}
    - {name: Component, description: Software component implementing functions, properties: [title, owner, technology, version, repository]}
    - {name: BuildArtifact, description: Artifact produced by the build of a component, properties: [name, format, version, technology, coordinates, toolchain, checks]}
    - {name: Application, description: Deployable application composed of components, properties: [title, owner, version]}
    - {name: Solution, description: Solution grouping applications serving needs, properties: [title, owner]}
    - {name: Data, description: Data object, properties: [title, classification]}
    - {name: Interface, description: Interface (API, file, event) exposed by an application, properties: [title, protocol, version]}
    - {name: Flow, description: Data flow between applications through an interface, properties: [title, mode, frequency]}
    - {name: TestCase, description: Test case verifying a requirement, properties: [title, level, steps]}
    - {name: Release, description: Deliverable version of an application (a set of artifacts), properties: [title, version, status, notes]}
    - {name: Environment, description: Execution environment (dev, test, staging, production), properties: [name, stage, order, url]}
    - {name: Deployment, description: Deployment of a release to an environment, properties: [status, stage, date, checks]}
  linkTypes:
    - {name: satisfies, from: Requirement, to: Need}
    - {name: refines, from: Requirement, to: Requirement}
    - {name: realizes, from: Function, to: Requirement}
    - {name: implements, from: Component, to: Function}
    - {name: depends_on, from: Component, to: Component}
    - {name: accesses, from: Component, to: Data}
    - {name: built_from, from: BuildArtifact, to: Component}
    - {name: composed_of, from: Application, to: Component}
    - {name: deploys, from: Application, to: BuildArtifact}
    - {name: includes, from: Solution, to: Application}
    - {name: addresses, from: Solution, to: Need}
    - {name: owned_by, from: Data, to: Application}
    - {name: exposed_by, from: Interface, to: Application}
    - {name: exchanges, from: Interface, to: Data}
    - {name: source, from: Flow, to: Application}
    - {name: target, from: Flow, to: Application}
    - {name: through, from: Flow, to: Interface}
    - {name: carries, from: Flow, to: Data}
    - {name: verifies, from: TestCase, to: Requirement}
    - {name: contains, from: Release, to: BuildArtifact}
    - {name: releases, from: Release, to: Application}
    - {name: promotes_to, from: Environment, to: Environment}
    - {name: of_release, from: Deployment, to: Release}
    - {name: in_environment, from: Deployment, to: Environment}

conditions:
  # --- analysis
  - name: scoped
    description: The scope of the change is identified (directly impacted elements)
    expr: size(impacts) > 0
  - name: propagated
    description: Impacts are propagated along the ALM links
    expr: artifacts.exists(a, a.type == "propagation")
  # --- specification
  - name: requirements_specified
    description: Requirements are created or revised
    expr: proposals.exists(p, (p.op == "create_node" || p.op == "update_node") && "Requirement" in p.node.types)
  # NB: the "each …" conditions are true on an empty set; the actions that
  # depend on them also require requirements_specified to anchor the cycle.
  - name: requirements_traced
    description: Each new requirement satisfies a need (or refines another one)
    expr: >
      proposals.filter(p, p.op == "create_node" && "Requirement" in p.node.types).all(r,
        proposals.exists(l, l.op == "add_link" && (l.link.type == "satisfies" || l.link.type == "refines") && l.link.from.key == r.node.key))
  - name: tests_planned
    description: Each created or revised requirement is verified by a proposed test case
    expr: >
      proposals.filter(p, (p.op == "create_node" || p.op == "update_node") && "Requirement" in p.node.types).all(r,
        proposals.exists(l, l.op == "add_link" && l.link.type == "verifies" && l.link.to.key == r.node.key))
  # --- design
  - name: functions_allocated
    description: Each new requirement is realized by a function
    expr: >
      proposals.filter(p, p.op == "create_node" && "Requirement" in p.node.types).all(r,
        proposals.exists(l, l.op == "add_link" && l.link.type == "realizes" && l.link.to.key == r.node.key))
  - name: design_done
    description: The design (components, interfaces, flows, data) is described
    expr: artifacts.exists(a, a.type == "design")
  - name: design_checked
    description: The consistency of the design is checked
    expr: artifacts.exists(a, a.type == "design_check")
  # --- build
  - name: components_in_scope
    description: Components are impacted or created
    expr: >
      impacts.exists(i, "Component" in i.target.types)
      || proposals.exists(p, p.op == "create_node" && "Component" in p.node.types)
  - name: build_complete
    description: Each impacted or created component has a build artifact
    expr: >
      impacts.filter(i, "Component" in i.target.types).all(i,
        artifacts.exists(a, a.type == "build" && a.data.component == i.target.key))
      && proposals.filter(p, p.op == "create_node" && "Component" in p.node.types).all(p,
        artifacts.exists(a, a.type == "build" && a.data.component == p.node.key))
  # --- delivery
  - name: release_planned
    description: The releases of the affected applications are built (artifacts, version, environment chain)
    expr: artifacts.exists(a, a.type == "release_plan")
  - name: release_noted
    description: The release note is written
    expr: artifacts.exists(a, a.type == "release_note")
  - name: reviewed
    description: >
      All content proposals have received a decision (deployments, recorded
      after the review, do not need one)
    expr: >
      proposals.exists(p, p.node == null || p.node.type != "Deployment")
      && proposals.all(p, p.status != "proposed" || (p.node != null && p.node.type == "Deployment")
        || (p.op == "add_link" && p.link.from.type == "Deployment"))
  - name: rolled_out
    description: Each release is deployed to every environment in the chain (or there is nothing to deploy)
    expr: >
      artifacts.exists(p, p.type == "release_plan" && (size(p.data.releases) == 0
        || size(artifacts.filter(w, w.type == "deployment_wave")) >= size(p.data.pipeline)))
  - name: applied
    description: The change is applied to the ALM repository (new baseline)
    expr: change.status == "applied"

actions:
  # ======================= impact analysis
  - name: identify_scope
    kind: llm
    description: Identify the ALM elements directly impacted by the intent
    pre: {scoped: false}
    effects: {scoped: true}
    cost: 2
    model: default
    prompt: |
      You are an analyst in a software development lifecycle. Change intent:
      "{{ .Change.Intent }}"

      ALM repository (key, type, properties):
      {{ range .Baseline.Nodes }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}
      Identify the elements DIRECTLY concerned (needs, requirements, functions,
      components, interfaces, flows, data). For each one:
      {"kind":"impact","type":"direct","target":"<key>","data":{"reason":"..."}}

  - name: select_scope
    kind: human
    description: Manually designate the elements directly impacted (fallback)
    pre: {scoped: false}
    effects: {scoped: true}
    cost: 8
    instructions: Indicate the elements of the ALM repository directly concerned by the change (impacts).

  - name: propagate_impacts
    kind: builtin
    builtin: graph.propagate
    description: >
      Propagate impacts along the ALM links: need → requirements → functions →
      components → artifacts, applications → solutions, interfaces, flows, data, tests
    pre: {scoped: true, propagated: false}
    effects: {propagated: true}
    cost: 1
    params:
      maxDepth: 6
      linkTypes: [satisfies, refines, realizes, implements, depends_on, built_from, composed_of, deploys,
                  includes, addresses, owned_by, exposed_by, exchanges, source, target, through, carries, verifies,
                  contains, releases, of_release]

  # ======================= specification
  - name: specify_requirements
    kind: llm
    description: Revise the impacted requirements and create the new requirements
    pre: {propagated: true, requirements_specified: false}
    effects: {requirements_specified: true}
    cost: 3
    model: default
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted elements:
      {{ range .Impacts }}- {{ .Target.Key }} ({{ .Target.Type }}) {{ json .Target.Properties }} : {{ index .Data "reason" }}
      {{ end }}
      Revise the impacted requirements and create new requirements (types:
      FunctionalRequirement, NonFunctionalRequirement, SecurityRequirement), each one
      linked to the need it satisfies:
      {"kind":"proposal","proposal":{"op":"update_node","node":{"base":"<key>","props":{...}}}}
      {"ref":"r1","kind":"proposal","proposal":{"op":"create_node","node":{"key":"REQ-...","type":"FunctionalRequirement","props":{"title":"...","priority":"high"}}}}
      {"kind":"proposal","proposal":{"op":"add_link","link":{"type":"satisfies","from":"#r1","to":"<need key>"}}}

  - name: write_requirements
    kind: human
    description: Write the requirements (fallback)
    pre: {propagated: true, requirements_specified: false}
    effects: {requirements_specified: true}
    cost: 8
    instructions: >
      Propose the new versions of the impacted requirements and the new
      requirements (with their "satisfies" link to the need).

  - name: trace_requirements
    kind: script
    language: javascript
    description: Link each untraced new requirement to the needs in scope (systematic rule)
    pre: {requirements_specified: true, requirements_traced: false}
    effects: {requirements_traced: true}
    cost: 1
    code: |
      function run(ctx) {
        const props = ctx.proposals();
        const traced = new Set(props.filter(l => l.op === "add_link" && l.link && (l.link.type === "satisfies" || l.link.type === "refines"))
          .map(l => l.link.from));
        // needs in scope: impacted, or satisfied by the impacted requirements
        const needs = new Set();
        for (const i of ctx.impacts()) {
          if (!i.target) continue;
          if (i.target.type === "Need") needs.add(i.target.key);
          if (i.target.type.endsWith("Requirement")) {
            for (const l of ctx.links(i.target.key, "out", "satisfies")) needs.add(l.to.key);
          }
        }
        let n = 0;
        for (const r of props) {
          if (r.op !== "create_node" || !r.node || !r.node.type.endsWith("Requirement")) continue;
          if (traced.has("@" + r.id) || traced.has(r.node.key)) continue;
          if (needs.size === 0) { ctx.warn(r.node.key + " : no need in scope"); continue; }
          for (const need of needs) { ctx.proposeLink("@" + r.id, "satisfies", need); n++; }
        }
        return n + " traceability link(s) proposed";
      }

  - name: trace_manually
    kind: human
    description: Manually trace requirements to needs (fallback)
    pre: {requirements_specified: true, requirements_traced: false}
    effects: {requirements_traced: true}
    cost: 6
    instructions: Link each new requirement to the need it satisfies (or the requirement it refines).

  - name: plan_tests
    kind: script
    language: javascript
    description: One test case per created or revised requirement (level based on requirement type)
    pre: {requirements_specified: true, tests_planned: false}
    effects: {tests_planned: true}
    cost: 1
    code: |
      function run(ctx) {
        const props = ctx.proposals();
        const verified = new Set(props.filter(l => l.op === "add_link" && l.link && l.link.type === "verifies").map(l => l.link.to));
        let n = 0;
        for (const r of props) {
          if ((r.op !== "create_node" && r.op !== "update_node") || !r.node || !r.node.type.endsWith("Requirement")) continue;
          const ref = r.op === "create_node" ? "@" + r.id : r.node.key;
          if (verified.has(ref) || verified.has(r.node.key)) continue;
          const level = r.node.type === "SecurityRequirement" ? "security"
            : r.node.type === "NonFunctionalRequirement" ? "performance" : "acceptance";
          const title = (r.node.props && r.node.props.title) || r.node.key;
          const t = ctx.proposeNode("TestCase", "TST-" + r.node.key, { title: "Verify: " + title, level: level });
          ctx.proposeLink(t, "verifies", ref);
          n++;
        }
        return n + " test case(s) proposed";
      }

  # ======================= design
  - name: allocate_functions
    kind: script
    language: javascript
    description: Allocate each new requirement to a function (impacted function, otherwise a new function)
    pre: {requirements_traced: true, functions_allocated: false}
    effects: {functions_allocated: true}
    cost: 1
    code: |
      function run(ctx) {
        const props = ctx.proposals();
        const realized = new Set(props.filter(l => l.op === "add_link" && l.link && l.link.type === "realizes").map(l => l.link.to));
        const functions = ctx.impacts().filter(i => i.target && i.target.type === "Function").map(i => i.target.key).sort();
        let n = 0;
        for (const r of props) {
          if (r.op !== "create_node" || !r.node || !r.node.type.endsWith("Requirement")) continue;
          if (realized.has("@" + r.id) || realized.has(r.node.key)) continue;
          let fn = functions[0];
          if (!fn) {
            fn = ctx.proposeNode("Function", "FCT-" + r.node.key, { title: "Function: " + ((r.node.props && r.node.props.title) || r.node.key) });
          }
          ctx.proposeLink(fn, "realizes", "@" + r.id);
          n++;
        }
        return n + " allocation(s)";
      }

  - name: design_solution
    kind: llm
    description: Design the evolution of components, interfaces, flows and data
    pre: {requirements_specified: true, requirements_traced: true, functions_allocated: true, design_done: false}
    effects: {design_done: true}
    cost: 3
    model: reasoning
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted elements:
      {{ range .Impacts }}- {{ .Target.Key }} ({{ .Target.Type }}) {{ json .Target.Properties }}
      {{ end }}
      Proposals already made:
      {{ range .Proposals }}- {{ .Proposal.Op }} {{ json .Proposal }}
      {{ end }}
      Design the evolution: components to modify (update_node, version /
      technology props) or to create (type Component, technology java|c|shell|…, an
      implements link to the function), interfaces (exposed_by, exchanges), flows
      (source, target, through, carries) and data. End with
      {"kind":"artifact","type":"design","data":{"summary":"...","decisions":["..."]}}

  - name: write_design
    kind: human
    description: Describe the design (fallback)
    pre: {requirements_specified: true, requirements_traced: true, functions_allocated: true, design_done: false}
    effects: {design_done: true}
    cost: 8
    utility: 'has(vars.design) && vars.design == "manual" ? 2.0 : 0.3'
    instructions: >
      Propose the changes to components, interfaces, flows and data, then a
      "design" artifact summarizing the decisions.

  - name: check_design
    kind: script
    language: javascript
    description: Check the consistency of the design (mandatory links of created elements)
    pre: {design_done: true, design_checked: false}
    effects: {design_checked: true}
    cost: 1
    code: |
      function run(ctx) {
        const props = ctx.proposals();
        const links = props.filter(l => l.op === "add_link" && l.link).map(l => l.link);
        const has = (from, type) => links.some(l => (l.from === from.id || l.from === from.key) && l.type === type);
        const required = {
          Component: ["implements"], Interface: ["exposed_by"], Flow: ["source", "target", "carries"],
          BuildArtifact: ["built_from"], Data: ["owned_by"],
        };
        const issues = [];
        for (const p of props) {
          if (p.op !== "create_node" || !p.node || !required[p.node.type]) continue;
          for (const t of required[p.node.type]) {
            if (!has({ id: "@" + p.id, key: p.node.key }, t)) issues.push(p.node.type + " " + p.node.key + " : missing link \"" + t + "\"");
          }
        }
        for (const i of issues) ctx.warn(i);
        ctx.addArtifact("design_check", { ok: issues.length === 0, issues: issues });
        return issues.length + " issue(s)";
      }

  # ======================= build (abstract action, specialized by technology)
  - name: build
    kind: abstract
    description: >
      Build the impacted or created components. Abstract action: each
      execution builds the components of one technology (specialization), until
      all of them have their artifact.
    pre: {propagated: true, design_checked: true, build_complete: false}
    effects: {build_complete: true}
    cost: 2
    incremental: true

  - name: build_java
    kind: script
    language: javascript
    specializes: build
    params: {technology: java}
    priority: 30
    description: "Java build: Maven, JDK 21, dependency check and coverage"
    when: >
      impacts.exists(i, "Component" in i.target.types && has(i.target.props.technology) && i.target.props.technology == "java"
        && !artifacts.exists(a, a.type == "build" && a.data.component == i.target.key))
      || proposals.exists(p, p.op == "create_node" && "Component" in p.node.types && has(p.node.props.technology)
        && p.node.props.technology == "java" && !artifacts.exists(a, a.type == "build" && a.data.component == p.node.key))
    code: &build |
      const RULES = {
        java:  { format: "jar", toolchain: "maven 3.9 / JDK 21", checks: ["mvn -B verify", "OWASP dependency-check", "JaCoCo ≥ 80 %"],
                 coordinates: (c, v) => "com.acme:" + c + ":" + v },
        c:     { format: "elf", toolchain: "gcc 13 / make", checks: ["-Wall -Wextra -Werror", "cppcheck", "valgrind on the tests"],
                 coordinates: (c, v) => c + "-" + v + "-linux-x86_64" },
        shell: { format: "tar.gz", toolchain: "bash 5", checks: ["shellcheck -S warning", "bats"],
                 coordinates: (c, v) => c + "-" + v + ".tar.gz" },
        other: { format: "tar.gz", toolchain: "archive", checks: ["sha256"],
                 coordinates: (c, v) => c + "-" + v + ".tar.gz" },
      };
      function bump(v) {
        const p = String(v || "0.0.0").split(".");
        while (p.length < 3) p.push("0");
        p[2] = String((parseInt(p[2], 10) || 0) + 1);
        return p.join(".");
      }
      // components in scope without a build artifact
      function pending(ctx) {
        const built = new Set(ctx.items("artifact").filter(a => a.type === "build").map(a => a.data.component));
        const out = new Map();
        for (const i of ctx.impacts()) {
          if (i.target && i.target.type === "Component" && !built.has(i.target.key)) out.set(i.target.key, { key: i.target.key, ref: i.target.key, props: i.target.props || {}, existing: true });
        }
        for (const p of ctx.proposals()) {
          if (p.op === "create_node" && p.node && p.node.type === "Component" && !built.has(p.node.key)) out.set(p.node.key, { key: p.node.key, ref: "@" + p.id, props: p.node.props || {}, existing: false });
        }
        return [...out.values()];
      }
      function build(ctx, tech) {
        const known = ["java", "c", "shell"];
        const mine = pending(ctx).filter(c => tech === "other" ? !known.includes(c.props.technology) : c.props.technology === tech);
        const r = RULES[tech];
        for (const c of mine) {
          const name = String(c.props.title || c.key);
          const v = bump(c.props.version);
          const key = "ART-" + c.key + "-" + v;
          const art = ctx.proposeNode("BuildArtifact", key, { name: name, format: r.format, version: v, technology: c.props.technology || "",
            coordinates: r.coordinates(name, v), toolchain: r.toolchain, checks: r.checks });
          ctx.proposeLink(art, "built_from", c.ref);
          if (c.existing) {
            for (const l of ctx.links(c.key, "in", "composed_of")) ctx.proposeLink(l.from.key, "deploys", art);
          }
          ctx.addArtifact("build", { component: c.key, technology: c.props.technology || "", version: v, artifact: key, toolchain: r.toolchain, checks: r.checks });
        }
        return mine.length + " " + tech + " component(s) built";
      }
      function run(ctx) { return build(ctx, ctx.param("technology") || "other"); }

  - name: build_c
    kind: script
    language: javascript
    specializes: build
    params: {technology: c}
    priority: 20
    description: "C build: gcc / make, blocking warnings, static analysis"
    when: >
      impacts.exists(i, "Component" in i.target.types && has(i.target.props.technology) && i.target.props.technology == "c"
        && !artifacts.exists(a, a.type == "build" && a.data.component == i.target.key))
      || proposals.exists(p, p.op == "create_node" && "Component" in p.node.types && has(p.node.props.technology)
        && p.node.props.technology == "c" && !artifacts.exists(a, a.type == "build" && a.data.component == p.node.key))
    code: *build

  - name: build_shell
    kind: script
    language: javascript
    specializes: build
    params: {technology: shell}
    priority: 10
    description: "Shell build: shellcheck, bats tests, archive"
    when: >
      impacts.exists(i, "Component" in i.target.types && has(i.target.props.technology) && i.target.props.technology == "shell"
        && !artifacts.exists(a, a.type == "build" && a.data.component == i.target.key))
      || proposals.exists(p, p.op == "create_node" && "Component" in p.node.types && has(p.node.props.technology)
        && p.node.props.technology == "shell" && !artifacts.exists(a, a.type == "build" && a.data.component == p.node.key))
    code: *build

  - name: build_generic
    kind: script
    language: javascript
    specializes: build
    params: {technology: other}
    description: "Generic build (other technologies): archive and checksum"
    code: *build

  # ======================= releases and environments
  - name: plan_release
    kind: script
    language: javascript
    description: >
      Build one release per application that deploys a new artifact (next minor version,
      contains / releases links) and freeze the environment chain (promotes_to order)
    pre: {requirements_specified: true, build_complete: true, release_planned: false}
    effects: {release_planned: true}
    cost: 1
    code: |
      function bumpMinor(v) {
        const p = String(v || "0.0").split(".");
        while (p.length < 2) p.push("0");
        p[1] = String((parseInt(p[1], 10) || 0) + 1);
        return p.slice(0, 2).join(".");
      }
      function run(ctx) {
        const props = ctx.proposals();
        const artifacts = new Map(); // item ref -> key
        for (const p of props) {
          if (p.op === "create_node" && p.node && p.node.type === "BuildArtifact") artifacts.set("@" + p.id, p.node.key);
        }
        // applications receiving a new artifact (deploys links proposed by the build)
        const byApp = new Map();
        for (const l of props) {
          if (l.op !== "add_link" || !l.link || l.link.type !== "deploys" || !artifacts.has(l.link.to)) continue;
          if (!byApp.has(l.link.from)) byApp.set(l.link.from, []);
          byApp.get(l.link.from).push(l.link.to);
        }
        const releases = [];
        for (const [app, arts] of byApp) {
          const node = ctx.node(app);
          const v = bumpMinor(node.props.version);
          const key = "REL-" + app + "-" + v;
          const r = ctx.proposeNode("Release", key, { title: (node.props.title || app) + " " + v, version: v, status: "candidate" });
          ctx.proposeLink(r, "releases", app);
          for (const a of arts) ctx.proposeLink(r, "contains", a);
          releases.push(key);
        }
        // environment chain: ascending order (order property)
        const pipeline = ctx.nodes("Environment")
          .map(e => ({ key: e.key, name: e.props.name || e.key, stage: e.props.stage || "", order: Number(e.props.order || 0) }))
          .sort((a, b) => a.order - b.order);
        ctx.addArtifact("release_plan", { releases: releases, pipeline: pipeline });
        return releases.length + " release(s), " + pipeline.length + " environment(s)";
      }

  # ======================= delivery
  - name: write_release_note
    kind: llm
    description: Write the release note
    pre: {requirements_specified: true, tests_planned: true, design_checked: true, build_complete: true, release_planned: true, release_noted: false}
    effects: {release_noted: true}
    cost: 1
    model: fast
    prompt: |
      Intent: "{{ .Change.Intent }}"
      Proposals:
      {{ range .Proposals }}- {{ json .Proposal }}
      {{ end }}
      Artifacts:
      {{ range .Artifacts }}- {{ .Type }} {{ json .Data }}
      {{ end }}
      Write the release note (requirements, components, artifacts, releases,
      affected applications, tests, deployment chain):
      {"kind":"artifact","type":"release_note","data":{"markdown":"..."}}

  - name: assemble_release_note
    kind: script
    language: javascript
    description: Assemble the release note from the change (deterministic fallback)
    pre: {requirements_specified: true, tests_planned: true, design_checked: true, build_complete: true, release_planned: true, release_noted: false}
    effects: {release_noted: true}
    cost: 3
    code: |
      function run(ctx) {
        const lines = ["# Release Note", "", "Intent: " + ctx.intent(), ""];
        const section = (title, rows) => { if (rows.length) { lines.push("## " + title, ...rows.map(r => "- " + r), ""); } };
        const props = ctx.proposals().filter(p => p.node);
        section("Requirements", props.filter(p => p.node.type.endsWith("Requirement")).map(p => p.op + " " + p.node.key));
        section("Design", props.filter(p => ["Function", "Component", "Interface", "Flow", "Data"].includes(p.node.type)).map(p => p.op + " " + p.node.type + " " + p.node.key));
        section("Build artifacts", ctx.items("artifact").filter(a => a.type === "build").map(a => a.data.artifact + " (" + a.data.toolchain + ")"));
        section("Tests", props.filter(p => p.node.type === "TestCase").map(p => p.node.key));
        section("Releases", props.filter(p => p.node.type === "Release").map(p => p.node.key + " " + (p.node.props.title || "")));
        const plan = ctx.items("artifact").filter(a => a.type === "release_plan").pop();
        if (plan) section("Deployment", [plan.data.pipeline.map(e => e.name + " (" + e.stage + ")").join(" → ")]);
        section("Affected applications", ctx.impacts().filter(i => i.target && i.target.type === "Application").map(i => i.target.key + " " + (i.target.props.title || "")));
        ctx.addArtifact("release_note", { markdown: lines.join("\n") });
        return "release note assembled";
      }

  - name: review
    kind: human
    description: Review of the change (requirements, design, artifacts, tests)
    pre: {release_noted: true, reviewed: false}
    effects: {reviewed: true}
    cost: 2
    instructions: Accept or reject each proposal based on the release note and the design check.

  # ======================= deployment (abstract, incremental, specialized by environment stage)
  - name: deploy
    kind: abstract
    description: >
      Deploy the releases to the next environment in the chain. Each execution is a wave
      (one environment); the specialization depends on the stage: automatic in dev / test, staging
      checks in staging, change window and release manager approval in production.
    pre: {reviewed: true, rolled_out: false}
    effects: {rolled_out: true}
    cost: 2
    incremental: true

  - name: deploy_auto
    kind: script
    language: javascript
    specializes: deploy
    description: "Automatic deployment (dev, test): unit tests and smoke tests"
    params: {checks: [unit tests, smoke tests]}
    code: &deploy |
      function run(ctx) {
        const plan = ctx.items("artifact").filter(a => a.type === "release_plan").pop();
        const waves = ctx.items("artifact").filter(a => a.type === "deployment_wave");
        const env = plan.data.pipeline[waves.length];
        if (!env) throw new Error("all waves are deployed");
        const checks = ctx.param("checks") || [];
        const tests = ctx.proposals().filter(p => p.op === "create_node" && p.node && p.node.type === "TestCase");
        const campaign = {};
        for (const t of tests) campaign[t.node.props.level || "acceptance"] = (campaign[t.node.props.level || "acceptance"] || 0) + 1;
        const releaseRef = key => {
          const p = ctx.proposals().find(p => p.op === "create_node" && p.node && p.node.key === key);
          return p ? "@" + p.id : key;
        };
        for (const r of plan.data.releases) {
          const d = ctx.proposeNode("Deployment", "DEP-" + r + "-" + env.key, { status: "succeeded", stage: env.stage, checks: checks });
          ctx.proposeLink(d, "of_release", releaseRef(r));
          ctx.proposeLink(d, "in_environment", env.key);
        }
        ctx.addArtifact("deployment_wave", { environment: env.key, name: env.name, stage: env.stage, releases: plan.data.releases,
          checks: checks, tests: campaign });
        return plan.data.releases.length + " release(s) deployed to " + env.name;
      }

  - name: deploy_staging
    kind: script
    language: javascript
    specializes: deploy
    priority: 10
    description: "Staging deployment: regression, performance, security (test case campaign)"
    when: >
      artifacts.exists(p, p.type == "release_plan"
        && p.data.pipeline[size(artifacts.filter(w, w.type == "deployment_wave"))].stage == "staging")
    params: {checks: [regression tests, performance tests, security tests (DAST), business acceptance testing]}
    code: *deploy

  - name: deploy_production
    kind: script
    language: javascript
    specializes: deploy
    priority: 20
    permission: release:deploy
    description: "Production deployment: change window, rollback plan, release manager approval"
    when: >
      artifacts.exists(p, p.type == "release_plan"
        && p.data.pipeline[size(artifacts.filter(w, w.type == "deployment_wave"))].stage == "prod")
    params: {checks: [change window, rollback plan, post-deployment monitoring]}
    code: *deploy

  - name: apply_change
    kind: builtin
    builtin: graph.apply
    description: Apply the change to the ALM repository (new baseline, including releases and deployments)
    pre: {reviewed: true, rolled_out: true, applied: false}
    effects: {applied: true}
    cost: 1
    permission: change:apply

goals:
  - name: analyze_impact
    description: Measure the impact of a change on the ALM chain
    examples: ["what is the impact", "what does this break", "impact analysis"]
    pre: {propagated: true}
    value: 3
  - name: specify
    description: Specify the requirements of a change, traced and verified
    examples: ["specify the need", "write the requirements", "new requirement"]
    pre: {requirements_specified: true, requirements_traced: true, tests_planned: true}
    value: 5
  - name: design
    description: Design the evolution of the solution (functions, components, interfaces, flows, data)
    examples: ["design", "architecture", "which components to modify"]
    pre: {requirements_specified: true, functions_allocated: true, design_checked: true}
    value: 6
  - name: build_components
    description: Build the impacted components
    examples: ["build the components", "build", "deliver the artifacts"]
    pre: {components_in_scope: true, build_complete: true}
    value: 7
  - name: release
    description: Build the releases and deploy them to all environments
    examples: ["deploy to production", "deploy the release", "deliver to staging"]
    pre: {release_planned: true, rolled_out: true}
    value: 8
  - name: deliver
    description: Deliver a change end-to-end, from requirement to updated repository
    examples: ["deliver an enhancement", "develop a new feature", "carry out the change"]
    pre: {applied: true}
    value: 10

agents:
  - name: analyst
    description: Analyst — scope, impacts, requirements, traceability, test plan
    examples: ["impact analysis", "specify the requirements", "what is the impact of this need"]
    planner: goap
    actions: [identify_scope, select_scope, propagate_impacts, specify_requirements, write_requirements,
              trace_requirements, trace_manually, plan_tests]
    goals: [analyze_impact, specify]
  - name: architect
    description: Architect — functional allocation, design of components, interfaces, flows and data
    examples: ["design the solution", "which components and interfaces to modify"]
    planner: hybrid
    actions: [identify_scope, select_scope, propagate_impacts, specify_requirements, write_requirements,
              trace_requirements, trace_manually, allocate_functions, design_solution, write_design, check_design]
    goals: [design]
  - name: builder
    description: Integrator — build the components according to their technology
    examples: ["build the components", "build"]
    planner: goap
    actions: [identify_scope, select_scope, propagate_impacts, specify_requirements, write_requirements,
              trace_requirements, trace_manually, allocate_functions, design_solution, write_design, check_design, build]
    goals: [build_components]
  - name: release_manager
    description: Release manager — releases, release note, review, step-by-step deployment
    examples: ["deploy to production", "deploy the release to the environments"]
    planner: goap
    goals: [release]
  - name: delivery
    description: End-to-end delivery — from intent to updated ALM repository
    examples: ["deliver an enhancement", "develop a feature end-to-end"]
    planner: goap
    goals: [deliver]
