name: sdlc
version: 0.12.0
description: >
  Software Development Life Cycle (SDLC) on the ALM repository: needs →
  requirements → functions → components → build artifacts → applications →
  solutions, with data, interfaces and flows. From the scope of a change to
  its delivery: impact analysis, specification and traceability, design,
  build (specialized by technology), tests, releases, release note, review,
  step-by-step deployment across environments (dev → test → staging →
  production) and application to the repository. Initial version, to be
  refined.

namespace: alm
goal: deliver
# the maturity of a change (ADR 0179): its phases, framing → analysing → designing → building → releasing → delivered;
# the gates of the delivery process move it from one to the next (enters), their decision may send it back (backTo).
# Its lifecycle is derived from them: no domain states it.
maturity:
  description: How a delivery change matures, from its framing to its delivery, phase by phase
  phases:
    - {name: framing, description: "The change is framed with its requester"}
    - {name: analysing, description: "Its impacts, requirements and tests are analysed"}
    - {name: designing, description: "Its solution is designed"}
    - {name: building, description: "Its components are built"}
    - {name: releasing, description: "Its releases are planned, reviewed and rolled out"}
    - {name: delivered, final: true, description: "Delivered: the change commits"}
    - {name: abandoned, final: true, exit: abandon, description: "Given up"}

# the proofs of concept and prototypes it opens as its sub-changes (ADR 0131): the poc methodology, whose conclusion it
# takes back (`poc.concluded` from an integrated change)
integrates:
  - methodologies: [poc]

# risks_under_control, the release train gate, is a condition of the `risks` library
# the rating in two steps, conditions of the `assessments` library (ADR 0110): the rating actions establish
# description_rated (a rating of the description as it reads now exists); description_accepted, the gate of the
# analysis, asks on top of it for a score of 3 or more (condition.AcceptableScore), which no action establishes
imports: [risks, dependencies, assessments]

# the events of the methodology (ADR 0110), raised by the actions that emit them
events:
  - {name: impact.analysed, description: "A person validated the impact analysis of the change (its four passes done)"}
  - {name: poc.concluded, description: "A proof of concept or a prototype the change opened concluded (raised by its poc sub-change)"}

# how the assessments of a change read (ADR 0116): the first state that holds wins, the defaults settle the rest
assessments:
  # the description: accepted is the gate of the analysis (description_accepted), not a score the web judges
  - subject: description
    states:
      - {when: "!assessment.current", tone: warn, label: "changed since its rating"}
      - {when: "!assessment.answered", tone: info, label: "your remark awaits an answer"}
      - {conditions: {description_accepted: true}, tone: ok, label: accepted}
      - {when: "assessment.score <= 1", tone: danger, label: "to be rewritten"}
      - {tone: warn, label: "to be improved"}
  # an impact qualified by the analysis: refuted ones are on their way out, the others wait for their review
  - subject: "impact:*"
    states:
      - {when: "subject.entry != null && subject.entry.review in ['accepted', 'rejected']", tone: ok, label: processed}
      - {when: "assessment.verdict == 'refuted'", tone: neutral, label: "refuted, to be withdrawn"}
      - {tone: warn, label: "to be reviewed"}

conditions:
  # A change impact is a node the change acts on (ADR 0024): declared as impacted (modified) or created,
  # written when its new version exists, reviewed when it has received a decision.
  # --- intake
  - name: formulated
    description: The request has been attached to a change (an open one it continues, or this new one, now well-defined)
    expr: artifacts.exists(a, a.target == "change_formulated")
  # --- impact analysis (ADR 0109): four passes, from the need down to what is built, one layer each:
  # requirements (needs and requirements), functions (the functional layer), applications (the logical layer:
  # applications, solutions, interfaces, flows, data) and components (the physical layer: components, build artifacts).
  # A pass identifies what of its layer the change directly concerns, propagates the impacts of the layers above down
  # to its own, then qualifies each propagated (suspected) impact, one at a time: an impact the change does not
  # concern is rejected with its reason, then withdrawn (the rejection stays in the log of the change).
  - name: requirements_identified
    description: The pass on the requirements named the needs and requirements the change directly concerns
    expr: artifacts.exists(a, a.target == "impact_pass" && a.data.layer == "requirements")
  - name: requirements_propagated
    description: The impacts are propagated to the requirements (needs, refinements)
    expr: artifacts.exists(a, a.target == "propagation" && a.data.layer == "requirements")
  - name: functions_identified
    description: The pass on the functional layer named the functions the change directly concerns
    expr: artifacts.exists(a, a.target == "impact_pass" && a.data.layer == "functions")
  - name: functions_propagated
    description: The impacts are propagated to the functions realizing the impacted requirements
    expr: artifacts.exists(a, a.target == "propagation" && a.data.layer == "functions")
  - name: applications_identified
    description: The pass on the logical layer named the applications, interfaces, flows and data the change directly concerns
    expr: artifacts.exists(a, a.target == "impact_pass" && a.data.layer == "applications")
  - name: applications_propagated
    description: The impacts are propagated to the logical layer (applications, solutions, interfaces, flows, data)
    expr: artifacts.exists(a, a.target == "propagation" && a.data.layer == "applications")
  - name: components_identified
    description: The pass on the physical layer named the components and artifacts the change directly concerns
    expr: artifacts.exists(a, a.target == "impact_pass" && a.data.layer == "components")
  - name: components_propagated
    description: The impacts are propagated to the physical layer (components, build artifacts)
    expr: artifacts.exists(a, a.target == "propagation" && a.data.layer == "components")
  # one impact
  - name: suspected
    scope: impact
    description: The impact was found by propagation along the ALM links, not named directly; it is to be qualified
    expr: self.rationale.startsWith("propagated (")
  - {name: in_requirements, scope: impact, description: A need or a requirement, expr: '["alm@Need", "alm@Requirement"].exists(t, t in self.types)'}
  - {name: in_functions, scope: impact, description: An element of the functional layer, expr: '"alm@Function" in self.types'}
  - {name: in_applications, scope: impact, description: An element of the logical layer,
     expr: '["alm@Application", "alm@Solution", "alm@Interface", "alm@Flow", "alm@Data"].exists(t, t in self.types)'}
  - {name: in_components, scope: impact, description: An element of the physical layer, expr: '["alm@Component", "alm@BuildArtifact"].exists(t, t in self.types)'}
  - name: confirmed
    scope: impact
    description: The rating confirms the change concerns the node (one it does not concern is withdrawn)
    expr: 'assessments.exists(a, a.key == "impact:" + self.key && a.verdict == "confirmed")'
  # every suspected impact of a layer is confirmed (an empty layer is: nothing to qualify)
  - {name: impacts_confirmed, all: confirmed, where: self.conditions.suspected, empty: true,
     description: Every suspected impact is confirmed (the others were withdrawn)}
  - {name: requirements_confirmed, all: confirmed, where: self.conditions.suspected && self.conditions.in_requirements, empty: true,
     description: Every suspected need or requirement is confirmed}
  - {name: functions_confirmed, all: confirmed, where: self.conditions.suspected && self.conditions.in_functions, empty: true,
     description: Every suspected function is confirmed}
  - {name: applications_confirmed, all: confirmed, where: self.conditions.suspected && self.conditions.in_applications, empty: true,
     description: Every suspected element of the logical layer is confirmed}
  - {name: components_confirmed, all: confirmed, where: self.conditions.suspected && self.conditions.in_components, empty: true,
     description: Every suspected element of the physical layer is confirmed}
  - name: impact_analysis_validated
    description: A person validated the impact analysis, the four passes done
    expr: artifacts.exists(a, a.target == "impact_validation" && a.data.accepted == true)
  # --- specification
  - name: requirements_specified
    description: Requirements are created or revised
    expr: changeImpacts.exists(n, n.hasPost && "alm@Requirement" in n.types)
  # NB: the "each …" conditions are true on an empty set; the actions that
  # depend on them also require requirements_specified to anchor the cycle
  # (functions_allocated anchors itself: it is false until a requirement is created or revised).
  - name: requirements_traced
    description: Each new requirement satisfies a need (or refines another one)
    expr: >
      changeImpacts.filter(r, r.intent == "created" && "alm@Requirement" in r.types).all(r,
        r.hasPost && r.post.out.exists(l, l.type == "alm@satisfies" || l.type == "alm@refines"))
  - name: tests_planned
    description: Each created or revised requirement is verified by a created test case
    expr: >
      changeImpacts.filter(r, r.hasPost && "alm@Requirement" in r.types).all(r,
        changeImpacts.exists(t, t.intent == "created" && t.hasPost && t.post.out.exists(l, l.type == "alm@verifies" && l.to.id == r.post.id)))
  # --- design
  - name: functions_allocated
    description: Each new requirement is realized by a function
    expr: >
      changeImpacts.exists(n, n.hasPost && "alm@Requirement" in n.types) &&
      changeImpacts.filter(r, r.intent == "created" && "alm@Requirement" in r.types && r.hasPost).all(r,
        changeImpacts.exists(f, f.hasPost && f.post.out.exists(l, l.type == "alm@realizes" && l.to.id == r.post.id)))
  - name: design_done
    description: The design (components, interfaces, flows, data) is described
    expr: artifacts.exists(a, a.target == "design")
  - name: design_checked
    description: The consistency of the design is checked
    expr: artifacts.exists(a, a.target == "design_check")
  # --- build
  - name: components_in_scope
    description: Components are impacted or created
    expr: changeImpacts.exists(n, "alm@Component" in n.types)
  - name: build_complete
    description: Each impacted or created component has a build artifact
    expr: >
      changeImpacts.filter(n, "alm@Component" in n.types).all(n,
        artifacts.exists(a, a.target == "build" && a.data.component == n.key))
  # --- build from the sources, in the workspace of the change (ADR 0118): a component whose repository is known is
  # implemented by an agent in its sources, built and tested there, then published (its branch pushed, a build
  # artifact); a failed build sends it back to the agent, three attempts at most. The build checks, the agent does not
  # say it builds.
  - name: from_sources
    scope: impact
    description: A component whose sources are in a repository, built in the workspace of the change
    expr: '"alm@Component" in self.types && has(self.props.repository) && self.props.repository != ""'
  - name: workspace_ready
    description: The workspace of the change holds the sources of the components built from their sources
    expr: artifacts.exists(a, a.target == "workspace")
  - name: implemented
    scope: impact
    description: >
      The agent changed the sources of the component (a code change), and no build failed since; after three
      attempts the component stays implemented as it is, for a person to take over
    expr: >
      artifacts.exists(k, k.target == "code_change" && k.data.component == self.key) &&
      (artifacts.filter(k, k.target == "code_change" && k.data.component == self.key).size() >= 3 ||
       !artifacts.exists(b, b.target == "build_report" && b.data.component == self.key && b.data.ok != true &&
         b.data.revision == artifacts.filter(k, k.target == "code_change" && k.data.component == self.key).size()))
  - name: build_checked
    scope: impact
    description: The latest code change of the component was built and tested in the workspace (whatever the outcome)
    expr: >
      artifacts.exists(b, b.target == "build_report" && b.data.component == self.key &&
        b.data.revision == artifacts.filter(k, k.target == "code_change" && k.data.component == self.key).size())
  - name: built
    scope: impact
    description: The latest code change of the component builds and passes its tests
    expr: >
      artifacts.exists(b, b.target == "build_report" && b.data.component == self.key && b.data.ok == true &&
        b.data.revision == artifacts.filter(k, k.target == "code_change" && k.data.component == self.key).size())
  - name: published
    scope: impact
    description: The component has its build artifact (its branch pushed)
    expr: artifacts.exists(a, a.target == "build" && a.data.component == self.key)
  - name: sources_published
    description: Every component built from its sources is published (true when there is none)
    all: published
    where: self.conditions.from_sources
    empty: true
  - {name: sources_implemented, all: implemented, where: self.conditions.from_sources, empty: true,
     description: "Every component built from its sources is implemented"}
  - {name: sources_build_checked, all: build_checked, where: self.conditions.from_sources, empty: true,
     description: "Every component built from its sources was built after its latest code change"}
  # --- delivery
  - name: release_planned
    description: The releases of the affected applications are built (artifacts, version, environment chain)
    expr: artifacts.exists(a, a.target == "release_plan")
  - name: release_noted
    description: The release note is written
    expr: artifacts.exists(a, a.target == "release_note")
  - name: reviewed
    description: >
      All the change impacts have received a decision (the deployments are
      recorded accepted, after the review)
    expr: size(changeImpacts) > 0 && changeImpacts.all(n, n.review != "proposed")
  - name: requirements_approved
    description: The requirements the review accepted are approved (ADR 0076, 0077)
    expr: artifacts.exists(a, a.target == "requirements_approval")
  - name: rolled_out
    description: Each release is deployed to every environment in the chain (or there is nothing to deploy)
    expr: >
      artifacts.exists(p, p.target == "release_plan" && (size(p.data.releases) == 0
        || size(artifacts.filter(w, w.target == "deployment_wave")) >= size(p.data.pipeline)))
  - name: applied
    description: The change is applied to the ALM repository (new commit)
    expr: change.status == "applied"
  # --- proofs of concept and prototypes (ADR 0131): an action of kind poc of the register, opened by a person as a
  # sub-change of the poc methodology, concluded there, taken back here; one opened for the framing explores the need,
  # one opened against risks derisks them. The steps waiting for them hold while one is open (true when there is none).
  - name: poc_opened
    scope: action
    description: The proof of concept has its sub-change
    expr: self.change != ""
  - name: poc_concluded_now
    scope: action
    description: The sub-change of the proof of concept just concluded (the event of its conclusion is being handled)
    expr: 'has(vars.event) && vars.event.type == "poc.concluded" && vars.event.change.id == self.change'
  - name: poc_settled
    scope: action
    description: The proof of concept is concluded (its verdicts taken back) or cancelled
    expr: self.status != "open"
  - {name: pocs_opened, all: poc_opened, where: self.kind == "poc" && self.status == "open", empty: true,
     description: Every proof of concept proposed is opened as a sub-change}
  - {name: prototypes_concluded, all: poc_settled, where: self.kind == "poc" && self.purpose == "explore", empty: true,
     description: Every prototype of the framing is concluded (true when there is none)}
  - {name: pocs_concluded, all: poc_settled, where: self.kind == "poc" && self.purpose == "derisk", empty: true,
     description: Every proof of concept against the risks is concluded (true when there is none)}

actions:
  # ======================= intake
  - name: find_or_create_change
    kind: llm
    description: >
      List the open changes of the requesting unit and compare them to the request: continue a
      clear match, else clarify this new change (title, intent, scope) with the requester,
      looping (a note per round) until it is well-defined enough to start.
    
    effects: {formulated: true}
    cost: 1
    model: default
    mcps: [goap-change]
    prompt: |
      A request came in: "{{ .Change.Intent }}"
      Notes exchanged with the requester so far (oldest first):
      {{ range .Artifacts }}{{ if .Data.text }}- {{ .Data.text }}
      {{ end }}{{ end }}

      1. Call goap-change/list (status draft, active or committed; filter by namespace "alm" and,
         if known, the requester's unit) to see the open changes.
      2. If one of them clearly is the same piece of work as the request, hand it off: call
         goap-scheduler/attach with change=<its id> (binds this same process to it directly, in
         place of the change opened for this request — no second process, no change left unused),
         then finish with
         {"type":"artifact","target":"change_formulated","data":{"continued":true,"changeId":"<its id>"}}.
      3. Otherwise this change is the right one, but only once its definition is clear: a concrete
         outcome, its scope (what it touches), and why it is needed. If that is still missing or
         ambiguous, ask ONE clarifying question and finish with
         {"type":"artifact","target":"question","data":{"text":"<question>"}} (do not set change_formulated:
         the requester's next note is read back in on the next round).
      4. Once it is clear, call goap-change/reformulate with the clarified title, a one-paragraph
         intent (concrete outcome and scope) and a rationale, then finish with
         {"type":"artifact","target":"change_formulated","data":{"continued":false,"changeId":"{{ .Change.ID }}"}}.

  - name: rate_description
    kind: llm
    description: >
      Rate how well the title and the description of the change say what is wanted (outcome, scope, reason),
      propose a better wording, and answer the requester's remarks in the thread of the rating.
    effects: {description_rated: true}
    cost: 1
    model: default
    prompt: |
      You review the description of a change before anyone works on it. It must state a concrete, observable
      outcome, its scope (the applications, requirements or data it touches) and why it is needed.
      Title: "{{ .Change.Title }}"
      Description: "{{ .Change.Intent }}"
      Rate the description as it is now. The brief shows the latest ASSESSMENT of it, if any, and the THREAD of the
      topic "description": the earlier ratings and the requester's remarks. When they answered a rating, take their
      answer into account and go on from the discussion rather than start over.
      Finish with exactly one item:
      {"type":"assessment","data":{"key":"description","score":<0 to 5>,"verdict":"clear|unclear|insufficient",
       "findings":[{"text":"<what is missing or ambiguous>","severity":"major|minor"}],
       "suggestion":"<a rewritten description, same language as the original, only if it can be improved>",
       "reply":"<one or two sentences to the requester: your answer to their last remark, or what to fix first>",
       "prototype":["<only when the text cannot settle it: a statement about the need a prototype would confirm or refute>"]}}
      (what you rated is recorded for you: the description as it is in this prompt.) Leave "prototype" out unless
      something only trying it would settle (is this flow what they want, can the data be shown that way): a person
      decides whether to build one (ADR 0131), never you.
      A score of 3 or more means the change can be worked on as described.

  - name: rate_description_by_hand
    kind: human
    description: >
      Fallback when no model rates the description (no model, or the rating action failed): a person rates it the
      same way, in the bubble of the change.
    effects: {description_rated: true}
    cost: 6
    roles: [business_analyst, product_owner]
    instructions: >
      Rate how well the title and the description say what is wanted (outcome, scope, reason) and answer the
      requester's last remark. Add one item of kind assessment: {key: "description", score: 0 to 5,
      verdict: clear|unclear|insufficient, findings, suggestion, reply, rated: the fp of the description (shown by the
      change)}. A score of 3 or more lets the change be worked on as described.

  # ======================= impact analysis (four passes: requirements, functions, applications, components)
  - name: identify_requirements
    kind: llm
    description: "First pass: name the needs and requirements the intent directly concerns"
    effects: {requirements_identified: true}
    cost: 2
    model: default
    prompt: |
      You are an analyst in a software development lifecycle, on the pass of the impact analysis about the needs and requirements.
      Change intent: "{{ .Change.Intent }}"

      What the change already concerns (impacts of the layers above: modified, or created; planned = to be written later):
      {{ range .ChangeImpacts }}- {{ .Key }} ({{ .Type }}, {{ .Intent }}{{ if .Planned }}, planned{{ end }}) {{ .Rationale }}
      {{ end }}
      Needs and requirements of the ALM repository (key, type, properties):
      {{ range .Commit.Nodes }}{{ if or (isa .Type "alm@Need") (isa .Type "alm@Requirement") }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}{{ end }}
      Name only the elements of this layer the change itself concerns DIRECTLY; the propagation along the ALM links
      follows, and qualifies what it finds. For each one, declare a change impact:
      {"type":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<key>","rationale":"why it is concerned"}}
      What this layer will need that does not exist yet (on a green field, where the repository holds nothing of
      this layer, that is all of it), plan its creation without writing it, under a new key in the style of the
      repository; the specification or the design writes it under that key (types: alm@Need, alm@FunctionalRequirement, alm@NonFunctionalRequirement, alm@SecurityRequirement):
      {"type":"changeImpact","changeImpact":{"op":"plan","type":"<type>","key":"<new key>","rationale":"what it will be, and why the change needs it"}}
      Finish with the summary of the pass (also when the layer is not concerned, or holds nothing yet):
      {"type":"artifact","target":"impact_pass","data":{"layer":"requirements","summary":"<what changes at this layer, what is new, and why>"}}

  - name: propagate_requirements
    kind: builtin
    builtin: graph.propagate
    description: Propagate the impacts to the needs and requirements (satisfies, refines)
    pre: {requirements_identified: true}
    effects: {requirements_propagated: true}
    cost: 1
    params:
      layer: requirements
      maxDepth: 6
      linkTypes: [alm@satisfies, alm@refines]
      declare: [alm@Need, alm@Requirement]

  - name: identify_functions
    kind: llm
    description: "Second pass: name the functions the change directly concerns, once the requirements are settled"
    pre: {requirements_propagated: true, requirements_confirmed: true}
    effects: {functions_identified: true}
    cost: 2
    model: default
    prompt: |
      You are an analyst in a software development lifecycle, on the pass of the impact analysis about the functions (the functional layer).
      Change intent: "{{ .Change.Intent }}"

      What the change already concerns (impacts of the layers above: modified, or created; planned = to be written later):
      {{ range .ChangeImpacts }}- {{ .Key }} ({{ .Type }}, {{ .Intent }}{{ if .Planned }}, planned{{ end }}) {{ .Rationale }}
      {{ end }}
      Functions of the ALM repository (key, type, properties):
      {{ range .Commit.Nodes }}{{ if isa .Type "alm@Function" }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}{{ end }}
      Name only the elements of this layer the change itself concerns (a new behaviour of an existing function, beyond what the impacted requirements carry); the propagation along the ALM links
      follows, and qualifies what it finds. For each one, declare a change impact:
      {"type":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<key>","rationale":"why it is concerned"}}
      What this layer will need that does not exist yet (on a green field, where the repository holds nothing of
      this layer, that is all of it), plan its creation without writing it, under a new key in the style of the
      repository; the specification or the design writes it under that key (types: alm@Function):
      {"type":"changeImpact","changeImpact":{"op":"plan","type":"<type>","key":"<new key>","rationale":"what it will be, and why the change needs it"}}
      Finish with the summary of the pass (also when the layer is not concerned, or holds nothing yet):
      {"type":"artifact","target":"impact_pass","data":{"layer":"functions","summary":"<what changes at this layer, what is new, and why>"}}

  - name: propagate_functions
    kind: builtin
    builtin: graph.propagate
    description: Propagate the impacts of the requirements to the functions realizing them
    pre: {functions_identified: true}
    effects: {functions_propagated: true}
    cost: 1
    params:
      layer: functions
      maxDepth: 2
      linkTypes: [alm@realizes]
      declare: [alm@Function]

  - name: identify_applications
    kind: llm
    description: "Third pass: name the elements of the logical layer the change directly concerns, once the functions are settled"
    pre: {functions_propagated: true, functions_confirmed: true}
    effects: {applications_identified: true}
    cost: 2
    model: default
    prompt: |
      You are an analyst in a software development lifecycle, on the pass of the impact analysis about the applications, solutions, interfaces, flows and data (the logical layer).
      Change intent: "{{ .Change.Intent }}"

      What the change already concerns (impacts of the layers above: modified, or created; planned = to be written later):
      {{ range .ChangeImpacts }}- {{ .Key }} ({{ .Type }}, {{ .Intent }}{{ if .Planned }}, planned{{ end }}) {{ .Rationale }}
      {{ end }}
      Applications, solutions, interfaces, flows and data of the ALM repository (key, type, properties):
      {{ range .Commit.Nodes }}{{ if or (isa .Type "alm@Application") (isa .Type "alm@Solution") (isa .Type "alm@Interface") (isa .Type "alm@Flow") (isa .Type "alm@Data") }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}{{ end }}
      Name only the elements of this layer the change itself concerns (a contract, a flow or a data structure to change); the propagation along the ALM links
      follows, and qualifies what it finds. For each one, declare a change impact:
      {"type":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<key>","rationale":"why it is concerned"}}
      What this layer will need that does not exist yet (on a green field, where the repository holds nothing of
      this layer, that is all of it), plan its creation without writing it, under a new key in the style of the
      repository; the specification or the design writes it under that key (types: alm@Application, alm@Solution, alm@Interface, alm@Flow, alm@Data):
      {"type":"changeImpact","changeImpact":{"op":"plan","type":"<type>","key":"<new key>","rationale":"what it will be, and why the change needs it"}}
      Finish with the summary of the pass (also when the layer is not concerned, or holds nothing yet):
      {"type":"artifact","target":"impact_pass","data":{"layer":"applications","summary":"<what changes at this layer, what is new, and why>"}}

  - name: propagate_applications
    kind: builtin
    builtin: graph.propagate
    description: "Propagate the impacts to the logical layer: the applications composed of the components implementing the functions, their solutions, interfaces, flows and data"
    pre: {applications_identified: true}
    effects: {applications_propagated: true}
    cost: 1
    params:
      layer: applications
      maxDepth: 6
      linkTypes: [alm@implements, alm@composed_of, alm@includes, alm@addresses, alm@exposed_by, alm@source, alm@target, alm@through, alm@owned_by, alm@exchanges, alm@carries]
      declare: [alm@Application, alm@Solution, alm@Interface, alm@Flow, alm@Data]

  - name: identify_components
    kind: llm
    description: "Fourth pass: name the components the change directly concerns, once the logical layer is settled"
    pre: {applications_propagated: true, applications_confirmed: true}
    effects: {components_identified: true}
    cost: 2
    model: default
    prompt: |
      You are an analyst in a software development lifecycle, on the pass of the impact analysis about the components and build artifacts (the physical layer).
      Change intent: "{{ .Change.Intent }}"

      What the change already concerns (impacts of the layers above: modified, or created; planned = to be written later):
      {{ range .ChangeImpacts }}- {{ .Key }} ({{ .Type }}, {{ .Intent }}{{ if .Planned }}, planned{{ end }}) {{ .Rationale }}
      {{ end }}
      Components and build artifacts of the ALM repository (key, type, properties):
      {{ range .Commit.Nodes }}{{ if or (isa .Type "alm@Component") (isa .Type "alm@BuildArtifact") }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}{{ end }}
      Name only the elements of this layer the change itself concerns (a technical change no function or application carries); the propagation along the ALM links
      follows, and qualifies what it finds. For each one, declare a change impact:
      {"type":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<key>","rationale":"why it is concerned"}}
      What this layer will need that does not exist yet (on a green field, where the repository holds nothing of
      this layer, that is all of it), plan its creation without writing it, under a new key in the style of the
      repository; the specification or the design writes it under that key (types: alm@Component, alm@BuildArtifact):
      {"type":"changeImpact","changeImpact":{"op":"plan","type":"<type>","key":"<new key>","rationale":"what it will be, and why the change needs it"}}
      Finish with the summary of the pass (also when the layer is not concerned, or holds nothing yet):
      {"type":"artifact","target":"impact_pass","data":{"layer":"components","summary":"<what changes at this layer, what is new, and why>"}}

  - name: propagate_components
    kind: builtin
    builtin: graph.propagate
    description: "Propagate the impacts to the physical layer: the components implementing the functions or composing the applications, those depending on them, their artifacts"
    pre: {components_identified: true}
    effects: {components_propagated: true}
    cost: 1
    params:
      layer: components
      maxDepth: 6
      linkTypes: [alm@implements, alm@depends_on, alm@built_from, alm@accesses]
      forward: [alm@composed_of, alm@deploys]
      declare: [alm@Component, alm@BuildArtifact]

  - name: select_scope
    kind: human
    description: Manually designate the needs and requirements directly impacted (fallback of the first pass)
    effects: {requirements_identified: true}
    cost: 8
    instructions: >
      Indicate the needs and requirements of the ALM repository the change directly concerns, and why (impacted change
      impacts), plan the ones the change needs that do not exist yet (planned creations: a type, a key, why; written
      by the specification), then record the pass: an artifact impact_pass with data {layer: requirements, summary}.

  # one suspected impact at a time (scope impact, ADR 0109 §3.5): the planner sees "a suspected impact is pending" and
  # reaches the aggregates of `confirmed`; the engine runs it for each pending impact, given as .Subject
  - name: qualify_impact
    kind: llm
    scope: impact
    where: self.conditions.suspected
    description: Qualify a suspected impact found by propagation; reject with the reason, then withdraw, what the change does not concern
    effects: {confirmed: true}
    cost: 1
    model: default
    prompt: |
      You qualify ONE suspected impact of a change, found by propagation along the ALM links: does the change really
      concern this element, or did the propagation go too far?
      Change: "{{ .Change.Title }}"
      Intent: "{{ .Change.Intent }}"
      Suspected impact: {{ .Subject.key }} ({{ .Subject.type }}), {{ .Subject.rationale }}
      Its properties: {{ json .Subject.props }}
      The brief lists the other impacts of the change and the passes of the analysis. Finish with your rating:
      {"type":"assessment","data":{"key":"impact:{{ .Subject.key }}","score":<0 to 5, how sure you are>,
       "verdict":"confirmed|refuted","findings":[{"text":"<why>","severity":"major|minor"}],
       "rated":"{{ fingerprint (printf "impact:%s" .Subject.key) }}"}}
      When the change does not concern it, also reject it with the reason, then withdraw it, in this order:
      {"type":"changeImpact","changeImpact":{"op":"review","node":"{{ .Subject.key }}","accept":false,"comment":"not impacted: <the reason>"}}
      {"type":"changeImpact","changeImpact":{"op":"remove","node":"{{ .Subject.key }}"}}

  - name: validate_impact_analysis
    kind: human
    description: Validate the impact analysis once its four passes are done
    pre: {components_propagated: true, requirements_confirmed: true, functions_confirmed: true, applications_confirmed: true, components_confirmed: true}
    effects: {impact_analysis_validated: true}
    emits: [impact.analysed]
    cost: 1
    instructions: >
      Review the impacts of the change, layer by layer (requirements, functions, applications, components): add what is
      missing, withdraw what is not concerned (reject it with the reason first). The planned creations (intent created,
      no content yet) are what the change will create: check their type, key and reason, the specification and the
      design write them. An analysis may find nothing existing concerned (a green field) and plan creations only, or
      nothing at all when the summaries of the passes say why: it is validated the same way. Then validate: an artifact
      impact_validation with data {accepted: true, comment}.

  # ======================= specification
  - name: specify_requirements
    kind: llm
    description: Revise the impacted requirements and create the new requirements
    pre: {impact_analysis_validated: true}
    effects: {requirements_specified: true}
    cost: 3
    model: default
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted elements (planned: a creation the analysis planned, to be written):
      {{ range .ChangeImpacts }}- {{ .Key }} ({{ .Type }}, {{ .Intent }}{{ if .Planned }}, planned{{ end }}) {{ if .Pre.ID }}{{ json .Pre.Properties }} {{ end }}: {{ .Rationale }}
      {{ end }}
      Write the needs and requirements the analysis planned under their key (a write creates them; withdraw one the
      change does not need after all: {"type":"changeImpact","changeImpact":{"op":"remove","node":"<planned key>"}}).
      Revise the impacted requirements and create new requirements (types:
      FunctionalRequirement, NonFunctionalRequirement, SecurityRequirement), each one
      linked to the need it satisfies. A revised requirement is an impacted change impact: move it to draft
      first (a transition: start from proposed, reopen from approved), then write it; a new requirement is
      declared then written with its link. The review of the change approves them afterwards:
      {"type":"changeImpact","changeImpact":{"op":"transition","node":"<impacted key>","state":"draft"}}
      {"type":"changeImpact","changeImpact":{"op":"write","node":"<impacted key>","props":{...}}}
      {"type":"changeImpact","changeImpact":{"op":"declare","ref":"#r1","intent":"created","type":"alm@FunctionalRequirement","key":"REQ-...","rationale":"why"}}
      {"type":"changeImpact","changeImpact":{"op":"write","node":"#r1","props":{"title":"...","priority":"high"},"links":[{"type":"alm@satisfies","to":"<need key>"}]}}
      {"type":"changeImpact","changeImpact":{"op":"write","node":"<planned key>","props":{"title":"...","priority":"high"},"links":[{"type":"alm@satisfies","to":"<need key>"}]}}

  - name: write_requirements
    kind: human
    description: Write the requirements (fallback)
    pre: {impact_analysis_validated: true}
    effects: {requirements_specified: true}
    cost: 8
    nodeTypes: [alm@Requirement, alm@FunctionalRequirement, alm@NonFunctionalRequirement, alm@SecurityRequirement]
    instructions: >
      Write the new versions of the impacted requirements and create the new
      requirements (with their "satisfies" link to the need), the planned ones under their key.

  - name: trace_requirements
    kind: script
    language: javascript
    description: Link each untraced new requirement to the needs in scope (systematic rule)
    pre: {requirements_specified: true}
    effects: {requirements_traced: true}
    cost: 1
    code: |
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        // needs in scope: impacted, or satisfied by the impacted requirements
        const needs = new Set();
        for (const n of nodes) {
          if (n.intent !== "modified" || !n.pre) continue;
          if (n.type === "alm@Need") needs.add(n.key);
          if (n.type.endsWith("Requirement")) {
            for (const l of ctx.links(n.key, "out", "alm@satisfies")) needs.add(l.to.key);
          }
        }
        let k = 0;
        for (const r of nodes) {
          if (r.intent !== "created" || !r.post || !r.type.endsWith("Requirement")) continue;
          if (r.links.some(l => l.type === "alm@satisfies" || l.type === "alm@refines")) continue;
          if (needs.size === 0) { ctx.warn(r.key + " : no need in scope"); continue; }
          ctx.writeNode(r.key, { links: [...needs].map(need => ({ type: "alm@satisfies", to: need })) });
          k += needs.size;
        }
        return k + " traceability link(s) written";
      }

  - name: trace_manually
    kind: human
    description: Manually trace requirements to needs (fallback)
    pre: {requirements_specified: true}
    effects: {requirements_traced: true}
    cost: 6
    nodeTypes: [alm@Need, alm@Requirement, alm@FunctionalRequirement, alm@NonFunctionalRequirement, alm@SecurityRequirement]
    instructions: Link each new requirement to the need it satisfies (or the requirement it refines).

  - name: plan_tests
    kind: script
    language: javascript
    description: One test case per created or revised requirement (level based on requirement type)
    pre: {requirements_specified: true}
    effects: {tests_planned: true}
    cost: 1
    code: |
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        const verified = new Set();
        for (const t of nodes) {
          if (t.intent === "created" && t.post) for (const l of t.links) if (l.type === "alm@verifies") verified.add(l.to.key);
        }
        let n = 0;
        for (const r of nodes) {
          if (!r.post || !r.type.endsWith("Requirement") || verified.has(r.key)) continue;
          const level = r.type === "alm@SecurityRequirement" ? "security"
            : r.type === "alm@NonFunctionalRequirement" ? "performance" : "acceptance";
          const title = (r.post.props && r.post.props.title) || r.key;
          const t = ctx.impactNodeCreate("alm@TestCase", "TST-" + r.key, "verifies " + r.key);
          ctx.writeNode(t, { props: { title: "Verify: " + title, level: level }, links: [{ type: "alm@verifies", to: r.key }] });
          n++;
        }
        return n + " test case(s) created";
      }

  # ======================= design
  - name: allocate_functions
    kind: script
    language: javascript
    description: Allocate each new requirement to a function (impacted function, otherwise a new function)
    pre: {requirements_specified: true, requirements_traced: true}
    effects: {functions_allocated: true}
    cost: 1
    code: |
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        const realized = new Set();
        for (const f of nodes) if (f.post) for (const l of f.links) if (l.type === "alm@realizes") realized.add(l.to.key);
        // the impacted functions, and the ones the analysis planned (written here at their first allocation)
        const functions = nodes.filter(f => f.type === "alm@Function" && (f.intent === "modified" || f.planned)).map(f => f.key).sort();
        const planned = new Set(nodes.filter(f => f.planned && f.type === "alm@Function").map(f => f.key));
        let n = 0;
        for (const r of nodes) {
          if (r.intent !== "created" || !r.post || !r.type.endsWith("Requirement") || realized.has(r.key)) continue;
          let fn = functions[0];
          if (!fn) {
            fn = ctx.impactNodeCreate("alm@Function", "FCT-" + r.key, "realizes " + r.key);
            ctx.writeNode(fn, { props: { title: "Function: " + ((r.post.props && r.post.props.title) || r.key) }, links: [{ type: "alm@realizes", to: r.key }] });
          } else if (planned.delete(fn)) {
            ctx.writeNode(fn, { props: { title: "Function: " + ((r.post.props && r.post.props.title) || r.key) }, links: [{ type: "alm@realizes", to: r.key }] });
          } else {
            ctx.writeNode(fn, { links: [{ type: "alm@realizes", to: r.key }] });
          }
          n++;
        }
        return n + " allocation(s)";
      }

  - name: design_solution
    kind: llm
    description: Design the evolution of components, interfaces, flows and data
    pre: {requirements_specified: true, requirements_traced: true, functions_allocated: true}
    effects: {design_done: true}
    cost: 3
    model: reasoning
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted elements:
      {{ range .ChangeImpacts }}{{ if eq .Intent "modified" }}- {{ .Key }} ({{ .Type }}) {{ json .Pre.Properties }}
      {{ end }}{{ end }}
      Change impacts already made (planned: a creation the analysis planned, to be written under its key):
      {{ range .ChangeImpacts }}- {{ .Intent }}{{ if .Planned }} planned{{ end }} {{ .Type }} {{ .Key }}: {{ .Rationale }}
      {{ end }}
      Design the evolution: components to modify (declare the impacted one if it is not, then write
      version / technology props) or to create (type Component, technology java|c|shell|…, an
      implements link to the function), interfaces (exposed_by, exchanges), flows
      (source, target, through, carries) and data, as change impacts:
      {"type":"changeImpact","changeImpact":{"op":"declare","ref":"#c1","intent":"created","type":"alm@Component","key":"CMP-...","rationale":"why"}}
      {"type":"changeImpact","changeImpact":{"op":"write","node":"#c1","props":{...},"links":[{"type":"alm@implements","to":"<function key>"}]}}
      Write the components, interfaces, flows and data the analysis planned under their key (or remove the ones the
      design does not need):
      {"type":"changeImpact","changeImpact":{"op":"write","node":"<planned key>","props":{...},"links":[...]}}
      End with
      {"type":"artifact","target":"design","data":{"summary":"...","decisions":["..."]}}

  - name: write_design
    kind: human
    description: Describe the design (fallback)
    pre: {requirements_specified: true, requirements_traced: true, functions_allocated: true}
    effects: {design_done: true}
    cost: 8
    utility: 'has(vars.design) && vars.design == "manual" ? 2.0 : 0.3'
    nodeTypes: [alm@Component, alm@Interface, alm@Flow, alm@Data]
    instructions: >
      Write the changes to components, interfaces, flows and data (change impacts), the planned
      creations under their key, then a "design" artifact summarizing the decisions.

  - name: check_design
    kind: script
    language: javascript
    description: Check the consistency of the design (mandatory links of created elements)
    pre: {design_done: true}
    effects: {design_checked: true}
    cost: 1
    code: |
      function run(ctx) {
        const required = {
          Component: ["implements"], Interface: ["exposed_by"], Flow: ["source", "target", "carries"],
          BuildArtifact: ["built_from"], Data: ["owned_by"],
        };
        const issues = [];
        for (const n of ctx.changeImpacts()) {
          const kind = n.type.split("@").pop();
          if (n.intent !== "created" || !required[kind]) continue;
          if (n.planned) { issues.push(n.type + " " + n.key + " : planned, not designed yet (write or withdraw it)"); continue; }
          for (const t of required[kind]) {
            if (!n.post || !n.links.some(l => l.type === "alm@" + t)) issues.push(n.type + " " + n.key + " : missing link \"" + t + "\"");
          }
        }
        for (const i of issues) ctx.warn(i);
        ctx.addArtifact("design_check", { ok: issues.length === 0, issues: issues });
        return issues.length + " issue(s)";
      }

  # ======================= build (abstract action, specialized by technology)
  - name: build
    kind: abstract
    description: >
      Build the impacted or created components. Abstract action: each
      execution builds the components of one technology (specialization), until
      all of them have their artifact.
    # the components built from their sources first (ADR 0118): this build records the others
    pre: {impact_analysis_validated: true, design_checked: true, sources_published: true}
    effects: {build_complete: true}
    cost: 2
    incremental: true

  - name: build_java
    kind: script
    language: javascript
    specializes: build
    params: {technology: java}
    priority: 30
    description: "Java build: Maven, JDK 21, dependency check and coverage"
    when: >
      changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.technology) && n.props.technology == "java"
        && !(has(n.props.repository) && n.props.repository != "")
        && !artifacts.exists(a, a.target == "build" && a.data.component == n.key))
    code: &build |
      const RULES = {
        java:  { format: "jar", toolchain: "maven 3.9 / JDK 21", checks: ["mvn -B verify", "OWASP dependency-check", "JaCoCo ≥ 80 %"],
                 coordinates: (c, v) => "com.acme:" + c + ":" + v },
        c:     { format: "elf", toolchain: "gcc 13 / make", checks: ["-Wall -Wextra -Werror", "cppcheck", "valgrind on the tests"],
                 coordinates: (c, v) => c + "-" + v + "-linux-x86_64" },
        shell: { format: "tar.gz", toolchain: "bash 5", checks: ["shellcheck -S warning", "bats"],
                 coordinates: (c, v) => c + "-" + v + ".tar.gz" },
        other: { format: "tar.gz", toolchain: "archive", checks: ["sha256"],
                 coordinates: (c, v) => c + "-" + v + ".tar.gz" },
      };
      function bump(v) {
        const p = String(v || "0.0.0").split(".");
        while (p.length < 3) p.push("0");
        p[2] = String((parseInt(p[2], 10) || 0) + 1);
        return p.join(".");
      }
      // components in scope without a build artifact
      function pending(ctx) {
        const built = new Set(ctx.items("artifact").filter(a => a.target === "build").map(a => a.data.component));
        const out = [];
        for (const n of ctx.changeImpacts()) {
          if (n.type !== "alm@Component" || built.has(n.key)) continue;
          const props = (n.post && n.post.props) || (n.pre && n.pre.props) || {};
          // a component with a repository is built from its sources, in the workspace (publish_build)
          if (props.repository) continue;
          out.push({ key: n.key, props: props, existing: n.intent === "modified" });
        }
        return out;
      }
      function build(ctx, tech) {
        const known = ["java", "c", "shell"];
        const mine = pending(ctx).filter(c => tech === "other" ? !known.includes(c.props.technology) : c.props.technology === tech);
        const r = RULES[tech];
        const declared = new Set(ctx.changeImpacts().map(n => n.key));
        for (const c of mine) {
          const name = String(c.props.title || c.key);
          const v = bump(c.props.version);
          const key = "ART-" + c.key + "-" + v;
          const art = ctx.impactNodeCreate("alm@BuildArtifact", key, "build artifact of " + c.key);
          ctx.writeNode(art, { props: { name: name, format: r.format, version: v, technology: c.props.technology || "",
            coordinates: r.coordinates(name, v), toolchain: r.toolchain, checks: r.checks }, links: [{ type: "alm@built_from", to: c.key }] });
          if (c.existing) {
            // the applications composed of the component deploy the new artifact
            for (const l of ctx.links(c.key, "in", "alm@composed_of")) {
              const app = l.from.key;
              if (!declared.has(app)) { ctx.impactNode(app, "deploys the new artifact " + key); declared.add(app); }
              ctx.writeNode(app, { links: [{ type: "alm@deploys", to: key }] });
            }
          }
          ctx.addArtifact("build", { component: c.key, technology: c.props.technology || "", version: v, artifact: key, toolchain: r.toolchain, checks: r.checks });
        }
        return mine.length + " " + tech + " component(s) built";
      }
      function run(ctx) { return build(ctx, ctx.param("technology") || "other"); }

  - name: build_c
    kind: script
    language: javascript
    specializes: build
    params: {technology: c}
    priority: 20
    description: "C build: gcc / make, blocking warnings, static analysis"
    when: >
      changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.technology) && n.props.technology == "c"
        && !(has(n.props.repository) && n.props.repository != "")
        && !artifacts.exists(a, a.target == "build" && a.data.component == n.key))
    code: *build

  - name: build_shell
    kind: script
    language: javascript
    specializes: build
    params: {technology: shell}
    priority: 10
    description: "Shell build: shellcheck, bats tests, archive"
    when: >
      changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.technology) && n.props.technology == "shell"
        && !(has(n.props.repository) && n.props.repository != "")
        && !artifacts.exists(a, a.target == "build" && a.data.component == n.key))
    code: *build

  - name: build_generic
    kind: script
    language: javascript
    specializes: build
    params: {technology: other}
    description: "Generic build (other technologies): archive and checksum"
    code: *build

  # ======================= build from the sources, in the workspace of the change (ADR 0118)
  - name: prepare_workspace
    kind: script
    language: javascript
    description: Open the workspace of the change with the sources of the components built from their sources, each on the branch of the change
    pre: {impact_analysis_validated: true, design_checked: true}
    effects: {workspace_ready: true}
    mcps: [workspace]
    code: |
      function run(ctx) {
        const sources = [];
        for (const n of ctx.changeImpacts()) {
          if (n.type !== "alm@Component") continue;
          const props = (n.post && n.post.props) || (n.pre && n.pre.props) || {};
          if (props.repository) sources.push({ repo: props.repository, path: n.key });
        }
        const ws = ctx.callTool("workspace/open", { sources: sources });
        ctx.addArtifact("workspace", { directory: ws.directory, sources: ws.sources });
        return sources.length + " source(s) in the workspace";
      }

  - name: implement_component
    kind: llm
    scope: impact
    where: self.conditions.from_sources
    description: Implement in the sources of a component what the change asks of it, built and tested; again after a failed build
    pre: {workspace_ready: true}
    effects: {implemented: true}
    cost: 1
    model: default
    mcps: [workspace, goap-graph]
    parallel: 2
    loop: {maxRounds: 200, maxTokens: 3000000, timeout: 2h, maxToolResultBytes: 60000}
    prompt: |
      You are a developer. You implement ONE component of a change in its sources, in the workspace of the change.
      Change: "{{ .Change.Title }}"
      Intent: "{{ .Change.Intent }}"
      Component to implement: {{ .Subject.key }} ({{ .Subject.type }}), {{ json .Subject.props }}
      Its sources are in the directory {{ .Subject.key }} of the workspace, on the branch of the change.
      The brief lists the requirements, functions and design of the change: read the nodes you need with goap-graph
      (the functions the component implements, the requirements they realize, the test cases verifying them).
      {{ range .Artifacts }}{{ if and (eq .Target "build_report") (eq (index .Data "component") $.Subject.key) }}A build of this component {{ if index .Data "ok" }}succeeded{{ else }}FAILED{{ end }} (`{{ index .Data "command" }}`, after code change {{ index .Data "revision" }}):
      {{ index .Data "output" }}
      {{ end }}{{ if eq .Target "poc_findings" }}A proof of concept of this change ({{ index .Data "change" }}) concluded: {{ index .Data "summary" }}
      Its verdicts: {{ json (index .Data "verdicts") }}; its code (a reference only, never copied as is): {{ json (index .Data "branches") }}; it was built without the rules of the delivery: learn from it, build again here.
      {{ end }}{{ end }}
      Work with the workspace tools: read and search the code, edit it, run the build and the tests with bash (cwd
      {{ .Subject.key }}) until they pass, then commit your work there (git add -A && git commit -m "<what and why>").
      Change only what the change needs. Finish with:
      {"items":[{"type":"artifact","target":"code_change","data":{"component":"{{ .Subject.key }}","summary":"<what you changed and why>","files":["<paths>"],"tests":"<what you ran, the result>"}}]}

  - name: build_component
    kind: script
    language: javascript
    scope: impact
    where: self.conditions.from_sources
    description: Build and test a component in the workspace (its build command, else the one of its technology) and record the report
    pre: {implemented: true}
    effects: {build_checked: true}
    mcps: [workspace]
    code: |
      const COMMANDS = { java: "mvn -B -q verify", go: "go build ./... && go test ./...", c: "make && make test",
                         shell: "shellcheck $(git ls-files '*.sh')", node: "npm ci && npm test", python: "python -m pytest -q" };
      function run(ctx) {
        const c = ctx.var("item");
        const props = c.props || {};
        const command = props.buildCommand || COMMANDS[props.technology] || "git diff --quiet HEAD";
        const revision = ctx.items("artifact").filter(a => a.target === "code_change" && a.data.component === c.key).length;
        const r = ctx.callTool("workspace/bash", { command: command, cwd: c.key, timeout: 600 });
        const out = String(r.stdout || "") + String(r.stderr || "");
        const ok = r.exitCode === 0 && !r.timedOut;
        ctx.addArtifact("build_report", { component: c.key, ok: ok, exitCode: r.exitCode, command: command, revision: revision,
          output: out.length > 4000 ? "..." + out.slice(out.length - 4000) : out });
        return c.key + (ok ? " builds" : " does not build");
      }

  - name: publish_build
    kind: script
    language: javascript
    scope: impact
    where: self.conditions.from_sources
    description: Push the branch of the change of a component that builds and record its build artifact
    # build_checked chains it after the build in a plan (the outcome is not known before); built holds it to a success
    pre: {build_checked: true, built: true}
    effects: {published: true}
    mcps: [workspace]
    code: |
      function bump(v) {
        const p = String(v || "0.0.0").split(".");
        while (p.length < 3) p.push("0");
        p[2] = String((parseInt(p[2], 10) || 0) + 1);
        return p.join(".");
      }
      function run(ctx) {
        const c = ctx.var("item");
        const props = c.props || {};
        const reports = ctx.items("artifact").filter(a => a.target === "build_report" && a.data.component === c.key && a.data.ok);
        const report = reports[reports.length - 1].data;
        const pushed = ctx.callTool("workspace/push", { path: c.key });
        const v = bump(props.version);
        const key = "ART-" + c.key + "-" + v;
        const art = ctx.impactNodeCreate("alm@BuildArtifact", key, "build artifact of " + c.key + ", branch " + pushed.branch);
        ctx.writeNode(art, { props: { name: String(props.title || c.key), format: "source", version: v, technology: props.technology || "",
          coordinates: pushed.remote + "#" + pushed.head, toolchain: report.command,
          checks: { command: report.command, exitCode: report.exitCode, commit: pushed.head } }, links: [{ type: "alm@built_from", to: c.key }] });
        if (c.intent === "modified") {
          // the applications composed of the component deploy the new artifact
          const declared = new Set(ctx.changeImpacts().map(n => n.key));
          for (const l of ctx.links(c.key, "in", "alm@composed_of")) {
            const app = l.from.key;
            if (!declared.has(app)) { ctx.impactNode(app, "deploys the new artifact " + key); declared.add(app); }
            ctx.writeNode(app, { links: [{ type: "alm@deploys", to: key }] });
          }
        }
        ctx.addArtifact("build", { component: c.key, technology: props.technology || "", version: v, artifact: key,
          toolchain: report.command, checks: [report.command], branch: pushed.branch, commit: pushed.head });
        return c.key + " published at " + pushed.head;
      }

  # ======================= releases and environments
  - name: plan_release
    kind: script
    language: javascript
    description: >
      Build one release per application that deploys a new artifact (next minor version,
      contains / releases links) and freeze the environment chain (promotes_to order)
    pre: {requirements_specified: true, build_complete: true}
    effects: {release_planned: true}
    cost: 1
    code: |
      function bumpMinor(v) {
        const p = String(v || "0.0").split(".");
        while (p.length < 2) p.push("0");
        p[1] = String((parseInt(p[1], 10) || 0) + 1);
        return p.slice(0, 2).join(".");
      }
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        const artifacts = new Set(nodes.filter(n => n.intent === "created" && n.type === "alm@BuildArtifact").map(n => n.key));
        // applications receiving a new artifact (deploys links written by the build)
        const byApp = new Map();
        for (const n of nodes) {
          if (!n.post) continue;
          for (const l of n.links) {
            if (l.type !== "alm@deploys" || !artifacts.has(l.to.key)) continue;
            if (!byApp.has(n.key)) byApp.set(n.key, []);
            byApp.get(n.key).push(l.to.key);
          }
        }
        const releases = [];
        for (const [app, arts] of byApp) {
          const node = ctx.node(app);
          const v = bumpMinor(node.props.version);
          const key = "REL-" + app + "-" + v;
          const r = ctx.impactNodeCreate("alm@Release", key, "release " + v + " of " + app);
          ctx.writeNode(r, {
            props: { title: (node.props.title || app) + " " + v, version: v, status: "candidate" },
            links: [{ type: "alm@releases", to: app }].concat(arts.map(a => ({ type: "alm@contains", to: a }))),
          });
          releases.push(key);
        }
        // environment chain: ascending order (order property)
        const pipeline = ctx.nodes("alm@Environment")
          .map(e => ({ key: e.key, name: e.props.name || e.key, stage: e.props.stage || "", order: Number(e.props.order || 0) }))
          .sort((a, b) => a.order - b.order);
        ctx.addArtifact("release_plan", { releases: releases, pipeline: pipeline });
        return releases.length + " release(s), " + pipeline.length + " environment(s)";
      }

  # ======================= delivery
  - name: write_release_note
    kind: llm
    description: Write the release note
    pre: {requirements_specified: true, tests_planned: true, design_checked: true, build_complete: true, release_planned: true}
    effects: {release_noted: true}
    cost: 1
    model: fast
    prompt: |
      Intent: "{{ .Change.Intent }}"
      Change impacts:
      {{ range .ChangeImpacts }}- {{ .Intent }} {{ .Type }} {{ .Key }}: {{ .Rationale }}
      {{ end }}
      Artifacts:
      {{ range .Artifacts }}- {{ .Target }} {{ json .Data }}
      {{ end }}
      Write the release note (requirements, components, artifacts, releases,
      affected applications, tests, deployment chain):
      {"type":"artifact","target":"release_note","data":{"markdown":"..."}}

  - name: assemble_release_note
    kind: script
    language: javascript
    description: Assemble the release note from the change (deterministic fallback)
    pre: {requirements_specified: true, tests_planned: true, design_checked: true, build_complete: true, release_planned: true}
    effects: {release_noted: true}
    cost: 3
    code: |
      function run(ctx) {
        const lines = ["# Release Note", "", "Intent: " + ctx.intent(), ""];
        const section = (title, rows) => { if (rows.length) { lines.push("## " + title, ...rows.map(r => "- " + r), ""); } };
        const nodes = ctx.changeImpacts().filter(n => n.post || n.intent === "created");
        const verb = n => (n.intent === "created" ? "create " : "update ");
        section("Requirements", nodes.filter(n => n.type.endsWith("Requirement")).map(n => verb(n) + n.key));
        section("Design", nodes.filter(n => ["alm@Function", "alm@Component", "alm@Interface", "alm@Flow", "alm@Data"].includes(n.type)).map(n => verb(n) + n.type + " " + n.key));
        section("Build artifacts", ctx.items("artifact").filter(a => a.target === "build").map(a => a.data.artifact + " (" + a.data.toolchain + ")"));
        section("Tests", nodes.filter(n => n.type === "alm@TestCase").map(n => n.key));
        section("Releases", nodes.filter(n => n.type === "alm@Release").map(n => n.key + " " + ((n.post && n.post.props.title) || "")));
        const plan = ctx.items("artifact").filter(a => a.target === "release_plan").pop();
        if (plan) section("Deployment", [plan.data.pipeline.map(e => e.name + " (" + e.stage + ")").join(" → ")]);
        section("Affected applications", ctx.changeImpacts().filter(n => n.intent === "modified" && n.type === "alm@Application" && n.pre).map(n => n.key + " " + (n.pre.props.title || "")));
        ctx.addArtifact("release_note", { markdown: lines.join("\n") });
        return "release note assembled";
      }

  - name: review
    kind: human
    description: Review of the change (requirements, design, artifacts, tests)
    pre: {release_noted: true}
    effects: {reviewed: true}
    cost: 2
    instructions: Accept or reject each change impact (impacts, requirements, design, artifacts, tests, releases) based on the release note and the design check; a comment is required.

  - name: approve_requirements
    kind: script
    language: javascript
    description: >
      Approve the requirements the review accepted: move them to approved, in place on their working version (it is
      frozen when the change commits); the approval guard reads the accepted review (ADR 0076, 0077). The releases planned in the
      change, created in draft, are put forward as candidates the same way
    pre: {reviewed: true}
    effects: {requirements_approved: true}
    cost: 1
    code: |
      function run(ctx) {
        const types = ["alm@Requirement", "alm@FunctionalRequirement", "alm@NonFunctionalRequirement", "alm@SecurityRequirement"];
        let approved = 0;
        for (const n of ctx.changeImpacts()) {
          if (!types.includes(n.type) || n.review !== "accepted" || !n.post) continue;
          const state = n.post.state;
          if (state === "proposed") ctx.impactNodeTransition(n.key, "draft");
          if (state === "proposed" || state === "draft") {
            ctx.impactNodeTransition(n.key, "approved");
            approved++;
          }
        }
        let candidates = 0;
        for (const n of ctx.changeImpacts()) {
          if (n.type !== "alm@Release" || n.review !== "accepted" || !n.post || n.post.state !== "draft") continue;
          ctx.impactNodeTransition(n.key, "candidate");
          candidates++;
        }
        ctx.addArtifact("requirements_approval", { approved: approved, candidates: candidates });
        return approved + " requirement(s) approved";
      }

  # ======================= deployment (abstract, incremental, specialized by environment stage)
  - name: deploy
    kind: abstract
    description: >
      Deploy the releases to the next environment in the chain. Each execution is a wave
      (one environment); the specialization depends on the stage: automatic in dev / test, staging
      checks in staging, change window and release manager approval in production.
    pre: {reviewed: true}
    effects: {rolled_out: true}
    cost: 2
    incremental: true

  - name: deploy_auto
    kind: script
    language: javascript
    specializes: deploy
    description: "Automatic deployment (dev, test): unit tests and smoke tests"
    params: {checks: [unit tests, smoke tests]}
    code: &deploy |
      function run(ctx) {
        const plan = ctx.items("artifact").filter(a => a.target === "release_plan").pop();
        const waves = ctx.items("artifact").filter(a => a.target === "deployment_wave");
        const env = plan.data.pipeline[waves.length];
        if (!env) throw new Error("all waves are deployed");
        const checks = ctx.param("checks") || [];
        const tests = ctx.changeImpacts().filter(n => n.intent === "created" && n.type === "alm@TestCase" && n.post);
        const campaign = {};
        for (const t of tests) campaign[t.post.props.level || "acceptance"] = (campaign[t.post.props.level || "acceptance"] || 0) + 1;
        for (const r of plan.data.releases) {
          const d = ctx.impactNodeCreate("alm@Deployment", "DEP-" + r + "-" + env.key, "deployment of " + r + " to " + env.name);
          ctx.writeNode(d, { props: { status: "succeeded", stage: env.stage, checks: checks },
            links: [{ type: "alm@of_release", to: r }, { type: "alm@in_environment", to: env.key }] });
          // a deployment is recorded once done: no review to wait for
          ctx.impactNodeReview(d, true, "deployment recorded");
        }
        ctx.addArtifact("deployment_wave", { environment: env.key, name: env.name, stage: env.stage, releases: plan.data.releases,
          checks: checks, tests: campaign });
        return plan.data.releases.length + " release(s) deployed to " + env.name;
      }

  - name: deploy_staging
    kind: script
    language: javascript
    specializes: deploy
    priority: 10
    description: "Staging deployment: regression, performance, security (test case campaign)"
    when: >
      artifacts.exists(p, p.target == "release_plan"
        && p.data.pipeline[size(artifacts.filter(w, w.target == "deployment_wave"))].stage == "staging")
    params: {checks: [regression tests, performance tests, security tests (DAST), business acceptance testing]}
    code: *deploy

  - name: deploy_production
    kind: script
    language: javascript
    specializes: deploy
    priority: 20
    permission: release:deploy
    description: "Production deployment: change window, rollback plan, release manager approval"
    when: >
      artifacts.exists(p, p.target == "release_plan"
        && p.data.pipeline[size(artifacts.filter(w, w.target == "deployment_wave"))].stage == "prod")
    params: {checks: [change window, rollback plan, post-deployment monitoring]}
    code: *deploy

  - name: apply_change
    kind: builtin
    builtin: graph.apply
    description: Apply the change to the ALM repository (new commit, including releases and deployments)
    # the change commits delivered (ADR 0132): the gate of the delivery took it there
    pre: {reviewed: true, requirements_approved: true, rolled_out: true, "gate:software_delivery/delivery_gate": true}
    effects: {applied: true}
    cost: 1
    permission: change:apply

  # ======================= proofs of concept and prototypes (ADR 0131)
  - name: open_poc
    kind: human
    language: javascript
    scope: action
    where: self.kind == "poc" && self.status == "open"
    description: Open a proposed proof of concept or prototype as a sub-change, with what it checks
    effects: {poc_opened: true}
    cost: 2
    mcps: [goap-change]
    instructions: >
      A proof of concept (or a prototype, during the framing) is proposed on the risk register. Say what it starts
      from and how long it may take: it opens a sub-change of the poc methodology that builds the least that shows
      whether its hypotheses hold, without the quality rules of the delivery, and commits nothing. Cancel the action on
      the register instead if it is not worth it.
    form:
      title: Open the proof of concept
      fields:
        - {name: hypotheses, widget: textarea, label: What to check, help: "One statement per line, on top of the risks of the action (a prototype: what the need should look like)"}
        - {name: repositories, widget: textarea, label: Sources, help: "The repositories it starts from, one per line (none: an empty workspace, for a mock-up)"}
        - {name: timebox, widget: text, label: Timebox, help: "How long it may take, e.g. 2 days"}
        - {name: notes, widget: textarea, label: Notes, help: "What to try, who to ask"}
    code: |
      function lines(s) { return String(s || "").split("\n").map(x => x.trim()).filter(x => x); }
      function run(ctx) {
        const a = ctx.var("item");
        const f = ctx.var("form") || {};
        const titles = {};
        for (const r of ctx.items("risk")) if (r.data.title) titles[r.data.key] = r.data.title;
        // the hypotheses are its requirements: a risk it checks holds, or a statement about the need
        const hypotheses = [];
        for (const k of (a.risks || [])) hypotheses.push({ statement: k + " holds: " + (titles[k] || k), source: k });
        for (const st of (a.hypotheses || []).concat(lines(f.hypotheses))) hypotheses.push({ statement: st, source: "framing" });
        if (hypotheses.length === 0) throw new Error("the proof of concept checks nothing: name a risk on the action, or a statement");
        const me = ctx.callTool("goap-change/read", {}).change;
        const what = a.purpose === "explore" ? "Prototype" : "POC";
        const intent = what + " for " + me.title + ": " + hypotheses.map(h => h.statement).join("; ") +
          (f.timebox ? " (timebox " + f.timebox + ")" : "");
        const sub = ctx.callTool("goap-change/create", { parent: me.id, title: what + ": " + a.title, intent: intent,
          methodology: "poc", criticality: "C1", data: { poc: { action: a.key, purpose: a.purpose, parent: me.id } } }).change;
        // what it checks, for the sub-change to state as its own hypotheses
        ctx.callTool("goap-change/note", { change: sub.id, target: "poc_scope", text: intent, data: { action: a.key,
          purpose: a.purpose, parent: me.id, hypotheses: hypotheses, repositories: lines(f.repositories),
          timebox: f.timebox || "", notes: f.notes || "" } });
        ctx.addItem("action", { key: a.key, title: a.title, change: sub.id });
        return what + " opened: " + sub.id;
      }

  - name: conclude_poc
    kind: script
    language: javascript
    scope: action
    where: self.kind == "poc"
    description: Take back the verdicts of a concluded proof of concept, settle its risks and close its sub-change
    pre: {poc_opened: true, poc_concluded_now: true}
    effects: {poc_settled: true}
    mcps: [goap-change]
    code: |
      function run(ctx) {
        const a = ctx.var("item");
        const sub = ctx.callTool("goap-change/read", { change: a.change });
        const items = sub.items || [];
        const last = (type, key) => items.filter(i => i.type === type && i.data && i.data.key === key).pop();
        const conclusion = items.filter(i => i.type === "artifact" && i.target === "poc_conclusion").pop();
        const kept = items.filter(i => i.type === "artifact" && i.target === "probes_kept").pop();
        const titles = {};
        for (const r of ctx.items("risk")) if (r.data.title) titles[r.data.key] = r.data.title;
        const verdicts = [];
        for (const h of items.filter(i => i.type === "hypothesis")) {
          const v = last("assessment", "item:" + h.data.key);
          const verdict = v ? v.data.verdict : "confirmed"; // no verdict: it was not shown to work
          const findings = v && v.data.findings ? v.data.findings : [];
          verdicts.push({ hypothesis: h.data.key, statement: h.data.statement, source: h.data.source, verdict: verdict,
            findings: findings, suggestion: v ? v.data.suggestion || "" : "" });
          const risk = h.data.source;
          if (!titles[risk]) continue;
          // the verdict on the risk, where the register reads it (ADR 0110 §6, the bubble of the risk)
          ctx.addItem("assessment", { key: "item:" + risk, verdict: verdict, score: v ? v.data.score : 0, findings: findings,
            from: a.change });
          if (verdict === "refuted") {
            ctx.addItem("risk", { key: risk, title: titles[risk], status: "closed",
              rationale: "the proof of concept " + a.key + " showed it works as expected (" + a.change + ")" });
          } else {
            // it holds: the concluded POC no longer covers it, the risk management asks for another mitigation
            ctx.addItem("risk", { key: risk, title: titles[risk], status: "open",
              rationale: "the proof of concept " + a.key + " confirmed it (" + a.change + "): another mitigation is needed" });
          }
        }
        const findings = { action: a.key, purpose: a.purpose, change: a.change, verdicts: verdicts,
          summary: conclusion ? conclusion.data.summary || "" : "", branches: kept ? kept.data.branches || [] : [] };
        // for the delivery: what the POC learnt and where its code is, a reference, never reused as is (ADR 0131 §5)
        ctx.addArtifact("poc_findings", findings);
        if (a.purpose === "explore") {
          // for the person confirming the framing: never applied to the description by itself (ADR 0110 §4)
          ctx.addArtifact("prototype_findings", findings);
        }
        const result = verdicts.map(v => v.hypothesis + " " + v.verdict + ": " + v.statement).join("; ");
        ctx.addItem("action", { key: a.key, title: a.title, status: "done", result: result });
        ctx.callTool("goap-change/close", { change: a.change, reason: "proof of concept concluded, nothing to commit" });
        return a.key + " concluded: " + result;
      }

goals:
  - name: formulate
    description: Attach a request to the change that should carry it (an open one it continues, or this new one, well-defined)
    examples: ["I need the checkout flow changed to support vouchers", "please fix the refund bug reported by support", "add a new requirement for SSO login"]
    pre: {formulated: true}
    value: 1
  - name: analyze_impact
    description: Measure the impact of a change on the ALM chain, layer by layer, validated by a person
    examples: ["what is the impact", "what does this break", "impact analysis"]
    pre: {impact_analysis_validated: true}
    value: 3
  - name: specify
    description: Specify the requirements of a change, traced and verified
    examples: ["specify the need", "write the requirements", "new requirement"]
    pre: {requirements_specified: true, requirements_traced: true, tests_planned: true}
    value: 5
  - name: design
    description: Design the evolution of the solution (functions, components, interfaces, flows, data)
    examples: ["design", "architecture", "which components to modify"]
    pre: {requirements_specified: true, functions_allocated: true, design_checked: true}
    value: 6
  - name: build_components
    description: Build the impacted components
    examples: ["build the components", "build", "deliver the artifacts"]
    pre: {components_in_scope: true, build_complete: true}
    value: 7
  - name: release
    description: Build the releases and deploy them to all environments
    examples: ["deploy to production", "deploy the release", "deliver to staging"]
    pre: {release_planned: true, rolled_out: true}
    value: 8
  - name: deliver
    description: Deliver a change end-to-end, from requirement to updated repository
    examples: ["deliver an enhancement", "develop a new feature", "carry out the change"]
    pre: {applied: true}
    value: 10

agents:
  - name: intake
    description: Change formulation — finds the open change a request continues, or clarifies it into a new one
    examples: ["I need the checkout flow changed to support vouchers", "please fix the refund bug reported by support", "add a new requirement for SSO login"]
    planner: goap
    actions: [find_or_create_change]
    goals: [formulate]
    mcps: [goap-scheduler]
  - name: analyst
    description: Analyst — scope, impacts, requirements, traceability, test plan
    examples: ["impact analysis", "specify the requirements", "what is the impact of this need"]
    planner: goap
    actions: [identify_requirements, select_scope, propagate_requirements, identify_functions, propagate_functions, identify_applications, propagate_applications, identify_components, propagate_components, qualify_impact, validate_impact_analysis, specify_requirements, write_requirements,
              trace_requirements, trace_manually, plan_tests]
    goals: [analyze_impact, specify]
  - name: builder
    description: Integrator — build the components according to their technology
    examples: ["build the components", "build"]
    planner: goap
    actions: [identify_requirements, select_scope, propagate_requirements, identify_functions, propagate_functions, identify_applications, propagate_applications, identify_components, propagate_components, qualify_impact, validate_impact_analysis, specify_requirements, write_requirements,
              trace_requirements, trace_manually, allocate_functions, design_solution, write_design, check_design, build,
              prepare_workspace, implement_component, build_component, publish_build]
    goals: [build_components]
  - name: release_manager
    description: Release manager — releases, release note, review, step-by-step deployment
    examples: ["deploy to production", "deploy the release to the environments"]
    planner: goap
    goals: [release]
  - name: delivery
    description: End-to-end delivery — from intent to updated ALM repository
    examples: ["deliver an enhancement", "develop a feature end-to-end"]
    planner: goap
    goals: [deliver]

# Roles (ADR 0035 §2): the roles the processes and methods assign, RACI style. The methodology names roles, never
# people: the organisation assigns them to users per unit ("developer@TEAM-PAY"), and a role held in a unit holds in
# the units below it. The responsible role performs the human tasks of a step, the accountable role may approve its
# gates (never on its own change).
roles:
  - {name: product_owner, description: Owns the need and accepts how a change is framed and analysed}
  - {name: business_analyst, description: Frames the changes with their requesters and analyses them}
  - {name: solution_architect, description: "Designs the components, interfaces, flows and data"}
  - {name: tech_lead, description: Answers for the technical quality of a delivery; reviews it}
  - {name: developer, description: Builds and tests the components}
  - {name: release_manager, description: Plans and carries out releases and deployments}
  - {name: service_owner, description: Answers for the service in operation}
  - {name: change_approver, description: Approves the application of changes to the repository}

# Methods (ADR 0035 §1): everything is an activity. A method is the variant of a step capability for a context
# (`for`, `when`, `priority`): it says how and with what, as the activities that compose it (steps, down to actions,
# which are not broken down further) with their tools. The agent it names is the actor: it performs those activities
# and has access to them, and to the tools their actions declare. A step names the capability (`method: design`); the
# applicable method with the highest priority is chosen at execution, and its guidance and references reach its agent.
methods:
  # The reviewing method of the framing (ADR 0110, 0130): the rating of the description, every activity carried out by
  # an agent, autonomous or human. The method is planned (goap): the llm action is the cheapest and comes first, the
  # human one is the fallback the planner takes when the llm action cannot run or keeps failing. The step of the
  # framing naming it is an automatic review: it starts by itself on the events of the description.
  - name: description_rating
    for: description_rating
    description: Rate the description of the change, by a model first, by a person when no model can
    planner: goap
    actions: [rate_description, rate_description_by_hand]
    done: {description_rated: true}
    roles: {responsible: business_analyst, accountable: product_owner}
    # not persistent (ADR 0112 §4): a rating depends only on the description as it is, so every edit gets an
    # independent run; what joins them is the discussion of the topic `description` (the earlier ratings and the
    # requester's remarks), which the brief gives every run
  # The impact analysis (ADR 0109): four passes, one layer each, so that nothing is done all at once and each layer
  # starts from what the layer above settled. Each pass names what its layer directly carries of the change,
  # propagates the impacts of the layers above down to its own along the ALM links, then qualifies the impacts the
  # propagation found one by one (a scoped action, run once per suspected impact): one the change does not concern is
  # rejected with its reason, then withdrawn, the rejection staying in the log of the change. A person validates the
  # whole at the end.
  - name: impact_analysis
    for: impact_analysis
    description: Impact analysis in four passes, from the need down to what is built (requirements, functional, logical, physical)
    guidance: >
      Go down the layers in order and finish one before starting the next: the requirements (needs and requirements),
      the functional layer (functions), the logical layer (applications, with their solutions, interfaces, flows and
      data), the physical layer (components and their build artifacts). In each pass, name only what the change
      itself carries at that layer; the propagation finds the rest, and every element it finds is qualified: kept when
      the change concerns it, rejected with the reason and withdrawn otherwise. What the change needs that does not
      exist yet is planned in its pass (a planned creation: a type, a key, why), written later by the specification
      or the design; on a green field the passes find nothing existing and plan what is new.
    deliverables: [ImpactAnalysis]
    roles: {responsible: business_analyst, accountable: product_owner, consulted: [solution_architect]}
    steps:
      - name: requirements
        description: "First pass: the needs and requirements the change concerns"
        steps:
          - {name: identify, description: "Name the needs and requirements the intent directly concerns (a person if it fails)", actions: [identify_requirements, select_scope]}
          - {name: propagate, description: "Propagate to the needs and requirements (satisfies, refines)", action: propagate_requirements}
          - {name: qualify, description: "Qualify each suspected need or requirement", action: qualify_impact, where: self.conditions.in_requirements, done: {requirements_confirmed: true}}
      - name: functions
        description: "Second pass, the functional layer: the functions realizing the impacted requirements"
        steps:
          - {name: identify, description: "Name the functions the change directly concerns", action: identify_functions}
          - {name: propagate, description: "Propagate to the functions realizing the impacted requirements", action: propagate_functions}
          - {name: qualify, description: "Qualify each suspected function", action: qualify_impact, where: self.conditions.in_functions, done: {functions_confirmed: true}}
      - name: applications
        description: "Third pass, the logical layer: applications, solutions, interfaces, flows and data"
        steps:
          - {name: identify, description: "Name the elements of the logical layer the change directly concerns", action: identify_applications}
          - {name: propagate, description: "Propagate to the applications, solutions, interfaces, flows and data", action: propagate_applications}
          - {name: qualify, description: "Qualify each suspected element of the logical layer", action: qualify_impact, where: self.conditions.in_applications, done: {applications_confirmed: true}}
      - name: components
        description: "Fourth pass, the physical layer: components and build artifacts"
        steps:
          - {name: identify, description: "Name the components the change directly concerns", action: identify_components}
          - {name: propagate, description: "Propagate to the components and their build artifacts", action: propagate_components}
          - {name: qualify, description: "Qualify each suspected component or artifact", action: qualify_impact, where: self.conditions.in_components, done: {components_confirmed: true}}
      - name: validation
        description: A person reviews the impacts layer by layer and validates the analysis
        roles: {responsible: business_analyst, accountable: product_owner}
        action: validate_impact_analysis
  - name: solution_design
    for: design
    description: Architecture of the components, interfaces, flows and data the change touches
    when: 'changeImpacts.exists(n, "alm@Component" in n.types)'
    priority: 10
    guidance: >
      Components are impacted: design their evolution (new or modified components, interfaces, flows, data), keep
      every new requirement realized by a function, and record the design decisions.
    references:
      - {title: Architecture standard, ref: "document-repository:sdlc/architecture-standard.md"}
    deliverables: [DesignDossier]
    roles: {responsible: solution_architect, accountable: tech_lead, consulted: [business_analyst]}
    planner: hybrid
    actions: [identify_requirements, select_scope, propagate_requirements, identify_functions, propagate_functions, identify_applications, propagate_applications, identify_components, propagate_components, qualify_impact, validate_impact_analysis, specify_requirements, write_requirements,
              trace_requirements, trace_manually, allocate_functions, design_solution, write_design, check_design]
    steps:
      - {name: allocation, description: "Allocate the requirements to functions", action: allocate_functions}
      - {name: design, description: "Design the components, interfaces, flows and data (by the agent, a person if it fails)", actions: [design_solution, write_design]}
      - {name: check, description: "Check the consistency of the design", action: check_design}
  - name: functional_design
    for: design
    description: Functional allocation and a design note written by hand, when no component is touched
    guidance: >
      No component is impacted: allocate the requirements to functions and write a short design note (what changes
      in behaviour, which functions realize it).
    deliverables: [DesignNote]
    roles: {responsible: business_analyst, accountable: tech_lead}
    actions: [allocate_functions, write_design, check_design]
    steps:
      - {name: allocation, description: "Allocate the requirements to functions", action: allocate_functions}
      - {name: note, description: "Write the design note by hand", action: write_design}
      - {name: check, description: "Check the consistency of the design", action: check_design}

  # The build (ADR 0118): from the sources when components in scope name their repository, in the workspace of the
  # change; the components with no repository get their build recorded according to their technology.
  - name: workspace_build
    for: build
    description: Implement, build and test the components in their sources, in the workspace of the change, then publish them
    when: 'changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.repository) && n.props.repository != "")'
    priority: 20
    guidance: >
      Each component with a repository is cloned in the workspace of the change on the branch of the change,
      implemented by an agent from the requirements and the design, built and tested by its build command (the
      report, not the agent, says it builds), sent back to the agent when the build fails (three attempts, then a
      person takes over), then pushed and recorded as a build artifact. The other components get their build recorded
      by technology.
    roles: {responsible: developer, accountable: tech_lead}
    planner: goap
    actions: [prepare_workspace, implement_component, build_component, publish_build, build]
    done: {sources_published: true, build_complete: true}
  - name: recorded_build
    for: build
    description: Record the build of each component according to its technology (no sources to build from)
    roles: {responsible: developer, accountable: tech_lead}
    planner: goap
    actions: [build]
    done: {build_complete: true}

# The route of a change, described as steps and sub-steps with the precision the methodology has for each (ADR 0034):
# a step is made of sub-steps, of the action that does it (not broken down further), of alternatives the planner
# chooses among, of the methods that specialize it (variants, one chosen by context), of a process it nests, or only of
# what a person does. Steps are sequenced by their conditions, not by their position: a step can be
# planned once its entry conditions hold (those of the phase containing it, its own, and those of what it runs). Each
# process is run by an agent of its name, towards a goal of its name; its reference documents say where it is
# described in the documentary repository.
processes:
  - name: software_delivery
    description: Deliver a change phase by phase — framing, analysis, design, build, release, application
    examples: ["deliver the change step by step", "run the software delivery process"]
    # ADR 0139: the analyst carries the change through its phases, the product owner answers for it
    roles: {responsible: business_analyst, accountable: product_owner}
    references:
      - {title: Software delivery guide, ref: "document-repository:sdlc/software-delivery-guide.md"}
    steps:
      - name: framing
        description: Frame the change with its requester, its description reviewed as soon as it is written
        roles: {responsible: business_analyst, accountable: product_owner}
        steps:
          # the reviewing method of the framing (ADR 0130): an automatic review starts by itself, without anyone
          # launching it, when the change is created, when its title or intent is edited (the rating in flight is
          # superseded) and when the requester answers in the thread; the run of the process waits for its rating
          # rather than rating the description a second time. The rating advises: a person confirms the framing.
          - name: review
            description: Rate the title and the description, propose a better wording, answer the requester's remarks
            method: description_rating
            review: {subject: description, automatic: true}
          # the go of the framing is a gate (ADR 0132): the product owner decides it once the description is accepted;
          # the go freezes the title and the intent of the change
          - name: confirmation
            description: The product owner confirms the framing, in the light of the review of the description and of its prototypes
            # a prototype of the framing (ADR 0131) holds the confirmation until it is concluded: its findings are read here
            pre: {description_rated: true, prototypes_concluded: true}
            roles: {accountable: product_owner}
            instructions: >
              Read the review of the description and the findings of its prototypes, if any (prototype_findings: a verdict
              per statement, a refuted one being a need the prototype answers); check with the requester that the intent
              states a concrete outcome, its scope (what it touches) and why it is needed; have the intent amended if it
              does not (the review rates it again by itself), then rule the go of the framing.
            guidance: >
              A well-framed change can be analysed without going back to the requester: the outcome is observable, the
              scope names the applications or requirements concerned, and the reason says what happens if nothing is
              done. The review is an advice: its findings and its proposed wording are for the requester to take or
              leave.
            checklist:
              - The outcome is concrete and observable
              - The scope names what the change touches
              - The reason for the change is stated
            references:
              - {title: Software delivery guide, ref: "document-repository:sdlc/software-delivery-guide.md", section: Framing a change}
            gate:
              transition: analyse
              enters: analysing
              checklist:
                - {name: description_accepted, role: business_analyst, veto: true, description: "The description is rated acceptable"}
              decision: {question: "Is the change framed well enough to be analysed?"}
              freezes: {fields: [title, intent], keepPhase: true}
      - name: analysis
        description: Impacts, requirements, traceability and test plan, once the change is framed and its description accepted
        roles: {responsible: business_analyst, accountable: product_owner, consulted: [solution_architect]}
        # the rating of the current description accepts it (ADR 0110): the requester edits the description, the
        # automatic review of the framing rates it again by itself, and the run waiting here is tried again
        pre: {"gate:software_delivery/framing/confirmation": true}
        steps:
          - name: impacts
            description: The impact analysis, in four passes (the impact_analysis method)
            method: impact_analysis
          - name: specification
            description: Requirements (once the impacts are known), then their traceability and their tests
            steps:
              - {name: requirements, actions: [specify_requirements, write_requirements]}
              - {name: traceability, actions: [trace_requirements, trace_manually]}
              - {name: test_plan, action: plan_tests}
          # the go of the analysis is collegial (ADR 0132): the tech lead, the solution architect and the product owner
          # (who chairs) rule it by consent, once the solution architect attested that the change keeps to the
          # architecture; the go freezes the requirements (they are still approved in the release)
          - name: gate
            description: The board decides whether the analysis is complete enough to design the solution
            # a gate follows the gate before it: the phases are passed in order, whoever plans them
            pre: {"gate:software_delivery/framing/confirmation": true, impact_analysis_validated: true, requirements_specified: true, requirements_traced: true, tests_planned: true}
            roles: {accountable: product_owner, consulted: [solution_architect, tech_lead]}
            gate:
              transition: design
              enters: designing
              checklist:
                - {name: impact_analysis_validated, role: business_analyst, veto: true}
                - {name: requirements_specified, role: business_analyst, veto: true}
                - {name: architecture_compliant, role: solution_architect, attest: true, veto: true, description: "The change keeps to the target architecture"}
                - {name: requirements_traced, role: business_analyst}
                - {name: tests_planned, role: business_analyst}
              decision: {board: [tech_lead, solution_architect, product_owner], rule: consent, back: reframe, backTo: framing}
              freezes: {types: [alm@Requirement], transitions: true, keepPhase: true}
      - name: design
        description: Allocate the functions and design the solution, by the method that fits the change, once the analysis passed its gate
        pre: {"gate:software_delivery/analysis/gate": true}
        method: design
      - name: design_gate
        description: The tech lead decides whether the design is checked enough to build
        pre: {"gate:software_delivery/analysis/gate": true, design_checked: true}
        roles: {accountable: tech_lead}
        gate:
          transition: build
          enters: building
          checklist:
            - {name: design_checked, role: solution_architect, veto: true}
          decision: {back: reanalyse, backTo: analysing}
          freezes: {keepPhase: true}
      - name: proofs
        description: Prove what is uncertain by building the least that shows it, before investing in it (ADR 0131)
        roles: {responsible: tech_lead, accountable: product_owner}
        guidance: >
          A proof of concept is a mitigation action of kind poc on the risk register (purpose derisk, the risks it
          checks), a prototype one proposed during the framing (purpose explore, the statements about the need it
          checks). A person opens it: a sub-change of the poc methodology builds it under relaxed rules and commits
          nothing; its verdicts come back here (a refuted risk closed, a confirmed one needing another mitigation).
        steps:
          - name: open
            description: Open each proposed proof of concept or prototype as a sub-change, with what it checks
            action: open_poc
            done: {pocs_opened: true}
          - name: conclusion
            description: Take back the verdicts of a concluded proof of concept and close its sub-change
            action: conclude_poc
            on:
              - {event: poc.concluded, from: integrated}
      - name: build
        description: Build every component in scope, from its sources in the workspace of the change when its repository is known, else according to its technology (once the design passed its gate and its proofs of concept are concluded)
        roles: {responsible: developer, accountable: tech_lead}
        # a proof of concept against the risks (ADR 0131) holds the build: what it checks decides what is built
        pre: {"gate:software_delivery/design_gate": true, pocs_concluded: true}
        method: build
      # the transverse risk management (methodologies/risk-management.yaml) answers risks_under_control: no live high
      # risk without an action; the run waiting for it is tried again when the change moves
      - name: build_gate
        description: The change approver decides whether the change is built and its risks under control to release it
        pre: {"gate:software_delivery/design_gate": true, build_complete: true}
        roles: {accountable: change_approver}
        gate:
          transition: release
          enters: releasing
          checklist:
            - {name: build_complete, role: developer, veto: true}
            - {name: risks_under_control, role: tech_lead, veto: true}
          decision: {back: redesign, backTo: designing}
          freezes: {keepPhase: true}
      - name: release
        description: Plan, note, review and roll out the releases, once the build passed its gate
        roles: {responsible: release_manager, accountable: service_owner, informed: [product_owner]}
        pre: {"gate:software_delivery/build_gate": true}
        process: release_train
      - name: delivery_gate
        description: The service owner confirms the change is delivered, its releases rolled out and its requirements approved
        pre: {"gate:software_delivery/build_gate": true, rolled_out: true}
        roles: {accountable: service_owner}
        gate:
          transition: deliver
          enters: delivered
          from: releasing
          checklist:
            - {name: rolled_out, role: release_manager, veto: true}
            - {name: requirements_approved, role: tech_lead, veto: true}
          freezes: {keepPhase: true}
      - name: application
        description: Apply the change to the ALM repository once delivered, after the changes it depends on
        roles: {responsible: release_manager, accountable: change_approver, informed: [product_owner, service_owner]}
        # the changes it depends on (ADR 0108) have committed where it merges: the run waits for them, and is tried again
        # when one of them moves
        pre: {"gate:software_delivery/delivery_gate": true, dependencies_met: true}
        action: apply_change

  - name: release_train
    description: Release — plan the releases, write the release note, review, deploy environment by environment
    examples: ["release the change", "run the release train"]
    roles: {responsible: release_manager, accountable: product_owner}
    references:
      - {title: Release management procedure, ref: "document-repository:sdlc/release-management.md"}
    steps:
      - {name: plan, action: plan_release}
      - {name: release_note, actions: [write_release_note, assemble_release_note]}
      - {name: review, action: review, roles: {responsible: tech_lead, accountable: service_owner}}
      - {name: approval, description: Approve the requirements the review accepted, action: approve_requirements}
      - name: rollout
        description: Deploy each release wave by wave, from dev to production
        action: deploy
        roles: {responsible: release_manager, accountable: service_owner}
