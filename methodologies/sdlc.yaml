name: sdlc
version: 0.4.0
description: >
  Software Development Life Cycle (SDLC) on the ALM repository: needs →
  requirements → functions → components → build artifacts → applications →
  solutions, with data, interfaces and flows. From the scope of a change to
  its delivery: impact analysis, specification and traceability, design,
  build (specialized by technology), tests, releases, release note, review,
  step-by-step deployment across environments (dev → test → staging →
  production) and application to the repository. Initial version, to be
  refined.

namespace: alm

conditions:
  # A change impact is a node the change acts on (ADR 0024): declared as impacted (modified) or created,
  # written when its new version exists, reviewed when it has received a decision.
  # --- intake
  - name: formulated
    description: The request has been attached to a change (an open one it continues, or this new one, now well-defined)
    expr: artifacts.exists(a, a.type == "change_formulated")
  # --- analysis
  - name: scoped
    description: The scope of the change is identified (directly impacted elements)
    expr: changeImpacts.exists(n, n.intent == "modified")
  - name: propagated
    description: Impacts are propagated along the ALM links
    expr: artifacts.exists(a, a.type == "propagation")
  # --- specification
  - name: requirements_specified
    description: Requirements are created or revised
    expr: changeImpacts.exists(n, n.hasPost && "alm@Requirement" in n.types)
  # NB: the "each …" conditions are true on an empty set; the actions that
  # depend on them also require requirements_specified to anchor the cycle.
  - name: requirements_traced
    description: Each new requirement satisfies a need (or refines another one)
    expr: >
      changeImpacts.filter(r, r.intent == "created" && "alm@Requirement" in r.types).all(r,
        r.hasPost && r.post.out.exists(l, l.type == "alm@satisfies" || l.type == "alm@refines"))
  - name: tests_planned
    description: Each created or revised requirement is verified by a created test case
    expr: >
      changeImpacts.filter(r, r.hasPost && "alm@Requirement" in r.types).all(r,
        changeImpacts.exists(t, t.intent == "created" && t.hasPost && t.post.out.exists(l, l.type == "alm@verifies" && l.to.id == r.post.id)))
  # --- design
  - name: functions_allocated
    description: Each new requirement is realized by a function
    expr: >
      changeImpacts.filter(r, r.intent == "created" && "alm@Requirement" in r.types && r.hasPost).all(r,
        changeImpacts.exists(f, f.hasPost && f.post.out.exists(l, l.type == "alm@realizes" && l.to.id == r.post.id)))
  - name: design_done
    description: The design (components, interfaces, flows, data) is described
    expr: artifacts.exists(a, a.type == "design")
  - name: design_checked
    description: The consistency of the design is checked
    expr: artifacts.exists(a, a.type == "design_check")
  # --- build
  - name: components_in_scope
    description: Components are impacted or created
    expr: changeImpacts.exists(n, "alm@Component" in n.types)
  - name: build_complete
    description: Each impacted or created component has a build artifact
    expr: >
      changeImpacts.filter(n, "alm@Component" in n.types).all(n,
        artifacts.exists(a, a.type == "build" && a.data.component == n.key))
  # --- delivery
  - name: release_planned
    description: The releases of the affected applications are built (artifacts, version, environment chain)
    expr: artifacts.exists(a, a.type == "release_plan")
  - name: release_noted
    description: The release note is written
    expr: artifacts.exists(a, a.type == "release_note")
  - name: reviewed
    description: >
      All the change impacts have received a decision (the deployments are
      recorded accepted, after the review)
    expr: size(changeImpacts) > 0 && changeImpacts.all(n, n.review != "proposed")
  - name: rolled_out
    description: Each release is deployed to every environment in the chain (or there is nothing to deploy)
    expr: >
      artifacts.exists(p, p.type == "release_plan" && (size(p.data.releases) == 0
        || size(artifacts.filter(w, w.type == "deployment_wave")) >= size(p.data.pipeline)))
  - name: applied
    description: The change is applied to the ALM repository (new baseline)
    expr: change.status == "applied"

actions:
  # ======================= intake
  - name: find_or_create_change
    kind: llm
    description: >
      List the open changes of the requesting unit and compare them to the request: continue a
      clear match, else clarify this new change (title, intent, scope) with the requester,
      looping (a note per round) until it is well-defined enough to start.
    pre: {formulated: false}
    effects: {formulated: true}
    cost: 1
    model: default
    mcps: [goap-change, goap-scheduler]
    prompt: |
      A request came in: "{{ .Change.Intent }}"
      Notes exchanged with the requester so far (oldest first):
      {{ range .Artifacts }}{{ if .Data.text }}- {{ .Data.text }}
      {{ end }}{{ end }}

      1. Call goap-change/list (status draft, active or merge_pending; filter by namespace "alm" and,
         if known, the requester's unit) to see the open changes.
      2. If one of them clearly is the same piece of work as the request, hand it off: call
         goap-scheduler/attach with change=<its id> (binds this same process to it directly, in
         place of the change opened for this request — no second process, no change left unused),
         then finish with
         {"kind":"artifact","type":"change_formulated","data":{"continued":true,"changeId":"<its id>"}}.
      3. Otherwise this change is the right one, but only once its definition is clear: a concrete
         outcome, its scope (what it touches), and why it is needed. If that is still missing or
         ambiguous, ask ONE clarifying question and finish with
         {"kind":"artifact","type":"question","data":{"text":"<question>"}} (do not set change_formulated:
         the requester's next note is read back in on the next round).
      4. Once it is clear, call goap-change/reformulate with the clarified title, a one-paragraph
         intent (concrete outcome and scope) and a rationale, then finish with
         {"kind":"artifact","type":"change_formulated","data":{"continued":false,"changeId":"{{ .Change.ID }}"}}.

  # ======================= impact analysis
  - name: identify_scope
    kind: llm
    description: Identify the ALM elements directly impacted by the intent
    pre: {scoped: false}
    effects: {scoped: true}
    cost: 2
    model: default
    prompt: |
      You are an analyst in a software development lifecycle. Change intent:
      "{{ .Change.Intent }}"

      ALM repository (key, type, properties):
      {{ range .Baseline.Nodes }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}
      Identify the elements DIRECTLY concerned (needs, requirements, functions,
      components, interfaces, flows, data). For each one, declare a change impact:
      {"kind":"changeImpact","changeImpact":{"op":"declare","intent":"modified","key":"<key>","rationale":"why it is concerned"}}

  - name: select_scope
    kind: human
    description: Manually designate the elements directly impacted (fallback)
    pre: {scoped: false}
    effects: {scoped: true}
    cost: 8
    instructions: Indicate the elements of the ALM repository directly concerned by the change, and why (impacted change impacts).

  - name: propagate_impacts
    kind: builtin
    builtin: graph.propagate
    description: >
      Propagate impacts along the ALM links: need → requirements → functions →
      components → artifacts, applications → solutions, interfaces, flows, data, tests
    pre: {scoped: true, propagated: false}
    effects: {propagated: true}
    cost: 1
    params:
      maxDepth: 6
      linkTypes: [alm@satisfies, alm@refines, alm@realizes, alm@implements, alm@depends_on, alm@built_from, alm@composed_of, alm@deploys,
                  alm@includes, alm@addresses, alm@owned_by, alm@exposed_by, alm@exchanges, alm@source, alm@target, alm@through, alm@carries, alm@verifies,
                  alm@contains, alm@releases, alm@of_release]

  # ======================= specification
  - name: specify_requirements
    kind: llm
    description: Revise the impacted requirements and create the new requirements
    pre: {propagated: true, requirements_specified: false}
    effects: {requirements_specified: true}
    cost: 3
    model: default
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted elements:
      {{ range .ChangeImpacts }}- {{ .Key }} ({{ .Type }}) {{ json .Pre.Properties }} : {{ .Rationale }}
      {{ end }}
      Revise the impacted requirements and create new requirements (types:
      FunctionalRequirement, NonFunctionalRequirement, SecurityRequirement), each one
      linked to the need it satisfies. A revised requirement is an impacted change impact that you write;
      a new requirement is declared then written with its link:
      {"kind":"changeImpact","changeImpact":{"op":"write","node":"<impacted key>","props":{...}}}
      {"kind":"changeImpact","changeImpact":{"op":"declare","ref":"#r1","intent":"created","type":"alm@FunctionalRequirement","key":"REQ-...","rationale":"why"}}
      {"kind":"changeImpact","changeImpact":{"op":"write","node":"#r1","props":{"title":"...","priority":"high"},"links":[{"type":"alm@satisfies","to":"<need key>"}]}}

  - name: write_requirements
    kind: human
    description: Write the requirements (fallback)
    pre: {propagated: true, requirements_specified: false}
    effects: {requirements_specified: true}
    cost: 8
    instructions: >
      Write the new versions of the impacted requirements and create the new
      requirements (with their "satisfies" link to the need).

  - name: trace_requirements
    kind: script
    language: javascript
    description: Link each untraced new requirement to the needs in scope (systematic rule)
    pre: {requirements_specified: true, requirements_traced: false}
    effects: {requirements_traced: true}
    cost: 1
    code: |
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        // needs in scope: impacted, or satisfied by the impacted requirements
        const needs = new Set();
        for (const n of nodes) {
          if (n.intent !== "modified" || !n.pre) continue;
          if (n.type === "alm@Need") needs.add(n.key);
          if (n.type.endsWith("Requirement")) {
            for (const l of ctx.links(n.key, "out", "alm@satisfies")) needs.add(l.to.key);
          }
        }
        let k = 0;
        for (const r of nodes) {
          if (r.intent !== "created" || !r.post || !r.type.endsWith("Requirement")) continue;
          if (r.links.some(l => l.type === "alm@satisfies" || l.type === "alm@refines")) continue;
          if (needs.size === 0) { ctx.warn(r.key + " : no need in scope"); continue; }
          ctx.writeNode(r.key, { links: [...needs].map(need => ({ type: "alm@satisfies", to: need })) });
          k += needs.size;
        }
        return k + " traceability link(s) written";
      }

  - name: trace_manually
    kind: human
    description: Manually trace requirements to needs (fallback)
    pre: {requirements_specified: true, requirements_traced: false}
    effects: {requirements_traced: true}
    cost: 6
    instructions: Link each new requirement to the need it satisfies (or the requirement it refines).

  - name: plan_tests
    kind: script
    language: javascript
    description: One test case per created or revised requirement (level based on requirement type)
    pre: {requirements_specified: true, tests_planned: false}
    effects: {tests_planned: true}
    cost: 1
    code: |
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        const verified = new Set();
        for (const t of nodes) {
          if (t.intent === "created" && t.post) for (const l of t.links) if (l.type === "alm@verifies") verified.add(l.to.key);
        }
        let n = 0;
        for (const r of nodes) {
          if (!r.post || !r.type.endsWith("Requirement") || verified.has(r.key)) continue;
          const level = r.type === "alm@SecurityRequirement" ? "security"
            : r.type === "alm@NonFunctionalRequirement" ? "performance" : "acceptance";
          const title = (r.post.props && r.post.props.title) || r.key;
          const t = ctx.createNode("alm@TestCase", "TST-" + r.key, "verifies " + r.key);
          ctx.writeNode(t, { props: { title: "Verify: " + title, level: level }, links: [{ type: "alm@verifies", to: r.key }] });
          n++;
        }
        return n + " test case(s) created";
      }

  # ======================= design
  - name: allocate_functions
    kind: script
    language: javascript
    description: Allocate each new requirement to a function (impacted function, otherwise a new function)
    pre: {requirements_traced: true, functions_allocated: false}
    effects: {functions_allocated: true}
    cost: 1
    code: |
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        const realized = new Set();
        for (const f of nodes) if (f.post) for (const l of f.links) if (l.type === "alm@realizes") realized.add(l.to.key);
        const functions = nodes.filter(f => f.intent === "modified" && f.type === "alm@Function").map(f => f.key).sort();
        let n = 0;
        for (const r of nodes) {
          if (r.intent !== "created" || !r.post || !r.type.endsWith("Requirement") || realized.has(r.key)) continue;
          let fn = functions[0];
          if (!fn) {
            fn = ctx.createNode("alm@Function", "FCT-" + r.key, "realizes " + r.key);
            ctx.writeNode(fn, { props: { title: "Function: " + ((r.post.props && r.post.props.title) || r.key) }, links: [{ type: "alm@realizes", to: r.key }] });
          } else {
            ctx.writeNode(fn, { links: [{ type: "alm@realizes", to: r.key }] });
          }
          n++;
        }
        return n + " allocation(s)";
      }

  - name: design_solution
    kind: llm
    description: Design the evolution of components, interfaces, flows and data
    pre: {requirements_specified: true, requirements_traced: true, functions_allocated: true, design_done: false}
    effects: {design_done: true}
    cost: 3
    model: reasoning
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted elements:
      {{ range .ChangeImpacts }}{{ if eq .Intent "modified" }}- {{ .Key }} ({{ .Type }}) {{ json .Pre.Properties }}
      {{ end }}{{ end }}
      Change impacts already made:
      {{ range .ChangeImpacts }}- {{ .Intent }} {{ .Type }} {{ .Key }}: {{ .Rationale }}
      {{ end }}
      Design the evolution: components to modify (declare the impacted one if it is not, then write
      version / technology props) or to create (type Component, technology java|c|shell|…, an
      implements link to the function), interfaces (exposed_by, exchanges), flows
      (source, target, through, carries) and data, as change impacts:
      {"kind":"changeImpact","changeImpact":{"op":"declare","ref":"#c1","intent":"created","type":"alm@Component","key":"CMP-...","rationale":"why"}}
      {"kind":"changeImpact","changeImpact":{"op":"write","node":"#c1","props":{...},"links":[{"type":"alm@implements","to":"<function key>"}]}}
      End with
      {"kind":"artifact","type":"design","data":{"summary":"...","decisions":["..."]}}

  - name: write_design
    kind: human
    description: Describe the design (fallback)
    pre: {requirements_specified: true, requirements_traced: true, functions_allocated: true, design_done: false}
    effects: {design_done: true}
    cost: 8
    utility: 'has(vars.design) && vars.design == "manual" ? 2.0 : 0.3'
    instructions: >
      Write the changes to components, interfaces, flows and data (change impacts), then a
      "design" artifact summarizing the decisions.

  - name: check_design
    kind: script
    language: javascript
    description: Check the consistency of the design (mandatory links of created elements)
    pre: {design_done: true, design_checked: false}
    effects: {design_checked: true}
    cost: 1
    code: |
      function run(ctx) {
        const required = {
          Component: ["implements"], Interface: ["exposed_by"], Flow: ["source", "target", "carries"],
          BuildArtifact: ["built_from"], Data: ["owned_by"],
        };
        const issues = [];
        for (const n of ctx.changeImpacts()) {
          const kind = n.type.split("@").pop();
          if (n.intent !== "created" || !required[kind]) continue;
          for (const t of required[kind]) {
            if (!n.post || !n.links.some(l => l.type === "alm@" + t)) issues.push(n.type + " " + n.key + " : missing link \"" + t + "\"");
          }
        }
        for (const i of issues) ctx.warn(i);
        ctx.addArtifact("design_check", { ok: issues.length === 0, issues: issues });
        return issues.length + " issue(s)";
      }

  # ======================= build (abstract action, specialized by technology)
  - name: build
    kind: abstract
    description: >
      Build the impacted or created components. Abstract action: each
      execution builds the components of one technology (specialization), until
      all of them have their artifact.
    pre: {propagated: true, design_checked: true, build_complete: false}
    effects: {build_complete: true}
    cost: 2
    incremental: true

  - name: build_java
    kind: script
    language: javascript
    specializes: build
    params: {technology: java}
    priority: 30
    description: "Java build: Maven, JDK 21, dependency check and coverage"
    when: >
      changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.technology) && n.props.technology == "java"
        && !artifacts.exists(a, a.type == "build" && a.data.component == n.key))
    code: &build |
      const RULES = {
        java:  { format: "jar", toolchain: "maven 3.9 / JDK 21", checks: ["mvn -B verify", "OWASP dependency-check", "JaCoCo ≥ 80 %"],
                 coordinates: (c, v) => "com.acme:" + c + ":" + v },
        c:     { format: "elf", toolchain: "gcc 13 / make", checks: ["-Wall -Wextra -Werror", "cppcheck", "valgrind on the tests"],
                 coordinates: (c, v) => c + "-" + v + "-linux-x86_64" },
        shell: { format: "tar.gz", toolchain: "bash 5", checks: ["shellcheck -S warning", "bats"],
                 coordinates: (c, v) => c + "-" + v + ".tar.gz" },
        other: { format: "tar.gz", toolchain: "archive", checks: ["sha256"],
                 coordinates: (c, v) => c + "-" + v + ".tar.gz" },
      };
      function bump(v) {
        const p = String(v || "0.0.0").split(".");
        while (p.length < 3) p.push("0");
        p[2] = String((parseInt(p[2], 10) || 0) + 1);
        return p.join(".");
      }
      // components in scope without a build artifact
      function pending(ctx) {
        const built = new Set(ctx.items("artifact").filter(a => a.type === "build").map(a => a.data.component));
        const out = [];
        for (const n of ctx.changeImpacts()) {
          if (n.type !== "alm@Component" || built.has(n.key)) continue;
          const props = (n.post && n.post.props) || (n.pre && n.pre.props) || {};
          out.push({ key: n.key, props: props, existing: n.intent === "modified" });
        }
        return out;
      }
      function build(ctx, tech) {
        const known = ["java", "c", "shell"];
        const mine = pending(ctx).filter(c => tech === "other" ? !known.includes(c.props.technology) : c.props.technology === tech);
        const r = RULES[tech];
        const declared = new Set(ctx.changeImpacts().map(n => n.key));
        for (const c of mine) {
          const name = String(c.props.title || c.key);
          const v = bump(c.props.version);
          const key = "ART-" + c.key + "-" + v;
          const art = ctx.createNode("alm@BuildArtifact", key, "build artifact of " + c.key);
          ctx.writeNode(art, { props: { name: name, format: r.format, version: v, technology: c.props.technology || "",
            coordinates: r.coordinates(name, v), toolchain: r.toolchain, checks: r.checks }, links: [{ type: "alm@built_from", to: c.key }] });
          if (c.existing) {
            // the applications composed of the component deploy the new artifact
            for (const l of ctx.links(c.key, "in", "alm@composed_of")) {
              const app = l.from.key;
              if (!declared.has(app)) { ctx.impactNode(app, "deploys the new artifact " + key); declared.add(app); }
              ctx.writeNode(app, { links: [{ type: "alm@deploys", to: key }] });
            }
          }
          ctx.addArtifact("build", { component: c.key, technology: c.props.technology || "", version: v, artifact: key, toolchain: r.toolchain, checks: r.checks });
        }
        return mine.length + " " + tech + " component(s) built";
      }
      function run(ctx) { return build(ctx, ctx.param("technology") || "other"); }

  - name: build_c
    kind: script
    language: javascript
    specializes: build
    params: {technology: c}
    priority: 20
    description: "C build: gcc / make, blocking warnings, static analysis"
    when: >
      changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.technology) && n.props.technology == "c"
        && !artifacts.exists(a, a.type == "build" && a.data.component == n.key))
    code: *build

  - name: build_shell
    kind: script
    language: javascript
    specializes: build
    params: {technology: shell}
    priority: 10
    description: "Shell build: shellcheck, bats tests, archive"
    when: >
      changeImpacts.exists(n, "alm@Component" in n.types && has(n.props.technology) && n.props.technology == "shell"
        && !artifacts.exists(a, a.type == "build" && a.data.component == n.key))
    code: *build

  - name: build_generic
    kind: script
    language: javascript
    specializes: build
    params: {technology: other}
    description: "Generic build (other technologies): archive and checksum"
    code: *build

  # ======================= releases and environments
  - name: plan_release
    kind: script
    language: javascript
    description: >
      Build one release per application that deploys a new artifact (next minor version,
      contains / releases links) and freeze the environment chain (promotes_to order)
    pre: {requirements_specified: true, build_complete: true, release_planned: false}
    effects: {release_planned: true}
    cost: 1
    code: |
      function bumpMinor(v) {
        const p = String(v || "0.0").split(".");
        while (p.length < 2) p.push("0");
        p[1] = String((parseInt(p[1], 10) || 0) + 1);
        return p.slice(0, 2).join(".");
      }
      function run(ctx) {
        const nodes = ctx.changeImpacts();
        const artifacts = new Set(nodes.filter(n => n.intent === "created" && n.type === "alm@BuildArtifact").map(n => n.key));
        // applications receiving a new artifact (deploys links written by the build)
        const byApp = new Map();
        for (const n of nodes) {
          if (!n.post) continue;
          for (const l of n.links) {
            if (l.type !== "alm@deploys" || !artifacts.has(l.to.key)) continue;
            if (!byApp.has(n.key)) byApp.set(n.key, []);
            byApp.get(n.key).push(l.to.key);
          }
        }
        const releases = [];
        for (const [app, arts] of byApp) {
          const node = ctx.node(app);
          const v = bumpMinor(node.props.version);
          const key = "REL-" + app + "-" + v;
          const r = ctx.createNode("alm@Release", key, "release " + v + " of " + app);
          ctx.writeNode(r, {
            props: { title: (node.props.title || app) + " " + v, version: v, status: "candidate" },
            links: [{ type: "alm@releases", to: app }].concat(arts.map(a => ({ type: "alm@contains", to: a }))),
          });
          releases.push(key);
        }
        // environment chain: ascending order (order property)
        const pipeline = ctx.nodes("alm@Environment")
          .map(e => ({ key: e.key, name: e.props.name || e.key, stage: e.props.stage || "", order: Number(e.props.order || 0) }))
          .sort((a, b) => a.order - b.order);
        ctx.addArtifact("release_plan", { releases: releases, pipeline: pipeline });
        return releases.length + " release(s), " + pipeline.length + " environment(s)";
      }

  # ======================= delivery
  - name: write_release_note
    kind: llm
    description: Write the release note
    pre: {requirements_specified: true, tests_planned: true, design_checked: true, build_complete: true, release_planned: true, release_noted: false}
    effects: {release_noted: true}
    cost: 1
    model: fast
    prompt: |
      Intent: "{{ .Change.Intent }}"
      Change impacts:
      {{ range .ChangeImpacts }}- {{ .Intent }} {{ .Type }} {{ .Key }}: {{ .Rationale }}
      {{ end }}
      Artifacts:
      {{ range .Artifacts }}- {{ .Type }} {{ json .Data }}
      {{ end }}
      Write the release note (requirements, components, artifacts, releases,
      affected applications, tests, deployment chain):
      {"kind":"artifact","type":"release_note","data":{"markdown":"..."}}

  - name: assemble_release_note
    kind: script
    language: javascript
    description: Assemble the release note from the change (deterministic fallback)
    pre: {requirements_specified: true, tests_planned: true, design_checked: true, build_complete: true, release_planned: true, release_noted: false}
    effects: {release_noted: true}
    cost: 3
    code: |
      function run(ctx) {
        const lines = ["# Release Note", "", "Intent: " + ctx.intent(), ""];
        const section = (title, rows) => { if (rows.length) { lines.push("## " + title, ...rows.map(r => "- " + r), ""); } };
        const nodes = ctx.changeImpacts().filter(n => n.post || n.intent === "created");
        const verb = n => (n.intent === "created" ? "create " : "update ");
        section("Requirements", nodes.filter(n => n.type.endsWith("Requirement")).map(n => verb(n) + n.key));
        section("Design", nodes.filter(n => ["alm@Function", "alm@Component", "alm@Interface", "alm@Flow", "alm@Data"].includes(n.type)).map(n => verb(n) + n.type + " " + n.key));
        section("Build artifacts", ctx.items("artifact").filter(a => a.type === "build").map(a => a.data.artifact + " (" + a.data.toolchain + ")"));
        section("Tests", nodes.filter(n => n.type === "alm@TestCase").map(n => n.key));
        section("Releases", nodes.filter(n => n.type === "alm@Release").map(n => n.key + " " + ((n.post && n.post.props.title) || "")));
        const plan = ctx.items("artifact").filter(a => a.type === "release_plan").pop();
        if (plan) section("Deployment", [plan.data.pipeline.map(e => e.name + " (" + e.stage + ")").join(" → ")]);
        section("Affected applications", ctx.changeImpacts().filter(n => n.intent === "modified" && n.type === "alm@Application" && n.pre).map(n => n.key + " " + (n.pre.props.title || "")));
        ctx.addArtifact("release_note", { markdown: lines.join("\n") });
        return "release note assembled";
      }

  - name: review
    kind: human
    description: Review of the change (requirements, design, artifacts, tests)
    pre: {release_noted: true, reviewed: false}
    effects: {reviewed: true}
    cost: 2
    instructions: Accept or reject each change impact (impacts, requirements, design, artifacts, tests, releases) based on the release note and the design check; a comment is required.

  # ======================= deployment (abstract, incremental, specialized by environment stage)
  - name: deploy
    kind: abstract
    description: >
      Deploy the releases to the next environment in the chain. Each execution is a wave
      (one environment); the specialization depends on the stage: automatic in dev / test, staging
      checks in staging, change window and release manager approval in production.
    pre: {reviewed: true, rolled_out: false}
    effects: {rolled_out: true}
    cost: 2
    incremental: true

  - name: deploy_auto
    kind: script
    language: javascript
    specializes: deploy
    description: "Automatic deployment (dev, test): unit tests and smoke tests"
    params: {checks: [unit tests, smoke tests]}
    code: &deploy |
      function run(ctx) {
        const plan = ctx.items("artifact").filter(a => a.type === "release_plan").pop();
        const waves = ctx.items("artifact").filter(a => a.type === "deployment_wave");
        const env = plan.data.pipeline[waves.length];
        if (!env) throw new Error("all waves are deployed");
        const checks = ctx.param("checks") || [];
        const tests = ctx.changeImpacts().filter(n => n.intent === "created" && n.type === "alm@TestCase" && n.post);
        const campaign = {};
        for (const t of tests) campaign[t.post.props.level || "acceptance"] = (campaign[t.post.props.level || "acceptance"] || 0) + 1;
        for (const r of plan.data.releases) {
          const d = ctx.createNode("alm@Deployment", "DEP-" + r + "-" + env.key, "deployment of " + r + " to " + env.name);
          ctx.writeNode(d, { props: { status: "succeeded", stage: env.stage, checks: checks },
            links: [{ type: "alm@of_release", to: r }, { type: "alm@in_environment", to: env.key }] });
          // a deployment is recorded once done: no review to wait for
          ctx.reviewNode(d, true, "deployment recorded");
        }
        ctx.addArtifact("deployment_wave", { environment: env.key, name: env.name, stage: env.stage, releases: plan.data.releases,
          checks: checks, tests: campaign });
        return plan.data.releases.length + " release(s) deployed to " + env.name;
      }

  - name: deploy_staging
    kind: script
    language: javascript
    specializes: deploy
    priority: 10
    description: "Staging deployment: regression, performance, security (test case campaign)"
    when: >
      artifacts.exists(p, p.type == "release_plan"
        && p.data.pipeline[size(artifacts.filter(w, w.type == "deployment_wave"))].stage == "staging")
    params: {checks: [regression tests, performance tests, security tests (DAST), business acceptance testing]}
    code: *deploy

  - name: deploy_production
    kind: script
    language: javascript
    specializes: deploy
    priority: 20
    permission: release:deploy
    description: "Production deployment: change window, rollback plan, release manager approval"
    when: >
      artifacts.exists(p, p.type == "release_plan"
        && p.data.pipeline[size(artifacts.filter(w, w.type == "deployment_wave"))].stage == "prod")
    params: {checks: [change window, rollback plan, post-deployment monitoring]}
    code: *deploy

  - name: apply_change
    kind: builtin
    builtin: graph.apply
    description: Apply the change to the ALM repository (new baseline, including releases and deployments)
    pre: {reviewed: true, rolled_out: true, applied: false}
    effects: {applied: true}
    cost: 1
    permission: change:apply

goals:
  - name: formulate
    description: Attach a request to the change that should carry it (an open one it continues, or this new one, well-defined)
    examples: ["I need the checkout flow changed to support vouchers", "please fix the refund bug reported by support", "add a new requirement for SSO login"]
    pre: {formulated: true}
    value: 1
  - name: analyze_impact
    description: Measure the impact of a change on the ALM chain
    examples: ["what is the impact", "what does this break", "impact analysis"]
    pre: {propagated: true}
    value: 3
  - name: specify
    description: Specify the requirements of a change, traced and verified
    examples: ["specify the need", "write the requirements", "new requirement"]
    pre: {requirements_specified: true, requirements_traced: true, tests_planned: true}
    value: 5
  - name: design
    description: Design the evolution of the solution (functions, components, interfaces, flows, data)
    examples: ["design", "architecture", "which components to modify"]
    pre: {requirements_specified: true, functions_allocated: true, design_checked: true}
    value: 6
  - name: build_components
    description: Build the impacted components
    examples: ["build the components", "build", "deliver the artifacts"]
    pre: {components_in_scope: true, build_complete: true}
    value: 7
  - name: release
    description: Build the releases and deploy them to all environments
    examples: ["deploy to production", "deploy the release", "deliver to staging"]
    pre: {release_planned: true, rolled_out: true}
    value: 8
  - name: deliver
    description: Deliver a change end-to-end, from requirement to updated repository
    examples: ["deliver an enhancement", "develop a new feature", "carry out the change"]
    pre: {applied: true}
    value: 10

agents:
  - name: intake
    description: Change formulation — finds the open change a request continues, or clarifies it into a new one
    examples: ["I need the checkout flow changed to support vouchers", "please fix the refund bug reported by support", "add a new requirement for SSO login"]
    planner: goap
    actions: [find_or_create_change]
    goals: [formulate]
    mcps: [goap-scheduler]
  - name: analyst
    description: Analyst — scope, impacts, requirements, traceability, test plan
    examples: ["impact analysis", "specify the requirements", "what is the impact of this need"]
    planner: goap
    actions: [identify_scope, select_scope, propagate_impacts, specify_requirements, write_requirements,
              trace_requirements, trace_manually, plan_tests]
    goals: [analyze_impact, specify]
  - name: architect
    description: Architect — functional allocation, design of components, interfaces, flows and data
    examples: ["design the solution", "which components and interfaces to modify"]
    planner: hybrid
    actions: [identify_scope, select_scope, propagate_impacts, specify_requirements, write_requirements,
              trace_requirements, trace_manually, allocate_functions, design_solution, write_design, check_design]
    goals: [design]
  - name: builder
    description: Integrator — build the components according to their technology
    examples: ["build the components", "build"]
    planner: goap
    actions: [identify_scope, select_scope, propagate_impacts, specify_requirements, write_requirements,
              trace_requirements, trace_manually, allocate_functions, design_solution, write_design, check_design, build]
    goals: [build_components]
  - name: release_manager
    description: Release manager — releases, release note, review, step-by-step deployment
    examples: ["deploy to production", "deploy the release to the environments"]
    planner: goap
    goals: [release]
  - name: delivery
    description: End-to-end delivery — from intent to updated ALM repository
    examples: ["deliver an enhancement", "develop a feature end-to-end"]
    planner: goap
    goals: [deliver]
