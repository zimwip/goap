name: impact-analysis
version: 1.1.0
description: >
  Impact analysis of a change on a requirements repository: identification of
  impacted elements, propagation along traceability links, update proposals
  and human review.

domain:
  nodeTypes:
    - name: Need
      description: Business need expressed by a stakeholder
      properties: [title, description]
    - name: Requirement
      description: Requirement (functional or non-functional) satisfying a need
      properties: [title, description, priority]
    - name: TestCase
      description: Test case verifying a requirement
      properties: [title, steps]
    - name: Component
      description: Software component implementing requirements
      properties: [title, owner]
  linkTypes:
    - {name: satisfies, from: Requirement, to: Need}
    - {name: verifies, from: TestCase, to: Requirement}
    - {name: implements, from: Component, to: Requirement}

conditions:
  - name: has_impacts
    description: At least one element of the reference graph is impacted
    expr: size(impacts) > 0
  - name: propagated
    description: Impacts have been propagated along traceability links
    expr: artifacts.exists(a, a.type == "propagation")
  - name: reported
    description: An impact report has been written
    expr: artifacts.exists(a, a.type == "report")
  - name: reviewed
    description: All proposals have received a decision
    expr: size(proposals) > 0 && proposals.all(p, p.status != "proposed")
  - name: applied
    description: The change has been applied to the repository (new baseline)
    expr: change.status == "applied"

actions:
  - name: identify_impacts
    kind: llm
    description: Identify the elements directly impacted by the change intent
    pre: {has_impacts: false}
    effects: {has_impacts: true}
    cost: 2
    model: default
    prompt: |
      You are an impact analyst. Change intent:
      "{{ .Change.Intent }}"

      Repository elements (key, type, properties):
      {{ range .Baseline.Nodes }}- {{ .Key }} ({{ .Type }}) {{ json .Properties }}
      {{ end }}
      Identify the elements DIRECTLY impacted. For each one, produce an item
      {"kind":"impact","type":"direct","target":"<key>","data":{"reason":"..."}}.

  - name: select_impacts
    kind: human
    description: Manual selection of impacted elements (fallback if automatic analysis is not possible)
    pre: {has_impacts: false}
    effects: {has_impacts: true}
    cost: 8
    instructions: Indicate the elements of the repository directly impacted by the change.

  - name: propagate_impacts
    kind: builtin
    builtin: graph.propagate
    description: Propagate impacts to linked elements (tests, components, derived requirements)
    pre: {has_impacts: true, propagated: false}
    effects: {propagated: true}
    cost: 1
    params:
      maxDepth: 3
      # an impact on the target of a link propagates to its source
      linkTypes: [verifies, implements, satisfies]

  - name: propose_requirement_updates
    kind: llm
    description: Propose a new version of each impacted requirement
    pre: {propagated: true}
    cost: 3
    model: default
    expects:
      forEach: impacts
      where: x.target.type == "Requirement"
      produce: {op: update_node}
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted requirements:
      {{ range .Impacts }}{{ if eq .Target.Type "Requirement" }}- {{ .Target.Key }} {{ json .Target.Properties }} (reason: {{ index .Data "reason" }})
      {{ end }}{{ end }}
      For each requirement, propose its new version:
      {"kind":"proposal","proposal":{"op":"update_node","node":{"base":"<key>","props":{...}}}}

  - name: propose_tests
    kind: llm
    description: Propose a new test case for each impacted requirement
    pre: {propagated: true}
    cost: 3
    model: default
    expects:
      forEach: impacts
      where: x.target.type == "Requirement"
      produce: {op: create_node, nodeType: TestCase}
      link: {type: verifies}
    prompt: |
      Change intent: "{{ .Change.Intent }}"
      Impacted requirements:
      {{ range .Impacts }}{{ if eq .Target.Type "Requirement" }}- {{ .Target.Key }} {{ json .Target.Properties }}
      {{ end }}{{ end }}
      For each requirement, propose a test case and its link:
      {"kind":"proposal","ref":"t1","proposal":{"op":"create_node","node":{"key":"TST-...","type":"TestCase","props":{"title":"..."}}}}
      {"kind":"proposal","proposal":{"op":"add_link","link":{"type":"verifies","from":"#t1","to":"<requirement key>"}}}

  - name: write_report
    kind: llm
    description: Write the impact report
    pre: {propagated: true, reported: false}
    effects: {reported: true}
    cost: 1
    model: fast
    prompt: |
      Intent: "{{ .Change.Intent }}"
      Impacts:
      {{ range .Impacts }}- {{ .Target.Key }} ({{ .Target.Type }}, {{ .Type }}) : {{ index .Data "reason" }}
      {{ end }}
      Write a concise report: {"kind":"artifact","type":"report","data":{"markdown":"..."}}

  - name: review_proposals
    kind: human
    description: Review of proposals (accept / reject)
    pre: {"expect:propose_requirement_updates": true, "expect:propose_tests": true}
    effects: {reviewed: true}
    cost: 2
    instructions: Accept or reject each proposal.

  - name: apply_change
    kind: builtin
    builtin: graph.apply
    description: Apply the validated change to the repository (creates the resulting baseline)
    pre: {reviewed: true, applied: false}
    effects: {applied: true}
    cost: 1
    # without this permission, the initiator must obtain an approver's approval
    permission: change:apply

goals:
  - name: assess_impact
    description: Assess the impact of a change and produce a report, without modifying the repository
    examples:
      - what is the impact
      - what does this break
      - impact analysis
    pre: {propagated: true, reported: true}
    value: 10
  - name: prepare_change
    description: Prepare the repository change (updated requirements and tests) and have it validated
    examples:
      - update the requirements
      - prepare the change
      - propose the changes
    pre: {"expect:propose_requirement_updates": true, "expect:propose_tests": true, reviewed: true}
    value: 20
  - name: deliver_change
    description: Prepare, validate, then apply the change to the repository
    examples:
      - apply the change
      - deliver the change
      - put the repository into production
    pre: {reviewed: true, applied: true}
    value: 30
