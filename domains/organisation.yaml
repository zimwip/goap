name: organisation
version: 1.1.0
description: >
  Organisation structure, managed in its own namespace ("organisation"): a hierarchy of organisational units. Nodes of other namespaces reference a unit as their owner through the cross-namespace `owner` link; changes are split into sub-changes along unit boundaries.
nodeTypes:
  - {name: OrgUnit, description: "Organisational unit (company, direction, department, team)", properties: [name, kind, description]}
  # an organisational unit's instance of an adapter definition (an AdapterDef node of the platform namespace):
  # the one place where unit, MCP and connector meet. mcp = the MCP implemented, adapter = the name of the
  # AdapterDef, params = its parameter values (secrets as references: env:<VAR> or <vault path>#<field>).
  # Linked to its unit by `owner`; a unit inherits the adapters of its ancestors (nearest wins).
  - {name: Adapter, description: "Instance, by an organisational unit, of an adapter definition", properties: [mcp, adapter, params, description]}
linkTypes:
  # child -> parent: outgoing links belong to the source version, so reorganising a unit only versions that unit
  - {name: part_of, from: OrgUnit, to: OrgUnit}
  # any node, whatever its namespace -> the unit that owns it
  - {name: owner, to: OrgUnit}
