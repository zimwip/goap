name: code
version: 1.7.0
description: >
  Source code held in git repositories (ADR 0147): a repository, its directories and its files as of the last commit
  imported. The git importer (platform/gitimport: the importer `git` below, served by importer-git, ADR 0148; the
  command goap-gitimport) makes one change per commit; a directory or a file is a
  node, a directory holds its entries by `contains` links, and a version of a directory is a git tree (its links follow
  the versions of its entries, as a tree names the objects it holds). With the symbols read (Tree-sitter), a source file
  defines its declarations (functions, types, imports, variables...) by `defines` links, read back as "defined in".
  An entry or a declaration a commit removes is deleted (ADR 0172: a tombstone, the node leaves the state); added
  again under the same key, the creation is requalified and restores the same node.
importers:
  - name: git
    label: Git repository
    description: >
      Loads a git repository: one change per commit of the first-parent history of the revision followed, a node per
      directory and per file, and with the symbols a node per declaration of the source files; the other git branches
      asked for each on a branch of the graph. A run resumes after the last commit imported.
    params:
      - {name: url, label: URL, description: "URL of the repository, cloned by the importer service and fetched again at each run (https://, ssh://, git@host:path). Give the URL or the local directory", order: 1}
      - {name: directory, label: Local directory, widget: directory, description: "Directory of a repository on the machine of the importer service, read in place (a working tree or a bare repository, ~ for the home directory); it must be under the directories the service reads (GOAP_IMPORT_GIT_ROOTS; make dev: the home directory). Give the URL or the local directory", order: 2}
      - {name: name, label: Name, description: "Name of the repository in the graph, the prefix of its keys (default: the last element of the repository)", order: 3}
      - {name: rev, label: Revision, default: HEAD, description: "The revision whose first-parent history is imported on the main branch of the graph", order: 4}
      - {name: branches, label: Other branches, description: "Other git branches imported, each on a branch of the graph named <name>/<branch> forked where it leaves the history already imported: names or patterns separated by commas, all for every branch (default: none)", order: 5}
      - {name: base, label: Start at, description: "First import only: start at this revision, its tree as the first change (default: the root commit)", order: 6}
      - {name: max, label: At most, type: number, description: "Import at most this many commits in this run (0: all)", order: 7}
      - {name: symbols, label: Symbols, type: boolean, description: "Read the declarations of the source files with Tree-sitter (functions, methods, classes, structs, variables...), the calls and uses between them, and the packages and their imports", order: 8}
      - {name: code, label: Source text, type: boolean, default: true, description: "With the symbols, keep the source text of each declaration on its node (the code attribute, cut at 64 KiB)", order: 9}
enums:
  - name: symbol-kind
    description: What a declaration of a source file is
    values:
      - {value: function, label: Function}
      - {value: method, label: Method}
      - {value: prototype, label: Prototype, description: A function declared without its body (a C prototype, an abstract method)}
      - {value: struct, label: Struct}
      - {value: union, label: Union}
      - {value: class, label: Class}
      - {value: interface, label: Interface, description: An interface, a trait}
      - {value: enum, label: Enum}
      - {value: type, label: Type, description: A type definition or alias}
      - {value: namespace, label: Namespace}
      - {value: module, label: Module}
      - {value: variable, label: Variable, description: A variable of the top level}
      - {value: constant, label: Constant}
      - {value: field, label: Field}
      - {value: macro, label: Macro}
nodeTypes:
  # an entry of a repository: what a directory holds
  - name: Entry
    icon: file
    color: "#64748b"
    description: An entry of a source tree, a directory or a file
    attributes:
      - {name: name, label: Name, description: Last element of the path, type: string, section: Identity, order: 1, asName: true}
      - {name: path, label: Path, description: "Path from the root of the repository, with / separators (empty for the root)", type: string, section: Identity, order: 2}
    search: [{property: name, text: true}, {property: path, text: true}]
  - name: Directory
    icon: folder
    color: "#ca8a04"
    description: A directory of a repository (a git tree)
    extends: Entry
    attributes:
      - {name: tree, label: Tree, description: Object id of the git tree the directory is at, type: string, section: Git, order: 10}
  - name: File
    icon: file
    color: "#2563eb"
    description: A file of a repository (a git blob, a symbolic link or a submodule)
    extends: Entry
    attributes:
      - {name: blob, label: Object, description: "Object id of the content (a blob; the commit of a submodule)", type: string, section: Git, order: 10}
      - {name: mode, label: Mode, description: "git mode of the entry (100644 file, 100755 executable, 120000 symbolic link, 160000 submodule)", type: string, section: Git, order: 11}
      - {name: size, label: Size, description: Size of the content in bytes (none for a submodule), type: number, section: Git, order: 12}
      - {name: extension, label: Extension, description: "Extension of the name, lower case, without the dot (c, h, go…)", type: string, section: Identity, order: 3}
    search: [{property: extension, facet: true}]
  # the root directory of a repository, the node that says where its import stands
  - name: Repository
    icon: branch
    color: "#ea580c"
    description: A git repository, its root directory
    extends: Directory
    attributes:
      - {name: url, label: Source, description: Where the repository was imported from (a URL or a path), type: string, section: Origin, order: 20}
      - {name: ref, label: Followed, description: "Revision followed by the import (HEAD, a branch, a tag)", type: string, section: Origin, order: 21}
      - {name: commit, label: Commit, description: Object id of the last commit imported, type: string, section: Origin, order: 22}
  # a declaration of a source file, read by Tree-sitter: a new version when its own text changes
  - name: Symbol
    icon: code
    color: "#7c3aed"
    description: A declaration of a source file (a function, a type, an import, a variable...)
    attributes:
      - {name: name, label: Name, description: Name of the declaration (the path of an import), type: string, section: Identity, order: 1, asName: true}
      - {name: kind, label: Kind, description: What the declaration is, type: enum, enum: symbol-kind, section: Identity, order: 2}
      - {name: container, label: Declared in, description: "Qualified name of the declaration holding it (a class for a method), empty at the top level", type: string, section: Identity, order: 3}
      - {name: language, label: Language, description: Language of its file, type: string, section: Source, order: 4}
      - {name: signature, label: Signature, description: First line of its text, type: string, section: Source, order: 5}
      - {name: digest, label: Digest, description: Digest of its text, type: string, section: Source, order: 6}
      - {name: code, label: Code, description: "Source text of the declaration with its language (a code text: front matter, then the fenced block; cut at 64 KiB; the digest is of the whole text)", type: code, section: Source, order: 7}
    search: [{property: name, text: true}, {property: signature, text: true}, {property: kind, facet: true}, {property: language, facet: true}]
  # the declarations by what they are; a namespace, a module or a macro stays a Symbol
  - name: Function
    icon: code
    color: "#7c3aed"
    description: A function (kind function), or a function declared without its body (kind prototype)
    extends: Symbol
  - name: Method
    icon: code
    color: "#8b5cf6"
    description: A method, member of its class, struct or interface (a Go method of its receiver type)
    extends: Symbol
  - name: Class
    icon: app
    color: "#0891b2"
    description: A class (a Java record too)
    extends: Symbol
  - name: Struct
    icon: app
    color: "#0e7490"
    description: A struct (kind struct) or a union (kind union)
    extends: Symbol
  - name: Interface
    icon: app
    color: "#0d9488"
    description: An interface, a trait
    extends: Symbol
  - name: Enum
    icon: list
    color: "#059669"
    description: An enumeration
    extends: Symbol
  - name: Type
    icon: node
    color: "#16a34a"
    description: A type definition or alias
    extends: Symbol
  - name: Variable
    icon: tag
    color: "#d97706"
    description: A variable of the top level
    extends: Symbol
  - name: Constant
    icon: tag
    color: "#b45309"
    description: A constant
    extends: Symbol
  - name: Field
    icon: tag
    color: "#a16207"
    description: A field of a class or a struct
    extends: Symbol
  # a package of the code: what the files of a directory (Go, C, JavaScript...) or a declared package (Java) make up,
  # or a package the repository imports from outside
  - name: Package
    icon: book
    color: "#db2777"
    description: >
      A package: the files of a directory (Go: its import path from go.mod; Python: the dotted path of the directory),
      the declared package of Java files, or a package imported from outside the repository (a module, an npm package,
      a system header). Present while a file is in it or imports it.
    attributes:
      - {name: name, label: Name, description: Name of the package (the Go package clause, the last element of its path), type: string, section: Identity, order: 1, asName: true}
      - {name: path, label: Path, description: "Import path of the package (a Go import path, a Python module, a Java package, an npm package, a directory)", type: string, section: Identity, order: 2}
      - {name: language, label: Language, description: "Language family of the package (go, python, java, js, c, rust)", type: string, section: Identity, order: 3}
    search: [{property: name, text: true}, {property: path, text: true}, {property: language, facet: true}]
linkTypes:
  - name: contains
    description: "A directory holds an entry (a git tree names it)"
    from: Directory
    to: Entry
    compose: true
    label: "contains"
    inverseLabel: "contained in"
  - name: defines
    description: "A source file defines a declaration (the symbol is defined in the file)"
    from: File
    to: Symbol
    compose: true
    label: "defines"
    inverseLabel: "defined in"
  - name: member_of
    description: "A declaration is a member of a class, a struct, an interface, a namespace (a Go method of its receiver type)"
    from: Symbol
    to: Symbol
    label: "member of"
    inverseLabel: "has member"
  - name: calls
    description: "A declaration calls a function, a method, a macro, or makes a class (resolved by name: the imports, the members of its class, its file, its package)"
    from: Symbol
    to: Symbol
    label: "calls"
    inverseLabel: "called by"
  - name: uses
    description: "A declaration names a type, a variable or a constant (resolved by name like the calls)"
    from: Symbol
    to: Symbol
    label: "uses"
    inverseLabel: "used by"
  - name: in_package
    description: "A source file is in a package"
    from: File
    to: Package
    label: "in package"
    inverseLabel: "holds"
  - name: imports
    description: "A source file imports a package (import, #include, use)"
    from: File
    to: Package
    label: "imports"
    inverseLabel: "imported by"
  - name: depends_on
    description: "A package imports another: one of its files imports it"
    from: Package
    to: Package
    label: "imports"
    inverseLabel: "imported by"
