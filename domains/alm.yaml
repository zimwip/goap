name: alm
version: 1.8.0
description: >
  Application lifecycle management domain: needs, requirements, functions, components, builds, releases and deployments. Shared by the delivery methodologies (impact-analysis, test-design, sdlc).
enums:
  - {name: priority, description: Priority of a requirement, values: [{value: low, label: Low}, {value: medium, label: Medium}, {value: high, label: High}]}
  - {name: classification, description: Sensitivity of a data object, values: [{value: public, label: Public}, {value: internal, label: Internal}, {value: confidential, label: Confidential}, {value: personal, label: Personal data}]}
  - {name: test-level, description: Level a test case verifies at, values: [{value: unit, label: Unit}, {value: integration, label: Integration}, {value: system, label: System}, {value: acceptance, label: Acceptance}]}
  - {name: flow-mode, description: How the data of a flow is exchanged, values: [{value: synchronous, label: Synchronous}, {value: asynchronous, label: Asynchronous}, {value: batch, label: Batch}]}
  - {name: rule-severity, description: "How a broken rule weighs (ADR 0162): a veto blocks, an objective passes under a derogation naming it, an advice is only reported", values: [{value: veto, label: Veto}, {value: objective, label: Objective}, {value: advice, label: Advice}]}
  - {name: stage, description: Stage of an environment on the way to production, values: [{value: dev, label: Development}, {value: test, label: Integration test}, {value: staging, label: Staging}, {value: prod, label: Production}]}
nodeTypes:
  - name: Need
    icon: target
    color: "#d97706"
    description: Business need expressed by a stakeholder
    attributes:
      - {name: title, label: Title, description: Short statement of the need, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: description, label: Description, description: The need in the stakeholder's words, type: string, widget: textarea, section: Identity, order: 2, validators: [description-max-2000]}
      - {name: stakeholder, label: Stakeholder, description: Who expressed the need, type: string, section: Origin, order: 3}
    search: [{property: title, text: true}, {property: description, text: true}, {property: stakeholder, facet: true}]
  - name: Requirement
    icon: list
    color: "#2563eb"
    description: Requirement satisfying a need
    attributes:
      - {name: title, label: Title, description: Short statement of the requirement, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: description, label: Description, description: The requirement in full, type: string, widget: textarea, section: Identity, order: 2, validators: [description-max-2000]}
      - {name: priority, label: Priority, description: How urgent the requirement is, type: enum, enum: priority, section: Classification, order: 3}
      - {name: status, label: Status, description: Free-form progress note (the lifecycle state is the formal status), type: string, section: Classification, order: 4}
      - {name: approvedAt, label: Approved on, description: Date of the approval, stamped by the approve transition, type: date, section: Classification, order: 5}
    lifecycle: requirement
    search: [{property: title, text: true}, {property: description, text: true}, {property: priority, facet: true}, {property: status, facet: true}]
    form:
      title: New requirement
      submit: Create
      fields:
        - {name: title, widget: text, label: Title, required: true, constraints: {maxLength: 200}}
        - {name: description, widget: textarea, label: Description, constraints: {maxLength: 2000}}
        - {name: priority, widget: select, label: Priority, constraints: {options: [low, medium, high]}}
        - {name: satisfies, widget: link, label: Needs it satisfies, constraints: {fromKey: $self, linkTypes: [alm@satisfies], toTypes: [alm@Need]}}
  - name: FunctionalRequirement
    description: "Functional requirement"
    extends: Requirement
  - name: NonFunctionalRequirement
    icon: check
    color: "#0891b2"
    extends: Requirement
    description: Non-functional requirement (performance, availability…)
    attributes:
      - {name: category, label: Category, description: Quality attribute concerned (performance, availability, security…), type: string, section: Classification, order: 6}
    search: [{property: category, facet: true}]
  - name: SecurityRequirement
    icon: shield
    color: "#dc2626"
    description: "Security requirement"
    extends: NonFunctionalRequirement
  - name: Function
    icon: zap
    color: "#7c3aed"
    description: Function (capability) realizing requirements
    attributes:
      - {name: title, label: Title, description: Name of the function, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: description, label: Description, description: What the function does, type: string, widget: textarea, section: Identity, order: 2, validators: [description-max-2000]}
    search: [{property: title, text: true}, {property: description, text: true}]
  - name: Component
    icon: code
    color: "#059669"
    description: Software component implementing functions
    attributes:
      - {name: title, label: Name, description: Name of the component, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: technology, label: Technology, description: Main technology the component is built with (java, go, c, shell…), type: string, section: Build, order: 2}
      - {name: version, label: Version, description: Current version, dotted (1.4.2), type: string, section: Build, order: 3, validators: [dotted-version]}
      - {name: repository, label: Repository, description: URL of the source repository, type: string, section: Build, order: 4, validators: [repository-url]}
      - {name: buildCommand, label: Build command, description: "Shell command building and testing the component in its sources (default: the one of its technology; ADR 0118)", type: string, section: Build, order: 5}
    search: [{property: title, text: true}, {property: technology, facet: true}, {property: version, facet: true}]
  - name: BuildArtifact
    icon: download
    color: "#65a30d"
    description: Artifact produced by the build of a component
    attributes:
      - {name: name, label: Name, description: Name of the artifact, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: format, label: Format, description: Packaging format (jar, tar.gz, elf…), type: string, section: Identity, order: 2}
      - {name: version, label: Version, description: Version of the artifact, dotted, type: string, section: Identity, order: 3, validators: [dotted-version]}
      - {name: technology, label: Technology, description: Technology the artifact was built with, type: string, section: Build, order: 4}
      - {name: coordinates, label: Coordinates, description: Address of the artifact in its repository (group:name:version), type: string, section: Build, order: 5}
      - {name: toolchain, label: Toolchain, description: Build tools and their versions, type: string, section: Build, order: 6}
      - {name: checks, label: Checks, description: Results of the checks run on the artifact (structured), type: json, widget: textarea, section: Build, order: 7}
  - name: Application
    icon: app
    color: "#0d9488"
    description: Deployable application composed of components
    attributes:
      - {name: title, label: Name, description: Name of the application, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: version, label: Version, description: Current version of the application, dotted, type: string, section: Identity, order: 2, validators: [dotted-version]}
    search: [{property: title, text: true}, {property: version, facet: true}]
  - name: Solution
    icon: graph
    color: "#4f46e5"
    description: Solution grouping applications serving needs
    attributes:
      - {name: title, label: Name, description: Name of the solution, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
    search: [{property: title, text: true}]
  - name: Data
    icon: database
    color: "#b45309"
    description: Data object
    attributes:
      - {name: title, label: Name, description: Name of the data object, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: classification, label: Classification, description: Sensitivity of the data, type: enum, enum: classification, section: Governance, order: 2}
  - name: Interface
    icon: radio
    color: "#db2777"
    description: Interface (API, file, event) exposed by an application
    attributes:
      - {name: title, label: Name, description: Name of the interface, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: protocol, label: Protocol, description: Protocol carried (REST, Kafka, SFTP…), type: string, section: Technical, order: 2}
      - {name: version, label: Version, description: Version of the contract (v1, v2…), type: string, section: Technical, order: 3}
    search: [{property: title, text: true}, {property: protocol, facet: true}]
  - name: Flow
    icon: send
    color: "#c026d3"
    description: Data flow between applications through an interface
    attributes:
      - {name: title, label: Name, description: Name of the flow, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: mode, label: Mode, description: How the data is exchanged, type: enum, enum: flow-mode, section: Exchange, order: 2}
      - {name: frequency, label: Frequency, description: How often data flows (real time, daily…), type: string, section: Exchange, order: 3}
  - name: TestCase
    icon: flask
    color: "#16a34a"
    description: Test case verifying a requirement
    attributes:
      - {name: title, label: Title, description: Name of the test case, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: level, label: Level, description: Level the test verifies at, type: enum, enum: test-level, section: Identity, order: 2}
      - {name: steps, label: Steps, description: Steps to run and the expected result, type: string, widget: textarea, section: Procedure, order: 3, validators: [description-max-2000]}
    search: [{property: title, text: true}, {property: steps, text: true}, {property: level, facet: true}]
  - name: Release
    icon: tag
    color: "#ea580c"
    description: Deliverable version of an application (a set of artifacts)
    attributes:
      - {name: title, label: Title, description: Name of the release, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: version, label: Version, description: Version number of the release, dotted, type: string, section: Identity, order: 2, validators: [dotted-version]}
      - {name: status, label: Status, description: Free-form delivery status (the lifecycle state is the formal one), type: string, section: Delivery, order: 3}
      - {name: notes, label: Release notes, description: What the release contains, type: string, widget: textarea, section: Delivery, order: 4, validators: [description-max-2000]}
    lifecycle: release
    search: [{property: title, text: true}, {property: notes, text: true}, {property: version, facet: true}]
  - name: Environment
    icon: settings
    color: "#475569"
    description: Execution environment (dev, test, staging, production)
    attributes:
      - {name: name, label: Name, description: Name of the environment, type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: stage, label: Stage, description: Stage on the way to production, type: enum, enum: stage, section: Identity, order: 2}
      - {name: order, label: Order, description: Position in the promotion path (1 = first), type: number, section: Identity, order: 3}
      - {name: url, label: URL, description: Address of the environment, type: string, section: Access, order: 4, validators: [url-format]}
  - name: Deployment
    icon: upload
    color: "#0284c7"
    description: Deployment of a release to an environment
    attributes:
      - {name: status, label: Status, description: Outcome of the deployment (succeeded, failed…), type: string, section: Outcome, order: 1}
      - {name: stage, label: Stage, description: Stage of the target environment, type: enum, enum: stage, section: Outcome, order: 2}
      - {name: date, label: Deployed on, description: Date of the deployment, type: date, section: Outcome, order: 3}
      - {name: checks, label: Checks, description: Results of the post-deployment checks (structured), type: json, widget: textarea, section: Outcome, order: 4}
  # Rules (ADR 0162): what governs an activity without being consumed by it. A project produces them through its own
  # processes (architecture decisions, coding rules), they govern the components they are linked to (governs) or, with
  # no such link, what the controls of a methodology select. The statement is all an agent is given in its brief; the
  # check measures the rule on what an activity produced and answers with the violations only.
  - name: Rule
    icon: shield
    color: "#b45309"
    description: A rule governing what the activities of a project produce
    attributes:
      - {name: statement, label: Statement, description: "The rule in one imperative sentence (140 characters or so): all an agent is given of it", type: string, section: Identity, order: 1, asName: true, validators: [title-max-200]}
      - {name: rationale, label: Rationale, description: Why the rule holds, with good and bad examples, type: string, widget: textarea, section: Identity, order: 2, validators: [description-max-2000]}
      - {name: severity, label: Severity, description: "How a broken rule weighs: veto (blocks), objective (passes under a derogation naming it), advice (reported)", type: enum, enum: rule-severity, default: veto, section: Control, order: 3}
      - {name: technology, label: Technology, description: "The technology the rule is about (go, java…); empty: any", type: string, section: Control, order: 4}
      - {name: check, label: Check, description: "How the rule is measured (a code text): cypher (a query over the view of the change, subject bound to the subject, each row a violation: its columns at and msg say where and what), shell (a command in the workspace of the change, in the directory of the subject: SARIF or file:line: message lines); none: the rule guides, it is not measured", type: code, section: Control, order: 5}
      - {name: fix, label: Fix, description: "How to fix a violation, in one line: given with it", type: string, section: Control, order: 6}
    lifecycle: rule
    search: [{property: statement, text: true}, {property: rationale, text: true}, {property: severity, facet: true}, {property: technology, facet: true}]
  - name: ArchitectureDecision
    extends: Rule
    icon: graph
    description: An architecture decision record (ADR) of a project, governing the components it is linked to
    attributes:
      - {name: context, label: Context, description: The forces at play when the decision was taken, type: string, widget: textarea, section: Decision, order: 7, validators: [description-max-2000]}
      - {name: consequences, label: Consequences, description: What the decision makes easier or harder, type: string, widget: textarea, section: Decision, order: 8, validators: [description-max-2000]}
  - name: CodingRule
    extends: Rule
    icon: code
    description: A coding rule of a project
lifecycles:
  # The maturity of a delivery change (ADR 0132): the phases it goes through. The domain says which states exist; the
  # methodology says what it takes to leave one (the gates of its processes, their checklists and decisions).
  - name: maturity_of_change
    description: How a delivery change matures, from its framing to its delivery, phase by phase
    initial: framing
    states:
      - {name: framing, description: "The change is framed with its requester"}
      - {name: analysing, description: "Its impacts, requirements and tests are analysed"}
      - {name: designing, description: "Its solution is designed"}
      - {name: building, description: "Its components are built"}
      - {name: releasing, description: "Its releases are planned, reviewed and rolled out"}
      - {name: delivered, final: true, description: "Delivered: the change commits"}
      - {name: abandoned, final: true, description: "Given up"}
    transitions:
      - {name: analyse, description: Go from the framing to the analysis, from: framing, to: analysing}
      - {name: design, description: Go from the analysis to the design, from: analysing, to: designing}
      - {name: build, description: Go from the design to the build, from: designing, to: building}
      - {name: release, description: Go from the build to the release, from: building, to: releasing}
      - {name: deliver, description: The change is rolled out, from: releasing, to: delivered}
      - {name: reframe, description: Back to the framing, from: analysing, to: framing}
      - {name: reanalyse, description: Back to the analysis, from: designing, to: analysing}
      - {name: redesign, description: Back to the design, from: building, to: designing}
      - {name: abandon, description: Give the change up, from: framing, to: abandoned}
      - {name: abandon, description: Give the change up, from: analysing, to: abandoned}
      - {name: abandon, description: Give the change up, from: designing, to: abandoned}
      - {name: abandon, description: Give the change up, from: building, to: abandoned}
      - {name: abandon, description: Give the change up, from: releasing, to: abandoned}
  # The lifecycle of a release change (ADR 0106, methodologies/release-based.yaml): the parent of the changes it
  # integrates. The integrated changes merge into it while it integrates; it commits once delivered.
  - name: delivery
    description: How a release is planned, screens its candidates, integrates them and is delivered
    initial: planning
    states:
      - {name: planning, description: "Scope and target of the release being set"}
      - {name: screening, description: "Open changes screened for candidates, the selected ones attached"}
      - {name: integrating, description: "The attached changes merge into the release"}
      - {name: delivered, final: true, description: "Delivered: the release commits"}
      - {name: cancelled, final: true, description: "Given up: its changes are detached"}
    transitions:
      - {name: screen, description: Screen the open changes for candidates, from: planning, to: screening}
      - {name: integrate, description: Integrate the selected changes, from: screening, to: integrating}
      - {name: rescreen, description: Take more candidates in, from: integrating, to: screening}
      - {name: deliver, description: Deliver the release once its changes are integrated, from: integrating, to: delivered}
      - {name: cancel_planning, description: Give the release up, from: planning, to: cancelled}
      - {name: cancel_screening, description: Give the release up, from: screening, to: cancelled}
  # A node is edited in any state while it is in a change; a state flagged notCommittable (a draft) keeps the change
  # from commit until the node is moved to a committable one (ADR 0078).
  - name: requirement
    description: How a requirement is written, approved once reviewed in its change, and retired
    # a node is created in its initial state and filled in its first version: it is born not committable
    initial: draft
    states:
      - {name: proposed, description: "Raised, not worked on yet"}
      - {name: draft, notCommittable: true, description: "Being written or reworked in a change"}
      - {name: approved, description: Reviewed and accepted}
      - {name: obsolete, final: true, description: No longer applicable}
    transitions:
      - {name: propose, description: Raise the requirement without working on it further yet, from: draft, to: proposed}
      - {name: start, description: Take a proposed requirement up to work on it in a change, from: proposed, to: draft}
      # the review is the change's (ADR 0076): the requirement is approved once the review of its impact is accepted
      # and its version frozen; a refused review sends it back to be reworked in the change
      - {name: approve, description: Approve the requirement once the change accepted its review; stamps the approval date, from: draft, to: approved, permission: "requirement:approve", guard: 'impact.review == "accepted"', requires: {attributes: [title]}, actions: [stamp-approved-at]}
      - {name: reopen, description: Rework an approved requirement in a change, from: approved, to: draft}
      - {name: retire, description: Take the requirement out of use for good, from: approved, to: obsolete}
  - name: release
    description: How a release is prepared, frozen and withdrawn
    initial: draft
    states:
      - {name: candidate, description: "Planned, contents may still change"}
      - {name: draft, notCommittable: true, description: Contents being reworked in a change}
      - {name: released, description: Frozen deliverable}
      - {name: withdrawn, final: true, description: Taken out of service}
    transitions:
      - {name: rework, description: Reopen a planned release to change its contents, from: candidate, to: draft}
      - {name: ready, description: Put the reworked release back to candidate, from: draft, to: candidate}
      - {name: release, description: Freeze the release as the deliverable, from: candidate, to: released}
      - {name: reopen, description: Rework a released version in a change, from: released, to: draft}
      - {name: withdraw, description: Take the released version out of service, from: released, to: withdrawn}
  # Generic process maturity of a version (ADR 0015): reference it with `lifecycle: maturity`.
  # A version is worked on in a change (draft), proposed, accepted and finally released;
  # only a released version is frozen for good and can be the "pre" of an impact.
  - name: maturity
    description: Generic process maturity of a version, from proposal to release
    initial: draft
    states:
      - {name: proposed, description: "Put forward, awaiting a decision"}
      - {name: draft, notCommittable: true, description: "Being written or reworked in a change"}
      - {name: accepted, description: "Decision taken, not delivered yet"}
      - {name: released, description: "Delivered and frozen"}
      - {name: withdrawn, final: true, description: Taken out of service}
    transitions:
      - {name: start, description: Take a proposal up to work on it in a change, from: proposed, to: draft}
      - {name: propose, description: Put the written version forward for a decision, from: draft, to: proposed}
      - {name: accept, description: Record the decision to deliver the version, from: proposed, to: accepted}
      - {name: release, description: Deliver and freeze the accepted version, from: accepted, to: released}
      - {name: rework, description: Reopen an accepted version before it is delivered, from: accepted, to: draft}
      - {name: reopen, description: Rework a released version in a change, from: released, to: draft}
      - {name: withdraw, description: Take the released version out of service, from: released, to: withdrawn}
  # The lifecycle of a rule (ADR 0162): only an accepted rule governs; a superseded or retired one is kept for the
  # history of what governed the work done under it.
  - name: rule
    description: How a rule is written, accepted, then superseded or retired
    initial: draft
    states:
      - {name: draft, notCommittable: true, description: "Being written or reworked in a change"}
      - {name: proposed, description: "Put forward, awaiting a decision"}
      - {name: accepted, description: "In force: it governs"}
      - {name: superseded, final: true, description: "Replaced by another rule"}
      - {name: retired, final: true, description: "No longer in force"}
    transitions:
      - {name: propose, description: Put the written rule forward for a decision, from: draft, to: proposed}
      - {name: accept, description: Put the rule in force, from: proposed, to: accepted}
      - {name: adopt, description: Put the written rule in force at once, from: draft, to: accepted}
      - {name: rework, description: Rework a rule, from: accepted, to: draft}
      - {name: supersede, description: Replace the rule by another one, from: accepted, to: superseded}
      - {name: retire, description: Take the rule out of force, from: accepted, to: retired}
# Algorithms (ADR 0018): scripts of a fixed type with declared parameters, and their
# instances (parameter values), which the node types and transitions above plug.
algorithms:
  - name: regex-match
    description: The value must match a regular expression (an absent value is accepted)
    type: property_validator
    language: javascript
    params:
      - {name: pattern, type: regex, required: true, description: Regular expression the value must match}
      - {name: message, type: string, description: Message shown when the value does not match}
    code: |
      const v = ctx.value();
      if (v === undefined || v === null || v === "") return;
      if (!new RegExp(ctx.param("pattern")).test(String(v))) {
        ctx.fail(ctx.param("message") || (ctx.property() + " must match " + ctx.param("pattern")));
      }
  - name: not-blank
    description: The value must be present and not blank
    type: property_validator
    language: javascript
    code: |
      const v = ctx.value();
      if (typeof v !== "string" || v.trim() === "") {
        ctx.fail(ctx.property() + " must not be blank");
      }
  - name: max-length
    description: A text value is at most `max` characters long
    type: property_validator
    language: javascript
    params:
      - {name: max, type: number, required: true, description: Maximum number of characters}
    code: |
      const v = ctx.value();
      if (typeof v === "string" && [...v].length > ctx.param("max")) {
        ctx.fail(ctx.property() + " is longer than " + ctx.param("max") + " characters");
      }
  - name: children-in-states
    description: Every node a document contains must be in one of the given states
    type: transition_guard
    language: javascript
    params:
      - {name: states, type: strings, required: true, description: Allowed states of the contained nodes}
    code: |
      const ok = ctx.param("states");
      for (const c of ctx.children()) {
        if (!ok.includes(c.state)) ctx.fail(c.key + " is " + c.state + ", expected " + ok.join(" or "));
      }
  - name: stamp-date
    description: Store the date of the transition in a property of the node
    type: transition_action
    language: javascript
    params:
      - {name: property, type: string, required: true, description: Property that receives the date}
    code: |
      ctx.setProp(ctx.param("property"), new Date().toISOString().slice(0, 10));
algorithmInstances:
  - {name: title-not-blank, algorithm: not-blank}
  - {name: title-max-200, algorithm: max-length, values: {max: 200}}
  - {name: dotted-version, algorithm: regex-match, values: {pattern: '^[0-9]+(\.[0-9]+)*$', message: "version must look like 1.2 or 1.2.3"}}
  - {name: stamp-approved-at, algorithm: stamp-date, values: {property: approvedAt}}
  - {name: description-max-2000, description: A long text is at most 2000 characters, algorithm: max-length, values: {max: 2000}}
  - {name: url-format, description: The value is an http(s) address, algorithm: regex-match, values: {pattern: '^https?://\S+$', message: "must be an http(s) URL"}}
  - {name: repository-url, description: "The value is the address of a git repository (https, ssh, git, file or user@host:path)", algorithm: regex-match, values: {pattern: '^((https?|ssh|git|file)://\S+|[\w.-]+@[\w.-]+:\S+)$', message: "must be the address of a git repository"}}
linkTypes:
  - name: satisfies
    description: "A requirement satisfies a need"
    from: Requirement
    to: Need
    label: "satisfies"
    inverseLabel: "satisfied by"
  - name: refines
    description: "A requirement refines a more general requirement"
    from: Requirement
    to: Requirement
    label: "refines"
    inverseLabel: "refined by"
  - name: realizes
    description: "A function realizes a requirement"
    from: Function
    to: Requirement
    label: "realizes"
    inverseLabel: "realized by"
  - name: implements
    description: "A component implements a function"
    from: Component
    to: Function
    label: "implements"
    inverseLabel: "implemented by"
  - name: depends_on
    description: "A component depends on another component"
