name: methodology
version: 1.5.0
description: >
  Built-in meta-domain (ADR 0012 §4, ADR 0023): the definition of a methodology version, one node per element, in the
  "methodology" namespace. Its types are in every type catalogue, before anything is loaded from the registry.
nodeTypes:
  - {name: MethodologyVersion, editor: methodology, description: "A version of a methodology: its scalar fields, status and timestamps", properties: [name, version, description, namespace, status, createdAt, updatedAt, publishedAt, updatedBy]}
  - {name: Agent, editor: agent, description: "Agent of a methodology version, with its triggers", properties: [name, description, planner, model, actions, goals, triggers, roles, position, removed]}
  # Action is an Activity too (architecture plan "Activity concept"): the smallest one, not broken down further.
  - {name: Action, extends: Activity, editor: action, description: "Action of a methodology version", properties: [name, kind, description, roles, position, removed]}
  - {name: Condition, editor: condition, description: "Condition of a methodology version", properties: [name, description, expr, position, removed]}
  - {name: Goal, editor: goal, description: "Goal of a methodology version", properties: [name, description, pre, position, removed]}
  # ADR 0035 §2: a role processes and methods assign RACI style; ADR 0039: what Assignment (organisation namespace)
  # grants a unit or user on a project is named from a project's applicable methodologies' roles.
  - {name: Role, editor: role, description: "Role of a methodology version: assigned RACI style by its processes and methods, allowed to run its agents and actions, held on a project through an Assignment", properties: [name, description, position, removed]}
  # Activity (architecture plan "Activity concept, Activity Runs, Change scoping"): the common shape of
  # Process/Step/Method/MethodStep. Takes input, names its goals, produces output; breaks down into
  # sub-activities (sub_activity link) that feed it. A Change scopes to one Activity node (ActivityRef);
  # an Activity Run (pkg/domain.ExecutionRecord) is one execution instance of one, against one Change.
  - {name: Activity, editor: activity, description: "Common shape of Process/Step/Method/MethodStep: input, goals and output conditions, composed from sub-activities", properties: [name, description, input, goals, output, position, removed]}
  # ADR 0034: the steps and sub-steps that reach an objective, each done by an action, an agent, a nested process or a person
  # ADR 0035 §1: how a step capability is carried out in a context, and the agent that acts
  - {name: Method, extends: Activity, editor: method, description: "Method of a methodology version: the reference of how a capability is carried out in a context", properties: [for, when, priority, guidance, checklist, deliverables, references, agent, steps]}
  - {name: Process, extends: Activity, editor: process, description: "Process of a methodology version: its steps and sub-steps", properties: [examples, references, steps]}
  # Step and MethodStep (architecture plan point 2): one step of a Process/Method, materialized as its own
  # node (not just compiled in-memory) so it can be an Activity in its own right - its own input/goals/output,
  # its own ActivityRuns. Still authored inline in the owning Process/Method's YAML for ergonomics; the
  # registry additionally materializes one node per step at save time, linked by sub_activity.
  - {name: Step, extends: Activity, editor: step, description: "Step of a Process: its own input/goals/output, done by an action, an agent, a nested process or a person", properties: [instructions, guidance, checklist, deliverables, references, roles, action, actions, agent, process, method]}
  - {name: MethodStep, extends: Activity, editor: step, description: "Step of a Method: its own input/goals/output, done by an action, an agent, a nested process or a person", properties: [instructions, guidance, checklist, deliverables, references, roles, action, actions, agent, process, method]}
  # an MCP tool the self-observation asks the platform for (ADR 0011): not part of a definition
  - {name: ToolRequest, description: "MCP tool requested by the self-observation of a methodology", properties: [name, description, motivation, span]}
linkTypes:
  # compose: true flags a composition link (the target is a part of the source): editors and browsers read it
  # to show the targets as the children of the source, instead of knowing the link by name.
  # a version -> its elements
  - {name: defines, from: MethodologyVersion, compose: true}
  # a specialization -> the more generic Activity it specializes (ADR 0009 §5 for an abstract action, ADR 0035 §1
  # for a method providing a capability; architecture plan "Activity concept"): the mechanism is the same at every
  # layer, going from generic to specialized - Action extends Activity, so this already covers it transitively.
  # properties: when (CEL guard, "" = always), priority (the applicable one with the highest wins).
  - {name: specializes, from: Activity, to: Activity, properties: [when, priority]}
  # an Activity -> the sub-activities (Step/MethodStep, or a nested Process/Method) it is composed from
  - {name: sub_activity, from: Activity, to: Activity, compose: true}
