name: organisation
version: 1.9.0
description: >
  Organisation structure, managed in its own namespace ("organisation"): a hierarchy of organisational units,
  mirrored by a hierarchy of projects (ADR 0039). Every node version, whatever its namespace, is owned by a unit and
  every node was created in a project (ADR 0054: the graph records both on the version, not as links); changes are
  split into sub-changes along unit boundaries.
nodeTypes:
  # `editor` names the editor of the user interface for the nodes of a type (the adapters of a unit are edited on its page).
  # `waiting: true` flags the waiting unit (ADR 0042): a unit an administrator creates at their discretion for
  # users signing in for the first time, linked member_of it until an administrator moves them. One unit
  # carries it at most (setting it clears the previous one in the same change); with none, new users join
  # ORG-DEFAULT.
  # `structure` (ADR 0054) tags the type building the organisation hierarchy: every node version is owned by a unit
  # and every change is held by one; the graph bootstraps the root (ORG-DEFAULT, rootless) and checks every write.
  - {name: OrgUnit, editor: unit, description: "Organisational unit (company, direction, department, team)", properties: [name, kind, description, waiting],
     structure: {kind: organisation, parent: part_of, root: ORG-DEFAULT}}
  # an organisational unit's instance of an adapter definition (an AdapterDef node of the platform namespace):
  # the one place where unit, MCP and connector meet. mcp = the MCP implemented, adapter = the name of the
  # AdapterDef, params = its parameter values (secrets as references: env:<VAR> or <vault path>#<field>).
  # Owned by its unit (the owner of its versions, ADR 0054); a unit inherits the adapters of its ancestors (nearest wins).
  # disabled / tools (allow-list) / deny / readOnly restrict the MCP for the unit and its sub-units (ADR 0028): the
  # restrictions of the chain add up, so a unit narrows what it inherits and never widens it. An instance without
  # adapter only restricts (the implementation is inherited): this is how a unit limits the built-in MCPs.
  - {name: Adapter, editor: unit, description: "Instance, by an organisational unit, of an adapter definition, or a restriction of an MCP", properties: [mcp, adapter, params, description, disabled, tools, deny, readOnly]}
  # who may do what is graph data too. A User is a person or service account: `admin: true` is legacy
  # back-compat (ADR 0047) — new code grants administration through a platform Assignment instead; it holds
  # no other role of its own — roles are held on projects, granted by Assignments. The unit it is `member_of`
  # is its organisation when the token names none.
  # User extends OrgUnit (ADR 0039): the smallest organisational unit is a single person, so a User node
  # satisfies an OrgUnit-typed reference (Assignment's `assigns_org` link can target a unit, a team or a
  # person uniformly). This does not fold User into the `part_of` unit tree; `member_of` still names its
  # home unit.
  # The user lifecycle (ADR 0048) tracks whether the account is usable, not a review workflow: proposed is a
  # transient bootstrap state (a sign-in immediately activates it in the same change), active and deactivated
  # are both ordinary long-lived statuses a User rests in indefinitely — hence restInEditable below.
  - {name: User, extends: OrgUnit, editor: access, description: "Person or service account, with its profile and roles", properties: [subject, displayName, email, locale, admin], lifecycle: user}
  # one ABAC rule (Casbin): effect allow|deny for a resource type and action, when the rule expression over
  # r.sub / r.obj / r.act holds. Changes to Policy and User nodes need the "policy:write" permission, checked
  # against the compiled-in floor (administrators) only, so that no policy can lock them out.
  - {name: Policy, editor: access, description: "ABAC rule", properties: [rule, resource, action, effect]}
  # what the organisation works on, mirroring OrgUnit's hierarchy (ADR 0039): a project identifies the
  # methodologies that apply to it (it inherits their declared roles, ADR 0035 §2), and is composed of
  # sub-projects through `project_part_of`. The root project (PROJ-ROOT, bootstrapped with ORG-DEFAULT) links
  # `project_part_of` to itself: every project not folded into another one resolves to it. `structure` (ADR 0054)
  # tags the type building the project hierarchy: every node is created in a project and every change acts in one.
  # `default: true` flags the default project, the one a change naming none acts in (one at most; with none
  # flagged, the root project). Selecting a project before non-administrative work (this namespace's own data:
  # units, projects, assignments, policies, adapters are administrative) is a UX-level gate (the project
  # selector), not enforced by the graph itself.
  - {name: ProjectUnit, editor: project, description: "Project or sub-project", properties: [name, description, kind, status, methodologies, default],
     structure: {kind: project, parent: project_part_of, root: PROJ-ROOT, selfParent: true}}
  # the meeting point of organisation and project (ADR 0039, same shape as Adapter): an organisational unit
  # (or a user, through subtyping) is assigned to a project with the roles it locally holds there — a subset
  # of the roles declared by the project's applicable methodologies. This is how the engine resolves "what
  # can this user do in this project": walk the user's org chain and the project's chain, union the roles of
  # the Assignments found, and check the RACI role a step requires against that set.
  # assigns_project is optional: an Assignment naming none grants one of the built-in platform roles (ADR
  # 0046, e.g. "reader") to the org unit everywhere, independent of any project's methodologies.
  - {name: Assignment, editor: assignment, description: "Roles an organisational unit or user locally holds on a project, or platform-wide when it names no project", properties: [roles, description]}
lifecycles:
  # ADR 0048: active and deactivated are both ordinary resting statuses (restInEditable), not a review draft —
  # a User's profile stays freely editable while active, the way it always has; only a deactivated account is
  # frozen (not editable) until an admin reactivates it. proposed exists only to carry a brand-new account
  # from creation to its first activation within the same bootstrap change (ADR 0040/0042).
  - name: user
    initial: proposed
    restInEditable: true
    states:
      - {name: proposed, editable: true, description: "Created, not yet activated"}
      - {name: active, editable: true, description: "Usable account"}
      - {name: deactivated, description: "Suspended by an admin; read-only until reactivated"}
    transitions:
      - {name: activate, from: proposed, to: active}
      - {name: deactivate, from: active, to: deactivated, permission: "user:deactivate"}
      - {name: reactivate, from: deactivated, to: active, permission: "user:reactivate"}
linkTypes:
  # child -> parent: outgoing links belong to the source version, so reorganising a unit only versions that unit
  - {name: part_of, from: OrgUnit, to: OrgUnit}
  # user -> the unit it belongs to
  - {name: member_of, from: User, to: OrgUnit}
  # child -> parent, mirrors OrgUnit's part_of; the root project points to itself. A distinct name (not
  # part_of): the catalogue merges same-named link types declared for several end pairs into "any pair
  # accepted" (pkg/typecat), which would erase part_of's OrgUnit-only constraint.
  - {name: project_part_of, from: ProjectUnit, to: ProjectUnit}
  # Assignment -> the org unit (or user) it grants roles to
  - {name: assigns_org, from: Assignment, to: OrgUnit}
  # Assignment -> the project the roles apply to
  - {name: assigns_project, from: Assignment, to: ProjectUnit}
