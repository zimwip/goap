root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o .air/goap-dev ./cmd/goap-dev"
entrypoint = ".air/goap-dev"
full_bin = "GOAP_STORE=sqlite .air/goap-dev"
include_ext = ["go"]
exclude_dir = ["web", ".air", ".goap", "bin", "deploy"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
