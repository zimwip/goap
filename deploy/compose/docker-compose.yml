# Dev stack: docker compose -f deploy/compose/docker-compose.yml up --build
# Gateway: http://localhost:8080 · Web: http://localhost:5173 · NATS monitor: http://localhost:8222 · Vault: http://localhost:8200
# Jaeger (traces): http://localhost:16686 · Prometheus: http://localhost:9090 · Grafana: http://localhost:3000
# Script sandboxes need the runner image: make runner-image (done by make up)
name: goap

x-service: &service
  build:
    context: ../..
  restart: unless-stopped
  environment: &env
    GOAP_HTTP_ADDR: ":8080"
    GOAP_NATS_URL: nats://nats:4222
    GOAP_LOG_FORMAT: text
    VAULT_ADDR: http://vault:8200
    VAULT_TOKEN: dev-root-token
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  depends_on: &deps
    postgres: {condition: service_healthy}
    nats: {condition: service_started}
    vault-init: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: goap
      POSTGRES_PASSWORD: goap
      POSTGRES_DB: goap
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goap -d goap"]
      interval: 2s
      retries: 30

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [natsdata:/data]
    ports: ["4222:4222", "8222:8222"]

  vault:
    image: hashicorp/vault:1.20
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]

  vault-init:
    image: hashicorp/vault:1.20
    depends_on: [vault]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOAP_JWT_SECRET: ${GOAP_JWT_SECRET:-}
    volumes: [../vault/init.sh:/init.sh:ro]
    entrypoint: ["/bin/sh", "/init.sh"]

  graph:
    <<: *service
    build: {context: ../.., args: {SERVICE: graph}}
    environment:
      <<: *env
      GOAP_DB_DSN: postgres://graph:graph@postgres:5432/goap?sslmode=disable
      GOAP_GRAPH_SEED: demo
      GOAP_REGISTRY_URL: http://registry:8080
    ports: ["8081:8080"]

  registry:
    <<: *service
    build: {context: ../.., args: {SERVICE: registry}}
    environment:
      <<: *env
      GOAP_DB_DSN: postgres://registry:registry@postgres:5432/goap?sslmode=disable
      GOAP_DOMAINS_DIR: /domains
      GOAP_METHODOLOGIES_DIR: /methodologies
      GOAP_IAM_URL: http://iam:8080
    ports: ["8082:8080"]

  modelgw:
    <<: *service
    build: {context: ../.., args: {SERVICE: modelgw}}
    ports: ["8084:8080"]

  engine:
    <<: *service
    build: {context: ../.., args: {SERVICE: engine}}
    environment:
      <<: *env
      GOAP_GRAPH_URL: http://graph:8080
      GOAP_REGISTRY_URL: http://registry:8080
      GOAP_MODELGW_URL: http://modelgw:8080
      GOAP_IAM_URL: http://iam:8080
      GOAP_TRACE_QUERY_URL: http://jaeger:16686
      GOAP_TRACE_UI_URL: http://localhost:16686/trace/
      GOAP_INTENT_RANKER: ${GOAP_INTENT_RANKER:-lexical}
      # script actions run in one hardened container per process
      GOAP_SANDBOX: ${GOAP_SANDBOX:-docker}
      GOAP_SANDBOX_IMAGE: goap/runner:dev
      GOAP_SANDBOX_NETWORK: goap-sandbox
      GOAP_RUNTIME_URL: http://engine:8080
      GOAP_DOCKER_HOST: tcp://docker-proxy:2375
    networks: [default, sandbox]
    ports: ["8083:8080"]

  # Docker API restricted to containers management (the engine never gets the socket)
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.6.0
    volumes: ["../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["../grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]

  mcp:
    <<: *service
    build: {context: ../.., args: {SERVICE: mcp}}

  iam:
    <<: *service
    build: {context: ../.., args: {SERVICE: iam}}
    environment:
      <<: *env
      GOAP_DB_DSN: postgres://iam:iam@postgres:5432/goap?sslmode=disable
    ports: ["8086:8080"]

  gateway:
    <<: *service
    build: {context: ../.., args: {SERVICE: gateway}}
    environment:
      <<: *env
      GOAP_AUTH_MODE: ${GOAP_AUTH_MODE:-none}
      GOAP_DEV_TOKENS: "true"
      GOAP_CORS_ORIGINS: http://localhost:5173
      GOAP_GRAPH_URL: http://graph:8080
      GOAP_REGISTRY_URL: http://registry:8080
      GOAP_ENGINE_URL: http://engine:8080
      GOAP_MODELGW_URL: http://modelgw:8080
      GOAP_MCP_URL: http://mcp:8080
      GOAP_IAM_URL: http://iam:8080
    ports: ["8080:8080"]

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      GOAP_GATEWAY_URL: http://gateway:8080
    volumes:
      - ../../web:/app
      - webmodules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [gateway]

networks:
  # sandboxes: no internet, only the engine RuntimeService is reachable
  sandbox:
    name: goap-sandbox
    internal: true

volumes:
  pgdata:
  natsdata:
  webmodules:
