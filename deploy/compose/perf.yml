# Performance stack: make perf (.\make.ps1 perf), or by hand:
#   docker build --target services -t goap/goap:dev . && docker build --target rust -t goap/rust:dev .
#   docker compose -f deploy/compose/perf.yml up -d
#   docker compose -f deploy/compose/perf.yml run --rm bench -versions 100000 -workers 8
# Every call goes through goap-proxy (ADR 0163), mode go here: the Go graph service; perf.rust.yml adds the Rust one
# (make perf-rust: mode rust, make perf-diff: mode shadow or compare). GOAP_PERF_GRAPH_URL=http://graph:8080 (make perf
# PERF_PROXY=0) leaves the proxy out.
# The graph service alone on PostgreSQL (with the domain registry it reads, a service of its own: ADR 0167), measured by goap-bench, the load generator,
# which writes nodes and versions through its API on the domain and change axes. Every measure goes to Prometheus (the
# graph's RPCs, its database calls and Go runtime, goap-bench's calls, PostgreSQL's tables) and is drawn by the Grafana
# dashboard "GOAP performance"; goap-bench also writes a CSV per run in .goap/perf (GOAP_PERF_RESULTS).
# Grafana: http://localhost:3300/d/goap-perf · Prometheus: http://localhost:9390 · graph: http://localhost:8380 ·
# proxy: http://localhost:8383 (/proxy/coverage, /proxy/report, /metrics)
# goap-bench holds once its run ends (make perf: until interrupted, PERF_AUTOSTOP=30m for that long, 0 to exit); make
# perf-capture saves what Prometheus holds in .goap/perf/captures, make perf-analysis replays it (perf-analysis.yml).
# The web on the data of the bench: http://localhost:5174 (the gateway on :8381 signs nobody in, a fixed administrator,
# and reaches the graph only: the Baseline explorer, the nodes and the changes work, what needs another service fails).
# pprof of the graph service: go tool pprof http://localhost:6060/debug/pprof/profile?seconds=30
# Its own project (goap-perf) and ports: it runs next to the dev stack (make up). make perf-reset drops its data.
name: goap-perf

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_TRACES_SAMPLER: always_off
  GOAP_LOG_FORMAT: text

services:
  postgres:
    image: pgvector/pgvector:pg17
    command: ["postgres", "-c", "shared_buffers=${GOAP_PERF_PG_SHARED_BUFFERS:-1GB}", "-c", "max_connections=200", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_USER: goap
      POSTGRES_PASSWORD: goap
      POSTGRES_DB: goap
    volumes:
      - perf-pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro,z
    ports: ["${GOAP_PERF_PG_PORT:-5433}:5432"]
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goap -d goap"]
      interval: 2s
      retries: 30

  # the domain registry (ADR 0167): the graphs read their types there, at start (no bus in this stack: again every
  # minute)
  domains:
    image: goap/goap:dev
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/goap/domains"]
    environment:
      <<: *telemetry
      GOAP_HTTP_ADDR: ":8080"
      GOAP_DB_DSN: postgres://domains:domains@postgres:5432/goap?sslmode=disable
      GOAP_DOMAINS_DIR: /domains
      GOAP_GRAPH_URL: ${GOAP_PERF_GRAPH_URL:-http://proxy:8080}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8382:8080"]

  graph:
    image: goap/goap:dev
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/goap/graph"]
    environment:
      <<: *telemetry
      GOAP_HTTP_ADDR: ":8080"
      GOAP_DB_DSN: postgres://graph:graph@postgres:5432/goap?sslmode=disable
      GOAP_DOMAINS_URL: http://domains:8080
      # no `graph bootstrap` in this stack: the service bootstraps the platform itself
      GOAP_GRAPH_BOOTSTRAP: "1"
      GOAP_PPROF_ADDR: ":6060"
      # baselines storing their whole state (ADR 0056): 1 every baseline, the default otherwise
    depends_on:
      postgres: {condition: service_healthy}
      domains: {condition: service_started}
    ports: ["8380:8080", "6060:6060"]

  # the entry of the graph's clients (the bench, the gateway): the Go service (mode go), the Rust one or both
  # (perf.rust.yml); its calls per method and who served them in /metrics, scraped by Prometheus
  proxy:
    image: goap/proxy:dev
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/goap/goap-proxy"]
    user: "0"
    environment:
      GOAP_HTTP_ADDR: ":8080"
      GOAP_PROXY_MODE: ${GOAP_PERF_IMPL:-go}
      GOAP_PROXY_GO: http://graph:8080
      GOAP_PROXY_RUST: ${GOAP_PERF_RUST_URL:-}
      GOAP_PROXY_REPORT_DIR: /results/diff
      GOAP_PROXY_IGNORE: ${GOAP_PERF_IGNORE:-}
    volumes: ["${GOAP_PERF_RESULTS:-../../.goap/perf}:/results:z"]
    depends_on: [graph]
    ports: ["8383:8080"]

  # the web's entry, for the graph alone: GOAP_AUTH_MODE none gives the fixed development principal (an administrator)
  gateway:
    image: goap/goap:dev
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/goap/gateway"]
    environment:
      GOAP_HTTP_ADDR: ":8080"
      GOAP_AUTH_MODE: none
      GOAP_GRAPH_URL: ${GOAP_PERF_GRAPH_URL:-http://proxy:8080}
      GOAP_DOMAINS_URL: http://domains:8080
      GOAP_LOG_FORMAT: text
    depends_on: [graph, proxy]
    ports: ["8381:8080"]

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      GOAP_GATEWAY_URL: http://gateway:8080
    volumes:
      - ../../web:/app:z
      - perf-webmodules:/app/node_modules
    ports: ["5174:5173"]
    depends_on: [gateway]

  # the load generator: docker compose -f deploy/compose/perf.yml run --rm bench <flags> (goap-bench -h)
  bench:
    image: goap/goap:dev
    pull_policy: never
    profiles: [bench]
    # the results are written in a directory of the host
    user: "0"
    entrypoint: ["/goap/goap-bench", "-wait", "3m", "-csv", "/results/"]
    command: ["-versions", "100000"]
    environment:
      <<: *telemetry
      GOAP_GRAPH_URL: ${GOAP_PERF_GRAPH_URL:-http://proxy:8080}
      GOAP_DOMAINS_URL: http://domains:8080
    volumes: ["${GOAP_PERF_RESULTS:-../../.goap/perf}:/results:z"]
    depends_on: [graph, proxy, otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../otel/collector-perf.yaml:/etc/otelcol/config.yaml:ro,z"]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_NAME: postgresql://goap:goap@postgres:5432/goap?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  # the CPU, memory, network and disk of every container (make perf-compare: the Go and the Rust graph side by side);
  # it reads the Docker daemon of the host (Linux, or the VM of Docker Desktop); started when named (profile cadvisor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [cadvisor]
    restart: unless-stopped
    privileged: true
    command: ["-docker_only=true", "-housekeeping_interval=5s", "-store_container_labels=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices: ["/dev/kmsg"]

  prometheus:
    image: prom/prometheus:v3.6.0
    # the admin API takes the snapshots of make perf-capture
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d", "--web.enable-admin-api"]
    volumes:
      - ../prometheus/prometheus-perf.yml:/etc/prometheus/prometheus.yml:ro,z
      - perf-prometheus:/prometheus
    ports: ["9390:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/goap-perf.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports: ["3300:3000"]

volumes:
  perf-webmodules:
  perf-pgdata:
  perf-prometheus:
