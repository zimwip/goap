# The Rust graph service in the performance stack (ADR 0163), over perf.yml:
#   docker compose -f deploy/compose/perf.yml -f deploy/compose/perf.rust.yml up -d
# make perf-rust: goap-proxy in mode rust, every call to the Rust service, on the database of the stack
# (GOAP_PERF_RS_DSN: the graph's). make perf-diff: mode compare, the Go service answering
# and the Rust one on a schema of its own (graph_rs), every call compared (.goap/perf/diff: calls.jsonl, summary.json,
# ids.json), then the two schemas (goap-proxy diff-db). make perf-compare PERF_COMPARE_MODE=mirror: the same mode compare,
# its divergences counted in Grafana (goap_proxy_compare_total).
# GOAP_PERF_RS_IMAGE=goap/goap:dev GOAP_PERF_RS_BIN=/goap/graph puts a second Go service in its place: the
# comparison of Go with Go, which must find no divergence (make perf-diff PERF_DIFF_RUST=go).
name: goap-perf

services:
  # the roles and schemas of init.sql, again: a database created before graph_rs was there gets it
  postgres-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "goap", "-d", "goap", "-f", "/init.sql"]
    environment:
      PGPASSWORD: goap
    volumes: ["../postgres/init.sql:/init.sql:ro,z"]
    depends_on:
      postgres: {condition: service_healthy}

  graph-rs:
    image: ${GOAP_PERF_RS_IMAGE:-goap/rust:dev}
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["${GOAP_PERF_RS_BIN:-/goap/goap-graph-rs}"]
    environment:
      GOAP_HTTP_ADDR: ":8080"
      GOAP_DB_DSN: ${GOAP_PERF_RS_DSN:-postgres://graph:graph@postgres:5432/goap?sslmode=disable}
      GOAP_DOMAINS_URL: http://domains:8080
      GOAP_GRAPH_BOOTSTRAP: "1"
      GOAP_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: always_off
    depends_on:
      postgres-init: {condition: service_completed_successfully}
      domains: {condition: service_started}
    ports: ["8384:8080"]

  # the Go service waits for the schemas too (make perf-diff drops them before it starts)
  graph:
    depends_on:
      postgres-init: {condition: service_completed_successfully}

  proxy:
    environment:
      GOAP_PROXY_RUST: http://graph-rs:8080
    depends_on: [graph, graph-rs]
