# Replay of a capture of the performance stack: make perf-analysis (.\make.ps1 perf-analysis), after make perf-capture.
# Prometheus on the captured data (GOAP_PERF_CAPTURE, a directory of .goap/perf/captures), scraping nothing, and Grafana
# with the dashboard "GOAP performance": the measures of a run stay readable once its stack is down or reset.
# Grafana: http://localhost:3301/d/goap-perf (make perf-analysis prints the link set to the time of the capture)
# Prometheus: http://localhost:9391. Its own project (goap-perf-analysis): it runs next to the performance stack.
name: goap-perf-analysis

services:
  prometheus:
    image: prom/prometheus:v3.6.0
    # it writes its lock and head next to the captured blocks; a long retention keeps them all
    user: "0"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=100y"]
    volumes:
      - ../prometheus/prometheus-analysis.yml:/etc/prometheus/prometheus.yml:ro,z
      - ${GOAP_PERF_CAPTURE:?make perf-analysis names the capture}:/prometheus:z
    ports: ["9391:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/goap-perf.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports: ["3301:3000"]
    depends_on: [prometheus]
