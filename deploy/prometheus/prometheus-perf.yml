# Prometheus of the performance stack (make perf): the collector (graph service, goap-bench) and PostgreSQL, every 5 s.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
