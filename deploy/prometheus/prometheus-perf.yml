# Prometheus of the performance stack (make perf): the collector (graph service, goap-bench), PostgreSQL and goap-proxy
# (its calls by who served them, ADR 0162), every 5 s.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: proxy
    static_configs:
      - targets: ["proxy:8080"]
