# Prometheus of the performance stack (make perf): the collector (graph service, goap-bench), PostgreSQL and
# cAdvisor or the podman exporter (CPU and memory per container), every 5 s. A target that does not run is only down.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: podman-exporter
    static_configs:
      - targets: ["podman-exporter:9882"]
