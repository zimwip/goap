# The Rust graph service and its proxy (ADR 0163). A workspace of its own: the Go modules stay in go.work.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
goap-ctx = { path = "crates/ctx" }
goap-connect = { path = "crates/connect" }
goap-proto = { path = "crates/proto" }
graph-catalog = { path = "crates/graph-catalog" }
graph-core = { path = "crates/graph-core" }
graph-script = { path = "crates/graph-script" }
graph-store = { path = "crates/graph-store" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
deadpool-postgres = "0.14"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
pbjson = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "stream"] }
rquickjs = { version = "0.14", default-features = false }
cel = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a float read back as Go reads it (correctly rounded), or a property differs at its last digit
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde_norway = "0.9"
sha2 = "0.10"
similar = "2"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.release]
debug = "line-tables-only"
