[package]
name = "goap-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Message types generated from proto/ at build time (prost + pbjson, compiled by protox: no protoc to install), with the server traits, routers and clients of the services over goap-connect"

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
serde = { workspace = true }
goap-connect = { workspace = true }

[build-dependencies]
prost-build = "0.14"
pbjson-build = "0.9"
protox = "0.10"
prost = "0.14"

[dev-dependencies]
futures = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
