version: v2
# The Rust code of the protos (contracts/gen, crate goap-gen) is generated at build time by its build.rs (prost +
# pbjson, compiled by protox): buf writes only the TypeScript of the web.
plugins:
  # the TypeScript of the web (ADR 0125): message types and their JSON forms (json_types), read by
  # web/src/lib/api/types; needs `npm ci` in web/
  - local: ["node", "web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: web/src/gen
    opt:
      - target=ts
      - json_types=true
      - import_extension=none
