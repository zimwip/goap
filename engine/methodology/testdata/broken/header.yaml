  - {name: sc, kind: human, pre: {per_impact: true}, effects: {ok: true}}
  - {name: scoped, kind: human, scope: impact, effects: {per_impact: true}}
  - {name: scoped2, kind: human, scope: nowhere, effects: {ok: true}}
  - {name: scoped3, kind: human, scope: impact, effects: {ok: true}}
  - {name: wh, kind: human, where: "true", effects: {ok: true}}
