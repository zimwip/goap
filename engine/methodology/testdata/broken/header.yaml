  - {name: t2, kind: tool, effects: {ok: true}}
  - {name: b, kind: builtin, effects: {ok: true}}
  - {name: b2, kind: builtin, builtin: nosuchbuiltin, effects: {ok: true}}
  - {name: s, kind: script, effects: {ok: true}}
